  const corto = el.querySelector('.ec-aviso-corto span'); if(corto && (f.cuenta||e.cuenta)==='otro') corto.textContent = ecNombreOtroFila(e, f) ? 'Lo pagó '+ecNombreOtroFila(e, f) : 'Falta escribir quién lo pagó';
}
function ecRefrescarResumenes(){ if(ecEstado) ecFilasVisibles().forEach(ecRefrescarFila); }
// Tipo de cambio de la fecha de cada movimiento (en segundo plano).
async function ecCargarTasas(){
  if(!ecEstado) return;
  const est = ecEstado;
  const pend = est.filas.filter(f=>f.moneda!=='MXN' && !f.rateEditado && f.rate==null);
  const cache = {};
  for(const f of pend){
    const k = f.moneda+'|'+f.fecha;
    if(!(k in cache)) cache[k] = f.fecha===todayISO() ? rateSnapshotFor(f.moneda) : await fetchRateHistorico(f.moneda, f.fecha);
    if(ecEstado!==est) return;
    f.rate = cache[k] || rateSnapshotFor(f.moneda);
    const inp = document.querySelector(`[data-ec-fila="${f.i}"] [data-ec="rate"]`); if(inp && !f.rateEditado) inp.value = Number(f.rate).toFixed(4);
  }
}
function guardarImportacionEstado(){
  const e = ecEstado; if(!e) return null;
  const sel = e.filas.filter(f=>f.incluir && !f.quitada && f.monto>0);
  if(!sel.length){ mostrarToast('No elegiste ningún movimiento para guardar.', 'error'); return null; }
  const ctaEst = ecCtaEstado(e);
  const ctaPara = (cuenta)=>ecCtaPara(e, cuenta);
  const ctaDebBudget = (cuenta)=>ctaPara('debito');
  // v18.4: cada renglón de "Otra persona" usa su propio nombre (o el de arriba si no escribiste uno).
  const sinNombre = sel.find(f=>(f.cuenta||e.cuenta)==='otro' && f.tipo==='gasto' && !ecNombreOtroFila(e, f));
  if(sinNombre){
    sinNombre.abierta = true;
    if(document.querySelector(`[data-ec-fila="${sinNombre.i}"]`)){ openRevisionEstado(); setTimeout(()=>{ const n = document.querySelector(`[data-ec-fila="${sinNombre.i}"] [data-ec="otroNombre"]`) || document.getElementById('ecOtro'); if(n){ n.focus && n.focus(); n.scrollIntoView && n.scrollIntoView({block:'center'}); } }, 30); }
    mostrarToast('Escribe quién pagó «'+String(sinNombre.desc||'').slice(0,40)+'» (Otra persona).', 'error'); return null;
  }
  const importId = uid();
  const persona = e.persona;
  let n = 0; const omitidos = []; const firmas = {};
  sel.forEach(f=>{
    const cuenta = f.cuenta || e.cuenta;
    const stamp = stampRates(f.monto, f.moneda, f.moneda==='MXN' ? 1 : (f.rate || null));
    const nota = f.desc;
    const base = {id:uid(), monto:f.monto, moneda:f.moneda, fecha:f.fecha, nota, importId, ...stamp};
    firmas[base.id] = firmaFilaEstado(persona, ctaEst, f);
    if(f.tipo==='gasto'){
      const g = {...base};
      if(cuenta==='abuelo'){ g.quien='abuelo'; g.pagadoCon='bote'; g.pagadoPor=null; g.repartoAbuelo = f.quien==='ambas' ? 'ambas' : 'jen'; }
      else { g.quien = f.quien==='ambas' ? 'ambas' : persona; g.pagadoPor = f.quien==='ambas' ? persona : null; g.pagadoCon = cuenta==='otro' ? 'otro' : cuenta; if(cuenta==='otro') g.otroNombre = ecNombreOtroFila(e, f);
        if(['bote','debito','credito'].includes(cuenta)) g.cta = ctaPara(cuenta); }
      { const sb = state.subcats.find(x=>x.id===f.cat) || subcatV15(state, 'Otros'); sb.gastos.push(g); }
      n++;
    } else if((f.tipo==='ingreso' || f.tipo==='pagoTarjeta') && (cuenta==='credito' || (cuenta==='bote' && esCredito(ctaEst)))){
      // v18.3: en un estado de tarjeta de crédito, un ingreso es un pago (o devolución) a la tarjeta: se guarda de dónde salió.
      const tarjeta = cuenta==='credito' ? ctaPara('credito') : ctaEst;
      const [parte, desde, ctaD] = String(f.origen || ecOrigenPorDefecto(e, f)).split('|');
      if(parte==='devolucion'){
        // Una devolución no es un pago: baja lo que se gastó (gasto negativo en esa tarjeta y en esa bolsa).
        const g = {...base, monto:-f.monto, montoMXN:-(Number(stamp.montoMXN)||0), montoEUR:-(Number(stamp.montoEUR)||0), quien:persona, pagadoPor:null, pagadoCon: desde==='budget' ? 'bote' : 'credito', cta:tarjeta, nota:'Devolución · '+nota};
        const sb = state.subcats.find(x=>x.id===(f.cat || ecSugerirCategoria(nota))) || subcatV15(state, 'Otros'); sb.gastos.push(g);
        n++; return;
      }
      const r = {id:base.id, persona, monto:f.monto, moneda:f.moneda, fecha:f.fecha, desde, bolsa: parte==='budget' ? 'budget' : 'mio', tarjeta, importId, ...stamp, notaLibre:nota};
      if(ctaD && (desde==='debito' || desde==='bote')) r.ctaDesde = ctaDebito(ctaD);
      r.nota = 'Pago '+labelCuenta(tarjeta)+(r.bolsa==='budget'?' (parte del Budget)':'')+' · '+(r.ctaDesde ? 'desde '+labelCuenta(r.ctaDesde)+' ('+(desde==='bote'?'Budget':'mío')+')' : (desde==='efectivo' ? 'en efectivo' : 'otra cuenta / devolución'))+' · '+nota;
      state.pagosTarjeta.push(r); n++; return;
    } else if(f.tipo==='ingreso'){
      if(cuenta==='abuelo' || cuenta==='otro'){ omitidos.push(nota); return; } // un abono a una tarjeta ajena no es dinero tuyo
      const destino = cuenta==='bote' ? 'bote' : cuenta==='arq' ? 'arq' : cuenta==='efectivo' ? 'efectivo' : 'debito';
      state.ingresos.push({id:base.id, persona, fuente:nota, montoBruto:f.monto, moneda:f.moneda, fecha:f.fecha, mes: ymDe(f.fecha), destino, ahorroAuto:false, ahorroAutoMonto:0, recurrente:false, importId, ...stamp, ...((destino==='bote'||destino==='debito') ? {cta: ctaDebBudget(destino)} : {})});
      n++;
    } else if(f.tipo==='retiro'){
      const cuentaRet = ['bote','arq','debito','abuelo'].includes(cuenta) ? cuenta : 'otra';
      state.efectivoMovimientos.push({id:base.id, persona, tipo:'retiro', monto:f.monto, moneda:f.moneda, fecha:f.fecha, cuenta:cuentaRet, origen:'', nota:'Retiro · '+nota, importId, ...stamp, ...((cuentaRet==='bote'||cuentaRet==='debito') ? {cta: ctaDebBudget(cuentaRet)} : {})});
      n++;
    } else if(f.tipo==='pagoTarjeta' && ['abuelo','otro','arq'].includes(cuenta)){
      omitidos.push(nota); return; // pago a una tarjeta que no es de ustedes: no mueve su dinero
    } else if(f.tipo==='pagoTarjeta'){
      // Estado de débito (o efectivo): sale de esta cuenta y se elige qué tarjeta y qué parte se pagó.
      const desde = cuenta==='debito' ? 'debito' : cuenta==='bote' ? 'bote' : cuenta==='efectivo' ? 'efectivo' : 'otra';
      const [parte, tarjeta] = String(f.tarjetaPagada || ecTarjetaPorDefecto(e, f)).split('|');
      // Lo del Budget de la tarjeta se paga con dinero del Budget (igual que en el formulario): sale como Budget de esa cuenta.
      const desdeReal = parte==='budget' && desde!=='otra' ? 'bote' : desde;
      const r = {id:base.id, persona, monto:f.monto, moneda:f.moneda, fecha:f.fecha, desde:desdeReal, bolsa: parte==='budget' ? 'budget' : 'mio', tarjeta: ctaCredito(tarjeta), importId, ...stamp, notaLibre:nota};
      if(desdeReal==='debito' || desdeReal==='bote') r.ctaDesde = desde==='efectivo' ? 'nu-deb' : ctaDebBudget(desde==='bote'?'bote':'debito');
      r.nota = 'Pago '+labelCuenta(r.tarjeta)+(r.bolsa==='budget'?' (parte del Budget)':'')+' · '+(r.ctaDesde ? 'desde '+labelCuenta(r.ctaDesde)+' ('+(desdeReal==='bote'?'Budget':'mío')+')' : (desdeReal==='efectivo'?'en efectivo':'otra cuenta'))+' · '+nota;
      state.pagosTarjeta.push(r);
      n++;
    }
  });
  if(!Array.isArray(state.importaciones)) state.importaciones = [];
  const imp = {id:importId, fecha:todayISO(), creado:Date.now(), banco:e.banco, persona, por: perfil||persona, cuenta:e.cuenta, n, archivo:e.archivo||'', nombre: nombreImportacionPorDefecto(e, sel), cta: ecCtaEstado(e)};
  state.importaciones.push(imp);
  // v18.5: huella de cada renglón: si la otra también importó el mismo estado, al sincronizar se queda una sola vez.
  registrosDeImportacion(importId).forEach(([,r])=>{ if(firmas[r.id]) r.firmaEc = firmas[r.id]; });
  ecEstado = null;
  persist();
  // Sello de cómo quedaron al importarlos: así "Deshacer" sabe cuáles se cambiaron después.
  imp.selloImport = registrosDeImportacion(importId).reduce((a,[,r])=>Math.max(a, Number(r._u)||0), 0);
  persist();
  if(omitidos.length) setTimeout(()=>mostrarToast(omitidos.length+' movimiento'+(omitidos.length===1?'':'s')+' de una tarjeta ajena (Abuelo / otra persona) no se guardaron: no es dinero de ustedes.', 'error'), 1200);
  return n;
}
// v18.3: la importación más reciente (de cualquiera de las dos) que todavía tiene movimientos.
function registrosDeImportacion(importId){
  const out = [];
  state.ingresos.forEach(r=>{ if(r.importId===importId) out.push(['ingresos', r]); });
  (state.gustosGastos||[]).forEach(r=>{ if(r.importId===importId) out.push(['gastos', r]); });
  state.subcats.forEach(sb=>(sb.gastos||[]).forEach(r=>{ if(r.importId===importId) out.push(['gastos', r]); }));
  (state.efectivoMovimientos||[]).forEach(r=>{ if(r.importId===importId) out.push(['efectivo', r]); });
  (state.pagosTarjeta||[]).forEach(r=>{ if(r.importId===importId) out.push(['pagosTarjeta', r]); });
  return out;
}
function ultimaImportacion(){
  const lista = (state.importaciones||[]).slice().sort((a,b)=>(b.creado||0)-(a.creado||0));
  return lista.find(im=>registrosDeImportacion(im.id).length>0) || null;
}
function openDeshacerUltimaImportacion(){
  const im = ultimaImportacion(); if(!im){ mostrarToast('No hay importaciones para deshacer.', 'error'); return; }
  openDeshacerImportacion(im, 'Deshacer última importación');
}

  if(typeof im==='string') im = (state.importaciones||[]).find(x=>x.id===im);

  const regs = registrosDeImportacion(im.id);
  const editados = regs.filter(([,r])=>typeof r._u==='number' && r._u > (Number(im.selloImport) || ((Number(im.creado)||0) + 5000))).length;
  const ks = new Set(regs.filter(([c])=>c==='gastos').map(([,r])=>'gastos:'+r.id));
  const pagosLigados = (state.pagosEntre||[]).filter(p=>(p.aplica||[]).some(ap=>ks.has(ap.k))).length;
  const quienImp = im.por || im.persona; const otra = quienImp && quienImp!==perfil;
  openSheet(`
    ${sheetHeader(titulo || 'Deshacer importación')}
    <div class="det-rows" style="margin-bottom:12px;">
      <div class="det-row"><span>Importación</span><b>${escHtml(nombreImportacion(im))}</b></div>
      <div class="det-row"><span>Estado de cuenta</span><b>${escHtml(EC_NOMBRE_BANCO[im.banco]||'Estado de cuenta')}${im.archivo?' · '+escHtml(im.archivo):''}</b></div>
      <div class="det-row"><span>Importado</span><b>${escHtml(fmtDate(im.fecha))} · ${escHtml(nombrePersona(im.persona))}</b></div>
      <div class="det-row"><span>Movimientos que se quitan</span><b>${regs.length}</b></div>
    </div>
    ${otra ? `<div class="note-box" style="margin-bottom:8px;">${ico('alert','icon-sm')}<div>Esta importación la hizo ${escHtml(nombrePersona(quienImp))}.</div></div>` : ''}
    ${editados ? `<div class="note-box" style="margin-bottom:8px;">${ico('alert','icon-sm')}<div>${editados} de esos movimientos los cambiaron después de importarlos: también se quitan.</div></div>` : ''}
    ${pagosLigados ? `<div class="note-box" style="margin-bottom:8px;">${ico('alert','icon-sm')}<div>${pagosLigados} pago${pagosLigados===1?'':'s'} en Nosotras estaba${pagosLigados===1?'':'n'} saldando gastos de esta importación: el pago se queda y cuenta como pagado a favor.</div></div>` : ''}
    <div class="small-note" style="margin-bottom:12px;">Todo se va a la papelera; si te equivocas, toca "Recuperar" en el aviso que sale después.</div>
    <div style="display:flex;gap:8px;"><button class="btn btn-outline" id="cancelarDeshacerImp" style="flex:1;">Cancelar</button><button class="btn" id="doDeshacerImp" style="flex:2;background:var(--brick);color:#fff;">Sí, deshacer (${regs.length})</button></div>
  `);
  document.getElementById('cancelarDeshacerImp').addEventListener('click', closeSheet);
  document.getElementById('doDeshacerImp').addEventListener('click', ()=>{
    const claves = registrosDeImportacion(im.id).map(([c, r])=>c+':'+r.id);
    const copiaIm = JSON.parse(JSON.stringify(im));
    const n = deshacerImportacion(im.id);
    closeSheet(); render();
    mostrarToast('Se quitaron '+n+' movimientos de esa importación.', 'ok', {label:'Recuperar', fn:()=>{
      if(!(state.importaciones||[]).some(x=>x.id===copiaIm.id)){ if(!Array.isArray(state.importaciones)) state.importaciones = []; state.importaciones.push(copiaIm); }
      if(state._papelera) delete state._papelera['importaciones:'+copiaIm.id];
      recuperarVarios(claves);
      // Lo recuperado queda como "recién importado" (no como cambiado después).
      const im2 = (state.importaciones||[]).find(x=>x.id===copiaIm.id);
      if(im2){ im2.selloImport = registrosDeImportacion(im2.id).reduce((a,[,r])=>Math.max(a, Number(r._u)||0), 0); persist(); }
      if(state._papelera && state._papelera['importaciones:'+copiaIm.id]){ delete state._papelera['importaciones:'+copiaIm.id]; Storage.save(state); }
    }});
  });
}
function deshacerImportacion(importId){
  let n = 0;
  const quitar = (arr)=>{ for(let i=arr.length-1;i>=0;i--){ const r = arr[i]; if(r && r.importId===importId){
    // Si ese movimiento ya era el primer mes de algo "cada mes", ese mes no se vuelve a crear solo.
    if(r.serieId && r.serieYM){ const se = (state.series||[]).find(x=>x.id===r.serieId); if(se){ if(!Array.isArray(se.omitidos)) se.omitidos = []; if(!se.omitidos.includes(r.serieYM)) se.omitidos.push(r.serieYM); } }
    arr.splice(i,1); n++; } } };
  quitar(state.ingresos); quitar(state.gustosGastos); quitar(state.efectivoMovimientos); quitar(state.pagosTarjeta);
  state.subcats.forEach(sb=>quitar(sb.gastos));
  state.importaciones = (state.importaciones||[]).filter(im=>im.id!==importId);
  persist(); render();
  return n;
}

const NOMBRE_COL = {ingresos:'Ingreso', gastos:'Gasto', costos:'Costo de referencia', efectivo:'Efectivo', pagosEntre:'Pago entre nosotras', pagosTarjeta:'Pago de tarjeta', pagosOtros:'Pago a otra persona', series:'Serie recurrente', porCobrar:'Me deben', proyecciones:'Deuda a futuro', finGan:'Ingreso a débito', finGas:'Gasto con tarjeta', ahorro:'Retiro de ahorro', fondoCon:'Gasto grande conocido', fondoMov:'Fondo de gastos grandes', destinos:'Destino', subcats:'Subcategoría', importaciones:'Importación', suscripciones:'Suscripción', comprasArq:'Compra de euros (Arq)', transferencias:'Pase entre cuentas'};
function describirRegistro(col, r){
  const txt = r.nota || r.fuente || r.concepto || r.nombre || (r.plantilla && (r.plantilla.nota || r.plantilla.fuente || r.plantilla.concepto)) || '';
  const monto = r.monto!=null ? r.monto : (r.montoBruto!=null ? r.montoBruto : (r.plantilla ? (r.plantilla.monto!=null?r.plantilla.monto:r.plantilla.montoBruto) : null));
  return {tipo: NOMBRE_COL[col]||col, txt, monto, moneda: r.moneda || (r.plantilla&&r.plantilla.moneda) || 'MXN', fecha: r.fecha || ''};
}
// Vuelve a poner un registro en su lugar.
function reinsertar(col, loc, rec){
  const f = (pp)=>{ if(!state.finanzas[pp]) state.finanzas[pp] = {inicial:0,ganancias:[],gastos:[],credito:{limite:0}}; return state.finanzas[pp]; };
  if(col==='ingresos') state.ingresos.push(rec);
  else if(col==='gastos'){ const sb = state.subcats.find(x=>'sub:'+x.id===loc) || (loc==='gustos' ? subcatV15(state, clasificarGastoV15(rec.nota)) : null) || state.subcats[0]; if(sb) sb.gastos.push(rec); else state.gustosGastos.push(rec); }
  else if(col==='suscripciones'){ if(!Array.isArray(state.suscripciones)) state.suscripciones=[]; state.suscripciones.push(rec); }
  else if(col==='comprasArq'){ if(!Array.isArray(state.comprasArq)) state.comprasArq=[]; state.comprasArq.push(rec); }
  else if(col==='transferencias'){ if(!Array.isArray(state.transferencias)) state.transferencias=[]; state.transferencias.push(rec); }
  else if(col==='costos'){ const sb = state.subcats.find(x=>x.id===loc) || state.subcats[0]; if(sb){ if(!Array.isArray(sb.costos)) sb.costos=[]; sb.costos.push(rec); } }
  else if(col==='efectivo') state.efectivoMovimientos.push(rec);
  else if(col==='pagosEntre'){
    state.pagosEntre.push(rec);
    if(rec.compensacion) Object.keys(state._papelera||{}).forEach(k=>{ const e = state._papelera[k]; if(e && e.col==='pagosEntre' && e.rec && e.rec.compensacion===rec.compensacion && e.rec.id!==rec.id && !state.pagosEntre.some(p=>p.id===e.rec.id)){ state.pagosEntre.push(JSON.parse(JSON.stringify(e.rec))); delete state._papelera[k]; } });
  }
  else if(col==='pagosTarjeta') state.pagosTarjeta.push(rec);
  else if(col==='pagosOtros') state.pagosOtros.push(rec);
  else if(col==='series') state.series.push(rec);
  else if(col==='porCobrar') state.porCobrar.push(rec);
  else if(col==='proyecciones') state.deudasProyectadas.push(rec);
  else if(col==='finGan') f(loc).ganancias.push(rec);
  else if(col==='finGas') f(loc).gastos.push(rec);
  else if(col==='ahorro') state.ahorro.movimientos.push(rec);
  else if(col==='fondoCon') state.fondoGrande.conocidos.push(rec);
  else if(col==='fondoMov') state.fondoGrande.movimientos.push(rec);
  else if(col==='destinos') state.destinos.push(rec);
  else if(col==='subcats') state.subcats.push({...rec, gastos:[], costos:[]});
  else if(col==='importaciones'){ if(!Array.isArray(state.importaciones)) state.importaciones=[]; state.importaciones.push(rec); }
  else return false;
  return true;
}
function recuperarDePapelera(k){
  const e = (state._papelera||{})[k];
  if(!e) return false;
  if(recorrerRegistros(state).some(x=>x.k===k)){ delete state._papelera[k]; persist(); render(); return true; }
  const rec = JSON.parse(JSON.stringify(e.rec));
  if(!reinsertar(e.col, e.loc, rec)) return false;
  delete state._papelera[k];
  // La marca de borrado se deja: así la hora del registro recuperado queda DESPUÉS
  // del borrado (aunque el reloj del otro teléfono vaya adelantado) y no se vuelve a borrar.
  persist();
  render();
  mostrarToast('Recuperado: '+(describirRegistro(e.col, e.rec).txt || NOMBRE_COL[e.col] || 'registro'), 'ok');
  return true;
}

/* ---------- Migración a v15 (Gustos → subcategorías, Súper aparte) ---------- */
const V15_RE_SUPER = /super|supermerc|konzum|lidl|spar\b|tommy|plodine|kaufland|studenac|eurospin|aldi|mercadona|carrefour|billa|oxxo|walmart|soriana|chedraui|\bmarket|mercado|groceries|abarrotes/;
function clasificarGastoV15(texto){
  const t = sinAcentos(texto||'');
  if(/netflix|spotify|disney|hbo|\bmax\b|prime video|youtube|apple\.com|icloud|google one|chatgpt|suscrip|subscription/.test(t)) return 'Otros';
  if(V15_RE_SUPER.test(t)) return 'Súper';
  if(/restaur|cafe|coffee|pizza|burger|helado|gelat|coctel|cocktail|cerveza|beer|vino|wine|drink|bebida|snack|taco|sushi|comida|cena|desayuno|brunch|bar\b|pub\b|kebab|pekara|panader|postre/.test(t)) return 'Comida y bebida (fuera)';
  if(/cine|cinema|concierto|concert|museo|museum|tour|ticket|entrada|club|fiesta|party|parque|excursion|kayak|playa|beach|boat|barco/.test(t)) return 'Actividades y tours';
  if(/ropa|zara|h&m|souvenir|regalo|shop|tienda|compras|mango|primark/.test(t)) return 'Compras / souvenirs';
  if(/farmacia|pharmacy|ljekarna|salud|doctor|spa\b|masaje|peluquer|corte de pelo|unas|manicure/.test(t)) return 'Salud y cuidado personal';
  if(/uber|bolt|taxi|\bbus\b|metro|tram|scooter/.test(t)) return 'Transporte local';
  return 'Otros';
}
function subcatV15(st, nombre){
  const clave = sinAcentos(nombre);
  let s = (st.subcats||[]).find(x=>sinAcentos(x.nombre)===clave);
  if(s) return s;
  if(nombre==='Súper') s = (st.subcats||[]).find(x=>x.id==='sub-super');
  if(nombre==='Otros') s = s || (st.subcats||[]).find(x=>x.id==='sub-otros');
  if(s) return s;
  const plant = {
    'Súper': {id:'sub-super', icono:'cart', peso:12, coberturaKey:'comida'},
    'Otros': {id:'sub-otros', icono:'star', peso:3, coberturaKey:null},
    'Comida y bebida (fuera)': {id:'sub-comida-fuera', icono:'food', peso:16, coberturaKey:'comida'},
    'Actividades y tours': {id:'sub-actividades', icono:'ticket', peso:10, coberturaKey:null},
    'Compras / souvenirs': {id:'sub-compras', icono:'bag', peso:5, coberturaKey:null},
    'Salud y cuidado personal': {id:'sub-salud', icono:'heart', peso:4, coberturaKey:null},
    'Transporte local': {id:'sub-transporte-local', icono:'bus', peso:8, coberturaKey:'transporte'},
  }[nombre] || {id:'sub-'+clave.replace(/[^a-z0-9]+/g,'-'), icono:'bag', peso:3, coberturaKey:null};
  s = {id:plant.id, nombre, icono:plant.icono, peso:plant.peso, coberturaKey:plant.coberturaKey, costos:[], gastos:[], _u:0};
  if(!Array.isArray(st.subcats)) st.subcats = [];
  const iComida = st.subcats.findIndex(x=>/comida/.test(sinAcentos(x.nombre)));
  if(nombre==='Súper' && iComida>=0) st.subcats.splice(iComida, 0, s); else st.subcats.push(s);
  return s;
}
// Mueve y marca con +1 (igual en los dos teléfonos) para que la versión movida gane al juntar.
function subirSelloV15(r){ r._u = (typeof r._u==='number' && r._u>0 ? r._u : 0) + 1; }
function migrarDatosV15(st, conSplit){
  if(!st || !Array.isArray(st.subcats)) return 0;
  let cambios = 0;
  // "Comida & Bebida" → "Comida y bebida (fuera)" + "Súper"
  const comida = st.subcats.find(x=>/^comida\s*(&|y)\s*bebida$/i.test(String(x.nombre||'').trim()));
  if(comida){ comida.nombre = 'Comida y bebida (fuera)'; comida.icono = 'food'; if(comida.peso===28) comida.peso = 16; subirSelloV15(comida); cambios++; }
  const comidaFuera = st.subcats.find(x=>/comida y bebida/i.test(x.nombre||''));
  if(comidaFuera || (st.gustosGastos||[]).length) subcatV15(st, 'Súper');
  // Gustos ya no existe: cada gasto va a la subcategoría que le corresponde (o a "Otros").
  (st.gustosGastos||[]).slice().forEach(g=>{
    const dest = subcatV15(st, clasificarGastoV15(g.nota));
    subirSelloV15(g); dest.gastos.push(g); cambios++;
  });
  st.gustosGastos = [];
  (st.series||[]).forEach(se=>{
    if(se.tipo==='gasto' && se.cat==='gustos'){
      se.cat = 'generales'; se.subId = subcatV15(st, clasificarGastoV15((se.plantilla||{}).nota)).id; subirSelloV15(se); cambios++;
    }
  });
  // Una sola vez por teléfono: lo del súper que estaba en Comida pasa a "Súper".
  if(conSplit && !st.migSuperV15 && comidaFuera){
    const sup = subcatV15(st, 'Súper');
    comidaFuera.gastos = comidaFuera.gastos.filter(g=>{
      if(V15_RE_SUPER.test(sinAcentos(g.nota||''))){ subirSelloV15(g); sup.gastos.push(g); cambios++; return false; }
      return true;
    });
    (st.series||[]).forEach(se=>{ if(se.tipo==='gasto' && se.subId===comidaFuera.id && V15_RE_SUPER.test(sinAcentos((se.plantilla||{}).nota||''))){ se.subId = sup.id; subirSelloV15(se); cambios++; } });
    st.migSuperV15 = true;
  }
  return cambios;
}

/* v16 — PRESUPUESTO POR SUBCATEGORÍA: primero lo esencial, luego lo demás.
   1) Lo esencial se calcula con costos reales de cada lugar, día por día según
      el destino de ese día y lo que cubre el programa.
   2) Si no alcanza con la meta del mes, se reparte proporcional y se avisa.
   3) Lo que queda se reparte entre lo opcional según su peso y los precios del lugar.
   Renta: Numbeo "Apartment (1 bedroom) in City Centre", EUR/mes (2026).
   Súper y demás: índices de precios Eurostat 2024 (PAISES). */
const RENTA_1R_EUR = {HR:632, SI:667, BA:285, ME:577, RS:453, MK:266, AL:478, HU:525, AT:887, IT:724, GR:483, CZ:726, SK:624, PL:649, RO:426, BG:416, DE:804, FR:763, ES:905, PT:913, NL:1457, BE:884, DK:993, SE:773, FI:788, NO:1186, IS:1500, CH:1784, IE:1574, EE:593, LV:363, LT:563, MT:1049, CY:879, LU:1831, TR:500, GB:1172, MX:654};

const ALOJ_AMUEBLADO = 1.6;       // depa amueblado por temporada vs renta local
const ALOJ_CORTA = 1.35;          // estancias de menos de 28 noches
const ALOJ_TEMPORADA = {baja:0.9, media:1, alta:1.25};
const ALOJ_NIVEL = {economico:0.8, medio:1, alto:1.3};
const SUPER_PERSONA_MES_EUR = 250;
const ESENCIAL_MES_EUR = {salud:{eur:50, idx:'tot'}, tlocal:{eur:60, idx:'trans'}, lav:{eur:30, idx:'tot'}, com:{eur:30, idx:null}, tram:{eur:10, idx:null}};
const ENTRE_CIUDADES_PERSONA_EUR = 45;
function claveEsencial(sub){
  const n = sinAcentos(sub && sub.nombre || '');
  if(esSubAlojamiento(sub)) return 'aloj';
  if(/super/.test(n)) return 'super';
  if(/salud|cuidado/.test(n)) return 'salud';
  if(/transporte entre/.test(n)) return 'tentre';
  if(/transporte local/.test(n) || sub.coberturaKey==='transporte') return 'tlocal';
  if(/comunicacion|esim|roaming/.test(n)) return 'com';
  if(/lavander/.test(n)) return 'lav';
  if(/tramite|documento/.test(n)) return 'tram';
  return null;
}
function esSubEsencial(sub){ return !!claveEsencial(sub); }
function nochesDestino(d){ return d && d.fechaInicio && d.fechaFin ? Math.max(1, diasEntreISO(d.fechaInicio, d.fechaFin)) : 30; }
// Hasta cuánto es aceptable pagar por noche (las dos, depa o cuarto privado), en EUR.
function topeNocheCalculadoEUR(d){
  const p = d ? paisDe(d.nombre) : null;
  const renta = p && RENTA_1R_EUR[p.c] ? RENTA_1R_EUR[p.c] : RENTA_1R_DEFAULT;
  let v = renta * ALOJ_AMUEBLADO / 30;
  v *= ALOJ_TEMPORADA[d && d.estacionalidad || 'media'] ?? 1;
  v *= ALOJ_NIVEL[d && d.nivelCosto || 'medio'] ?? 1;
  if(nochesDestino(d) < 28) v *= ALOJ_CORTA;
  return Math.round(v);
}
function topeNocheEUR(d){ const o = Number(d && d.alojMaxNoche); return o>0 ? o : topeNocheCalculadoEUR(d); }
function indicePais(d, idx){ const p = d ? paisDe(d.nombre) : null; return p && typeof p[idx]==='number' ? p[idx]/100 : 1; }
function destinoParaDia(iso){
  const d = destinoEnFecha(iso); if(d) return d;
  const ds = (state.destinos||[]).filter(x=>x.fechaInicio && x.fechaFin).sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
  if(!ds.length) return destinoActual() || null;
  const antes = ds.filter(x=>x.fechaFin < iso); if(antes.length) return antes[antes.length-1];
  return ds[0];
}
// Necesidad esencial de una subcategoría para un día, en EUR.
function necesidadEsencialDiaEUR(clave, sub, d){
  const cov = (k)=> d && d.cobertura ? coverageMultiplier(d.cobertura[k]) : 1;
  if(clave==='aloj') return topeNocheEUR(d) * cov('alojamiento');
  if(clave==='super') return SUPER_PERSONA_MES_EUR*2/30 * indicePais(d,'food') * coverageMultiplierForSub(sub, d);
  if(clave==='tlocal') return ESENCIAL_MES_EUR.tlocal.eur/30 * indicePais(d,'trans') * cov('transporte');
  const b = ESENCIAL_MES_EUR[clave]; if(!b) return 0;

// v18: referencia de costo de una subcategoría para un día en un destino, en MXN (null si no hay).
// Las del destino mandan sobre las de "todos los destinos".
const FACTOR_DIA_REF = {noche:1, diaria:1, semanal:1/7, quincenal:1/14, mensual:1/30};
function refDiaMXN(sb, d, iso, ym){

  if(!usar.length) usar = cs.filter(c=>!c.destinoId);

    const mxn = toMXN(Number(c.monto)||0, c.moneda||'EUR');
    if(c.frecuencia==='unica') return a + (d && iso===d.fechaInicio ? mxn : 0); // una sola vez: el día que llegan

let _planCache = {k:null, v:null};
function planPresupuestoMes(ym){
  ym = ym || mesActual();
  const meta = metaTotalMXN(ym);
  const eur = rateSnapshotFor('EUR') || 21.5;
  const k = ym+'|'+meta+'|'+eur+'|'+todayISO()+'|'+(state.destinoActualId||'')+'|'+JSON.stringify(state.destinos||[])+'|'+state.subcats.map(x=>x.id+':'+x.nombre+':'+x.peso+':'+(x.coberturaKey||'')+':'+JSON.stringify((x.costos||[]).map(c=>[c.monto,c.moneda,c.frecuencia,c.destinoId]))).join(',')+'|'+JSON.stringify(state.rates||{});
  if(_planCache.k===k) return _planCache.v;
  const dias = []; const fin = finDeMesISO(ym);
  for(let iso = ym+'-01'; iso <= fin; iso = sumarDiasISO(iso, 1)) dias.push(iso);
  const hayDestinos = (state.destinos||[]).some(x=>x.fechaInicio && x.fechaFin) || !!destinoActual();
  const porSub = {};
  let necesidadTotal = 0;
  state.subcats.forEach(sb=>{ porSub[sb.id] = {esencial: esSubEsencial(sb), necesidad:0, presup:0, peso:0, ref:0}; });
  if(hayDestinos){
    dias.forEach(iso=>{
      const d = destinoParaDia(iso);
      state.subcats.forEach(sb=>{
        const r = refDiaMXN(sb, d, iso, ym);
        if(r!==null){ porSub[sb.id].ref += r; return; } // tu referencia manda sobre Numbeo
        const c = claveEsencial(sb);
        if(c && c!=='tentre') porSub[sb.id].necesidad += necesidadEsencialDiaEUR(c, sb, d) * eur;
        if(!c) porSub[sb.id].peso += pesoBaseDestino(sb, d) * coverageMultiplierForSub(sb, d);
      });
    });
    // Transporte entre ciudades: cada llegada a un destino nuevo dentro del mes.
    const ordenados = (state.destinos||[]).filter(x=>x.fechaInicio).sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
    const cambios = ordenados.filter((x,i)=>i>0 && ymDe(x.fechaInicio)===ym);
    state.subcats.filter(sb=>claveEsencial(sb)==='tentre').forEach(sb=>{
      // Si hay referencia tuya para ese viaje, ya se contó arriba: no se suma también el estimado.
      porSub[sb.id].necesidad = cambios.filter(x=>refDiaMXN(sb, x, x.fechaInicio, ym)===null).reduce((a,x)=>a + ENTRE_CIUDADES_PERSONA_EUR*2*indicePais(x,'tot')*eur, 0);
    });
  } else {
    // Sin destinos: todo por peso (como antes).
    state.subcats.forEach(sb=>{ porSub[sb.id].esencial = false; porSub[sb.id].peso = Number(sb.peso)||0; });
  }
  // 1) Lo que tiene referencia tuya; 2) lo esencial con precios del lugar; 3) lo demás por peso.
  const totalRef = state.subcats.reduce((a,sb)=>a+porSub[sb.id].ref, 0);
  const escalaRef = totalRef > meta ? (meta>0 ? meta/totalRef : 0) : 1;
  state.subcats.forEach(sb=>{ const x = porSub[sb.id]; x.presupRef = x.ref*escalaRef; });
  const metaSinRef = Math.max(0, meta - totalRef*escalaRef);
  state.subcats.forEach(sb=>{ if(porSub[sb.id].esencial) necesidadTotal += porSub[sb.id].necesidad; });
  const escala = necesidadTotal > metaSinRef ? (metaSinRef>0 ? metaSinRef/necesidadTotal : 0) : 1;
  let asignadoEsencial = 0;
  state.subcats.forEach(sb=>{ const x = porSub[sb.id]; if(x.esencial){ x.presup = x.necesidad*escala; asignadoEsencial += x.presup; } });
  const resto = Math.max(0, metaSinRef - asignadoEsencial);
  const pesoTotal = state.subcats.reduce((a,sb)=>a+(porSub[sb.id].esencial?0:porSub[sb.id].peso),0);
  state.subcats.forEach(sb=>{ const x = porSub[sb.id]; if(!x.esencial) x.presup = pesoTotal>0 ? resto * x.peso/pesoTotal : 0; });
  if(!(pesoTotal>0) && resto>0 && asignadoEsencial>0){
    // No hay nada opcional con peso: lo que sobra se queda en lo esencial (proporcional), para que todo sume la meta.
    state.subcats.forEach(sb=>{ const x = porSub[sb.id]; if(x.esencial) x.presup += resto * x.presup/asignadoEsencial; });
  }
  state.subcats.forEach(sb=>{ const x = porSub[sb.id]; x.presup += x.presupRef; });
  const dHoy = destinoParaDia(ym===mesActual() ? todayISO() : ym+'-15');
  const v = {ym, meta, porSub, totalRef, necesidadEsencial: necesidadTotal, asignadoEsencial, resto: pesoTotal>0 ? resto : 0, sinRepartir: pesoTotal>0 ? 0 : resto, faltante: Math.max(0, totalRef + necesidadTotal - meta), escala, destino: dHoy, topeNoche: dHoy ? topeNocheEUR(dHoy) : null, hayDestinos};
  _planCache = {k, v};
  return v;
}
function presupuestoSubcatMXN(s, ym){ const x = planPresupuestoMes(ym).porSub[s.id]; return x ? x.presup : 0; }
function subcatGastadoTotalMesMXN(s, ym){ ym = ym||mesActual(); return (s.gastos||[]).filter(cuentaEnTotal).reduce((a,g)=>a+montoEnMesMXN(g, ym),0); }
function subcatRebasada(s, ym){
  const gastado = subcatGastadoTotalMesMXN(s, ym);
  const presup = presupuestoSubcatMXN(s, ym);
  return gastado > 0.5 && gastado > presup + 0.5;
}
function ymMov(m){ return m.tipo==='ingreso' ? (m.mes || ymDe(m.fecha)) : ymDe(m.fecha); }
function mesesBudgetTotal(){
  const set = new Set([mesActual()]);
  Object.keys(resumenPorMes()).forEach(k=>{ if(k<=mesActual()) set.add(k); });
  gastosCategoria().forEach(g=>{ if(g.quien==='abuelo' && g.fecha && ymDe(g.fecha)<=mesActual()) set.add(ymDe(g.fecha)); });
  return [...set].sort().reverse();
}
// Sobrante (+) o faltante (−) de mamá y papá acumulado ANTES de ese mes. El Abuelo no se acumula.
function acumuladoAntesDe(ym){
  const meses = resumenPorMes(); let acc = 0;
  Object.keys(meses).forEach(k=>{ if(k < ym) acc += meses[k].neto; });
  return acc - traspasosMXN('sobrante', null, ym);
}
// Efecto de un movimiento en el Budget total: +1 entra, −1 sale, 'neutro' se mueve dentro del total.
function signoTotal(m){
  if(m.tipo==='ingreso') return (esDestinoBote(m.destino) && !m.esAbuelo) ? +1 : 0;
  if(m.tipo==='gasto-generales' || m.tipo==='gasto-gustos') return (m.quien==='abuelo' || !fueraDelBote(m)) ? -1 : 0;
  if(m.tipo==='retiro-efectivo') return (m.cuenta==='bote' || m.cuenta==='arq' || m.cuenta==='abuelo') ? -1 : 0;
  if(m.tipo==='pago-tarjeta' && m.bolsa==='budget') return 'neutro'; // v18: pagar la parte del Budget de la tarjeta (ya se contó al comprar)
  if(m.tipo==='pago-tarjeta' || m.tipo==='pago-otro') return m.desde==='bote' ? -1 : 0;
  if(m.tipo==='pago-entre'){
    const s = m.sale==='bote', e = m.entra==='bote';
    if(s && e) return 'neutro';
    if(s) return -1; if(e) return +1; return 0;
  }
  return 0;
}

/* ---------- Deudas entre nosotras, gasto por gasto ---------- */
function deudaItems(){
  const items = [];
  // (Gustos ya no existe desde v15; si llegara algo ahí, igual cuenta.)
  [...state.subcats, {id:'gustos', nombre:'Otros', gastos: state.gustosGastos||[]}].forEach(sb=>(sb.gastos||[]).forEach(g=>{
    let deudor = null, acreedor = null, mitad = 0, viaAbuelo = false;
    if(g.quien==='abuelo'){
      if(g.repartoAbuelo!=='ambas') return;
      deudor='isa'; acreedor='jen'; mitad = mxnOf(g)/2; viaAbuelo = true;
    } else if(g.quien==='ambas'){
      const dd = deudaDeGastoAmbas(g); if(!dd) return;
      acreedor = dd.acreedor; deudor = dd.deudor; mitad = dd.monto;
    } else return;
    if(!(mitad>0)) return;
    items.push({k:'gastos:'+g.id, id:g.id, subId:sb.id, fecha:g.fecha, nota:g.nota||sb.nombre, subNombre:sb.nombre, deudor, acreedor, mitad, viaAbuelo, dosPusieron: g.pagadoPor==='ambas', pagado:0, pagos:[], delBudget: !viaAbuelo && !fueraDelBote(g)});
  }));
  const porK = {}; items.forEach(it=>{ porK[it.k] = it; });
  const libres = {jen:0, isa:0};
  const colas = {jen:[], isa:[]}; // v18: lo que sobró de cada pago (para saber con qué pago se saldó cada gasto)
  (state.pagosEntre||[]).filter(p=>!p.noDeuda).slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).forEach(p=>{
    let resto = mxnOf(p);
    (Array.isArray(p.aplica) ? p.aplica : []).forEach(ap=>{
      const it = porK[ap.k]; if(!it || it.deudor!==p.de || resto<=0) return;
      const x = Math.min(Math.max(0, Number(ap.montoMXN)||0), resto, Math.max(0, it.mitad - it.pagado));
      if(x>0){ it.pagado += x; it.pagos.push({id:p.id, x}); }
      resto -= x;
    });
    if(resto>0.004 && (p.de==='jen'||p.de==='isa')) colas[p.de].push({id:p.id, resto, excluye: new Set(Array.isArray(p.excluye)?p.excluye:[])});
  });
  // Lo que se pagó sin elegir gastos va a las deudas más viejas de esa persona.
  ['jen','isa'].forEach(d=>{
    items.filter(i=>i.deudor===d).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).forEach(it=>{
      let falta = it.mitad - it.pagado;
      for(const c of colas[d]){
        if(falta<=0.004) break;
        if(c.resto<=0.004 || c.excluye.has(it.k)) continue;
        const x = Math.min(falta, c.resto); it.pagado += x; it.pagos.push({id:c.id, x}); c.resto -= x; falta -= x;
      }
    });
    libres[d] = colas[d].reduce((a,c)=>a+Math.max(0,c.resto),0);
  });
  items.forEach(it=>{ it.restante = Math.max(0, Math.round((it.mitad - it.pagado)*100)/100); it.saldado = it.restante<=0.005; });
  // Si las dos pagaron de más, solo queda la diferencia.
  const m = Math.min(libres.jen, libres.isa); libres.jen = Math.round((libres.jen-m)*100)/100; libres.isa = Math.round((libres.isa-m)*100)/100;
  return {items, aFavor:libres};
}

// v16: si "deudora" paga cierta cantidad (MXN), qué gastos se saldan (del más viejo al más nuevo).
function simularPagoLibre(deudora, montoMXN){
  const ver = otraPersona(deudora);
  const {items, aFavor} = deudaItems();
  let resto = Math.max(0, Number(montoMXN)||0);
  const lineas = [];
  items.filter(i=>i.deudor===deudora && !i.saldado).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'') || String(a.id).localeCompare(String(b.id))).forEach(i=>{
    if(resto<=0.004) return;
    const x = Math.min(i.restante, resto); resto -= x;
    lineas.push({k:i.k, nota:i.nota, subNombre:i.subNombre, subId:i.subId, aplica:Math.round(x*100)/100, completo: x >= i.restante-0.005, queda: Math.max(0, Math.round((i.restante-x)*100)/100)});
  });
  // Lo que "ver" había pagado de más también se le regresa.
  const extraVer = aFavor[ver]>0.005 ? Math.min(aFavor[ver], resto) : 0; resto -= extraVer;
  return {lineas, extraVer: Math.round(extraVer*100)/100, sobra: Math.round(Math.max(0,resto)*100)/100};
}
let nosLibreMonto = '', nosLibreMoneda = 'MXN';
function renderPrevPagoLibre(deudora){
  const monto = Number(nosLibreMonto)||0;
  if(!(monto>0)) return `<div class="small-note">Escribe cuánto pagó y aquí ves qué gastos se saldan.</div>`;
  const mxn = nosLibreMoneda==='MXN' ? monto : monto*rateSnapshotFor(nosLibreMoneda);

/* ---------- Arq: pesos → euros al tipo de cambio de la compra ---------- */
function comprasArqDe(p){ return (state.comprasArq||[]).filter(c=>c.persona===p).slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'') || (a.creado||0)-(b.creado||0)); }
function consumosArq(p, excluirId){
  // Cada consumo trae solo la parte de esta persona (con "Ambas", lo que puso cada una).
  const gastos = gastosCategoria().filter(g=>g.pagadoCon==='arq' && partePago(g, p)>0 && g.id!==excluirId)
    .map(g=>{ const f = partePago(g, p); return Object.assign({}, g, {monto:(Number(g.monto)||0)*f, montoMXN: mxnOf(g)*f}); });
  const retiros = (state.efectivoMovimientos||[]).filter(m=>m.tipo==='retiro' && m.cuenta==='arq' && m.persona===p && m.id!==excluirId);
  return [...gastos, ...retiros].sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
}
function lotesArq(p, excluirId){
  const lotes = comprasArqDe(p).map(c=>({eur:Number(c.montoEUR)||0, rate:(Number(c.montoMXN)||0)/((Number(c.montoEUR)||1))}));
  consumosArq(p, excluirId).filter(g=>(g.moneda||'MXN')==='EUR').forEach(g=>{
    let falta = Number(g.monto)||0;
    for(const l of lotes){ if(falta<=0) break; const x = Math.min(l.eur, falta); l.eur -= x; falta -= x; }
  });
  return lotes.filter(l=>l.eur>0.0001);
}
function tasaArq(p, montoEUR, excluirId){
  const restantes = lotesArq(p, excluirId);
  const todas = comprasArqDe(p);
  const ultima = todas.length ? (Number(todas[todas.length-1].montoMXN)||0)/((Number(todas[todas.length-1].montoEUR)||1)) : null;
  if(!(montoEUR>0)) return restantes.length ? restantes[0].rate : ultima;
  let falta = montoEUR, mxn = 0;
  for(const l of restantes){ if(falta<=0) break; const x = Math.min(l.eur, falta); mxn += x*l.rate; falta -= x; }
  if(falta>0.0001){ const r = restantes.length ? restantes[restantes.length-1].rate : (ultima || rateSnapshotFor('EUR')); mxn += falta*r; }
  return mxn/montoEUR;
}
// Vuelve a calcular en pesos cada gasto/retiro en euros pagado con Arq, en orden
// (primero se usan los euros que se compraron primero). Así, editar un gasto o
// agregar una compra nunca cuenta dos veces los mismos euros.
function recalcularArq(st){
  st = st || state;
  if(!(st.comprasArq||[]).length) return false;
  let cambio = false;
  const porRec = new Map();
  ['jen','isa'].forEach(p=>{
    const compras = (st.comprasArq||[]).filter(c=>c.persona===p).slice().sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'') || (a.creado||0)-(b.creado||0) || String(a.id).localeCompare(String(b.id)));
    if(!compras.length) return;
    const lotes = compras.map(c=>({eur:Number(c.montoEUR)||0, rate:(Number(c.montoMXN)||0)/((Number(c.montoEUR)||1))})).filter(l=>l.eur>0);
    if(!lotes.length) return;
    const ultimaRate = lotes[lotes.length-1].rate;
    const gastos = [];
    (st.subcats||[]).forEach(sb=>(sb.gastos||[]).forEach(g=>gastos.push(g)));
    (st.gustosGastos||[]).forEach(g=>gastos.push(g));
    const cons = [
      ...gastos.filter(g=>g.pagadoCon==='arq' && partePago(g, p)>0).map(g=>({rec:g, eur:(Number(g.monto)||0)*partePago(g, p)})),
      ...(st.efectivoMovimientos||[]).filter(m=>m.tipo==='retiro' && m.cuenta==='arq' && m.persona===p).map(m=>({rec:m, eur:Number(m.monto)||0}))
    ].filter(c=>(c.rec.moneda||'MXN')==='EUR' && c.eur>0)
     .sort((a,b)=>(a.rec.fecha||'').localeCompare(b.rec.fecha||'') || String(a.rec.id).localeCompare(String(b.rec.id)));
    cons.forEach(c=>{
      let falta = c.eur, mxn = 0;
      for(const l of lotes){ if(falta<=0.000001) break; const x = Math.min(l.eur, falta); if(x>0){ mxn += x*l.rate; l.eur -= x; falta -= x; } }
      if(falta>0.000001) mxn += falta*ultimaRate; // gastó más euros de los comprados: provisional con la última compra
      const acc = porRec.get(c.rec) || {mxn:0, eur:0, partes:0};
      acc.mxn += mxn; acc.eur += c.eur; acc.partes++;
      porRec.set(c.rec, acc);
    });
  });
  porRec.forEach((acc, g)=>{
    const monto = Number(g.monto)||0; if(!(monto>0)) return;
    // Si "Ambas" y solo una tiene euros comprados, la otra parte se queda con su tipo de cambio actual.
    const faltaEur = Math.max(0, monto - acc.eur);
    // La parte sin euros de Arq se vale al tipo de cambio que quedó guardado al registrarlo (rateEURMXN), nunca al que esta misma función escribió.
    const mxn = acc.mxn + faltaEur * (Number(g.rateEURMXN)||rateSnapshotFor('EUR')||0);
    const rate = mxn/monto;
    const montoMXN = Math.round(mxn*100)/100;
    if(Math.abs((Number(g.rateMXN)||0)-rate)>0.00005 || Math.abs((Number(g.montoMXN)||0)-montoMXN)>0.005){ g.rateMXN = rate; g.montoMXN = montoMXN; cambio = true; }
  });
  return cambio;
}
function arqResumen(p){
  const depositos = state.ingresos.filter(i=>i.persona===p && i.destino==='arq' && (i.fecha||'')<=todayISO()).reduce((a,i)=>a+netoIngresoMXN(i),0);
  const compras = comprasArqDe(p);
  const comprasMXN = compras.reduce((a,c)=>a+(Number(c.montoMXN)||0),0);
  const eurComprados = compras.reduce((a,c)=>a+(Number(c.montoEUR)||0),0);
  const cons = consumosArq(p);
  const gastosMXN = cons.filter(g=>(g.moneda||'MXN')!=='EUR').reduce((a,g)=>a+mxnOf(g),0);
  const eurGastados = cons.filter(g=>(g.moneda||'MXN')==='EUR').reduce((a,g)=>a+(Number(g.monto)||0),0);
  const lotes = lotesArq(p);
  const eurRest = lotes.reduce((a,l)=>a+l.eur,0);
  const tasaProm = eurRest>0 ? lotes.reduce((a,l)=>a+l.eur*l.rate,0)/eurRest : null;
  return {depositos, comprasMXN, eurComprados, gastosMXN, eurGastados, saldoMXN: depositos - comprasMXN - gastosMXN, saldoEUR: eurComprados - eurGastados, tasaProm, compras};
}

/* ---------- Suscripciones ---------- */
function diasEntreISO(a, b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000); }
function sumarMesesISO(iso, n){ const ym = ymMas(ymDe(iso), n); return diaEnMes(ym, diaDe(iso)); }
function finTrial(inicio, cant, unidad){
  cant = Math.max(1, Number(cant)||1);
  if(unidad==='meses') return sumarMesesISO(inicio, cant);
  return sumarDiasISO(inicio, unidad==='semanas' ? cant*7 : cant);
}
function serieDeSuscripcion(sub){ return sub && sub.serieId ? (state.series||[]).find(x=>x.id===sub.serieId) : null; }
// Siguiente fecha de cobro (hoy o después) sin mirar la serie.
function proximoCobroBase(sub, hoy){
  hoy = hoy || todayISO();
  const primero = sub && (sub.tipo==='trial' ? sub.trialFin : sub.primerCobro);
  if(!primero) return null;
  if(hoy <= primero) return primero;
  const dia = diaDe(primero);
  let f = diaEnMes(ymDe(hoy), dia);
  if(f < hoy) f = diaEnMes(ymMas(ymDe(hoy), 1), dia);
  return f;
}
// Cobros que ya pasaron y se registrarían al guardar (para avisar antes).
function cobrosPasadosSuscripcion(sub, hoy){
  hoy = hoy || todayISO();
  const primero = sub.tipo==='trial' ? sub.trialFin : sub.primerCobro;
  if(!primero || primero > hoy) return 0;
  let n = 0, ym = ymDe(primero); const dia = diaDe(primero);
  while(ym <= ymDe(hoy)){ if(diaEnMes(ym, dia) <= hoy) n++; ym = ymMas(ym, 1); }
  return n;
}
function proximoCobro(sub, hoy){
  if(!sub || sub.activa===false) return null;
  const f = proximoCobroBase(sub, hoy);
  if(!f) return null;
  const se = serieDeSuscripcion(sub);
  if(se && se.hasta && ymDe(f) > se.hasta) return null;
  return f;
}
function enTrial(sub, hoy){ hoy = hoy||todayISO(); return sub.tipo==='trial' && sub.trialFin && hoy < sub.trialFin; }
function alertasSuscripciones(){
  const hoy = todayISO();
  return (state.suscripciones||[]).filter(s=>s.persona===perfil && s.activa!==false).map(s=>{
    const prox = proximoCobro(s, hoy); if(!prox) return null;
    const dias = diasEntreISO(hoy, prox);
    if(dias<0 || dias>1) return null;
    const esFinTrial = s.tipo==='trial' && prox===s.trialFin;
    if(!esFinTrial && !s.avisar) return null;
    if(s.avisosVistos && s.avisosVistos[prox]) return null;
    return {s, prox, dias, esFinTrial};
  }).filter(Boolean);
}
function plantillaSuscripcion(sub){
  const abuelo = sub.pagadoCon==='abuelo';
  const p = {monto:Number(sub.monto)||0, moneda:sub.moneda||'MXN', quien: abuelo ? 'abuelo' : sub.persona, pagadoPor:null, pagadoCon: abuelo ? 'bote' : sub.pagadoCon, nota:'Suscripción · '+sub.nombre, suscripcionId:sub.id};
  if(abuelo) p.repartoAbuelo = 'jen';
  if(sub.pagadoCon==='otro' && sub.otroNombre) p.otroNombre = sub.otroNombre;
  return p;
}
function sincronizarSerieSuscripcion(sub, opts){
  opts = opts || {};
  const primero = sub.tipo==='trial' ? sub.trialFin : sub.primerCobro;
  if(!primero) return;
  // Cancelada: nunca se crea ni se alarga la serie (no se cobra nada más).
  if(sub.activa===false) return;
  let se = serieDeSuscripcion(sub);
  const plantilla = plantillaSuscripcion(sub);
  const prox = proximoCobroBase(sub);
  if(!se){
    // Al reactivar, se empieza en el próximo cobro (no se cobran los meses en que estuvo cancelada).
    const desde = opts.reactivar && prox ? ymDe(prox) : ymDe(primero);
    se = {id:uid(), tipo:'gasto', persona:sub.persona, plantilla, dia:diaDe(primero), desde, hasta:null, omitidos:[], offset:0, cat:'generales', subId:sub.subId||null};
    state.series.push(se); sub.serieId = se.id;
    return;
  }
  const yaHay = registrosDeSerie(se);
  se.plantilla = plantilla; se.cat = 'generales'; se.subId = sub.subId||null; se.persona = sub.persona;
  if(!yaHay.length){ se.desde = opts.reactivar && prox ? ymDe(prox) : ymDe(primero); }
  se.dia = diaDe(primero); // si cambió el día de cobro, aplica a los meses que faltan
  if(se.hasta){
    // Estaba cancelada: los meses entre la cancelación y el próximo cobro no se cobran.
    if(!Array.isArray(se.omitidos)) se.omitidos = [];
    if(prox){ let m = ymMas(se.hasta, 1); const fin = ymDe(prox); while(m < fin){ if(!se.omitidos.includes(m)) se.omitidos.push(m); m = ymMas(m, 1); } se.omitidos.sort(); }
    se.hasta = null;
  }
  const yms = yaHay.map(r=>r.serieYM).filter(Boolean).sort();
  se.plantillaU = Math.max(Date.now(), selloMaximo(state)+1);
  se.plantillaYM = yms.length ? yms[yms.length-1] : ymMas(se.desde, -1);
}
function cancelarSuscripcion(sub){
  const prox = proximoCobro(sub);
  sub.activa = false; sub.canceladaEn = todayISO();
  const se = serieDeSuscripcion(sub);
  if(!se) return;
  const hasta = prox ? ymMas(ymDe(prox), -1) : mesActual();
  if(hasta < se.desde && !registrosDeSerie(se).length){ state.series = state.series.filter(x=>x.id!==se.id); sub.serieId = null; return; }
  se.hasta = hasta < se.desde ? se.desde : hasta;
  quitarRegistrosDeSerie(se, r=>(r.serieYM||'') > se.hasta);
}

function wirePickers(root){
  (root||document).querySelectorAll('[data-pk-btn]').forEach(btn=>{
    if(btn._pk) return; btn._pk = true;
    btn.addEventListener('click', (e)=>{
      e.preventDefault();
      const id = btn.getAttribute('data-pk-btn');
      const list = document.querySelector(`[data-pk-list="${id}"]`);
      document.querySelectorAll('.pk-list').forEach(l=>{ if(l!==list) l.hidden = true; });
      if(list) list.hidden = !list.hidden;
    });
  });
  (root||document).querySelectorAll('[data-pk-opt]').forEach(op=>{
    if(op._pk) return; op._pk = true;
    op.addEventListener('click', (e)=>{

function elegirEnPicker(id, v){
  const inp = document.getElementById(id); if(!inp) return;

  inp.value = v;

    btn.querySelector('.pk-cur').innerHTML = (ilu?ilu.outerHTML:'') + `<span class="pk-lbl">${escHtml(op.querySelector('.pk-lbl').textContent)}</span>`;

   Cada <select> de la app se muestra como un selector con icono en cada opción.

const ICO_SELECT_SVG = (g)=>`<span class="pk-ilu"><svg viewBox="0 0 64 64" aria-hidden="true">${ILU[g]||ILU.maleta}</svg></span>`;
function iconoLetra(t){
  const txt = String(t||'').replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]+/,'');
  const pal = paletteFor(Math.abs([...txt].reduce((a,c)=>a*31 + c.charCodeAt(0), 7)) % 12);
  return `<span class="pk-av" style="background:${pal.bg};color:${pal.fg};">${escHtml((txt[0]||'·').toUpperCase())}</span>`;
}
function iconoOpcionSel(sel, opt){
  if(!opt) return '';
  const av = opt.getAttribute('data-av'), g = opt.getAttribute('data-glyph'), ic = opt.getAttribute('data-ico');
  if(av) return avatarPersona(av);
  if(g) return ICO_SELECT_SVG(g);
  if(ic) return `<span class="pk-ic ${opt.getAttribute('data-ico-cls')||''}">${ico(ic,'icon-sm')}</span>`;
  const v = String(opt.value||''), t = sinAcentos(opt.textContent||''), campo = sel.getAttribute('data-ec') || sel.id || '';
  if(CURRENCY_META[v]) return `<span class="pk-flag">${CURRENCY_META[v].flag}</span>`;
  if(campo==='tipo' || /tipo/i.test(campo)){
    if(v==='gasto') return `<span class="pk-ic out">${ico('minus','icon-sm')}</span>`;
    if(v==='ingreso') return `<span class="pk-ic in">${ico('plus','icon-sm')}</span>`;
    if(v==='retiro') return ICO_SELECT_SVG('billete');
    if(v==='pagoTarjeta') return ICO_SELECT_SVG('credito');
  }
  if(state && state.subcats){ const sb = state.subcats.find(x=>x.id===v); if(sb) return ICO_SELECT_SVG(iconoSubcat(sb).glyph); }
  if(v==='jen' || v==='isa' || v==='ambas') return avatarPersona(v);
  if(v==='yo') return avatarPersona(sel.getAttribute('data-persona') || perfil);
  if(/^\d{4}-\d{2}$/.test(v) || /^\d{4}-\d{2}-\d{2}$/.test(v)) return ICO_SELECT_SVG('calendario');
  if(/abuelo/.test(t) || v==='abuelo') return ICO_SELECT_SVG('abuelo');
  if(/\barq\b/.test(t) || v==='arq') return ICO_SELECT_SVG('arq');
  if(/devoluci|reembols/.test(t)) return `<span class="pk-ic in">${ico('handcoin','icon-sm')}</span>`;
  if(/otra persona|alguien mas/.test(t) || v==='otro' || v==='otra-persona') return ICO_SELECT_SVG('persona');
  if(/efectivo|cash/.test(t) || v==='efectivo') return ICO_SELECT_SVG('billete');
  if(/otra cuenta|otra tarjeta|fuera de la app/.test(t) || v==='otra') return `<span class="pk-ic">${ico('swap','icon-sm')}</span>`;
  if(/budget|bote/.test(t) || v==='bote') return ICO_SELECT_SVG('bote');
  if(/credito|cred\b/.test(t) || /-cred$/.test(v) || v==='credito') return ICO_SELECT_SVG('credito');
  if(/debito|\bdeb\b/.test(t) || /-deb$/.test(v) || v==='debito') return ICO_SELECT_SVG('tarjeta');
  if(/ahorro|alcancia/.test(t)) return ICO_SELECT_SVG('alcancia');
  if(/\b(dia|dias|semana|semanas|mes|meses|cada|mensual|anual|unica|vez)\b/.test(t)) return ICO_SELECT_SVG('calendario');
  if(/^(wise|revolut|nu|didi|amex|american|estado de cuenta|otro banco)/.test(t)) return iconoLetra(opt.textContent);
  return iconoLetra(opt.textContent);
}

  };
  btn.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); if(sel.disabled) return; const abrir = list.hidden; cerrarListasPkx(list); document.querySelectorAll('.pk-list:not(.pkx-list)').forEach(l=>l.hidden=true); if(abrir){ llenar(); list.hidden = false; const on = list.querySelector('.pk-opt.on'); if(on && on.scrollIntoView) try{ on.scrollIntoView({block:'nearest'}); }catch(_){} } else list.hidden = true; });
  list.addEventListener('click', (e)=>{

    const b = e.target.closest('[data-pkx-v]'); if(!b || b.disabled) return;

    pintar();
  });
  sel.addEventListener('change', pintar);
  try{
    Object.defineProperty(sel, 'value', {configurable:true, get(){ return PKX_DESC.value.get.call(this); }, set(v){ PKX_DESC.value.set.call(this, v); pintar(); }});
    Object.defineProperty(sel, 'selectedIndex', {configurable:true, get(){ return PKX_DESC.idx.get.call(this); }, set(v){ PKX_DESC.idx.set.call(this, v); pintar(); }});
  }catch(_){}
  try{ new MutationObserver(()=>pintar()).observe(sel, {childList:true, subtree:true, attributes:true, attributeFilter:['disabled','selected','style','hidden']}); }catch(_){}
  pintar();
}

function opcionesPagoV15(persona, incluirAbuelo){
  const arq = arqResumen(persona);
  const out = [
    {v:'bote', label:nombreBudget(persona), sub:'Budget del viaje', glyph:'bote'},
    {v:'arq', label:'Arq (euros)', sub: arq.saldoEUR>0.005 ? 'Quedan '+fmt(arq.saldoEUR,'EUR')+(arq.tasaProm?' a '+arq.tasaProm.toFixed(2):'') : nombreBudget(persona)+' · compra euros primero', glyph:'arq'},
  ];
  if(persona==='jen' || incluirAbuelo) out.push({v:'abuelo', label:'Tarjeta del Abuelo', sub:'meta aparte', glyph:'abuelo'});
  out.push(
    {v:'efectivo', label:'Efectivo', sub:'tu efectivo', glyph:'billete'},
    {v:'debito', label:'Tarjeta de débito', sub:'Mi dinero', glyph:'tarjeta'},
    {v:'credito', label:'Tarjeta de crédito', sub:'Mi dinero', glyph:'credito'},
    {v:'otro', label:'Otra persona', sub:'alguien más lo pagó', glyph:'persona'}
  );
  return out;

function bolsaDePago(pago){
  if(pago==='bote') return 'budget';
  if(pago==='debito' || pago==='credito' || pago==='personal') return 'mio';
  return pago||'';
}

const ULT_TARJ_KEY = 'budgetin_ultima_tarjeta';
function ultimaTarjeta(bolsa){ try{ const v = JSON.parse(localStorage.getItem(ULT_TARJ_KEY)||'{}') || {}; const c = (v[perfil]||{})[bolsa]; return CUENTAS[c] ? c : ''; }catch(e){ return ''; } }
function ultimaTarjetaPara(pago){ const c = ultimaTarjeta(bolsaDePago(pago)); if(!c) return ''; if(pago==='credito') return esCredito(c) ? c : ''; if(pago==='debito' || pago==='personal') return esCredito(c) ? '' : c; return c; }
function recordarTarjeta(bolsa, cta){ if(!CUENTAS[cta] || !(bolsa==='budget' || bolsa==='mio')) return; try{ const v = JSON.parse(localStorage.getItem(ULT_TARJ_KEY)||'{}') || {}; v[perfil] = Object.assign({}, v[perfil], {[bolsa]: cta}); localStorage.setItem(ULT_TARJ_KEY, JSON.stringify(v)); }catch(e){} }

/* ---------- Encabezados por fecha en las listas ---------- */
function etiquetaDia(iso){
  if(!iso) return 'Sin fecha';
  const hoy = todayISO();
  if(iso===hoy) return 'Hoy';
  if(iso===sumarDiasISO(hoy,-1)) return 'Ayer';
  if(iso===sumarDiasISO(hoy,1)) return 'Mañana';
  const d = new Date(iso+'T00:00:00');
  const txt = d.toLocaleDateString('es-MX',{weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'');
  return txt.charAt(0).toUpperCase()+txt.slice(1) + (iso.slice(0,4)!==hoy.slice(0,4) ? ' '+iso.slice(0,4) : '');
}
function listaPorDia(movs, pintar){
  let html = '', ultima = null;
  movs.forEach(m=>{
    const f = m.fecha || '';
    if(f!==ultima){
      ultima = f;
      const lugar = lugarEnFecha(f);
      html += `<div class="dia-head"><span>${etiquetaDia(f)}</span>${lugar?`<small>${escHtml(lugar)}</small>`:''}</div>`;
    }
    html += pintar(m);
  });
  return html;
}

/* ---------- v18.5: Revisar posibles duplicados (en todo lo registrado) ---------- */
function personaDeMov(m){ if(/^gasto/.test(m.tipo)) return m.quien==='abuelo' ? 'jen' : (m.quien==='ambas' ? (m.pagadoPor||'ambas') : m.quien); return m.persona || ''; }
function claveParDup(a, b){ return [a.tipo+':'+a.id, b.tipo+':'+b.id].sort().join('|'); }
function posiblesDuplicados(){
  const desc = new Set(Array.isArray(state.noDuplicados) ? state.noDuplicados : []);
  const raw = (m)=>registroDeMov(m.tipo, m.id, m.subId || m.persona) || {};
  const lista = collectMovimientos().filter(m=>!m.estanciaParte && m.fecha && !(m.tipo==='ingreso' && m.traspaso) && ['out','in','pago','retiro'].includes(dirMov(m, perfil)))
    .map(m=>({m, d:dirMov(m, perfil), p:personaDeMov(m), mx:Math.abs(Number(m.montoMXN)||0), t:new Date(m.fecha+'T00:00:00').getTime(), imp:raw(m).importId||'', se:m.serieId||''}))
    .filter(x=>x.mx>0).sort((a,b)=>a.mx-b.mx);
  const pares = [];
  for(let i=0;i<lista.length;i++){
    const A = lista[i];
    for(let j=i+1;j<lista.length;j++){
      const B = lista[j];
      if(B.mx - A.mx > Math.max(1, A.mx*0.01)) break;
      if(A.d!==B.d || A.p!==B.p) continue;
      if(A.imp && A.imp===B.imp) continue;          // dos cargos iguales del mismo estado de cuenta: son reales
      if(A.se && A.se===B.se) continue;             // meses distintos de algo "cada mes"
      if(Math.abs(A.t-B.t) > 3*24*3600*1000) continue;
      if(desc.has(claveParDup(A.m, B.m))) continue;
      pares.push([A.m, B.m]);
    }
  }
  return pares.sort((x,y)=>(y[0].fecha||'').localeCompare(x[0].fecha||'')).slice(0, 60);
}
function openRevisarDuplicados(){
  const pares = posiblesDuplicados();
  const linea = (m)=>{ const r = registroDeMov(m.tipo, m.id, m.subId || m.persona) || {}; const im = r.importId ? (state.importaciones||[]).find(x=>x.id===r.importId) : null; const v = vistaMov(m);
    return `<div class="dup-mov">${micoHtml(iconoMov(m),'sm')}<div class="desc"><div class="n">${escHtml(m.nota||m.subNombre||labelTipoMov(m))}</div><div class="d">${escHtml(fmtDate(m.fecha))} · ${escHtml(labelTipoMov(m))}${im ? ' · '+escHtml(nombreImportacion(im)) : ' · a mano'}</div></div><div class="amt ${v.neutro?'neutro':(v.signo>0?'income':'gasto')}">${v.neutro?'↔ ':(v.signo>0?'+':'−')}${fmt(v.monto, v.moneda)}</div>
      <button type="button" class="icon-btn" data-dup-borrar="${escHtml(m.tipo+'|'+m.id+'|'+(m.subId||m.persona||''))}" title="Borrar este" aria-label="Borrar este">${ico('trash','icon-sm')}</button></div>`; };
  openSheet(`
    ${sheetHeader('Posibles duplicados')}
    <div class="small-note" style="margin-bottom:10px;">Movimientos del mismo tipo y de la misma persona, por casi el mismo monto y con 3 días o menos de diferencia. Borra el que sobra (va a la papelera) o marca "No es duplicado".</div>
    ${pares.length ? pares.map(([a,b])=>`<div class="dup-par">${linea(a)}${linea(b)}<button type="button" class="link-quiet" data-dup-no="${escHtml(claveParDup(a,b))}">${ico('check','icon-xs')} No es duplicado</button></div>`).join('') : `<div class="note-box">${ico('check','icon-sm')}<div>No encontré movimientos repetidos.</div></div>`}
  `);
  const ov = document.getElementById('overlay');
  ov.querySelectorAll('[data-dup-borrar]').forEach(b=>b.addEventListener('click', ()=>{
    const [tipo, id, extra] = b.getAttribute('data-dup-borrar').split('|');
    quitarMovimiento(tipo, id, extra, 'solo'); persist(); render(); openRevisarDuplicados();
    mostrarToast('Se borró (está en la papelera).', 'ok');
  }));
  ov.querySelectorAll('[data-dup-no]').forEach(b=>b.addEventListener('click', ()=>{
    if(!Array.isArray(state.noDuplicados)) state.noDuplicados = [];
    state.noDuplicados.push(b.getAttribute('data-dup-no')); if(state.noDuplicados.length > 400) state.noDuplicados = state.noDuplicados.slice(-400);
    persist(); openRevisarDuplicados();
  }));
}
function aplicarFiltrosMov(lista){
  const conPago = movFiltro==='todos' || movFiltro==='total';
  const idsCta = movFiltro==='personales' && CUENTAS[movFCuenta] ? saldosCuentas(perfil)[movFCuenta].ids : null;
  return lista.filter(m=>{
    if(movFDesde && (m.fecha||'') < movFDesde) return false;
    if(movFHasta && (m.fecha||'') > movFHasta) return false;
    if(movFTipo!=='todos'){
      const v = vistaMov(m);
      if(v.neutro) return false;
      if(movFTipo==='ingreso' && v.signo<=0) return false;
      if(movFTipo==='gasto' && v.signo>0) return false;
    }
    if(conPago && movFPago && pagoDeMov(m)!==movFPago) return false;
    if(idsCta){ if(!idsCta.has(m.id)) return false; }
    else if(movFiltro==='personales' && movFCuenta && !cuentasDeMov(m, perfil).some(c=>c.cuenta===movFCuenta)) return false;
    return true;
  });
}

let acumAbierto = null;
function desgloseAcumulado(){
  const meses = resumenPorMes(), hoyYM = mesActual();
  const filas = [];
  Object.keys(meses).filter(k=>k<hoyYM).sort().forEach(k=>filas.push({ym:k, tipo:'mes', ingreso:meses[k].ingreso, gasto:meses[k].gasto, v:meses[k].neto}));
  state.ingresos.filter(i=>i.traspaso==='sobrante' && (i.fecha||'')<=todayISO() && ymDe(i.fecha||'') >= inicioBudgetYM()).forEach(i=>filas.push({ym:ymDe(i.fecha||''), tipo:'uso', v:-brutoIngresoMXN(i), i}));
  return filas.sort((a,b)=>a.ym.localeCompare(b.ym) || (a.tipo==='mes'?-1:1));
}

      <div class="carry-line acum-tot"><div class="carry-lbl"><b>Total acumulado</b></div><div class="carry-val" style="color:${col(total)};">${txt(total)}</div></div>
      ${(()=>{ const n = gastosBudgetAntesDeInicio().length; return n ? `<div class="note-box" style="margin:8px 0;">${ico('alert','icon-sm')}<div>Hay ${n} gasto${n===1?'':'s'} marcado${n===1?'':'s'} como Budget antes de ${escHtml(nombreMesLargo(inicioBudgetYM()).toLowerCase())}: no cuentan aquí. <button type="button" class="link-quiet" data-acum-antes>Revisar</button></div></div>` : ''; })()}

function openUsarAcumulado(editId){
  const ex = editId ? state.ingresos.find(i=>i.id===editId) : null;
  // Un mes que ya cerró: lo que se usó o repuso ya quedó en el acumulado (no se edita el monto).
  if(ex && (ex.mes || ymDe(ex.fecha||'')) < mesActual()){
    openSheet(`${sheetHeader('Reposición de '+nombreMesLargo(ex.mes||ymDe(ex.fecha)).toLowerCase())}
      <div class="small-note" style="margin-bottom:12px;">Se repusieron ${fmt(Math.abs(Number(ex.montoBruto)||0),'MXN')} del Budget de ${nombreMesLargo(ex.mes||ymDe(ex.fecha)).toLowerCase()}. Ese mes ya cerró y lo que pasó ya está en el Total acumulado, así que el monto no se cambia. Si nunca debió existir, bórralo desde Movimientos.</div>
      <button class="btn btn-outline btn-block" onclick="closeSheet()">Entendido</button>`);
    return;
  }
  const devuelto = ex ? brutoIngresoMXN(ex) : 0;
  const total = carryoverAcumuladoMXN() + devuelto - (traspasosMXN('sobrante') - traspasosMXN('sobrante', todayISO()));
  const debe = ex ? (Number(ex.montoBruto)||0) < 0 : total < 0;
  const max = debe ? Math.max(0, -total) : Math.max(0, total);
  const persona = ex ? ex.persona : perfil;
  const ym = ex ? (ex.mes || mesActual()) : mesActual();
  const montoIni = ex ? Math.abs(Number(ex.montoBruto)||0) : (max>0.5 ? Math.round(max*100)/100 : '');
  openSheet(`
    ${sheetHeader((debe ? 'Reponer lo que se debe en ' : 'Usar el acumulado en ')+nombreMesLargo(ym).toLowerCase())}
    <div class="small-note" style="margin-bottom:12px;">${debe
      ? `De meses pasados se deben ${fmt(max,'MXN')}. Lo que pongas aquí se resta del Budget de ${nombreMesLargo(ym).toLowerCase()} y el acumulado sube (se acerca a $0).`
      : `Hay ${fmt(max,'MXN')} acumulados. Lo que pases se suma al Budget de ${nombreMesLargo(ym).toLowerCase()}; lo que no se gaste regresa al acumulado cuando cierre el mes.`}</div>
    <input type="hidden" id="usarSigno" value="${debe?'-1':'1'}">
    <div class="field"><label>${debe ? '¿Cuánto repones este mes?' : '¿Cuánto?'}</label><input type="number" step="0.01" min="0" id="usarMonto" placeholder="0" value="${montoIni}"></div>
    <div class="field"><label>${debe ? '¿Del Budget de quién sale?' : '¿Al Budget de quién?'}</label><div class="seg">${['jen','isa'].map(p=>`<button type="button" class="${persona===p?'on':''}" data-usar-persona="${p}">${nombreBudget(p)}</button>`).join('')}</div><input type="hidden" id="usarPersona" value="${persona}"></div>
    <button class="btn btn-primary btn-block" id="doUsarAcum">${ex ? 'Guardar cambios' : (debe ? 'Reponer en este mes' : 'Usar en este mes')}</button>
  `);
  document.querySelectorAll('[data-usar-persona]').forEach(b=>b.addEventListener('click', ()=>{ document.querySelectorAll('[data-usar-persona]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); document.getElementById('usarPersona').value = b.getAttribute('data-usar-persona'); }));
  document.getElementById('doUsarAcum').addEventListener('click', ()=>{
    const monto = Math.round((Number(document.getElementById('usarMonto').value)||0)*100)/100;
    if(!(monto>0)){ alert(debe ? 'Escribe cuánto repones.' : 'Escribe cuánto quieres usar.'); return; }
    if(monto > max + 0.5){ alert(debe ? (max>0.5 ? 'Solo se deben '+fmt(max,'MXN')+'.' : 'Ya no se debe nada de meses pasados. Si sobra esta reposición, bórrala desde Movimientos.') : 'Solo hay '+fmt(max,'MXN')+' acumulados.'); return; }
    const per = document.getElementById('usarPersona').value;
    const v = debe ? -monto : monto;
    const campos = {persona:per, fuente: debe ? 'Reposición de lo que se debía' : 'Del sobrante', montoBruto:v, moneda:'MXN', fecha: ex ? ex.fecha : todayISO(), mes:ym, destino:'bote', ahorroAuto:false, ahorroAutoMonto:0, recurrente:false, traspaso:'sobrante', nota:(debe ? 'Repuesto en ' : 'Usado en ')+nombreMesLargo(ym).toLowerCase(), ...stampRates(v, 'MXN', 1)};
    if(ex) Object.assign(ex, campos); else state.ingresos.push({id:uid(), ...campos});
    persist(); closeSheet(); render();
    mostrarToast(debe ? 'Listo: se restan '+fmt(monto,'MXN')+' del Budget de este mes para reponer lo que se debía.' : 'Listo: '+fmt(monto,'MXN')+' del acumulado se suman al Budget de este mes.', 'ok');
  });
}

function labelDestinoTraspaso(destino, persona){
  return {bote: nombreBudget(persona||'jen'), arq:'Arq ('+nombreBudget(persona||'jen')+')', efectivo:'Efectivo de '+nombrePersona(persona), debito:'Débito de '+nombrePersona(persona)}[destino] || destino;
}
function disponibleTraspaso(origen, excluirId){
  const ex = excluirId ? state.ingresos.find(i=>i.id===excluirId) : null;
  const devuelto = ex && ex.traspaso===origen ? brutoIngresoMXN(ex) : 0;
  if(origen==='ahorro') return ahorroSaldoMXN() + devuelto; // el ahorro ya resta todos los traspasos, sin importar la fecha
  // Sobrante: se restan también los traspasos con fecha futura (no se puede prometer dos veces el mismo dinero).
  const futuros = traspasosMXN('sobrante') - traspasosMXN('sobrante', todayISO());
  const exFuturo = ex && ex.traspaso==='sobrante' && (ex.fecha||'') > todayISO() ? brutoIngresoMXN(ex) : 0;
  return carryoverAcumuladoMXN() - futuros + exFuturo + (ex && ex.traspaso==='sobrante' && (ex.fecha||'') <= todayISO() ? brutoIngresoMXN(ex) : 0);
}

function opcionesLotePago(){
  const out = [];
  CUENTAS_BUDGET.forEach(k=>out.push({v:'bote|'+k, label:'Budget · '+CUENTAS[k].corto, glyph:'bote'}));
  CUENTAS_MIO.forEach(k=>out.push({v:(esCredito(k)?'credito|':'debito|')+k, label:'Mi dinero · '+CUENTAS[k].corto, glyph:CUENTAS[k].glyph}));
  out.push({v:'efectivo', label:'Efectivo', glyph:'billete'});
  if(hayArq()) out.push({v:'arq', label:'Arq (euros)', glyph:'arq'});
  return out;
}
function aplicarCampoLote(g, campo, v, pct){
  if(campo==='quien'){
    const antes = g.quien;
    if(v==='ambas'){ if(antes!=='ambas'){ g.pagadoPor = (antes==='jen'||antes==='isa') ? antes : perfil; delete g.parteJen; } }
    else { g.pagadoPor = null; delete g.parteJen; }
    g.quien = v;
  } else if(campo==='pagadoPor'){
    if(v==='jen' || v==='isa'){ g.pagadoPor = v; delete g.parteJen; }
    else { g.pagadoPor = 'ambas'; g.parteJen = v==='custom' ? pct/100 : 0.5; }
  } else if(campo==='pagadoCon'){
    const [pc, cta] = String(v).split('|');
    g.pagadoCon = pc; if(pc!=='otro') delete g.otroNombre;
    if(cta && CUENTAS[cta]) g.cta = cta; else delete g.cta;
  } else if(campo==='subId'){
    const destino = state.subcats.find(x=>x.id===v); if(!destino) return;
    state.subcats.forEach(x=>{ if(x.gastos.includes(g)) x.gastos = x.gastos.filter(y=>y!==g); });
    state.gustosGastos = state.gustosGastos.filter(y=>y!==g);
    destino.gastos.push(g);
    if(!esSubAlojamiento(destino)){ delete g.cubreDesde; delete g.cubreHasta; }
  } else if(campo==='fecha'){ g.fecha = v; }
  else if(campo==='nota'){ g.nota = v; }
}
function deshacerLote(antes){
  let hechos = 0, saltados = 0;
  antes.forEach(a=>{
    const actual = gastosCategoria().find(y=>y.id===a.id);
    // Si ya no existe o alguien lo cambió después, no se pisa.
    if(!actual || (a.uDespues!=null && actual._u!==a.uDespues)){ saltados++; return; }
    state.subcats.forEach(x=>{ if(x.gastos.some(y=>y.id===a.id)) x.gastos = x.gastos.filter(y=>y.id!==a.id); });
    state.gustosGastos = state.gustosGastos.filter(y=>y.id!==a.id);
    const sb = a.sub ? state.subcats.find(x=>x.id===a.sub) : null;
    if(sb) sb.gastos.push(a.rec); else if(!a.sub) state.gustosGastos.push(a.rec); else (subcatV15(state,'Otros')).gastos.push(a.rec);
    hechos++;
  });
  persist(); render();
  mostrarToast(saltados ? `Se regresaron ${hechos}; ${saltados} ya habían cambiado y se dejaron como están.` : 'Se regresaron los cambios.', 'ok');
}

// Compensar: si las dos se deben, se cancelan las deudas hasta donde alcance (no se mueve dinero).
function planCompensacion(){
  const {items} = deudaItems();
  const lado = (d)=>items.filter(i=>i.deudor===d && !i.saldado).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'') || String(a.id).localeCompare(String(b.id)));
  const J = lado('jen'), I = lado('isa');
  const tJ = J.reduce((a,i)=>a+i.restante,0), tI = I.reduce((a,i)=>a+i.restante,0);
  const m = Math.round(Math.min(tJ, tI)*100)/100;
  const reparte = (lista)=>{ let r = m; const out = []; lista.forEach(i=>{ if(r<=0.004) return; const x = Math.round(Math.min(i.restante, r)*100)/100; r -= x; out.push({k:i.k, nota:i.nota, montoMXN:x, completo: x>=i.restante-0.005, queda: Math.max(0, Math.round((i.restante-x)*100)/100), mitad:i.mitad}); }); return out; };
  return {monto: m, jen: m>0 ? reparte(J) : [], isa: m>0 ? reparte(I) : []};
}
function openCompensar(){
  const pl = planCompensacion();
  if(!(pl.monto>0.004)){ mostrarToast('No hay deudas de las dos para compensar.', 'error'); return; }
  const lista = (arr)=>arr.map(l=>`<div class="det-row"><span>${escHtml(l.nota)}</span><b>${l.completo ? 'saldado' : fmt(l.montoMXN,'MXN')+' de '+fmt(l.mitad,'MXN')+' · faltan '+fmt(l.queda,'MXN')}</b></div>`).join('');
  openSheet(`
    ${sheetHeader('Compensar deudas')}
    <div class="small-note" style="margin-bottom:12px;">Las dos se deben algo: se cancela <b>${fmt(pl.monto,'MXN')}</b> de cada lado, del gasto más viejo al más nuevo. No se mueve dinero de ninguna cuenta.</div>
    <div class="field"><label>Lo que Jen le debía a Isa</label><div class="det-rows">${lista(pl.jen)}</div></div>
    <div class="field"><label>Lo que Isa le debía a Jen</label><div class="det-rows">${lista(pl.isa)}</div></div>
    <button class="btn btn-primary btn-block" id="doCompensar">Compensar ${fmt(pl.monto,'MXN')}</button>
  `);
  document.getElementById('doCompensar').addEventListener('click', ()=>{
    const p2 = planCompensacion(); if(!(p2.monto>0.004)){ closeSheet(); return; }
    const grupo = uid(), fecha = todayISO();
    const nota = (de)=>'Compensación · '+(de==='jen' ? p2.jen : p2.isa).map(l=>l.nota).join(', ');
    ['jen','isa'].forEach(de=>{
      state.pagosEntre.push({id:uid(), de, a:otraPersona(de), monto:p2.monto, moneda:'MXN', rateMXN:1, montoMXN:p2.monto, fecha, sale:'compensacion', entra:'compensacion', compensacion:grupo, nota:nota(de), notaLibre:'', aplica:(de==='jen'?p2.jen:p2.isa).map(l=>({k:l.k, montoMXN:l.montoMXN}))});

// "Marcar como pendiente otra vez" un gasto saldado.
function openPendienteOtraVez(k, pagoId){
  const pe = (state.pagosEntre||[]).find(p=>p.id===pagoId); if(!pe) return;
  const {items} = deudaItems();
  const it = items.find(i=>i.k===k);
  const otros = items.filter(i=>i.k!==k && (i.pagos||[]).some(x=>x.id===pagoId)).map(i=>i.nota);
  const esComp = pe.sale==='compensacion';
  openSheet(`
    ${sheetHeader('Marcar como pendiente otra vez')}
    <div class="small-note" style="margin-bottom:12px;"><b>${escHtml(it?it.nota:'Gasto')}</b> se saldó con: ${escHtml(textoPagoEntre(pe))}.</div>
    ${esComp ? `<button class="btn btn-outline btn-block" data-pend-op="comp" style="margin-bottom:10px;">Deshacer la compensación</button>
      <div class="small-note" style="margin-bottom:12px;">Todo lo que se compensó ese día vuelve a quedar como estaba.</div>` : `
    <div class="small-note" style="margin-bottom:8px;">¿Qué pasó?</div>
    <button class="btn btn-outline btn-block" data-pend-op="borrar" style="margin-bottom:6px;">Ese pago no existió (borrarlo)</button>
    <div class="small-note" style="margin-bottom:12px;">${otros.length ? 'Ese pago también saldó: '+escHtml(otros.join(', '))+'. También volverán a quedar pendientes.' : 'Se va a la papelera por si lo necesitas.'}</div>
    <button class="btn btn-outline btn-block" data-pend-op="otra" style="margin-bottom:6px;">El pago era para otra cosa</button>
    <div class="small-note">El pago se queda, pero ya no cuenta para este gasto (se usa para lo demás que se deba).</div>`}
  `);
  document.querySelectorAll('[data-pend-op]').forEach(b=>b.addEventListener('click', ()=>{
    const op = b.getAttribute('data-pend-op');
    if(op==='comp'){ (state.pagosEntre||[]).filter(p=>p.compensacion===pe.compensacion).map(p=>p.id).forEach(id=>quitarMovimiento('pago-entre', id)); }
    else if(op==='borrar'){ quitarMovimiento('pago-entre', pagoId); }
    else {
      const x = (state.pagosEntre||[]).find(p=>p.id===pagoId); if(!x) return;
      if(Array.isArray(x.aplica)) x.aplica = x.aplica.filter(ap=>ap.k!==k);
      if(!Array.isArray(x.excluye)) x.excluye = [];
      if(!x.excluye.includes(k)) x.excluye.push(k);
    }
    persist(); closeSheet(); render();
    mostrarToast(op==='otra' ? 'Listo: ese pago ya no cuenta para este gasto.' : 'Listo: volvió a quedar pendiente.', 'ok');
  }));
}
function renderNosotras(){
  const d = deudasPendientes();
  const {items, aFavor} = deudaItems();
  const neto = d.neto;
  const pos = {jen:fmtPosicionDeuda(neto), isa:fmtPosicionDeuda(-neto)};
  const ver = nosotrasVer || (neto>0.005 ? 'jen' : (neto<-0.005 ? 'isa' : perfil)); // acreedora
  const deudora = otraPersona(ver);
  const pend = items.filter(i=>i.acreedor===ver && !i.saldado).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  const sald = items.filter(i=>i.acreedor===ver && i.saldado).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  // Lo que "ver" pagó de más (sin gastos pendientes que cubrir) también se lo deben.
  const extraVer = aFavor[ver]>0.005 ? aFavor[ver] : 0;
  const totalPend = pend.reduce((a,i)=>a+i.restante,0) + extraVer;
  const contraPend = items.filter(i=>i.acreedor===deudora && !i.saldado).reduce((a,i)=>a+i.restante,0) + (aFavor[deudora]>0.005 ? aFavor[deudora] : 0);
  const netoVer = ver==='jen' ? neto : -neto;
  const selTotal = pend.reduce((a,i)=>a+(nosotrasSel[i.k]!==undefined ? Math.min(i.restante, Math.max(0, Number(nosotrasSel[i.k])||0)) : 0),0);
  const q = sinAcentos(nosotrasBusqueda.trim());
  const historial = [
    ...items.map(i=>({tipo:'item', fecha:i.fecha, i})),
    ...(state.pagosEntre||[]).map(p=>({tipo:'pago', fecha:p.fecha, p}))
  ].filter(x=>{
    if(!q) return true;
    const t = x.tipo==='item' ? x.i.nota+' '+x.i.subNombre : (x.p.nota||'')+' pago';
    return sinAcentos(t).includes(q);

  const lineaItem = (i, conSel)=>`
    <div class="exp-line nos-item ${i.saldado?'saldado':''}">
      ${conSel ? `<label class="nos-chk"><input type="checkbox" data-nos-sel="${escHtml(i.k)}" ${nosotrasSel[i.k]!==undefined?'checked':''}></label>` : ''}
      ${micoHtml(iconoMov({tipo:'gasto-generales', subId:i.subId}),'sm')}
      <div class="desc"><div data-mov-open="gasto-generales|${i.id}|${i.subId}"><div class="n">${escHtml(i.nota)}</div><div class="d">${fmtDate(i.fecha)} · ${escHtml(i.subNombre)} · ${i.viaAbuelo?'Tarjeta del Abuelo':(i.dosPusieron ? 'pusieron las dos, '+nombrePersona(i.acreedor)+' de más' : 'puso '+nombrePersona(i.acreedor))}${i.pagado>0.005 && !i.saldado?` · ya pagó ${fmt(i.pagado,'MXN')}`:''}</div></div>${i.saldado ? htmlPagosDeItem(i) : ''}</div>
      <div class="amt ${i.saldado?'':'gasto'}">${i.saldado ? 'Saldado' : fmt(i.restante,'MXN')}${!i.saldado && i.pagado>0.005 ? `<span class="est">de ${fmt(i.mitad,'MXN')}</span>` : ''}</div>
    </div>
    ${conSel && nosotrasSel[i.k]!==undefined ? `<div class="nos-parcial"><label>¿Cuánto paga de este? (MXN)</label><input type="number" step="0.01" data-nos-monto="${escHtml(i.k)}" value="${nosotrasSel[i.k]}" max="${i.restante}"></div>` : ''}`;
  return `
  <div class="card card-deudas">
    <div class="card-title"><h2>${ico('users','icon-sm')} Cuentas entre nosotras</h2></div>
    <div class="deuda-cols">
      ${['jen','isa'].map(p=>`<div class="deuda-col ${ver===p?'on':''}" data-nos-ver="${p}" style="cursor:pointer;">
        <div class="deuda-col-name">${nombrePersona(p)}</div>
        <div class="deuda-col-amt" style="color:${pos[p].color};">${pos[p].txt}</div>
      </div>`).join('')}
    </div>
    <div class="small-note" style="margin-top:8px;">Verde = le deben · Rojo = debe. Toca un nombre para ver lo que le deben.</div>
  </div>
  <div class="card">
    <div class="card-title"><h2>Lo que ${nombrePersona(deudora)} le debe a ${nombrePersona(ver)}</h2><span class="hint">${fmt(totalPend,'MXN')}</span></div>
    ${contraPend>0.005 ? `<div class="note-box" style="margin:-2px 0 10px;flex-wrap:wrap;"><span>${netoVer>0.005 ? `En neto ${nombrePersona(deudora)} le debe <b>${fmt(netoVer,'MXN')}</b>` : (netoVer<-0.005 ? `En neto es ${nombrePersona(ver)} quien debe <b>${fmt(-netoVer,'MXN')}</b>` : 'En neto están a mano')}, porque ${nombrePersona(ver)} también le debe ${fmt(contraPend,'MXN')} a ${nombrePersona(deudora)} (toca su nombre arriba para verlo).</span>${planCompensacion().monto>0.004 ? `<button class="btn btn-outline btn-sm" id="nosCompensar" style="margin-top:8px;">${ico('swap','icon-sm')} Compensar ${fmt(planCompensacion().monto,'MXN')}</button>` : ''}</div>` : ''}
    ${(pend.length || extraVer) ? `<div class="nos-libre">
      <label for="nosLibreMonto">¿Cuánto pagó ${nombrePersona(deudora)}? <span class="muted">(cualquier cantidad)</span></label>
      <div class="nos-libre-row"><input type="number" step="0.01" min="0" id="nosLibreMonto" placeholder="0" value="${escHtml(nosLibreMonto)}"><select id="nosLibreMoneda" aria-label="Moneda">${['MXN','EUR'].map(m=>`<option ${m===nosLibreMoneda?'selected':''}>${m}</option>`).join('')}</select><button class="btn btn-primary btn-sm" id="nosLibrePagar" data-deudora="${deudora}">Registrar</button></div>
      <div id="nosLibrePrev">${renderPrevPagoLibre(deudora)}</div>
