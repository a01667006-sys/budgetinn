// En qué tarjeta (débito/crédito) de una persona pega un movimiento, y con
// qué signo (+ entra / baja lo utilizado, − sale / sube lo utilizado).
function cuentasDeMov(m, persona){
  const out = [];
  const esCat = m.tipo==='gasto-generales' || m.tipo==='gasto-gustos';
  if(esCat && partePago(m, persona)>0){
    if(esDebito(m.pagadoCon)) out.push({cuenta:'debito', signo:-1});
    if(m.pagadoCon==='credito') out.push({cuenta:'credito', signo:-1});
    if(m.pagadoCon==='otro') out.push({cuenta:'otro', signo:-1});
  }
  if(m.persona===persona){
    if(m.tipo==='personal-ganancia') out.push({cuenta:'debito', signo:+1});
    if(m.tipo==='personal-gasto') out.push({cuenta:m.cuenta==='credito'?'credito':'debito', signo:-1});
    if(m.tipo==='ingreso' && m.destino==='debito') out.push({cuenta:'debito', signo:+1});
    if(m.tipo==='retiro-efectivo' && esDebito(m.cuenta)) out.push({cuenta:'debito', signo:-1});
    if(m.tipo==='pago-tarjeta'){ out.push({cuenta:'credito', signo:+1}); if(m.desde==='debito') out.push({cuenta:'debito', signo:-1}); }
    if(m.tipo==='pago-otro'){ if(m.desde==='debito') out.push({cuenta:'debito', signo:-1}); out.push({cuenta:'otro', signo:+1}); }
  }
  if(m.tipo==='pago-entre'){
    if(m.persona===persona && esDebito(m.sale)) out.push({cuenta:'debito', signo:-1});
    if(m.a===persona && esDebito(m.entra)) out.push({cuenta:'debito', signo:+1});
  }
  if(m.tipo==='transferencia' && m.persona===persona) out.push({cuenta:'debito', signo:0});
  return out;
}
// Efecto de un movimiento en el efectivo de una persona (+/−/0).
function signoEfectivo(m, persona){
  if(m.tipo==='gasto-efectivo' && m.quien===persona) return -1;
  if((m.tipo==='retiro-efectivo' || m.tipo==='ajuste-efectivo') && m.quien===persona) return +1;
  if((m.tipo==='gasto-generales'||m.tipo==='gasto-gustos') && m.pagadoCon==='efectivo' && partePago(m, persona)>0) return -1;
  if(m.tipo==='ingreso' && m.destino==='efectivo' && m.persona===persona) return +1;
  if(m.tipo==='pago-otro' && m.desde==='efectivo' && m.persona===persona) return -1;
  if(m.tipo==='pago-tarjeta' && m.desde==='efectivo' && m.persona===persona) return -1;
  if(m.tipo==='pago-entre'){
    if(m.persona===persona && m.sale==='efectivo') return -1;
    if(m.a===persona && m.entra==='efectivo') return +1;
  }
  return 0;
}
// Efecto en el Budget (mamá/papá) de una persona.
function signoBudget(m, persona){
  if(m.tipo==='ingreso') return (esDestinoBote(m.destino) && m.persona===persona && !m.esAbuelo) ? +1 : 0;
  if(m.tipo==='retiro-efectivo') return ((m.cuenta==='bote'||m.cuenta==='arq') && m.persona===persona) ? -1 : 0;
  if(m.tipo==='pago-tarjeta') return (m.desde==='bote' && m.bolsa!=='budget' && m.persona===persona) ? -1 : 0;
  if(m.tipo==='pago-otro') return (m.desde==='bote' && m.persona===persona) ? -1 : 0;
  if(m.tipo==='pago-entre'){
    const pe = (state.pagosEntre||[]).find(x=>x.id===m.id) || m;
    const e = efectoBudgetPagoEntre(Object.assign({}, pe, {de: pe.de || m.persona}), persona, porcionBudgetDePagos());
    return e > 0.004 ? -1 : (e < -0.004 ? +1 : 0);
  }
  if((m.tipo==='gasto-generales'||m.tipo==='gasto-gustos') && !fueraDelBote(m) && m.quien!=='abuelo'){
    return (m.quien===persona || m.quien==='ambas') ? -1 : 0;
  }
  return 0;
}
function movMatchesChip(m, chip, todosMeses){
  if(chip==='todos') return true;
  if(chip==='abuelo') return m.quien==='abuelo' || (m.tipo==='retiro-efectivo' && m.cuenta==='abuelo');
  if(chip==='personales') return cuentasDeMov(m, perfil).length>0;
  if(chip==='efectivo') return signoEfectivo(m, perfil)!==0;
  if(chip==='budget') return signoBudget(m, perfil)!==0;
  if(chip==='total') return signoTotal(m)!==0 && (todosMeses || ymMov(m)===(movMesTotal||mesActual()));
  return true;
}
// Signo y monto que se muestran según el filtro activo (p. ej. en tu Budget
// un gasto compartido cuenta a la mitad y el ingreso va en neto).
function vistaMov(m){
  let signo;
  let monto = m.monto, moneda = m.moneda||'MXN', montoMXN = m.montoMXN, nota = '';
  if(m.tipo==='transferencia') return {signo:0, neutro:true, monto, moneda, montoMXN, nota:'entre tus cuentas'+(m.bolsa==='budget'?' (del Budget)':'')};
  if(m.tipo==='pago-entre' && m.sale==='compensacion') return {signo:0, neutro:true, monto, moneda, montoMXN, nota:'compensación (no se movió dinero)'};
  if(movFiltro==='total'){
    const st = signoTotal(m);
    if(st==='neutro') return {signo:0, neutro:true, monto, moneda, montoMXN, nota:'se queda dentro del Budget'};
    signo = st;
    if(m.tipo==='ingreso' && m.netoMXN!==m.montoMXN){ monto = m.netoMXN; moneda = 'MXN'; montoMXN = m.netoMXN; nota = 'neto de ahorro'; }
    if(m.quien==='abuelo') nota = 'Tarjeta del Abuelo';
  } else if(movFiltro==='budget'){
    signo = signoBudget(m, perfil);
    if(m.tipo==='ingreso' && m.netoMXN!==m.montoMXN){ monto = m.netoMXN; moneda = 'MXN'; montoMXN = m.netoMXN; nota = 'neto de ahorro'; }
    if(m.quien==='ambas' && (m.tipo==='gasto-generales'||m.tipo==='gasto-gustos')){ monto = m.monto/2; montoMXN = m.montoMXN/2; nota = 'tu mitad'; }
  } else if(movFiltro==='efectivo'){
    signo = signoEfectivo(m, perfil);
    if(m.quien==='ambas' && m.pagadoPor==='ambas' && (m.tipo==='gasto-generales'||m.tipo==='gasto-gustos')){ const f = partePago(m, perfil); monto = m.monto*f; montoMXN = m.montoMXN*f; nota = 'tu parte'; }
  } else if(movFiltro==='personales'){
    const c = cuentasDeMov(m, perfil);
    signo = c.length ? c[0].signo : -1;
    if(m.quien==='ambas' && m.pagadoPor==='ambas' && (m.tipo==='gasto-generales'||m.tipo==='gasto-gustos')){ const f = partePago(m, perfil); monto = m.monto*f; montoMXN = m.montoMXN*f; nota = 'tu parte'; }
    if(m.tipo==='pago-tarjeta' && m.desde==='debito') nota = 'de débito a crédito';
    if(m.pagadoCon==='otro' && (m.tipo==='gasto-generales'||m.tipo==='gasto-gustos')) nota = 'lo pagó '+(m.otroNombre||'otra persona');
  } else if(movFiltro==='abuelo'){
    signo = -1;
  } else {
    signo = m.tipo==='pago-entre' ? (m.a===perfil ? +1 : -1)
      : ((m.tipo==='ingreso' || m.tipo==='personal-ganancia' || m.tipo==='retiro-efectivo' || m.tipo==='ajuste-efectivo') ? +1 : -1);
  }
  if(Number(monto) < 0){ signo = -(signo>=0?1:-1); monto = -monto; montoMXN = -montoMXN; if(m.traspaso==='sobrante') nota = 'reponer lo que se debía'; }
  return {signo: signo>=0?+1:-1, monto, moneda, montoMXN, nota, neutro:false};
}
function labelTipoMov(m){
  if(m.tipo==='ingreso' && m.traspaso==='sobrante' && (Number(m.monto)||0) < 0) return 'Reposición · lo que se debía → ' + labelDestinoTraspaso(m.destino, m.persona);
  if(m.tipo==='ingreso' && m.traspaso) return 'Traspaso · ' + (m.traspaso==='ahorro' ? 'del ahorro' : 'del sobrante') + ' → ' + labelDestinoTraspaso(m.destino, m.persona);
  if(m.tipo==='ingreso') return 'Ingreso' + (m.destino==='debito' ? ' · mío' : (m.destino==='efectivo' ? ' · efectivo' : (m.destino==='arq' ? ' · Arq' : ' · Budget'))) + (m.recurrente ? ' · cada mes' : '');
  if(m.tipo==='personal-gasto') return m.cuenta==='credito' ? 'Crédito' : 'Débito';
  if(m.tipo==='personal-ganancia') return 'Débito';
  if(m.tipo==='transferencia') return 'Pase entre cuentas · '+labelCuenta(m.desde)+' → '+labelCuenta(m.hacia);
  return {'gasto-generales':m.subNombre,'gasto-gustos':'Gustos','gasto-efectivo':'Efectivo','retiro-efectivo':'Retiro efectivo','ajuste-efectivo':'Saldo inicial','pago-entre':'Pago entre nosotras','pago-tarjeta':'Pago de tarjeta','pago-otro':'Pago de deuda','ahorro-retiro':'Ahorro'}[m.tipo]||'';
}
// Etiquetas de una línea sin repetir (p. ej. "Tarjeta del Abuelo" no sale tres veces).
function tagsMovUnicos(m, v, tipoLabel, esGasto){
  const vistos = new Set([String(quienTxt(m)||'').replace(/^ · /,'').trim().toLowerCase()]);
  const out = [];
  const add = (txt, cls)=>{ const t = String(txt||'').trim(); if(!t) return; const k = t.toLowerCase(); if(vistos.has(k)) return; vistos.add(k); out.push(` <span class="type-tag${cls?' '+cls:''}">${escHtml(t)}</span>`); };
  add(tipoLabel);
  if(esGasto) add(labelPago(m), 'pago-tag');
  const seM = m.serieId ? (state.series||[]).find(x=>x.id===m.serieId) : null;

  if(m.estanciaParte) add('noches de este mes · de '+fmt(m.estanciaParte.total,'MXN'));
  if(v.nota) add(v.nota);
  return out.join('');
}

/* ============================================================
   v18 — CUENTAS Y BOLSAS. Cada una tiene Nu (débito y crédito) y Revolut
   (débito y crédito). En cada cuenta conviven dos "bolsas": lo del Budget
   (lo que dan mamá/papá para el viaje) y lo tuyo. La app no mueve dinero:
   solo lleva la cuenta de cuánto de cada cuenta es de cada bolsa.

   débito (tuyo), crédito → Nu crédito (tuyo).
   ============================================================ */
const CUENTAS = {
  'nu-deb':  {label:'Nu · Tarjeta de débito',      corto:'Nu débito',      tipo:'deb',  glyph:'tarjeta'},
  'nu-cred': {label:'Nu · Tarjeta de crédito',     corto:'Nu crédito',     tipo:'cred', glyph:'credito'},
  'rev-deb': {label:'Revolut · Tarjeta de débito', corto:'Revolut débito', tipo:'deb',  glyph:'tarjeta'},
  'rev-cred':{label:'Revolut · Tarjeta de crédito',corto:'Revolut crédito',tipo:'cred', glyph:'credito'},
};
const CUENTAS_BUDGET = ['nu-deb','nu-cred','rev-deb','rev-cred']; // v18.1: el Budget también puede estar en Revolut débito
const CUENTAS_MIO = ['nu-deb','nu-cred','rev-deb','rev-cred'];
const CUENTAS_DEBITO = ['nu-deb','rev-deb'];
function opcionesCta(lista, sel){ return lista.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${CUENTAS[k].corto}</option>`).join(''); }
const CUENTAS_CREDITO = ['nu-cred','rev-cred'];

function ctasDebitoDe(k, sel){ const l = CUENTAS_DEBITO.slice(); if(sel && CUENTAS[sel] && !esCredito(sel) && !l.includes(sel)) l.push(sel); return l; }
function labelCuenta(k){ return CUENTAS[k] ? CUENTAS[k].corto : (k||''); }
function esCredito(k){ return !!(CUENTAS[k] && CUENTAS[k].tipo==='cred'); }
function ctaDebito(v){ return CUENTAS[v] && CUENTAS[v].tipo==='deb' ? v : 'nu-deb'; }
function ctaCredito(v){ return CUENTAS[v] && CUENTAS[v].tipo==='cred' ? v : 'nu-cred'; }
// Cuenta física de un gasto de categoría (null si no sale de una tarjeta).
function ctaDeGasto(g){
  if(!g) return null;
  if(g.pagadoCon==='bote') return CUENTAS[g.cta] ? g.cta : 'nu-deb';
  if(g.pagadoCon==='debito' || g.pagadoCon==='personal') return ctaDebito(g.cta);
  if(g.pagadoCon==='credito') return ctaCredito(g.cta);
  return null;
}
function hayArq(){
  return (state.comprasArq||[]).length>0 || state.ingresos.some(i=>i.destino==='arq') || gastosCategoria().some(g=>g.pagadoCon==='arq') || (state.efectivoMovimientos||[]).some(m=>m.cuenta==='arq');
}
function inicialCuenta(p, k){
  if(k==='nu-deb') return Number((state.finanzas[p]||{}).inicial)||0;
  return Number((((state.cuentasCfg||{})[p]||{})[k]||{}).inicial)||0;
}
function limiteCuenta(p, k){
  if(k==='nu-cred') return creditoLimiteMXN(p);
  return Number((((state.cuentasCfg||{})[p]||{})[k]||{}).limite)||0;
}
// Todos los movimientos de dinero por cuenta y bolsa: {p, cta, bolsa:'budget'|'mio'|'ahorro', mxn (+ entra / − sale), id}.
// En las de crédito, el saldo es negativo = lo que se debe.
function flujosCuentas(){
  const out = [];
  const hoy = todayISO();
  const f = (p, cta, bolsa, mxn, id, fecha)=>{ if((p==='jen'||p==='isa') && CUENTAS[cta] && mxn) out.push({p, cta, bolsa, mxn, id, fecha: fecha||''}); };
  ['jen','isa'].forEach(p=>{
    f(p, 'nu-deb', 'mio', inicialCuenta(p,'nu-deb'), 'ini-'+p+'-nu-deb');
    f(p, 'rev-deb', 'mio', inicialCuenta(p,'rev-deb'), 'ini-'+p+'-rev-deb');
  });
  state.ingresos.forEach(i=>{
    const p = i.persona; const cta = ctaDebito(i.cta);
    if(i.traspaso){
      if(i.destino==='debito' ? !ocurrenciasIngreso(i).length : (i.fecha && i.fecha > hoy)) return; // igual que el saldo de débito
      const x = brutoIngresoMXN(i);
      const origen = i.traspaso==='ahorro' ? 'ahorro' : 'budget';
      const dest = i.destino==='bote' ? 'budget' : (i.destino==='debito' ? 'mio' : null);
      if(origen===dest) return; // del sobrante al Budget del mes: ya estaba en la cuenta
      f(p, cta, origen, -x, i.id); if(dest) f(p, cta, dest, x, i.id);
      return;
    }
    if(i.destino==='bote'){
      if(esIngresoAbuelo(i)) return;
      if(i.fecha && i.fecha > hoy) return;
      const veces = i.recurrente ? Math.max(1, ocurrenciasIngreso(i).length) : 1;
      f(p, cta, 'budget', netoIngresoMXN(i)*veces, i.id);
      f(p, cta, 'ahorro', ahorroDeIngresoMXN(i)*veces, i.id);
    } else if(i.destino==='debito'){
      f(p, cta, 'mio', netoIngresoMXN(i)*ocurrenciasIngreso(i).length, i.id);
    }
  });
  gastosCategoria().forEach(g=>{
    const cta = ctaDeGasto(g); if(!cta) return;
    const bolsa = g.pagadoCon==='bote' ? 'budget' : 'mio';
    ['jen','isa'].forEach(p=>{ const parte = partePago(g, p); if(parte>0) f(p, cta, bolsa, -mxnOf(g)*parte, g.id, g.fecha); });
  });
  (state.efectivoMovimientos||[]).forEach(m=>{
    if(m.tipo!=='retiro') return;
    const bolsa = m.cuenta==='bote' ? 'budget' : (esDebito(m.cuenta) ? 'mio' : (m.cuenta==='ahorro' ? 'ahorro' : null));
    if(bolsa) f(m.persona, ctaDebito(m.cta), bolsa, -mxnOf(m), m.id);
  });
  (state.pagosEntre||[]).forEach(pe=>{
    const x = mxnOf(pe);
    const bs = pe.sale==='bote' ? 'budget' : (esDebito(pe.sale) ? 'mio' : null);
    const be = pe.entra==='bote' ? 'budget' : (esDebito(pe.entra) ? 'mio' : null);
    if(bs) f(pe.de, ctaDebito(pe.ctaSale), bs, -x, pe.id);
    if(be) f(pe.a, ctaDebito(pe.ctaEntra), be, x, pe.id);
  });
  (state.pagosTarjeta||[]).forEach(t=>{
    const x = mxnOf(t);
    f(t.persona, ctaCredito(t.tarjeta), t.bolsa==='budget' ? 'budget' : 'mio', x, t.id, t.fecha); // baja lo que se debe
    if(t.desde==='debito') f(t.persona, ctaDebito(t.ctaDesde), 'mio', -x, t.id);
    else if(t.desde==='bote') f(t.persona, ctaDebito(t.ctaDesde), 'budget', -x, t.id);
  });
  (state.pagosOtros||[]).forEach(t=>{
    const x = mxnOf(t);
    if(t.desde==='debito') f(t.persona, ctaDebito(t.ctaDesde), 'mio', -x, t.id);
    else if(t.desde==='bote') f(t.persona, ctaDebito(t.ctaDesde), 'budget', -x, t.id);
  });
  ['jen','isa'].forEach(p=>{
    const fz = state.finanzas[p]; if(!fz) return;
    (fz.ganancias||[]).forEach(g=>f(p, ctaDebito(g.cta), 'mio', mxnOf(g), g.id));
    (fz.gastos||[]).forEach(g=>{ if(g.cuenta==='credito') f(p, ctaCredito(g.cta), 'mio', -mxnOf(g), g.id, g.fecha); else f(p, ctaDebito(g.cta), 'mio', -mxnOf(g), g.id, g.fecha); });
  });
  (state.transferencias||[]).forEach(t=>{
    const x = mxnOf(t), b = t.bolsa==='budget' ? 'budget' : 'mio';
    f(t.persona, t.desde, b, -x, t.id); f(t.persona, t.hacia, b, x, t.id);
  });
  (state.ahorro.movimientos||[]).filter(m=>m.tipo==='retiro').forEach(m=>f('jen', 'nu-deb', 'ahorro', -(Number(m.monto)||0), m.id));
  return out;
}
// {cta: {budget, mio, ahorro, total}} de una persona.
function saldosCuentas(p){
  const r = {}; Object.keys(CUENTAS).forEach(k=>{ r[k] = {budget:0, mio:0, ahorro:0, total:0, ids:new Set()}; });
  flujosCuentas().filter(x=>x.p===p).forEach(x=>{ const c = r[x.cta]; c[x.bolsa] += x.mxn; c.total += x.mxn; if(!/^ini-/.test(x.id)) c.ids.add(x.id); });
  return r;
}
/* ============================================================
   v18.4 — FECHA DE CORTE Y FECHA LÍMITE DE PAGO (tarjetas de crédito)
   Se guardan por persona y por tarjeta en cuentasCfg[p][k] = {corte, pago}
   (días del mes, 1–31; 0 = sin configurar). Se sincronizan con el resto de
   cuentasCfg de esa persona (las de Jen no tocan las de Isa).
   ============================================================ */
function diasDelMesYM(y, m){ return new Date(y, m, 0).getDate(); }
function fechaConDia(y, m, d){
  while(m < 1){ m += 12; y--; } while(m > 12){ m -= 12; y++; }
  const dd = Math.min(Math.max(1, d), diasDelMesYM(y, m));
  return y+'-'+String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
}
function cfgTarjeta(p, k){ const c = ((state.cuentasCfg||{})[p]||{})[k] || {}; return {corte: Math.round(Number(c.corte)||0), pago: Math.round(Number(c.pago)||0)}; }
// Último corte (hoy o antes), su fecha límite de pago y el siguiente corte.
function cicloTarjeta(cfg, hoy){
  if(!(cfg.corte>=1 && cfg.corte<=31 && cfg.pago>=1 && cfg.pago<=31)) return null;
  const [y, m] = hoy.split('-').map(Number);
  let corte = fechaConDia(y, m, cfg.corte); if(corte > hoy) corte = fechaConDia(y, m-1, cfg.corte);
  const [cy, cm] = corte.split('-').map(Number);
  let limite = fechaConDia(cy, cm, cfg.pago); if(limite <= corte) limite = fechaConDia(cy, cm+1, cfg.pago);
  // Si la fecha límite del corte anterior todavía no pasa (p. ej. corte y pago el mismo día), se sigue mostrando ese corte.
  const pCorte = fechaConDia(cy, cm-1, cfg.corte); const [py, pm] = pCorte.split('-').map(Number);
  let pLimite = fechaConDia(py, pm, cfg.pago); if(pLimite <= pCorte) pLimite = fechaConDia(py, pm+1, cfg.pago);
  if(pLimite >= hoy && pLimite < limite) return {corte: pCorte, limite: pLimite, proxCorte: corte};
  return {corte, limite, proxCorte: fechaConDia(cy, cm+1, cfg.corte)};
}
// Cuánto se debe de la tarjeta, cuánto se debía al corte y cuánto falta pagar de ese corte.
function estadoTarjetaCredito(p, k, hoy){
  hoy = hoy || todayISO();
  const cfg = cfgTarjeta(p, k);
  const fl = flujosCuentas().filter(x=>x.p===p && x.cta===k);
  const sum = (arr, b)=>arr.filter(x=>!b || x.bolsa===b).reduce((a,x)=>a+x.mxn, 0);
  const uti = Math.max(0, -sum(fl)), utiB = Math.max(0, -sum(fl,'budget')), utiM = Math.max(0, -sum(fl,'mio'));
  const ciclo = cicloTarjeta(cfg, hoy);
  const base = {p, k, cfg, uti, utiBudget: utiB, utiMio: utiM, configurada: !!ciclo};
  if(!ciclo) return base;
  const antes = fl.filter(x=>!x.fecha || x.fecha <= ciclo.corte), despues = fl.filter(x=>x.fecha && x.fecha > ciclo.corte);
  const parte = (b)=>{ const alCorte = Math.max(0, -sum(antes, b)); const pagado = despues.filter(x=>x.mxn>0 && (!b || x.bolsa===b)).reduce((a,x)=>a+x.mxn, 0); return {alCorte, porPagar: Math.max(0, alCorte - pagado)}; };
  const t = parte(null), b = parte('budget'), m = parte('mio');
  const porPagar = Math.min(t.porPagar, uti);
  return Object.assign(base, ciclo, {alCorte: t.alCorte, porPagar: porPagar < 0.5 ? 0 : Math.round(porPagar*100)/100, porPagarBudget: b.porPagar < 0.5 ? 0 : b.porPagar, porPagarMio: m.porPagar < 0.5 ? 0 : m.porPagar, dias: diasEntreISO(hoy, ciclo.limite)});
}
function textoPartesCorte(e){ return e.porPagarMio>0.005 && e.porPagarBudget>0.005 ? ' ('+fmt(e.porPagarMio,'MXN')+' tuyo + '+fmt(e.porPagarBudget,'MXN')+' del Budget)' : ''; }
function textoDiasLimite(e){
  if(!e.configurada) return '';
  if(e.porPagar <= 0) return 'Corte pagado · siguiente corte '+fmtDate(e.proxCorte);
  if(e.dias > 1) return 'Faltan '+e.dias+' días';
  if(e.dias === 1) return 'Mañana es la fecha límite';
  if(e.dias === 0) return 'Hoy es la fecha límite';
  return 'Venció hace '+(-e.dias)+' día'+(e.dias===-1?'':'s');
}
function tarjetasCreditoDe(p){ return CUENTAS_CREDITO.map(k=>estadoTarjetaCredito(p, k)).filter(e=>e.configurada || e.uti > 0.5); }
// Avisos de "mañana / hoy vence el pago" (como las suscripciones). "Entendido" se recuerda en este teléfono.
const AVISO_TARJ_KEY = 'budgetin_avisos_tarjeta';
function avisosTarjetaVistos(){ try{ return JSON.parse(localStorage.getItem(AVISO_TARJ_KEY)||'{}') || {}; }catch(e){ return {}; } }
function marcarAvisoTarjeta(clave){ try{ const v = avisosTarjetaVistos(); v[clave] = Date.now(); Object.keys(v).forEach(k=>{ if(Date.now() - v[k] > 90*24*3600*1000) delete v[k]; }); localStorage.setItem(AVISO_TARJ_KEY, JSON.stringify(v)); }catch(e){} }

}

}

function lineaSplit(c, credito){
  const fmtS = (v)=>fmt(Math.round(Math.abs(v)*100)/100,'MXN');
  if(credito){
    const deb = (v)=>Math.max(0, -v);
    return `<span class="split"><b>${fmt(deb(c.budget),'MXN')}</b> del Budget + <b>${fmt(deb(c.mio),'MXN')}</b> tuyo</span>`;
  }
  return `<span class="split"><b>${c.budget<0?'−':''}${fmtS(c.budget)}</b> del Budget + <b>${c.mio<0?'−':''}${fmtS(c.mio)}</b> tuyo${Math.abs(c.ahorro)>0.5?` + <b>${fmtS(c.ahorro)}</b> de ahorro`:''}</span>`;
}
function listaFichaCuenta(persona, cta){
  const ids = saldosCuentas(persona)[cta].ids;
  const movs = collectMovimientos().filter(m=>ids.has(m.id)).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  if(!movs.length) return `<div class="small-note">Sin movimientos todavía.</div>`;
  const neto = {}; flujosCuentas().forEach(x=>{ if(x.p===persona && x.cta===cta) neto[x.id] = (neto[x.id]||0) + x.mxn; });
  const signoEn = (m)=>(neto[m.id]||0)>=0 ? +1 : -1;
  const vis = movs.slice(0, fichaLimite);
  return listaPorDia(vis.map(m=>Object.assign({}, m, {_signo: signoEn(m)})), m=>lineaFicha(m, m._signo))
    + (movs.length > vis.length ? `<button class="btn btn-outline btn-sm btn-block" data-ficha-mas style="margin-top:8px;">${ico('chevdown','icon-sm')} Ver más (${movs.length - vis.length} más)</button>` : '');
}

function listaPC(lista){ return lista==='cobro' ? state.porCobrar : state.deudasProyectadas; }
function resumenPC(persona){
  const finMes = finDeMesISO(mesActual());
  const ymHoy = mesActual();
  const cobros = (state.porCobrar||[]).filter(r=>r.persona===persona);
  const proys = (state.deudasProyectadas||[]).filter(r=>r.persona===persona);
  const futC = (state.series||[]).filter(se=>se.tipo==='cobro' && se.persona===persona).flatMap(se=>proximasOcurrencias(se,12));
  const futP = (state.series||[]).filter(se=>se.tipo==='proyeccion' && se.persona===persona).flatMap(se=>proximasOcurrencias(se,12));
  const pend = r=>r.estado!=='cobrado' && r.estado!=='pagado';
  const porCobrarAhora = cobros.filter(r=>pend(r) && (r.fecha||'')<=finMes).reduce((a,r)=>a+mxnOf(r),0);
  const porCobrarFuturo = cobros.filter(r=>pend(r) && (r.fecha||'')>finMes).reduce((a,r)=>a+mxnOf(r),0) + futC.reduce((a,r)=>a+r.montoMXN,0);
  const cobradoMes = cobros.filter(r=>r.estado==='cobrado' && ymDe(r.fechaCobro||r.fecha)===ymHoy).reduce((a,r)=>a+mxnOf(r),0);
  const voyADeber = proys.filter(pend).reduce((a,r)=>a+mxnOf(r),0) + futP.reduce((a,r)=>a+r.montoMXN,0);
  return {cobros, proys, futC, futP, porCobrarAhora, porCobrarFuturo, cobradoMes, voyADeber, neto: porCobrarAhora + porCobrarFuturo - voyADeber};
}
function gruposPC(registros, virtuales){
  const map = {};
  [...registros, ...virtuales].forEach(r=>{
    const k = claveOtro(r.nombre);
    if(!map[k]) map[k] = {clave:k, nombre:String(r.nombre||'').trim()||'Sin nombre', items:[], pendiente:0};
    map[k].items.push(r);
    if(r.estado!=='cobrado' && r.estado!=='pagado') map[k].pendiente += r.virtual ? r.montoMXN : mxnOf(r);
  });
  Object.values(map).forEach(g=>g.items.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')));
  return Object.values(map).sort((a,b)=>b.pendiente-a.pendiente || a.nombre.localeCompare(b.nombre));
}

// En Budget total, un alojamiento de varias noches aparece en cada mes que cubre,
// con la parte de ese mes (igual que lo cuenta la tarjeta).
function repartirEstanciasMes(lista, ym){
  ym = ym || mesActual();
  const out = [];
  lista.forEach(m=>{
    if(!(m.tipo==='gasto-generales' && esEstancia(m))){ out.push(m); return; }
    const total = mxnOf(m);
    const parte = montoEnMesMXN(m, ym);
    if(!(parte>0.005)) return;
    if(Math.abs(parte-total)<=0.005 && ymDe(m.fecha)===ym){ out.push(m); return; }
    const ini = m.cubreDesde > ym+'-01' ? m.cubreDesde : ym+'-01';
    const factor = total>0 ? parte/total : 0;
    out.push(Object.assign({}, m, {fecha: ymDe(m.fecha)===ym ? m.fecha : ini, montoMXN: Math.round(parte*100)/100, monto: Math.round((Number(m.monto)||0)*factor*100)/100, estanciaParte: {total}}));
  });
  return out;
}

// El registro guardado detrás de una línea de movimientos.
function registroDeMov(tipo, id, extra){
  if(tipo==='gasto-generales'){ const s = state.subcats.find(x=>x.id===extra); return s ? s.gastos.find(g=>g.id===id) : gastosCategoria().find(g=>g.id===id); }
  if(tipo==='gasto-gustos') return state.gustosGastos.find(g=>g.id===id) || gastosCategoria().find(g=>g.id===id);
  if(tipo==='gasto-efectivo') return (state.efectivoMovimientos||[]).find(m=>m.id===id);
  if(tipo==='ingreso') return state.ingresos.find(i=>i.id===id);
  if(tipo==='personal-gasto') return state.finanzas[extra] ? state.finanzas[extra].gastos.find(m=>m.id===id) : null;
  if(tipo==='retiro-efectivo' || tipo==='ajuste-efectivo') return (state.efectivoMovimientos||[]).find(m=>m.id===id);
  if(tipo==='personal-ganancia') return state.finanzas[extra] ? state.finanzas[extra].ganancias.find(m=>m.id===id) : null;
  if(tipo==='ahorro-retiro') return (state.ahorro.movimientos||[]).find(m=>m.id===id);
  if(tipo==='pago-entre') return (state.pagosEntre||[]).find(p=>p.id===id);
  if(tipo==='pago-tarjeta') return (state.pagosTarjeta||[]).find(p=>p.id===id);
  if(tipo==='pago-otro') return (state.pagosOtros||[]).find(p=>p.id===id);
  if(tipo==='transferencia') return (state.transferencias||[]).find(p=>p.id===id);
  return null;
}
// Si es parte de una serie mensual, pregunta qué borrar; si no, borra directo.
function pedirBorrado(tipo, id, extra){
  const rec = registroDeMov(tipo, id, extra);
  if(rec && serieDe(rec)) return openBorrarSerie({kind:'mov', tipo, id, extra});
  deleteMovimiento(tipo, id, extra);
}

function deleteMovimiento(tipo, id, extra, alcance){
  quitarMovimiento(tipo, id, extra, alcance);
  persist(); render();
}
// Quita un movimiento sin guardar todavía (para borrar varios de una vez).
function quitarMovimiento(tipo, id, extra, alcance){
  const recSerie = registroDeMov(tipo, id, extra);
  const seSerie = serieDe(recSerie);
  if(seSerie){ aplicarBorradoSerie(seSerie, recSerie.serieYM, alcance||'solo'); return; }
  if(tipo==='gasto-generales' || tipo==='gasto-gustos'){
    // (donde sea que esté: los de Gustos se mudaron a subcategorías en v15)
    state.subcats.forEach(x=>{ if(x.gastos.some(g=>g.id===id)) x.gastos = x.gastos.filter(g=>g.id!==id); });
    state.gustosGastos = state.gustosGastos.filter(g=>g.id!==id);
  } else if(tipo==='gasto-efectivo' || tipo==='retiro-efectivo' || tipo==='ajuste-efectivo'){
    state.efectivoMovimientos = (state.efectivoMovimientos||[]).filter(m=>m.id!==id);
  } else if(tipo==='ingreso'){
    state.ingresos = state.ingresos.filter(i=>i.id!==id);
  } else if(tipo==='personal-ganancia'){
    if(state.finanzas[extra]) state.finanzas[extra].ganancias = state.finanzas[extra].ganancias.filter(m=>m.id!==id);
  } else if(tipo==='personal-gasto'){
    if(state.finanzas[extra]) state.finanzas[extra].gastos = state.finanzas[extra].gastos.filter(m=>m.id!==id);
  } else if(tipo==='ahorro-retiro'){
    state.ahorro.movimientos = state.ahorro.movimientos.filter(m=>m.id!==id);
  } else if(tipo==='pago-entre'){
    // Una compensación son dos registros: se quita completa.
    const pe = (state.pagosEntre||[]).find(p=>p.id===id);
    const grupo = pe && pe.compensacion;
    state.pagosEntre = (state.pagosEntre||[]).filter(p=>p.id!==id && !(grupo && p.compensacion===grupo));
  } else if(tipo==='pago-tarjeta'){
    state.pagosTarjeta = (state.pagosTarjeta||[]).filter(p=>p.id!==id);
  } else if(tipo==='pago-otro'){
    state.pagosOtros = (state.pagosOtros||[]).filter(p=>p.id!==id);
  } else if(tipo==='transferencia'){
    state.transferencias = (state.transferencias||[]).filter(p=>p.id!==id);
  }
}
function editMovimiento(tipo, id, extra){
  if(tipo==='gasto-generales') return openGasto('generales', extra, {kind:'generales', subId:extra, id});
  if(tipo==='gasto-gustos') return openGasto('gustos', null, {kind:'gustos', id});
  if(tipo==='gasto-efectivo') return openGastoEfectivo({id});
  if(tipo==='retiro-efectivo') return openRetiroEfectivo({id});
  if(tipo==='ajuste-efectivo') return openSaldoInicialEfectivo({id});
  if(tipo==='ingreso'){ const ing = state.ingresos.find(i=>i.id===id); if(esTraspaso(ing) && ing.traspaso==='sobrante' && ing.destino==='bote' && (Number(ing.montoBruto)||0) < 0) return openUsarAcumulado(id); if(esTraspaso(ing)) return openTraspaso(null, id); return openIngreso({id}); }
  if(tipo==='personal-ganancia') return openPersonalMov(extra, 'ganancia', {id});
  if(tipo==='personal-gasto') return openPersonalMov(extra, 'gasto', {id});
  if(tipo==='ahorro-retiro') return openAhorro(id);
  if(tipo==='pago-entre'){ const pe = (state.pagosEntre||[]).find(p=>p.id===id); if(pe && pe.sale==='compensacion') return openCompensacionDetalle(pe); return openPagoEntre(null, id); }
  if(tipo==='pago-tarjeta') return openPagoTarjeta(extra, id);
  if(tipo==='pago-otro') return openPagoOtro(extra, null, id);
  if(tipo==='transferencia') return openTransferencia(null, null, id);
}

/* ---------------- RESUMEN MENSUAL (vive dentro de Movimientos) ---------------- */
// Antes era la pestaña "Historial" aparte; se fusionó aquí porque "Todos los
// ingresos" ya era un subconjunto exacto de Movimientos (chip "Todos"), y
// esto era lo único que de verdad aportaba algo distinto: el corte por mes.
// Lista de meses 'YYYY-MM' entre a y b, inclusive.
function mesesEntre(a, b){
  const out=[]; let ay=+a.slice(0,4), am=+a.slice(5,7); const by=+b.slice(0,4), bm=+b.slice(5,7);
  if(ay>by || (ay===by && am>bm)) return [a];
  while(ay<by || (ay===by && am<=bm)){
    out.push(ay+'-'+String(am).padStart(2,'0'));
    am++; if(am>12){ am=1; ay++; }
    if(out.length>240) break;
  }
  return out;
}
// Ingreso, gasto y neto por mes. Los ingresos recurrentes (Mamá, Abuelo, Isa)
// se cuentan en CADA mes desde su fecha inicial hasta el mes actual, no solo
// en el mes en que se registraron — así el neto mensual es real.
// v18.5: mes en que empezó el Budget de mamá y papá (septiembre 2026 si no se cambia en Configuración).
const INICIO_BUDGET_DEF = '2026-09';
function inicioBudgetYM(){ const v = String(state.inicioBudget||''); return /^\d{4}-\d{2}$/.test(v) ? v : INICIO_BUDGET_DEF; }
// Gastos marcados como Budget antes de ese mes (no cuentan en el acumulado).
function gastosBudgetAntesDeInicio(){ const ini = inicioBudgetYM(); return gastosCategoria().filter(g=>cuentaEnBote(g) && g.fecha && ymDe(g.fecha) < ini && !esEstancia(g)); }
function resumenPorMes(){
  // Meses con cualquier movimiento del bote, del más viejo al actual (y los
  // futuros que ya tengan algo, p. ej. noches de alojamiento pagadas).
  const set = new Set([mesActual()]);
  state.ingresos.forEach(i=>{ if(esDestinoBote(i.destino)) set.add(mesIngreso(i)); });
  [...state.subcats.flatMap(s=>s.gastos), ...state.gustosGastos].forEach(g=>{
    if(esEstancia(g)){ set.add(ymDe(g.cubreDesde)); set.add(ymDe(sumarDiasISO(g.cubreHasta,-1))); }
    else if(g.fecha) set.add(ymDe(g.fecha));
  });
  (state.efectivoMovimientos||[]).forEach(m=>{ if(m.tipo==='retiro' && (m.cuenta==='bote'||m.cuenta==='arq') && m.fecha) set.add(ymDe(m.fecha)); });
  (state.pagosEntre||[]).forEach(p=>{ if(p.fecha) set.add(ymDe(p.fecha)); });
  (state.pagosTarjeta||[]).forEach(p=>{ if(p.desde==='bote' && p.fecha) set.add(ymDe(p.fecha)); });
  (state.pagosOtros||[]).forEach(p=>{ if(p.desde==='bote' && p.fecha) set.add(ymDe(p.fecha)); });
  // v18.5: el acumulado (y el resumen) empieza en el mes de inicio del Budget; lo de antes no cuenta.
  const ini = inicioBudgetYM();
  let lista = [...set].filter(Boolean).filter(k=>k>=ini).sort();
  if(!lista.length) lista = [mesActual() >= ini ? mesActual() : ini];
  const meses = {};
  mesesEntre(lista[0], lista[lista.length-1]).forEach(ym=>{
    const b = balanceMes(ym);
    if(ym>mesActual() && b.gasto===0) return; // meses futuros solo si ya tienen algo pagado (p. ej. noches)
    meses[ym] = { ingreso:b.ingreso, gasto:b.gasto, neto:b.disp };
  });
  return meses;
}
// Sobrante (o faltante) acumulado de todos los meses YA CERRADOS (anteriores
// al actual). Se guarda aparte: no se suma al saldo de arriba del mes.
function carryoverAcumuladoMXN(){
  const meses = resumenPorMes();
  const nowYM = mesActual();
  let acc = 0;
  Object.keys(meses).forEach(ym=>{ if(ym < nowYM) acc += meses[ym].neto; });
  return acc - traspasosMXN('sobrante', todayISO());
}
// Total de toda la vida: lo acumulado de meses cerrados + lo que va de este mes.
function acumuladoTotalMXN(){ return carryoverAcumuladoMXN() + balanceMes().disp; }
function renderResumenMensual(){
  const meses = resumenPorMes();
  const keys = Object.keys(meses).sort().reverse();
  const carry = carryoverAcumuladoMXN();
  const carryColor = carry < 0 ? 'var(--brick)' : 'var(--teal-deep)';
  const carryTxt = carry < 0
    ? `Faltante acumulado de meses anteriores: falta reponer ${fmt(-carry,'MXN')}.`
    : (carry > 0 ? `Sobrante acumulado de meses anteriores: ${fmt(carry,'MXN')} disponibles para el futuro.` : 'Sin sobrante ni faltante de meses anteriores.');
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title" style="cursor:pointer;" data-toggle-resumen-mensual>
        <h2>${ico('clock','icon-sm')} Resumen por mes</h2>
        <button class="subrow-btn">${ico(mostrarResumenMensual?'chevdown':'chevright','icon-sm')}</button>
      </div>
      <div class="carry-line">
        <div class="carry-lbl">${carry<0?'Faltante':'Sobrante'} acumulado</div>
        <div class="carry-val" style="color:${carryColor};">${carry<0?'−':(carry>0?'+':'')}${fmt(Math.abs(carry),'MXN')}</div>
      </div>
      <div class="small-note" style="margin:-2px 0 6px;">${carryTxt} Aparte del saldo de arriba, que es solo de este mes. No incluye lo del ahorro.</div>
      <div class="carry-line" style="margin-top:4px;">
        <div class="carry-lbl">Total de toda la vida</div>
        <div class="carry-val" style="color:${acumuladoTotalMXN()<0?'var(--brick)':'var(--teal-deep)'};">${acumuladoTotalMXN()<0?'−':(acumuladoTotalMXN()>0?'+':'')}${fmt(Math.abs(acumuladoTotalMXN()),'MXN')}</div>
      </div>
      <div class="small-note" style="margin:-2px 0 6px;">Lo acumulado de meses anteriores más lo que va de ${nombreMesLargo(mesActual()).toLowerCase()}.</div>
      ${mostrarResumenMensual ? (keys.length? keys.map(k=>{
        const m = meses[k];
        const netoColor = m.neto<0 ? 'var(--brick)' : 'var(--teal-deep)';
        return `
        <div class="row-between" style="padding:10px 0;border-bottom:1px solid var(--line);">
          <div>
            <div style="font-weight:700;font-size:13.5px;">${nombreMesLargo(k)}${k===mesActual()?' <span class="muted" style="font-weight:600;font-size:11px;">· en curso</span>':(k>mesActual()?' <span class="muted" style="font-weight:600;font-size:11px;">· próximo, proyectado</span>':'')}</div>
            <div class="muted" style="font-size:11.5px;margin-top:2px;">Ingreso ${fmt(m.ingreso,'MXN')} · Gasto ${fmt(m.gasto,'MXN')}</div>
          </div>
          <div style="text-align:right;font-size:14px;font-weight:800;color:${netoColor};">${m.neto<0?'−':'+'}${fmt(Math.abs(m.neto),'MXN')}</div>
        </div>`;
      }).join('') : emptyMini('Aún no hay suficiente historial. Se va llenando solo cada mes.')) : ''}
    </div>`;
}

function openSheet(html){
  document.querySelectorAll('.overlay').forEach(o=>o.remove()); // nunca dos formularios encimados
  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.id='overlay';
  wrap.innerHTML = `<div class="sheet">${html}</div>`;
  wrap.addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });
  document.body.appendChild(wrap);
  wireSheetEvents();
  mejorarSelects(wrap);
}
function closeSheet(){
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
}

function sheetHeader(title){
  return `<div class="sheet-head"><h2>${title}</h2><button class="close-x" id="closeSheetBtn" aria-label="Cerrar">${ico('x','icon-sm')}</button></div>`;
}

function openModalFor(type, ds){
  if(type==='pct') return openPct();
  if(type==='ahorro') return openAhorro();
  if(type==='gasto') return openGasto(ds.cat, ds.sub, null, el_pago(ds), ds.cta);
  if(type==='nuevaSubcat') return openNuevaSubcat();
  if(type==='costoRef') return openCostoRef(ds.sub);
  if(type==='conocido') return openConocido();
  if(type==='destino') return openDestinoForm();
  if(type==='gastoEfectivo') return openGasto('generales', null, null, 'efectivo'); // v15: un solo formulario de gasto
  if(type==='retiroEfectivo') return openRetiroEfectivo();
  if(type==='saldoInicialEfectivo') return openSaldoInicialEfectivo();
  if(type==='pagoEntre') return openPagoEntre(ds.persona);
  if(type==='ingreso') return openIngreso(null, {destino: ds.destino, cta: ds.cta});
  if(type==='personalMov') return ds.tipo==='gasto' ? openGasto('generales', null, null, ds.cuenta==='credito'?'credito':'debito') : openPersonalMov(ds.persona, ds.tipo, null, ds.cuenta);
  if(type==='pagoTarjeta') return openPagoTarjeta(ds.persona||perfil, null, ds.tarjeta, ds.monto ? {monto:Number(ds.monto)} : null);
  if(type==='pagoOtro') return openPagoOtro(ds.persona||perfil, ds.acreedor||'');
  if(type==='porCobrar') return openPorCobrar(ds.tipo, ds.persona||perfil, null, ds.acreedor||'');
}

    'ingreso':'Ingreso', 'personal-ganancia':'Personal — ingreso', 'personal-gasto':'Personal — gasto', 'ahorro-retiro':'Ahorro — retiro', 'pago-entre':'Pago entre nosotras', 'retiro-efectivo':'Retiro a efectivo', 'ajuste-efectivo':'Saldo inicial de efectivo', 'pago-tarjeta':'Pago de tarjeta de crédito', 'pago-otro':'Pago de deuda a otra persona', 'por-cobrar':'Me deben (solo anotado)', 'deuda-proyectada':'Deuda a futuro (solo anotada)', 'ahorro-deposito':'Ahorro — depósito automático', 'saldo-inicial-debito':'Saldo inicial de tarjeta de débito', 'transferencia':'Pase entre cuentas'}[m.tipo] || m.tipo;
}
function pagadoConExport(m){
  if(m.tipo!=='gasto-generales' && m.tipo!=='gasto-gustos') return '';
  if(m.quien==='abuelo') return 'Tarjeta del Abuelo';
  if(m.pagadoCon==='otro') return 'Otra persona ('+(m.otroNombre||'sin nombre')+')';
  { const c = ctaDeGasto(m); if(c) return (m.pagadoCon==='bote' ? 'Budget' : 'Mi dinero')+' · '+labelCuenta(c); }
  return {bote:'Budget', arq:'Arq', efectivo:'Efectivo', debito:'Mi dinero · débito', personal:'Mi dinero · débito', credito:'Mi dinero · crédito'}[m.pagadoCon||'bote']||'';
}
function cuentaExport(m){
  const L = {bote:'Budget', arq:'Arq', debito:'Débito', personal:'Débito', efectivo:'Efectivo', credito:'Crédito', abuelo:'Tarjeta del Abuelo', ahorro:'Ahorro', otra:'Otra'};
  if(m.tipo==='ingreso') return L[m.destino||'bote'];
  if(m.tipo==='retiro-efectivo') return 'De '+(L[m.cuenta]||'Otra')+' a Efectivo';
  if(m.tipo==='pago-entre') return 'De '+(L[m.sale]||'Otra')+' ('+nombrePersonaExport(m.persona)+') a '+(L[m.entra]||'Otra')+' ('+nombrePersonaExport(m.a)+')';
  if(m.tipo==='pago-tarjeta') return 'De '+(L[m.desde]||'Otra')+' a Crédito';
  if(m.tipo==='pago-otro') return 'De '+(L[m.desde]||'Otra')+' a '+(m.acreedor||'otra persona');
  if(m.tipo==='por-cobrar' || m.tipo==='deuda-proyectada') return 'No mueve dinero';
  if(m.tipo==='personal-gasto') return m.cuenta==='credito' ? 'Crédito' : 'Débito';
  if(m.tipo==='personal-ganancia') return 'Débito';
  if(m.tipo==='transferencia') return 'De '+labelCuenta(m.desde)+' a '+labelCuenta(m.hacia);
  return '';
}
function detalleExport(m){
  const d = [];
  if(m.tipo==='ingreso'){ if(m.recurrente) d.push('recurrente cada mes'); if(m.netoMXN!==undefined && m.netoMXN!==m.montoMXN) d.push('neto de ahorro: '+Math.round(m.netoMXN*100)/100+' MXN'); }
  if(m.quien==='ambas' && m.pagadoPor) d.push(m.pagadoPor==='ambas' ? 'compartido, pusieron las dos ('+textoPagadoPor(m)+')' : 'compartido, puso '+nombrePersonaExport(m.pagadoPor));
  if(m.pagadoCon==='otro') d.push('deuda de '+nombrePersonaExport(pagadorFisico(m))+' con '+(m.otroNombre||'otra persona'));
  if(m.tipo==='transferencia'){ const t = (state.transferencias||[]).find(x=>x.id===m.id); d.push(t && t.bolsa==='budget' ? 'dinero del Budget' : 'dinero tuyo'); }
  if(m.tipo==='pago-entre'){ const pe = (state.pagosEntre||[]).find(x=>x.id===m.id); if(pe && pe.noDeuda) d.push('no es deuda'); }
  if(m.estadoPC) d.push(m.estadoPC);
  if(m.serieId && m.tipo!=='ingreso') d.push('recurrente cada mes');
  if(m.quien==='abuelo'){ const g = gastosCategoria().find(x=>x.id===m.id); if(g && g.repartoAbuelo==='ambas') d.push('Abuelo compartido (Isa debe la mitad)'); }
  if(m.cubreDesde && m.cubreHasta) d.push('noches '+m.cubreDesde+' a '+m.cubreHasta);
  return d.join(' · ');
}
function nombrePersonaExport(v){
  return {jen:'Jen', isa:'Isa', abuelo:'Abuelo', ambas:'Jen e Isa'}[v] || (v||'');
}
function csvCell(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
// Arma el CSV en texto plano (sin tocar el DOM) para poder probarlo aparte
// de la descarga. Ordenado cronológicamente para que se lea como bitácora.
function buildMovimientosCSV(){
  const {headers, filas} = datosMovimientosExport();
  return [headers, ...filas].map(fila=>fila.map(csvCell).join(',')).join('\r\n');
}

async function reiniciarTodo(){
  const btn = document.getElementById('doReiniciar');
  if(state.syncUrl){
    if(navigator.onLine===false){ alert('Para reiniciar necesitas internet (así se borra también en la hoja y en el otro teléfono). No se borró nada.'); return; }
    if(btn){ btn.disabled = true; btn.textContent = 'Reiniciando…'; }
    // 1) Traer lo último del otro teléfono (para que el respaldo lo tenga todo).
    const okSync = await sincronizar();
    if(!okSync){ if(btn){ btn.disabled = false; btn.textContent = 'Bajar respaldo y borrar todo'; } alert('No se pudo conectar con la hoja ('+(syncError||'revisa tu internet')+'). No se borró nada.'); return; }
    try{ descargarRespaldo(); }catch(e){}
    // 2) Subir el reinicio y esperar a que la hoja lo confirme antes de borrar aquí.
    const nuevo = estadoReiniciado();
    try{
      const res = await fetchSync(state.syncUrl, {cache:'no-store'});
      const payload = await res.json();
      if(!(Number(payload && payload.script) >= SCRIPT_MIN)) throw new Error('Falta pegar el código nuevo de la hoja (Apps Script v3.5).');
      const disp = miDispositivo();
      const body = JSON.stringify({ updatedAt: new Date().toISOString(), baseUpdatedAt: payload.updatedAt || null, appBuild: APP_BUILD, quien: perfil||'', dispositivo: disp.nombre, dispositivoId: disp.id, cambios: 0, data: nuevo });
      const r2 = await fetchSync(state.syncUrl, { method:'POST', body }, 60000);
      const resp = await r2.json();
      if(!resp || resp.ok!==true) throw new Error(resp && resp.error ? resp.error : 'La hoja no confirmó.');
      ultimaNubeVista = resp.updatedAt || null;
    }catch(e){
      if(btn){ btn.disabled = false; btn.textContent = 'Bajar respaldo y borrar todo'; }
      alert('No se pudo reiniciar en la hoja: '+((e && e.message) || 'revisa tu internet')+'. No se borró nada.');
      return;
    }
    aplicarReinicioLocal(nuevo, false);
    return;
  }
  try{ descargarRespaldo(); }catch(e){}
  aplicarReinicioLocal(estadoReiniciado(), true);
}
function aplicarReinicioLocal(nuevo, pendiente){
  state = nuevo;
  // Se empieza como si fuera la primera vez: nada de lo anterior queda como "borrado" ni en la papelera.
  const meta = leerMetaSync();
  guardarMetaSync({huellas:null, pendiente:!!pendiente, pendienteDesde: pendiente ? Date.now() : null, pendientes:[], ultima: meta.ultima || null});
  persist();
  state._borrados = {}; state._papelera = {};
  Storage.save(state); rebasarHuellas(); marcarPendiente(!!pendiente);
  borrarCopiasLocales();
  vistasAlInicio();
  try{ closeSheet(); }catch(e){}
  render();
  if(state.syncUrl) programarSync(1500);
  mostrarToast(state.syncUrl ? 'Listo: empezaron desde cero. Ya se borró en la hoja; el otro teléfono se borra solo al sincronizarse.' : 'Listo: empezaste desde cero.', 'ok');
}

// .xlsx hecho aquí mismo (sin internet ni librerías): un zip sin comprimir con la hoja y sus estilos.
const CRC_TABLA = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(bytes){ let c = 0xFFFFFFFF; for(let i=0;i<bytes.length;i++) c = CRC_TABLA[(c^bytes[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipSinComprimir(archivos){
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  const u16 = (v)=>[v&0xFF, (v>>>8)&0xFF], u32 = (v)=>[v&0xFF, (v>>>8)&0xFF, (v>>>16)&0xFF, (v>>>24)&0xFF];
  archivos.forEach(([nombre, texto])=>{
    const n = enc.encode(nombre), d = enc.encode(texto), crc = crc32(d);
    const loc = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(d.length), ...u32(d.length), ...u16(n.length), ...u16(0)]);
    partes.push(loc, n, d);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(d.length), ...u32(d.length), ...u16(n.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), n);
    off += loc.length + n.length + d.length;
  });
  const tamCentral = central.reduce((a,x)=>a+x.length,0);
  const fin = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(archivos.length), ...u16(archivos.length), ...u32(tamCentral), ...u32(off), ...u16(0)]);
  const todo = [...partes, ...central, fin], total = todo.reduce((a,x)=>a+x.length,0), out = new Uint8Array(total);
  let p = 0; todo.forEach(x=>{ out.set(x, p); p += x.length; });
  return out;
}
function xmlEsc(v){ return String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,''); }

  // estilos: 1 encabezado, 2 texto rojo, 3 texto verde, 4 número rojo, 5 número verde, 6 número normal
  const estilo = (clase, num)=> num ? (clase==='gasto'?4:(clase==='ingreso'?5:6)) : (clase==='gasto'?2:(clase==='ingreso'?3:0));
  const celda = (ref, v, s)=> (typeof v==='number' && isFinite(v)) ? `<c r="${ref}" s="${s}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${s?` s="${s}"`:''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  const filasXml = [`<row r="1">${headers.map((h,i)=>celda(col(i)+'1', h, 1)).join('')}</row>`]
    .concat(filas.map((f,ri)=>`<row r="${ri+2}">${f.map((v,ci)=>{ const num = typeof v==='number' && isFinite(v); return celda(col(ci)+(ri+2), v, estilo(clases[ri], num)); }).join('')}</row>`));

  const estilos = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00"/></numFmts><fonts count="4"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><sz val="11"/><color rgb="FFC0392B"/><name val="Calibri"/></font><font><sz val="11"/><color rgb="FF1E8449"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8F0EE"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/><xf numFmtId="164" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Movimientos" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">Movimientos!$A$1:$'+col(headers.length-1)+'$'+(filas.length+1)+'</definedName></definedNames></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],

function pendienteAMesesMXN(persona, soloCuenta){
  let t = 0;
  (state.series||[]).filter(se=>se.aMeses && se.tipo==='gasto').forEach(se=>{
    if(soloCuenta && (se.plantilla||{}).pagadoCon!==soloCuenta) return;
    const parte = partePago(se.plantilla||{}, persona); if(!(parte>0)) return;
    const hechos = new Set(registrosDeSerie(se).map(r=>r.serieYM));
    const omit = new Set(se.omitidos||[]);
    let faltan = 0; for(let ym = se.desde; ym <= (se.hasta||se.desde); ym = ymMas(ym,1)){ if(!hechos.has(ym) && !omit.has(ym)) faltan++; }
    const rate = (se.plantilla||{}).moneda==='MXN' ? 1 : (Number(se.rateMXN) || rateSnapshotFor((se.plantilla||{}).moneda||'MXN'));
    t += faltan * (Number(se.aMeses.cuota)||0) * rate * parte;
  });
  return t;
}

  const arrancaCompartido = !existing && cat==='generales' && subInicial && esSubcatCompartidaDefault(subInicial.nombre);
  // v15: "¿Con qué se pagó?" y "¿A quién corresponde?" empiezan en blanco (hay que elegirlos).
  const pagoSel = existing ? (existing.quien==='abuelo' ? 'abuelo' : (esDebito(existing.pagadoCon) ? 'debito' : (existing.pagadoCon||'bote'))) : (pagoPreset||'');

  // v18: "¿De dónde sale?" + "¿Con qué tarjeta?" (el selector viejo de pago queda oculto y sincronizado).

  const ctaSel = existing ? (ctaDeGasto(existing)||'') : (bolsaSel==='budget'||bolsaSel==='mio' ? ctaPorDefecto(pagoSel, ctaPreset || ultimaTarjetaPara(pagoSel)) : '');
  return openSheet(`

    ${planMesesDe(existing) ? `<div class="note-box meses-info">${ico('calendar','icon-sm')}<div>${escHtml(textoPlanMeses(existing))}. Los cambios aplican solo a esta mensualidad.</div></div>` : `

/* ============================================================
   v18.5 — REGISTRAR VARIOS GASTOS A LA VEZ
   Eliges qué campos tienen en común (fecha, de dónde sale, a quién corresponde,
   categoría, moneda): se llenan solos en todos los renglones y aun así puedes
   cambiarlos en un renglón ("Cambiar solo en este").
   ============================================================ */
let gvEstado = null;
const GV_CAMPOS = [['fecha','Fecha','calendar'],['pago','De dónde sale','card'],['quien','A quién corresponde','users'],['cat','Categoría','layers'],['moneda','Moneda','swap']];
function gvOpcionesPago(persona){
  const o = [];
  ['nu-deb','nu-cred','rev-deb','rev-cred'].forEach(k=>o.push(['bote|'+k, nombreBudget(persona)+' · '+labelCuenta(k), 'bote']));
  o.push(['arq','Arq (euros del Budget)','arq']);
  if(persona==='jen') o.push(['abuelo','Tarjeta del Abuelo','abuelo']);
  ['nu-deb','rev-deb'].forEach(k=>o.push(['debito|'+k, 'Mi dinero · '+labelCuenta(k), 'tarjeta']));
  ['nu-cred','rev-cred'].forEach(k=>o.push(['credito|'+k, 'Mi dinero · '+labelCuenta(k), 'credito']));
  o.push(['efectivo','Efectivo','billete'], ['otro','Otra persona lo pagó','persona']);
  return o;
}
function gvOpcionesQuien(pago){
  const o = pago==='abuelo' ? [['jen','Solo Jen','jen'],['ambas','Ambas (a medias)','ambas']] : [['jen','Solo Jen','jen'],['isa','Solo Isa','isa'],['ambas','Ambas (a medias)','ambas']];
  return o;
}
function gvFilaVacia(base){ return Object.assign({monto:'', nota:'', devolucion:false, exc:{}, fecha:todayISO(), pago:'', quien:'', cat:'', moneda:'EUR', otroNombre:''}, base||{}); }
function gvValor(f, campo){ const g = gvEstado; return g.comparte[campo] && !(campo in f.exc) ? g.comun[campo] : (campo in f.exc ? f.exc[campo] : f[campo]); }
function openGastosVarios(prefill){
  if(prefill){
    gvEstado = {comparte:{fecha:true, pago:true, quien:true, cat:false, moneda:true},
      comun:{fecha: prefill.fecha||todayISO(), pago: prefill.pago||'', quien: prefill.quien||'', cat: prefill.cat||'', moneda: prefill.moneda||'EUR', otroNombre: prefill.otroNombre||''},
      filas:[gvFilaVacia({monto: prefill.monto||'', nota: prefill.nota||'', cat: prefill.cat||''}), gvFilaVacia({cat: prefill.cat||''})]};
  }
  if(!gvEstado) gvEstado = {comparte:{fecha:true, pago:true, quien:true, cat:false, moneda:true}, comun:{fecha:todayISO(), pago:'', quien:'', cat:'', moneda:'EUR', otroNombre:''}, filas:[gvFilaVacia(), gvFilaVacia()]};
  const g = gvEstado, persona = perfil;
  const opPago = gvOpcionesPago(persona);
  const sel = (campo, valor, extraAttr, pagoCtx)=>{
    if(campo==='pago') return `<select ${extraAttr}><option value="" ${!valor?'selected':''} disabled>Elige de dónde sale</option>${opPago.map(([v,l,gl])=>ecOpt(v, l, valor, {glyph:gl})).join('')}</select>`;
    if(campo==='quien') return `<select ${extraAttr}><option value="" ${!valor?'selected':''} disabled>Elige a quién corresponde</option>${gvOpcionesQuien(pagoCtx).map(([v,l,av])=>ecOpt(v, l, valor, {av})).join('')}</select>`;
    if(campo==='cat') return `<select ${extraAttr}><option value="" ${!valor?'selected':''} disabled>Elige la categoría</option>${state.subcats.map(sb=>ecOpt(sb.id, sb.nombre, valor, {glyph: iconoSubcat(sb).glyph})).join('')}</select>`;
    if(campo==='moneda') return `<select ${extraAttr}>${currencyOptions(valor||'EUR')}</select>`;
    if(campo==='fecha') return `<input type="date" ${extraAttr} value="${escHtml(valor||todayISO())}">`;
    return '';
  };
  const lbl = (campo)=>{ const c = GV_CAMPOS.find(x=>x[0]===campo); return `<span>${ico(c[2],'icon-xs')} ${c[1]}</span>`; };
  const total = g.filas.filter(f=>Number(f.monto)>0).length;
  openSheet(`
    ${sheetHeader('Registrar varios gastos')}
    <div class="small-note" style="margin-bottom:8px;">Marca lo que tienen en común: se llena solo en todos y aun así lo puedes cambiar en un gasto.</div>
    <div class="gv-comparte">${GV_CAMPOS.map(([k,l,ic])=>`<button type="button" class="chip chip-ico ${g.comparte[k]?'on':''}" data-gv-comparte="${k}">${ico(g.comparte[k]?'check':ic,'icon-xs')}${l}</button>`).join('')}</div>
    ${Object.keys(g.comparte).some(k=>g.comparte[k]) ? `<div class="gv-comun">
      <div class="gv-tit">${ico('layers','icon-xs')} Para todos</div>
      ${GV_CAMPOS.filter(([k])=>g.comparte[k]).map(([k])=>`<label class="ec-campo">${lbl(k)}${sel(k, g.comun[k], `data-gv-comun="${k}"`, g.comun.pago)}</label>`).join('')}
      ${g.comparte.pago && g.comun.pago==='otro' ? `<label class="ec-campo"><span>${ico('users','icon-xs')} ¿Quién lo pagó?</span><input type="text" data-gv-comun="otroNombre" value="${escHtml(g.comun.otroNombre||'')}" list="gvOtros" placeholder="Ej. Ana"></label>` : ''}
    </div>` : ''}
    <datalist id="gvOtros">${[...new Set([...nombresOtros('jen'), ...nombresOtros('isa')])].map(n=>`<option value="${escHtml(n)}">`).join('')}</datalist>
    <div class="gv-lista">
    ${g.filas.map((f,i)=>{
      const pagoFila = gvValor(f,'pago');
      const propios = GV_CAMPOS.filter(([k])=>!g.comparte[k] && k!=='moneda' && k!=='cat');
      const excs = GV_CAMPOS.filter(([k])=>g.comparte[k] && (k in f.exc));
      return `<div class="gv-fila" data-gv-fila="${i}">
        <div class="gv-fila-top"><b>Gasto ${i+1}</b>${g.filas.length>1 ? `<button type="button" class="icon-btn" data-gv-quitar="${i}" aria-label="Quitar este gasto">${ico('x','icon-sm')}</button>` : ''}</div>
        <div class="ec-grid">
          <label class="ec-campo"><span>${ico('wallet','icon-xs')} Monto</span><div class="ec-monto"><input type="number" step="0.01" inputmode="decimal" data-gv="monto" value="${escHtml(f.monto)}" placeholder="0">${g.comparte.moneda && !('moneda' in f.exc) ? '' : sel('moneda', gvValor(f,'moneda'), `data-gv="${'moneda' in f.exc ? 'exc:' : ''}moneda"`)}</div></label>
          ${g.comparte.cat && !('cat' in f.exc) ? '' : `<label class="ec-campo">${lbl('cat')}${sel('cat', gvValor(f,'cat'), `data-gv="${'cat' in f.exc ? 'exc:' : ''}cat"`)}</label>`}
        </div>
        <label class="ec-campo"><span>${ico('edit','icon-xs')} Nota</span><input type="text" data-gv="nota" value="${escHtml(f.nota)}" placeholder="Ej. cena, camión…"></label>
        ${propios.map(([k])=>`<label class="ec-campo">${lbl(k)}${sel(k, f[k], `data-gv="${k}"`, pagoFila)}</label>`).join('')}
        ${excs.filter(([k])=>k!=='moneda' && k!=='cat').map(([k])=>`<label class="ec-campo">${lbl(k)} <small class="gv-exc">solo en este</small>${sel(k, f.exc[k], `data-gv="exc:${k}"`, pagoFila)}</label>`).join('')}
        ${pagoFila==='otro' && !(g.comparte.pago && !('pago' in f.exc)) ? `<label class="ec-campo"><span>${ico('users','icon-xs')} ¿Quién lo pagó?</span><input type="text" data-gv="otroNombre" value="${escHtml(f.otroNombre||'')}" list="gvOtros"></label>` : ''}
        <div class="gv-fila-pie">
          <label class="rec-chk"><input type="checkbox" data-gv="devolucion" ${f.devolucion?'checked':''} style="width:auto;"> Es devolución</label>
          ${GV_CAMPOS.some(([k])=>g.comparte[k] && !(k in f.exc)) ? `<button type="button" class="link-quiet" data-gv-excepcion="${i}">Cambiar solo en este</button>` : ''}
        </div>
      </div>`; }).join('')}
    </div>
    <button type="button" class="btn btn-outline btn-block" id="gvMas" style="margin:10px 0;">${ico('plus','icon-sm')} Otro gasto</button>
    <div class="ec-pie"><button class="btn btn-primary btn-block" id="gvGuardar">${ico('check','icon-sm')} <span>Guardar todos (<span id="gvN">${total}</span>)</span></button></div>
  `);
  const ov = document.getElementById('overlay');
  ov.querySelectorAll('[data-gv-comparte]').forEach(b=>b.addEventListener('click', ()=>{
    const k = b.getAttribute('data-gv-comparte'); g.comparte[k] = !g.comparte[k];
    // Al dejar de compartir, cada gasto se queda con lo que tenía en común (para no perderlo).
    g.filas.forEach(f=>{ if(!g.comparte[k]){ if(!(k in f.exc)) f[k] = g.comun[k]; else { f[k] = f.exc[k]; } delete f.exc[k]; } });
    openGastosVarios();
  }));
  ov.querySelectorAll('[data-gv-comun]').forEach(el=>{
    const k = el.getAttribute('data-gv-comun');
    const fn = ()=>{ g.comun[k] = el.value; if(k==='pago') openGastosVarios(); };
    el.addEventListener(el.tagName==='SELECT' ? 'change' : 'input', fn);
  });
  ov.querySelectorAll('[data-gv-fila]').forEach(fe=>{
    const f = g.filas[Number(fe.getAttribute('data-gv-fila'))];
    fe.querySelectorAll('[data-gv]').forEach(el=>{
      const k = el.getAttribute('data-gv');
      const set = ()=>{
        const v = el.type==='checkbox' ? el.checked : el.value;
        if(k.startsWith('exc:')) f.exc[k.slice(4)] = v; else f[k] = v;
        const n = document.getElementById('gvN'); if(n) n.textContent = g.filas.filter(x=>Number(x.monto)>0).length;
        if(k==='pago' || k==='exc:pago') openGastosVarios();
      };
      el.addEventListener(el.tagName==='SELECT' || el.type==='checkbox' || el.type==='date' ? 'change' : 'input', set);
    });
  });
  ov.querySelectorAll('[data-gv-quitar]').forEach(b=>b.addEventListener('click', ()=>{ g.filas.splice(Number(b.getAttribute('data-gv-quitar')),1); openGastosVarios(); }));
  ov.querySelectorAll('[data-gv-excepcion]').forEach(b=>b.addEventListener('click', ()=>{
    const f = g.filas[Number(b.getAttribute('data-gv-excepcion'))];
    GV_CAMPOS.forEach(([k])=>{ if(g.comparte[k] && !(k in f.exc)) f.exc[k] = g.comun[k]; });
    openGastosVarios();
  }));
  document.getElementById('gvMas').addEventListener('click', ()=>{
    const ult = g.filas[g.filas.length-1] || gvFilaVacia();
    g.filas.push(gvFilaVacia({fecha: ult.fecha, pago: ult.pago, quien: ult.quien, cat: ult.cat, moneda: ult.moneda}));
    openGastosVarios();
    setTimeout(()=>{ const ins = document.querySelectorAll('[data-gv="monto"]'); const u = ins[ins.length-1]; if(u){ u.focus && u.focus(); u.scrollIntoView && u.scrollIntoView({block:'center'}); } }, 20);
  });
  document.getElementById('gvGuardar').addEventListener('click', guardarGastosVarios);
}
// Arma y guarda un gasto sencillo (mismas reglas que el formulario de un gasto).
function crearGastoSimple(o){
  const pagoPartes = String(o.pago||'').split('|'); const pago = pagoPartes[0], ctaSel = pagoPartes[1]||'';
  const quien = pago==='abuelo' ? 'abuelo' : o.quien;
  const repartoAbuelo = pago==='abuelo' ? (o.quien==='ambas' ? 'ambas' : 'jen') : null;
  const pagadoPor = quien==='ambas' ? perfil : null;
  const pagadoCon = pago==='abuelo' ? 'bote' : pago;
  let rate = null;
  if(pago==='arq' && o.moneda==='EUR'){ const pag = quien==='ambas' ? perfil : (quien==='abuelo' ? 'jen' : quien); const t = tasaArq(pag, o.monto, null); if(t) rate = t; }
  const st = stampRates(o.monto, o.moneda, rate);
  const signo = o.devolucion ? -1 : 1;
  const g = {id:uid(), monto: signo*o.monto, moneda:o.moneda, fecha:o.fecha, quien, pagadoPor, nota:o.nota||'', pagadoCon, rateMXN: st.rateMXN, montoMXN: signo*st.montoMXN, rateEURMXN: st.rateEURMXN, montoEUR: signo*st.montoEUR};
  if(repartoAbuelo) g.repartoAbuelo = repartoAbuelo;
  if(pago==='otro') g.otroNombre = o.otroNombre;
  if(pago==='bote') g.cta = CUENTAS_BUDGET.includes(ctaSel) ? ctaSel : 'nu-deb';
  else if(pago==='credito') g.cta = ctaCredito(ctaSel);
  else if(pago==='debito') g.cta = ctaDebito(ctaSel);
  const sb = state.subcats.find(x=>x.id===o.cat) || subcatV15(state, 'Otros');
  sb.gastos.push(g);
  return g;
}
function guardarGastosVarios(){
  const g = gvEstado; if(!g) return;
  const filas = g.filas.filter(f=>Number(f.monto)>0);
  if(!filas.length){ mostrarToast('Escribe el monto de al menos un gasto.', 'error'); return; }
  const datos = [];
  for(let i=0;i<g.filas.length;i++){
    const f = g.filas[i]; if(!(Number(f.monto)>0)) continue;
    const d = {monto:Math.abs(Number(f.monto)), nota:f.nota, devolucion:!!f.devolucion, fecha:gvValor(f,'fecha')||todayISO(), pago:gvValor(f,'pago'), quien:gvValor(f,'quien'), cat:gvValor(f,'cat'), moneda:gvValor(f,'moneda')||'MXN',
      otroNombre: String((g.comparte.pago && !('pago' in f.exc) ? g.comun.otroNombre : f.otroNombre)||'').trim()};
    if(['bote','debito','credito'].includes(d.pago)) d.pago = '';
    const falta = !d.cat ? 'la categoría' : !d.pago ? 'de dónde sale (y con qué tarjeta)' : !d.quien ? 'a quién corresponde' : (d.pago==='otro' && !d.otroNombre ? 'quién lo pagó' : '');
    if(falta){ mostrarToast('Gasto '+(i+1)+': falta '+falta+'.', 'error'); const el = document.querySelector(`[data-gv-fila="${i}"]`); if(el && el.scrollIntoView) el.scrollIntoView({block:'center'}); return; }
    if(d.pago==='abuelo' && d.quien==='isa') d.quien = 'jen';
    if(!(d.moneda in (state.rates||{}))) d.moneda = 'MXN';
    datos.push(d);
  }
  datos.forEach(d=>{ crearGastoSimple(d); const pp = String(d.pago).split('|'); if(pp[1]) recordarTarjeta(bolsaDePago(pp[0]), pp[1]); });
  gvEstado = null;
  persist(); closeSheet(); render();
  mostrarToast('Se registraron '+datos.length+' gasto'+(datos.length===1?'':'s')+'.', 'ok');
}

// Lo que se debe de una tarjeta, por parte (Budget / tuya).
function deudaTarjetaPartes(persona, tarjeta){
  const c = saldosCuentas(persona)[ctaCredito(tarjeta)];
  return {budget: Math.max(0, -c.budget), mio: Math.max(0, -c.mio)};
}
function openPagoTarjeta(persona, editId, tarjetaPreset, preset){
  const ex = editId ? (state.pagosTarjeta||[]).find(p=>p.id===editId) : null;
  persona = ex ? ex.persona : (persona||perfil);
  const moneda = ex ? (ex.moneda||'MXN') : 'MXN';
  const tarjeta = ctaCredito(ex ? ex.tarjeta : tarjetaPreset);
  const partes = deudaTarjetaPartes(persona, tarjeta);
  // v18.4: desde "Tarjetas de crédito" en Inicio llega lo que falta pagar del corte (primero lo tuyo).
  const etCorte = !ex && preset && preset.monto ? estadoTarjetaCredito(persona, tarjeta) : null;
  const parte = ex ? (ex.bolsa==='budget' ? 'budget' : 'mio') : (etCorte && etCorte.configurada ? (etCorte.porPagarMio>0.005 || !(etCorte.porPagarBudget>0.005) ? 'mio' : 'budget') : (partes.mio<0.005 && partes.budget>0.005 ? 'budget' : 'mio'));
  const montoCorte = etCorte && etCorte.configurada ? Math.round((parte==='budget' ? etCorte.porPagarBudget : etCorte.porPagarMio)*100)/100 : 0;

/* ============================================================
   IMPORTAR ESTADO DE CUENTA — texto pegado, CSV/TXT, PDF o Excel.
   Todo se lee dentro del teléfono: nada se manda a ningún lado.
   Convención interna: monto con signo, negativo = sale dinero (gasto).
   ============================================================ */
const EC_BANCOS = [['auto','Detectar solo'],['wise','Wise'],['revolut','Revolut'],['nu','Nu'],['didi','DiDi'],['amex','American Express'],['otro','Otro banco']];
const EC_NOMBRE_BANCO = {auto:'Estado de cuenta', wise:'Wise', revolut:'Revolut', nu:'Nu', didi:'DiDi', amex:'American Express', otro:'Otro banco'};
const EC_CUENTA_DEF = {wise:'debito', revolut:'debito', nu:'credito', didi:'credito', amex:'credito', otro:'debito', auto:'debito'};
const EC_CARGO_POSITIVO = {nu:true, didi:true, amex:true}; // en tarjetas de crédito los cargos vienen sin signo
let ecEstado = null;
function sinAcentos(t){ return String(t==null?'':t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
const MESES_EC = {ene:1,jan:1,enero:1,january:1,feb:2,febrero:2,february:2,mar:3,marzo:3,march:3,abr:4,apr:4,abril:4,april:4,may:5,mayo:5,jun:6,junio:6,june:6,jul:7,julio:7,july:7,ago:8,aug:8,agosto:8,august:8,sep:9,sept:9,set:9,septiembre:9,setiembre:9,september:9,oct:10,octubre:10,october:10,nov:11,noviembre:11,november:11,dic:12,dec:12,diciembre:12,december:12};
// "1,234.56" · "1.234,56" · "-12.00" · "(12.00)" · "12.00-" · "$ 1,234.56" → número con signo
function ecParseMonto(txt){
  let t = String(txt==null?'':txt).trim();
  if(!t) return null;
  let neg = /^\(.*\)$/.test(t) || /^[\-−–]/.test(t) || /[\-−–]\s*$/.test(t) || /^[+]?\s*[\-−–]\s*[$€£]/.test(t) || /[$€£]\s*[\-−–]/.test(t);
  const d = t.replace(/[^0-9.,]/g,'');
  if(!/\d/.test(d)) return null;
  const lp = d.lastIndexOf('.'), lc = d.lastIndexOf(',');
  let dec = null;
  if(lp>=0 && lc>=0) dec = lp>lc ? '.' : ',';
  else if(lc>=0) dec = /,\d{1,2}$/.test(d) ? ',' : null;
  else if(lp>=0) dec = /^\d{1,3}(\.\d{3})+$/.test(d) ? null : '.';
  const n = dec==='.' ? d.replace(/,/g,'') : dec===',' ? d.replace(/\./g,'').replace(',','.') : d.replace(/[.,]/g,'');
  const v = parseFloat(n);
  if(!isFinite(v)) return null;
  return neg ? -v : v;
}
function ecArmarFecha(y, m, d){
  y = Number(y); m = Number(m); d = Number(d);
  if(!(m>=1 && m<=12 && d>=1 && d<=31)) return null;
  const hoy = new Date();
  if(!y){ y = hoy.getFullYear(); const f = new Date(y, m-1, d); if(f - hoy > 31*24*3600*1000) y--; }
  else if(y<100) y += 2000;
  if(y<2000 || y>2100) return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
// Busca una fecha en el texto. orden: 'dmy' (México/Europa) o 'mdy' (EE. UU.).
function ecParseFecha(txt, orden, soloAlInicio){
  const t = sinAcentos(txt).trim();
  const ini = soloAlInicio ? '^\\s*' : '';
  let m;
  if((m = t.match(new RegExp(ini+'(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})')))) return ecArmarFecha(m[1], m[2], m[3]);
  if((m = t.match(new RegExp(ini+'(\\d{1,2})[-/.](\\d{1,2})[-/.](\\d{2,4})(?!\\d)')))) return orden==='mdy' ? ecArmarFecha(m[3], m[1], m[2]) : ecArmarFecha(m[3], m[2], m[1]);
  if((m = t.match(new RegExp(ini+'(\\d{1,2})(?:\\s+de)?[\\s\\-/.]+([a-z]{3,10})\\.?(?:(?:\\s+de)?[\\s\\-/.,]+(\\d{4}|\\d{2}(?![\\d.,])))?')))){ const mes = MESES_EC[m[2]] || MESES_EC[m[2].slice(0,3)]; if(mes) return ecArmarFecha(m[3], mes, m[1]); }
  if((m = t.match(new RegExp(ini+'([a-z]{3,10})\\.?\\s+(\\d{1,2}),?(?:\\s+(\\d{4}))?(?![\\d.,])')))){ const mes = MESES_EC[m[1]] || MESES_EC[m[1].slice(0,3)]; if(mes) return ecArmarFecha(m[3], mes, m[2]); }
  if(soloAlInicio && (m = t.match(/^\s*(\d{1,2})[\/-](\d{1,2})(?![\/\-.,]?\d)/))) return orden==='mdy' ? ecArmarFecha(null, m[1], m[2]) : ecArmarFecha(null, m[2], m[1]);
  return null;
}
function ecOrdenFechas(textos){
  let dmy = 0, mdy = 0;
  textos.forEach(t=>{ const m = String(t).match(/(\d{1,2})[-/.](\d{1,2})[-/.]\d{2,4}/); if(m){ if(+m[1]>12) dmy++; if(+m[2]>12) mdy++; } });
  if(mdy!==dmy) return mdy>dmy ? 'mdy' : 'dmy';
  // Ambiguo (todos los días ≤ 12): se queda el orden que no pone movimientos en el futuro.
  const manana = new Date(Date.now()+36*3600*1000).toISOString().slice(0,10);
  const futuras = (o)=>textos.filter(t=>{ const m = String(t).match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})(?!\d)/); if(!m) return false; const f = o==='mdy' ? ecArmarFecha(m[3], m[1], m[2]) : ecArmarFecha(m[3], m[2], m[1]); return f && f>manana; }).length;
  const fD = futuras('dmy'), fM = futuras('mdy');
  if(fD!==fM) return fD > fM ? 'mdy' : 'dmy';
  // Si tampoco, el orden que junta los movimientos en menos días (un estado de cuenta cubre ~1 mes).
  const rango = (o)=>{ const fs = textos.map(t=>{ const m = String(t).match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})(?!\d)/); return m ? (o==='mdy' ? ecArmarFecha(m[3], m[1], m[2]) : ecArmarFecha(m[3], m[2], m[1])) : null; }).filter(Boolean).sort(); return fs.length ? (new Date(fs[fs.length-1]) - new Date(fs[0])) : 0; };
  return rango('mdy') < rango('dmy') ? 'mdy' : 'dmy';
}
function ecDetectarMoneda(t, def){
  const s = String(t||'');
  if(/€|\bEUR\b/i.test(s)) return 'EUR';
  if(/\bUSD\b|US\$/i.test(s)) return 'USD';
  if(/\bGBP\b|£/.test(s)) return 'GBP';
  if(/\bMXN\b|MN\b/.test(s)) return 'MXN';
  return def || 'MXN';
}
function ecDetectarBanco(texto){
  const t = sinAcentos(String(texto||'').slice(0, 1500));
  if(/revolut/.test(t) || /started date.*completed date|fecha de inicio.*fecha de finalizacion/.test(t)) return 'revolut';
  if(/transferwise|\bwise\b|source amount \(after fees\)/.test(t)) return 'wise';
  if(/american express|\bamex\b|card member|titular de la tarjeta|appears on your statement as|extended details/.test(t)) return 'amex';
  if(/didi ?card|tarjeta didi|didi.{0,30}estado de cuenta/.test(t)) return 'didi';
  if(/nu mexico|nubank|\bnu\b.*(tarjeta|cuenta)|cuenta nu|tarjeta nu/.test(t)) return 'nu';
  if(/\bdidi\b/.test(t) && !/didi food|didi rides/.test(t)) return 'didi';
  return 'otro';
}
// CSV con comillas; separador , ; tab o |
function ecCSV(texto){
  const lineas = String(texto||'').replace(/\r\n?/g,'\n').split('\n');
  const primera = lineas.find(l=>l.trim()) || '';
  const cuenta = (c)=>primera.split(c).length-1;
  const sep = [',',';','\t','|'].sort((a,b)=>cuenta(b)-cuenta(a))[0];
  const filas = []; let fila = [], campo = '', comillas = false;
  const txt = String(texto||'').replace(/\r\n?/g,'\n');
  for(let i=0;i<txt.length;i++){
    const ch = txt[i];
    if(comillas){ if(ch==='"'){ if(txt[i+1]==='"'){ campo+='"'; i++; } else comillas=false; } else campo+=ch; }
    else if(ch==='"') comillas = true;
    else if(ch===sep){ fila.push(campo); campo=''; }
    else if(ch==='\n'){ fila.push(campo); filas.push(fila); fila=[]; campo=''; }

function ecLeerTexto(texto, bancoElegido, monedaDef){

// Bibliotecas para PDF y Excel: se cargan solo cuando se adjunta uno (necesita internet esa vez).
const EC_LIBS = { pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js' };
const ecScripts = {};
function ecCargarScript(url){
  if(!ecScripts[url]) ecScripts[url] = new Promise((ok, mal)=>{ const s = document.createElement('script'); s.src = url; s.onload = ()=>ok(); s.onerror = ()=>{ delete ecScripts[url]; mal(new Error('sin internet')); }; document.head.appendChild(s); });

// v17: color de cada texto del PDF (Nu pone los ingresos en verde y los gastos en negro).
const EC_RE_CANTIDAD = /\d[\d.,]*[.,]\d{2}(?!\d)/;
function ecEsVerde(c){ return !!c && c[1] >= 90 && c[1] > c[0] + 35 && c[1] > c[2] + 10; }
function ecEsOscuro(c){ return !c || (c[0] < 110 && c[1] < 110 && c[2] < 110 && Math.max(c[0],c[1],c[2]) - Math.min(c[0],c[1],c[2]) < 40); }
async function ecColoresDePagina(pag, lib){
  // Recorre las instrucciones de dibujo: color de relleno vigente + texto que se pinta con él.
  const OPS = lib.OPS; const ol = await pag.getOperatorList();
  let color = [0,0,0]; const pila = []; let texto = ''; const colores = [];
  const agregar = (glifos)=>{ (glifos||[]).forEach(gl=>{ if(gl && typeof gl==='object' && typeof gl.unicode==='string'){ const u = gl.unicode.replace(/\s+/g,''); for(const ch of u){ texto += ch; colores.push(color); } } }); };
  for(let i=0;i<ol.fnArray.length;i++){
    const fn = ol.fnArray[i], a = ol.argsArray[i];
    if(fn===OPS.save || fn===OPS.paintFormXObjectBegin || fn===OPS.beginGroup) pila.push(color);
    else if(fn===OPS.restore || fn===OPS.paintFormXObjectEnd || fn===OPS.endGroup){ if(pila.length) color = pila.pop(); }
    else if(fn===OPS.setFillRGBColor){ if(a && a.length>=3) color = [Number(a[0])||0, Number(a[1])||0, Number(a[2])||0]; else if(a && typeof a[0]==='string' && /^#/.test(a[0])){ const h = a[0]; color = [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; } }
    else if(fn===OPS.setFillGray){ const g = Math.round((Number(a&&a[0])||0) * (a&&a[0]<=1?255:1)); color = [g,g,g]; }
    else if(fn===OPS.showText || fn===OPS.showSpacedText){ agregar(a && a[0]); }
    else if(fn===OPS.nextLineShowText){ agregar(a && a[0]); }
    else if(fn===OPS.nextLineSetSpacingShowText){ agregar(a && a[2]); }
  }
  return {texto, colores};
}
async function ecTextoDePDF(buffer, bancoElegido){
  await ecCargarScript(EC_LIBS.pdf);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = EC_LIBS.pdfWorker;
  const pdf = await lib.getDocument({data: buffer}).promise;
  const paginas = [];
  let hayVerde = false, hayOscuro = false;
  for(let p=1; p<=pdf.numPages; p++){
    const pag = await pdf.getPage(p);
    const tc = await pag.getTextContent();
    let mapa = null; try{ mapa = await ecColoresDePagina(pag, lib); }catch(e){ mapa = null; }
    let cursor = 0;
    const items = [];
    tc.items.forEach(it=>{
      if(!it.str || !it.str.trim()) return;
      let color = null;
      if(mapa){
        const buscado = it.str.replace(/\s+/g,'');
        const pos = mapa.texto.indexOf(buscado, cursor);
        if(pos>=0){ color = mapa.colores[pos + buscado.length - 1]; cursor = pos + buscado.length; }
      }
      const esCant = EC_RE_CANTIDAD.test(it.str) && !/^\s*\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\s*$/.test(it.str);
      items.push({x: it.transform[4], y: it.transform[5], s: it.str, color, esCant});
    });
    paginas.push(items);
  }
  // Primero se arman los renglones; el color solo cuenta en renglones de movimientos (los que empiezan con fecha).
  const renglones = [];
  paginas.forEach(items=>{
    const grupos = [];
    items.forEach(it=>{ let g = grupos.find(g=>Math.abs(g.y-it.y)<=2.5); if(!g){ g = {y:it.y, items:[]}; grupos.push(g); } g.items.push(it); });
    grupos.sort((a,b)=>b.y-a.y).forEach(g=>{ const its = g.items.sort((a,b)=>a.x-b.x); renglones.push({its, texto: its.map(i=>i.s).join(' ')}); });
  });
  const textoPlano = renglones.map(r=>r.texto).join('\n');
  const orden = ecOrdenFechas(renglones.map(r=>r.texto));
  renglones.forEach(r=>{ r.mov = !!ecParseFecha(r.texto.slice(0,32), orden, true); if(r.mov) r.its.forEach(i=>{ if(i.esCant && i.color){ if(ecEsVerde(i.color)) hayVerde = true; else if(ecEsOscuro(i.color)) hayOscuro = true; } }); });
  // Solo Nu (ingresos en verde, gastos en negro) y solo si hay cantidades verdes Y negras en los movimientos.
  const esNu = bancoElegido==='nu' || ((!bancoElegido || bancoElegido==='auto') && ecDetectarBanco(textoPlano)==='nu');
  const usarColor = esNu && hayVerde && hayOscuro;
  if(!usarColor) return textoPlano;
  return renglones.map(r=>!r.mov ? r.texto : r.its.map(i=>{
    if(i.esCant && i.color) return i.s + (ecEsVerde(i.color) ? '⟪v⟫' : (ecEsOscuro(i.color) ? '⟪n⟫' : ''));
    return i.s;
  }).join(' ')).join('\n');
}
const EC_RE_MARCA = /⟪[vn]⟫/g;
async function ecTextoDeExcel(buffer){
  await ecCargarScript(EC_LIBS.xlsx);
  const wb = window.XLSX.read(buffer, {type:'array', cellDates:true, dateNF:'yyyy-mm-dd'});
  return wb.SheetNames.map(n=>window.XLSX.utils.sheet_to_csv(wb.Sheets[n], {FS:',', RS:'\n', rawNumbers:true, dateNF:'yyyy-mm-dd'})).join('\n');

async function ecLeerArchivo(file, bancoElegido){
  const nombre = (file.name||'').toLowerCase();
  if(/\.pdf$/.test(nombre) || file.type==='application/pdf') return ecTextoDePDF(await file.arrayBuffer(), bancoElegido);

  return await file.text();
}

// v18.5: si las dos importaron el mismo estado de cuenta (antes de sincronizar), se queda la importación más vieja
// y los renglones repetidos de la otra se quitan (van a la papelera). Mismo resultado en los dos teléfonos.
function juntarImportacionesRepetidas(st){
  const regs = [];
  const add = (arr)=>(arr||[]).forEach(r=>{ if(r && r.importId && r.firmaEc) regs.push({arr, r}); });
  add(st.ingresos); add(st.gustosGastos); add(st.efectivoMovimientos); add(st.pagosTarjeta); (st.subcats||[]).forEach(sb=>add(sb.gastos));
  if(!regs.length) return 0;
  const imps = {}; (st.importaciones||[]).forEach(im=>{ imps[im.id] = im; });
  const clave = (id)=>{ const im = imps[id]; return [im ? (Number(im.creado)||0) : Number.MAX_SAFE_INTEGER, id]; };
  const editada = (lista, id)=>{ const im = imps[id]; const sello = im ? (Number(im.selloImport) || ((Number(im.creado)||0) + 5000)) : 0; return lista.some(x=>(Number(x.r._u)||0) > sello) ? 1 : 0; };
  const porFirma = {}; regs.forEach(x=>{ (porFirma[x.r.firmaEc] = porFirma[x.r.firmaEc] || []).push(x); });
  let quitados = 0;
  Object.keys(porFirma).forEach(fm=>{
    const porImp = {}; porFirma[fm].forEach(x=>{ (porImp[x.r.importId] = porImp[x.r.importId] || []).push(x); });
    const ids = Object.keys(porImp); if(ids.length < 2) return;
    // Se queda la copia que alguien ya editó (categoría, nota, "ambas"…); si ninguna o las dos, la importación más vieja.
    ids.sort((a,b)=>{ const ea = editada(porImp[a], a), eb = editada(porImp[b], b); if(ea!==eb) return eb-ea; const A = clave(a), B = clave(b); return (A[0]-B[0]) || (A[1] < B[1] ? -1 : 1); });
    let cupo = porImp[ids[0]].length;
    ids.slice(1).forEach(id=>{
      const l = porImp[id].slice().sort((a,b)=>a.r.id < b.r.id ? -1 : 1);
      const n = Math.min(cupo, l.length);
      for(let i=0;i<n;i++){ const k = l[i].arr.indexOf(l[i].r); if(k>=0){ l[i].arr.splice(k,1); quitados++; } }
      cupo = Math.max(cupo, l.length);
    });
  });
  return quitados;
}

// Actualiza el resumen de una línea (y el monto/icono) sin volver a dibujar todo.
function ecRefrescarFila(f){
  const e = ecEstado, el = document.querySelector(`[data-ec-fila="${f.i}"]`); if(!el || !e) return;
  const r = el.querySelector('[data-ec-res]'); if(r) r.textContent = ecResumenFila(e, f);
