<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budgetin">
<meta name="theme-color" content="#080d1a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFC93C'/%3E%3Crect x='30' y='21' width='11' height='58' rx='5.5' fill='white'/%3E%3Cpath d='M35 21 H54 A14.5 14.5 0 0 1 54 50 H35 Z' fill='white'/%3E%3Cpath d='M35 50 H58 A15 15 0 0 1 58 79 H35 Z' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FFC93C'/%3E%3Crect x='30' y='21' width='11' height='58' rx='5.5' fill='white'/%3E%3Cpath d='M35 21 H54 A14.5 14.5 0 0 1 54 50 H35 Z' fill='white'/%3E%3Cpath d='M35 50 H58 A15 15 0 0 1 58 79 H35 Z' fill='white'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<title>Budgetin — Presupuesto de viaje</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ===== TEMA OSCURO (default) — paleta guía Figma ===== */
  :root{
    --paper:#080d1a;
    --paper-soft:#0f1628;
    --card:#141d35;
    --card2:#1a2540;
    --ink:#e8edf8;
    --ink-soft:#a9b7d6;
    --ink-faint:#6b7fa8;
    --teal:#00e5a0;
    --teal-deep:#00e5a0;
    --teal-soft:rgba(0,229,160,0.14);
    --gold:#f5a623;
    --gold-soft:rgba(245,166,35,0.16);
    --plum:#a78bfa;
    --plum-soft:rgba(167,139,250,0.16);
    --brick:#ff5c6e;
    --brick-soft:rgba(255,92,110,0.16);
    --amber:#f5a623;
    --amber-soft:rgba(245,166,35,0.16);
    --line:#1f2e50;
    --grid:rgba(255,255,255,0.06);
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow-1: 0 6px 22px rgba(0,0,0,0.35);
  }
  /* ===== TEMA CLARO — mayormente blanco ===== */
  :root[data-theme="light"]{
    --paper:#ffffff;
    --paper-soft:#f4f6fb;
    --card:#ffffff;
    --card2:#f7f9fd;
    --ink:#12203a;
    --ink-soft:#566588;
    --ink-faint:#8a97b0;
    --teal:#00b87d;
    --teal-deep:#00895d;
    --teal-soft:#d9fbef;
    --gold:#d98c10;
    --gold-soft:#fbf0d5;
    --plum:#7c5cff;
    --plum-soft:#ece6ff;
    --brick:#e5484d;
    --brick-soft:#ffe3e5;
    --amber:#c98a12;
    --amber-soft:#fbf0d5;
    --line:#e6eaf2;
    --grid:rgba(20,40,80,0.06);
    --shadow-1: 0 4px 15px rgba(20,40,80,0.07);
  }
  *{box-sizing:border-box;}
  /* overflow-x:clip (no 'hidden') evita crear un contenedor de scroll, que
     rompería el position:sticky del encabezado. */
  html,body{margin:0;padding:0;overflow-x:clip;max-width:100%;background:var(--paper);}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Outfit', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(96px + env(safe-area-inset-bottom, 20px));
    width:100%;
    transition:background .25s ease, color .25s ease;
  }
  #app{background:var(--paper);}
  .font-display{font-family:'DM Serif Display', serif;}
  h1,h2,h3,.num{
    font-family:'Outfit', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  button{font-family:inherit;}
  .app{max-width:520px;margin:0 auto;padding:18px 16px 8px;}
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .icon-sm{width:16px;height:16px;}
  .icon-lg{width:26px;height:26px;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .topbar .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#06231a;}
  .brand h1{font-size:15px;color:var(--ink);}
  .brand .sub{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;}
  .icon-btn:active{transform:scale(0.94);}

  /* ---------- balance stamp ---------- */
  /* ---------- top sticky (balance + tabs) estilo referencia ----------
     Solo el saldo y las pestañas quedan fijos; el logo+nombre (renderTop)
     viven arriba y se van al hacer scroll. La línea curva de abajo (border
     inferior + esquinas redondeadas) "encierra" el bloque superior. */
  .topsticky{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1.5px solid var(--line);border-radius:0 0 26px 26px;box-shadow:0 8px 18px -14px rgba(0,0,0,.45);}
  .stamp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .stamp-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .brand-name{font-size:15px;color:var(--ink);font-weight:700;}
  .theme-toggle{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;flex-shrink:0;}
  .theme-toggle:active{transform:scale(.92);}
  /* El balance ahora vive directo sobre el fondo (como la referencia), sin
     tarjeta verde — el color pasa a las variables de tema. */
  .stamp{
    position:relative;
    background:transparent;
    color:var(--ink);
    padding:6px 0 4px;
    margin-bottom:8px;
  }
  .stamp .label{font-size:12px;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:.2px;}
  .stamp .amount{font-size:42px;line-height:1.02;margin-top:6px;font-weight:800;letter-spacing:-1px;color:var(--ink);}
  .stamp .amount small{font-size:18px;font-weight:600;opacity:.6;margin-right:2px;}
  .stamp .sub-row{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
  .stamp .sub-item{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .stamp .sub-item b{display:block;font-family:'Outfit',sans-serif;font-size:14.5px;color:var(--ink);font-weight:700;margin-top:3px;text-transform:none;letter-spacing:normal;}
  .stamp .sub-item b.accent{color:var(--teal);}
  .stamp-bar{margin-top:16px;}
  .stamp-bar-track{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;}
  .stamp-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--teal-deep));}
  .stamp-bar-ends{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--ink-faint);font-weight:600;}
  .stamp-rate{margin-top:12px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .stamp .cover-banner{
    margin-top:14px;background:var(--card);border:1px dashed var(--line);
    border-radius:var(--radius-sm);padding:9px 11px;font-size:12px;display:flex;gap:8px;align-items:flex-start;color:var(--ink-soft);
  }

  /* ---------- tabs (estilo subrayado, referencia) ---------- */
  .tabs{display:flex;gap:20px;overflow-x:auto;padding:4px 0 0;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;padding:8px 0 10px;font-size:14px;font-weight:600;
    background:none;color:var(--ink-faint);border:none;border-bottom:2px solid transparent;cursor:pointer;
    transition:color .15s ease;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--teal);}

  /* ---------- generic card ---------- */
  .card{background:var(--card);border:none;border-radius:var(--radius-md);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-1);}
  .card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .card-title h2{font-size:15.5px;}
  .card-title .hint{font-size:11.5px;color:var(--ink-faint);font-weight:600;font-family:'Outfit', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;}
  /* Cualquier ".hint" que además sea interactivo (tiene data-open/data-tab/
     data-tab-to/data-goto-mov) se ve como botón — píldora con color — para
     que sea obvio que se puede tocar, no solo texto informativo. */
  .card-title .hint[data-open], .card-title .hint[data-tab], .card-title .hint[data-tab-to], .card-title .hint[data-goto-mov]{
    color:var(--teal-deep); background:var(--teal-soft); padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .card-title .hint[data-open]:active, .card-title .hint[data-tab]:active, .card-title .hint[data-tab-to]:active, .card-title .hint[data-goto-mov]:active{ transform:scale(.94); }
  .muted{color:var(--ink-faint);}
  .section-label{font-size:11.5px;text-transform:none;color:var(--ink-faint);font-weight:700;margin:20px 4px 10px;letter-spacing:.02em;}

  /* ---------- category card ---------- */
  .cat-card{border-radius:var(--radius-md);padding:14px 14px 12px;margin-bottom:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;}
  .cat-head{display:flex;align-items:center;gap:11px;}
  .cat-ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cat-info{flex:1;min-width:0;}
  .cat-info .name{font-size:14.5px;font-weight:600;}
  .cat-info .meta{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
  .cat-amt{text-align:right;flex-shrink:0;}
  .cat-amt .left{font-family:'Outfit', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;font-weight:600;font-size:16px;}
  .cat-amt .of{font-size:11px;color:var(--ink-faint);}
  .bar-track{height:7px;border-radius:99px;background:var(--paper-soft);margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;transition:width .3s ease;}
  .chev{color:var(--ink-faint);transition:transform .2s;}
  .cat-card.open .chev{transform:rotate(180deg);}
  .cat-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:99px;}
  .badge-ok{background:var(--teal-soft);color:var(--teal-deep);}
  .badge-warn{background:var(--amber-soft);color:#8A6A17;}
  .badge-bad{background:var(--brick-soft);color:var(--brick);}
  .badge-plum{background:var(--plum-soft);color:var(--plum);}

  /* subcategory rows */
  .subrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--paper-soft);}
  .subrow:last-child{border-bottom:none;}
  .subrow .sico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .subrow .sname{flex:1;font-size:13.5px;font-weight:500;}
  .subrow .samt{font-size:13px;font-weight:600;text-align:right;}
  .subrow .samt .est{display:block;font-size:10.5px;color:var(--ink-faint);font-weight:500;}
  .subrow-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;}

  /* expense list line */
  .exp-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--paper-soft);font-size:13px;}
  .exp-line:last-child{border-bottom:none;}
  .mico{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .mico svg{width:100%;height:100%;overflow:visible;}
  .mico.sm{width:28px;height:28px;}
  .who-txt{font-weight:600;color:var(--ink-soft);}
  .exp-line .who{width:24px;height:24px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .exp-line .who.isa{background:var(--plum-soft);color:var(--plum);}
  .exp-line .who.abuelo{background:var(--amber-soft);color:#8A6412;}
  .exp-line .desc{flex:1;min-width:0;}
  .exp-line .desc .n{font-weight:600;}
  .exp-line .desc .d{color:var(--ink-faint);font-size:11px;}
  .exp-line .amt{font-weight:600;text-align:right;}
  .exp-line .amt .est{display:block;font-size:10px;font-weight:500;color:var(--ink-faint);}
  .exp-line .tag-cash{font-size:9.5px;background:var(--plum-soft);color:var(--plum);padding:2px 6px;border-radius:99px;font-weight:700;margin-left:4px;}

  /* buttons */
  .btn{border:none;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:active{background:var(--teal-deep);}
  .btn-ghost{background:var(--paper-soft);color:var(--ink);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:var(--brick-soft);color:var(--brick);}
  .btn-block{width:100%;justify-content:center;}
  .btn-sm{padding:7px 12px;font-size:12.5px;}

  .fab{
    position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 12px));right:calc(50% - 260px + 16px);
    width:56px;height:56px;border-radius:50%;background:var(--teal);color:#06231a;border:none;
    display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -8px rgba(0,229,160,.5);
    cursor:pointer;z-index:998;
  }
  @media (max-width:552px){.fab{right:20px;}}
  /* Wrappers neutros en móvil: no cambian el flujo actual */
  .rail{display:contents;}
  /* Cuando la barra fija ya está pegada arriba, pinta el fondo HACIA ARRIBA
     (zona de la barra de estado / hueco superior en iPhone) para que no se vea
     el contenido pasando por detrás. Solo aparece al estar pegada (.stuck),
     así no tapa el logo cuando estás hasta arriba. */
  .topsticky::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:0;background:var(--paper);pointer-events:none;}
  .topsticky.stuck::before{height:240px;}
  .main{display:contents;}
  .main-head{display:none;}
  .tabico{display:none;}
  .nav-label{display:none;}

  /* ---------- ESCRITORIO: barra lateral fija + contenido a TODO lo ancho ----------
     Solo min-width:900px. En móvil nada de esto aplica (los wrappers son
     display:contents y el resto está oculto). */
  @media (min-width:900px){
    :root{ --rail-w: 340px; }
    .rail{
      display:block;position:fixed;top:0;left:0;width:var(--rail-w);height:100vh;
      overflow-y:auto;background:var(--paper-soft);border-right:1px solid var(--line);
      z-index:60;padding-bottom:24px;
    }
    .rail .app{max-width:none;margin:0;padding:20px 20px 0;}
    .rail .topbar{margin-bottom:12px;}
    .rail .brand-mark{width:40px;height:40px;}
    .rail .brand-name{font-size:17px;}
    .rail .topsticky{position:static;border:none;border-radius:0;box-shadow:none;background:transparent;}
    .rail .topsticky::before{display:none;}
    /* Tarjeta de balance en la barra */
    .rail .stamp{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;}
    .rail .stamp .amount{font-size:36px;}
    .rail .stamp .label{font-size:12.5px;}
    .rail .stamp .sub-item{font-size:11.5px;}
    .rail .stamp .sub-item b{font-size:15.5px;}
    .rail .stamp .stamp-controls{gap:7px;}
    /* Navegación vertical tipo rail — más grande */
    .nav-label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint);margin:16px 6px 10px;}
    .rail .tabs{flex-direction:column;gap:5px;overflow:visible;padding:0;}
    .rail .tab{
      display:flex;align-items:center;gap:13px;width:100%;padding:13px 15px;border:none;
      border-radius:13px;font-size:15.5px;font-weight:600;color:var(--ink-soft);
      border-bottom:none;transition:background .15s ease, color .15s ease;
    }
    .rail .tab .tabico{display:flex;align-items:center;}
    .rail .tab .tabico .icon{width:19px;height:19px;}
    .rail .tab:hover{background:var(--card);color:var(--ink);}
    .rail .tab.active{background:var(--teal);color:#06231a;border-bottom:none;}
    .rail .tab.active .tabico{color:#06231a;}
    /* Área principal: TODO el ancho restante, exactamente 3 columnas
       (2 solo en ventanas de escritorio angostas <1200 para que no se
       apachurre), balanceadas para que queden parejas. */
    .main{display:block;margin-left:var(--rail-w);min-height:100vh;}
    .main-head{display:flex;align-items:flex-end;justify-content:space-between;padding:30px 34px 4px;}
    .main-title{font-size:30px;font-weight:800;letter-spacing:-.5px;}
    .main-date{font-size:13.5px;color:var(--ink-faint);margin-top:4px;}
    .main-date::first-letter{text-transform:uppercase;}
    .main .appcontent{max-width:none;width:100%;margin:0;padding:16px 34px 48px;column-count:2;column-gap:26px;column-fill:balance;}
    .main .appcontent > *{break-inside:avoid;margin-bottom:26px;}
    .main .appcontent > .chiprow, .main .appcontent > .mov-search, .main .appcontent > .section-label{column-span:all;}
    /* Por sección: el tablero de Inicio va en varias columnas; las secciones
       con pocas tarjetas (Movimientos/Destinos/Configuración) usan UNA columna
       ancha para que no se vean chicas ni apretadas; Categorías en dos. */
    .main .appcontent.tab-movimientos,
    .main .appcontent.tab-destinos,
    .main .appcontent.tab-config{column-count:1;max-width:1000px;}
    .main .appcontent.tab-movimientos > *,
    .main .appcontent.tab-destinos > *,
    .main .appcontent.tab-config > *{margin-bottom:22px;}
    .main .appcontent.tab-categorias{column-count:2;}
    /* Todo un poco más grande en el contenido */
    .main .card{padding:22px;border-radius:18px;}
    .main .card-title h2{font-size:17.5px;}
    .main .stat-box{padding:14px 15px;}
    .main .stat-box .val{font-size:20px;}
    .main .deuda-col-amt{font-size:25px;}
    .main .triple-stat .ts-val{font-size:18px;}
    .main .carry-val{font-size:24px;}
    /* Gráficas más grandes (los contenedores traen la altura en estilo inline) */
    .main .card div[style*="height:190px"]{height:240px !important;}
    .main .card div[style*="height:180px"]{height:220px !important;}
    .fab{right:30px;bottom:30px;width:60px;height:60px;}
  }
  @media (min-width:1200px){
    .main .appcontent.tab-inicio{column-count:3;}
    /* Movimientos/Destinos/Config siguen en una sola columna ancha */
    .main .appcontent.tab-movimientos,
    .main .appcontent.tab-destinos,
    .main .appcontent.tab-config{column-count:1;}
  }

  /* bottom nav */
  .bottomnav{
    position:fixed;bottom:0;left:0;width:100%;background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:8px 6px calc(60px + env(safe-area-inset-bottom, 20px));z-index:999;
  }
  .navbtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-size:9.5px;font-weight:600;cursor:pointer;padding:4px 4px;}
  .navbtn .navdot{width:30px;height:22px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
  .navbtn.active{color:var(--teal-deep);}
  .navbtn.active .navdot{background:var(--teal-soft);}

  /* forms */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--paper-soft);font-size:14px;font-family:inherit;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  /* iPhone / Safari (solo móvil): Safari dibuja fechas y selectores con su
     estilo nativo — la fecha no se encoge y se empalma con la casilla de al

/* Paleta de colores vivos tipo "budget tracker" — un color distinto por
   tarjeta, como en la captura de referencia (círculos de colores con ícono
   adentro). Se asigna por posición para que cada categoría tenga su propio
   color consistente. */
// Paleta categórica VIBRANTE (guía de la foto): verde, azul, naranja, rojo,
// morado y más. Cada color se usa sólido en las gráficas y como tinte
// (color + fondo translúcido del mismo color) en los círculos de ícono, para
// que se vea vibrante y legible en tema claro y oscuro por igual.
const CHART_COLORS = [
  '#12E29E', // verde menta
  '#4C8DFF', // azul
  '#FF9F43', // naranja
  '#FF5C6E', // rojo/coral
  '#A78BFA', // morado
  '#22C7E6', // cyan
  '#FF6FB5', // rosa
  '#FFC93C', // amarillo
  '#2DD4BF', // teal
  '#7C83FF', // indigo
  '#9BE15D', // lima
];
function colorFor(i){ return CHART_COLORS[i % CHART_COLORS.length]; }
// Convierte un hex a rgba con alpha, para los fondos translúcidos.
function hexA(hex, a){
  const h = hex.replace('#',''); const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function paletteFor(i){ const c = colorFor(i); return {bg:hexA(c,0.18), fg:c}; }

   rápido de dónde son. MXN es la moneda base de toda la app — todo lo
   demás se convierte a MXN con el tipo de cambio vigente al momento de
   registrar cada movimiento (y queda congelado para siempre). */
const CURRENCY_META = {
  MXN:{flag:'🇲🇽', name:'Peso mexicano'},
  EUR:{flag:'🇪🇺', name:'Euro'},
  USD:{flag:'🇺🇸', name:'Dólar estadounidense'},

  CZK:{flag:'🇨🇿', name:'Corona checa'},
  PLN:{flag:'🇵🇱', name:'Zloty polaco'},
  RON:{flag:'🇷🇴', name:'Leu rumano'},
  BGN:{flag:'🇧🇬', name:'Lev búlgaro'},
  SEK:{flag:'🇸🇪', name:'Corona sueca'},
  NOK:{flag:'🇳🇴', name:'Corona noruega'},

  RSD:{flag:'🇷🇸', name:'Dinar serbio'},
  BAM:{flag:'🇧🇦', name:'Marco bosnio'},
  MKD:{flag:'🇲🇰', name:'Denar macedonio'},
  ALL:{flag:'🇦🇱', name:'Lek albanés'},
};
const CURRENCY_CODES = Object.keys(CURRENCY_META);
// Adivina la moneda local del destino activo por nombre, para poder ponerla
// arriba del selector (best-effort — si no reconoce el lugar, simplemente
// no agrega una tercera moneda destacada y el resto de la lista sigue igual).
const MONEDA_POR_LUGAR = [
  [/croacia|split|zagreb|dubrovnik|zadar|pula|rijeka/i,'EUR'],
  [/montenegro|kotor|budva|podgorica/i,'EUR'],
  [/serbia|belgrado|belgrade|novi sad/i,'RSD'],
  [/bosnia|sarajevo|mostar/i,'BAM'],
  [/macedonia|skopje/i,'MKD'],
  [/albania|tirana|shkoder/i,'ALL'],
  [/hungr[íi]a|budapest/i,'HUF'],
  [/chequia|praga|prague|czech/i,'CZK'],
  [/polonia|varsovia|krak[oó]w|poland/i,'PLN'],
  [/rumania|bucarest|romania/i,'RON'],
  [/bulgaria|sofia/i,'BGN'],
  [/suecia|estocolmo|sweden/i,'SEK'],
  [/noruega|oslo|norway/i,'NOK'],
  [/dinamarca|copenhague|denmark/i,'DKK'],
  [/suiza|z[uü]rich|ginebra|switzerland/i,'CHF'],
  [/turqu[íi]a|estambul|turkey/i,'TRY'],
  [/reino unido|londres|brighton|uk|england|gran breta/i,'GBP'],
  [/irlanda|dubl[íi]n|ireland/i,'EUR'],
  [/portugal|lisboa|oporto|porto/i,'EUR'],
  [/espa[ñn]a|barcelona|madrid|spain/i,'EUR'],
  [/italia|roma|mil[aá]n|florencia|italy/i,'EUR'],
];
function guessMonedaDestino(){
  const d = destinoActual();
  if(!d || !d.nombre) return null;
  const hit = MONEDA_POR_LUGAR.find(([re])=>re.test(d.nombre));
  return hit ? hit[1] : null;
}
function currencyOptions(selected, onlyList){
  const list = onlyList || CURRENCY_CODES;
  if(!onlyList && list===CURRENCY_CODES){
    const local = guessMonedaDestino();
    const primeras = ['MXN','EUR', ...(local && local!=='MXN' && local!=='EUR' ? [local] : [])];
    const ordenado = [...primeras, ...CURRENCY_CODES.filter(c=>!primeras.includes(c))];
    return ordenado.map(c=>`<option value="${c}" ${c===selected?'selected':''}>${CURRENCY_META[c].flag} ${c}</option>`).join('');
  }
  return list.map(c=>`<option value="${c}" ${c===selected?'selected':''}>${CURRENCY_META[c].flag} ${c}</option>`).join('');
}

/* ------------------------------------------------------------
   Migración de datos guardados de versiones anteriores. Si el
   navegador ya tenía datos de una versión vieja de la app (sin los
   campos nuevos como "peso" o "pctAuto"), esto los completa con
   valores por defecto para que nada se quede "congelado" en silencio.
   ------------------------------------------------------------ */
function migrateState(s){
  if(!s) return s;
  if(typeof s.pctAuto === 'undefined') s.pctAuto = true;
  if(!s.ratesMeta) s.ratesMeta = { updatedAt:null, source:'Valores iniciales (sin conexión aún)' };
  const defaultRates = { MXN:1, EUR:19.66, USD:16.90, GBP:22.89, CHF:20.87, HUF:0.054, CZK:0.811, PLN:4.556, RON:3.742, BGN:10.05, SEK:1.762, NOK:1.837, DKK:2.630, TRY:0.348, RSD:0.168, BAM:10.05, MKD:0.320, ALL:0.214 };
  if(!s.rates) s.rates = defaultRates;
  Object.keys(defaultRates).forEach(code=>{ if(typeof s.rates[code] !== 'number') s.rates[code] = defaultRates[code]; });
  if(!Array.isArray(s.subcats)) s.subcats = defaultSubcats();
  // Pesos por defecto de subcategorías creadas antes de que este campo
  // existiera: en vez de dejarlas todas iguales (lo que producía un % parejo
  // y sin sentido, ej. "9% en todo"), se les asigna el peso real que le
  // corresponde a ese nombre según defaultSubcats() — solo como respaldo
  // para datos viejos; una subcategoría con peso ya guardado nunca se toca.
  const PESO_POR_NOMBRE = {};
  defaultSubcats().forEach(d=>{ PESO_POR_NOMBRE[d.nombre] = d.peso; });
  s.subcats.forEach((sub,i)=>{
    if(typeof sub.peso === 'undefined' || sub.peso===null) sub.peso = PESO_POR_NOMBRE[sub.nombre] || 5;
    if(typeof sub.coberturaKey === 'undefined') sub.coberturaKey = null;
    if(!Array.isArray(sub.costos)) sub.costos = [];
    if(!Array.isArray(sub.gastos)) sub.gastos = [];
    // pagadoPor: gastos viejos marcados "ambas" no traen quién puso el dinero.
    // Se dejan en null (no se inventa deuda); son editables para asignarlo.
    sub.gastos.forEach(g=>{ if(typeof g.pagadoPor === 'undefined') g.pagadoPor = null; });
  });
  if(Array.isArray(s.gustosGastos)) s.gustosGastos.forEach(g=>{ if(typeof g.pagadoPor === 'undefined') g.pagadoPor = null; });
  if(!Array.isArray(s.destinos)) s.destinos = [];
  s.destinos.forEach(d=>{
    if(!d.cobertura) d.cobertura = {alojamiento:'no',desayuno:'no',comida:'no',cena:'no',transporte:'no'};
    if(typeof d.costoVidaDia === 'undefined' || d.costoVidaDia===null) d.costoVidaDia = 0;
    if(!d.fuenteCosto) d.fuenteCosto = 'externo';
    if(!d.estacionalidad) d.estacionalidad = 'media';
    if(!d.nivelCosto) d.nivelCosto = 'medio';
  });
  if(!s.fondoGrande) s.fondoGrande = {overrideManual:null, conocidos:[], movimientos:[]};
  if(!Array.isArray(s.fondoGrande.conocidos)) s.fondoGrande.conocidos=[];
  if(!Array.isArray(s.fondoGrande.movimientos)) s.fondoGrande.movimientos=[];
  if(!Array.isArray(s.efectivoGastos)) s.efectivoGastos=[];
  if(!Array.isArray(s.pagosEntre)) s.pagosEntre=[];
  if(!Array.isArray(s.pagosTarjeta)) s.pagosTarjeta=[];
  if(!Array.isArray(s.pagosOtros)) s.pagosOtros=[];
  if(!Array.isArray(s.series)) s.series=[];
  if(!Array.isArray(s.porCobrar)) s.porCobrar=[];
  if(!Array.isArray(s.deudasProyectadas)) s.deudasProyectadas=[];
  s.series.forEach(se=>{ if(!Array.isArray(se.omitidos)) se.omitidos=[]; if(!se.plantilla) se.plantilla={}; });
  if(!Array.isArray(s.efectivoMovimientos)){
    s.efectivoMovimientos = [];
    // Migrar el saldo plano viejo (state.efectivo.{jen,isa}.monto) a un
    // movimiento de "ajuste" inicial, para no perder lo ya cargado.
    if(s.efectivo){
      ['jen','isa'].forEach(p=>{
        const e = s.efectivo[p];
        if(e && Number(e.monto)){
          s.efectivoMovimientos.push({id:uid(), persona:p, tipo:'ajuste', monto:Number(e.monto), moneda:e.moneda||(p==='isa'?'USD':'EUR'), fecha: s.primerIngresoOficial||todayISO(), nota:'Saldo inicial de efectivo', origen:'ajuste'});
        }
      });
    }
    // Migrar los "gustos extra en efectivo" viejos a movimientos tipo gasto.
    s.efectivoGastos.forEach(g=>{
      s.efectivoMovimientos.push({id:g.id||uid(), persona:g.quien==='isa'?'isa':'jen', tipo:'gasto', monto:Number(g.monto)||0, moneda:g.moneda||'EUR', fecha:g.fecha||todayISO(), nota:g.nota||'Gusto en efectivo', origen:null, ...(g.montoMXN?{montoMXN:g.montoMXN,rateMXN:g.rateMXN}:{})});
    });
    s.efectivoGastos = []; // ya migrados
  }
  delete s.efectivo; // el saldo ahora se deriva de la bitácora
  if(!Array.isArray(s.gustosGastos)) s.gustosGastos=[];
  if(!Array.isArray(s.ingresos)) s.ingresos=[];
  // Ingresos: a dónde va (bote/débito/efectivo) y a qué mes aplica.
  s.ingresos.forEach(i=>{
    if(!i.destino) i.destino = 'bote';
    if(!i.mes) i.mes = (i.fecha||'').slice(0,7) || todayISO().slice(0,7);
  });
  // Ingresos recurrentes del modelo viejo (un solo registro que "contaba"
  // cada mes) → una serie + un registro independiente por mes.
  if(!Array.isArray(s.series)) s.series=[];
  s.ingresos.filter(i=>i.recurrente).forEach(i=>{
    const se = serieNueva('ingreso', i, null);
    s.series.push(se);
    i.recurrente = false; i.serieId = se.id; i.serieYM = se.desde;
  });
  // El abuelo no deposita nada: su tarjeta vive aparte, fuera del bote.
  if(!s.migAbueloFueraDelBote){
    s.ingresos = s.ingresos.filter(i=>!(/abuelo/i.test(i.fuente||'')));
    s.migAbueloFueraDelBote = true;
  }
  // "Dinero personal" pasa a ser la Tarjeta de débito.
  const aDebito = v => v==='personal' ? 'debito' : v;
  (s.subcats||[]).forEach(sub=>(sub.gastos||[]).forEach(g=>{ g.pagadoCon = aDebito(g.pagadoCon); }));
  (s.gustosGastos||[]).forEach(g=>{ g.pagadoCon = aDebito(g.pagadoCon); });
  (s.efectivoMovimientos||[]).forEach(m=>{ if(m.cuenta) m.cuenta = aDebito(m.cuenta); });
  (s.pagosEntre||[]).forEach(p=>{ p.sale = aDebito(p.sale); p.entra = aDebito(p.entra); });
  // Los préstamos del Fondo de gastos grandes ahora se calculan en vivo.
  if(s.fondoGrande && Array.isArray(s.fondoGrande.movimientos)) s.fondoGrande.movimientos = s.fondoGrande.movimientos.filter(m=>m.tipo!=='prestamo_a_generales');
  if(!s.ahorro || !Array.isArray(s.ahorro.movimientos)) s.ahorro = {movimientos:[]};
  if(!s.pct) s.pct = {generales:82, gustos:8, fondoGrande:10};
  if(!s.finanzas) s.finanzas = { jen:{inicial:0,ganancias:[],gastos:[]}, isa:{inicial:0,ganancias:[],gastos:[]} };
  ['jen','isa'].forEach(p=>{
    if(!s.finanzas[p]) s.finanzas[p] = {inicial:0,ganancias:[],gastos:[]};
    if(typeof s.finanzas[p].inicial !== 'number') s.finanzas[p].inicial = 0;
    if(!Array.isArray(s.finanzas[p].ganancias)) s.finanzas[p].ganancias = [];
    if(!Array.isArray(s.finanzas[p].gastos)) s.finanzas[p].gastos = [];
    if(!s.finanzas[p].credito || typeof s.finanzas[p].credito!=='object') s.finanzas[p].credito = {limite:0};
    if(typeof s.finanzas[p].credito.limite !== 'number') s.finanzas[p].credito.limite = Number(s.finanzas[p].credito.limite)||0;
  });
  if(!s.viajeConfig) s.viajeConfig = {montoDisponibleMXN:0, fechaInicio:'', fechaFin:''};
  if(!s.abuelo) s.abuelo = { metaMXN:4200 };
  if(typeof s.abuelo.metaMXN !== 'number') s.abuelo.metaMXN = 4200;
  if(typeof s.viajeConfig.montoDisponibleMXN !== 'number'){
    s.viajeConfig.montoDisponibleMXN = s.viajeConfig.montoDisponibleEUR || 0;
    delete s.viajeConfig.montoDisponibleEUR;
  }
  if(typeof s.syncUrl !== 'string') s.syncUrl = '';
  return s;
}

   nada de esto es fijo, todo se puede editar o borrar después.
   ------------------------------------------------------------ */
function estaVacia(){
  return state.ingresos.length===0 && state.ahorro.movimientos.length===0;
}
function cargarValoresIniciales(){
  const fecha = state.primerIngresoOficial || '2026-09-19';
  // Ingreso de mamá para Jen, con ahorro automático de 5000 MXN — recurrente cada mes
  const ing1 = {id:uid(), persona:'jen', fuente:'Mamá', montoBruto:25000, moneda:'MXN', fecha, mes:fecha.slice(0,7), destino:'bote', ahorroAuto:true, ahorroAutoMonto:5000, ...stampRates(25000,'MXN',null)};
  state.ingresos.push(ing1); hacerRecurrente(ing1, 'ingreso', null, null);
  // Ingreso de Isa — recurrente cada mes
  const ing2 = {id:uid(), persona:'isa', fuente:'Isa', montoBruto:20000, moneda:'MXN', fecha, mes:fecha.slice(0,7), destino:'bote', ahorroAuto:false, ahorroAutoMonto:0, ...stampRates(20000,'MXN',null)};
  state.ingresos.push(ing2); hacerRecurrente(ing2, 'ingreso', null, null);

  // Costo de vida estimado de Split (editable — ajústalo con lo que vayan viendo)
  const split = state.destinos.find(d=>d.nombre.includes('Split'));
  if(split && !split.costoVidaDia){
    split.costoVidaDia = 690; // ~35 EUR/día al tipo de cambio inicial
    split.fuenteCosto = 'comunidad';
    split.notas = (split.notas?split.notas+' ':'') + 'Costo de vida inicial estimado — ajústalo con lo que vayan gastando.';
  }
  // Un par de costos de referencia de ejemplo, editables/borrables
  const lavanderia = state.subcats.find(s=>s.nombre==='Lavandería');
  if(lavanderia && lavanderia.costos.length===0){
    lavanderia.costos.push({id:uid(), nombre:'Lavandería self-service', monto:1, moneda:'EUR', frecuencia:'quincenal', destinoId: split?split.id:null});
  }
  const transporte = state.subcats.find(s=>s.nombre==='Transporte local');
  if(transporte && transporte.costos.length===0){
    transporte.costos.push({id:uid(), nombre:'Camión / bus local', monto:2, moneda:'EUR', frecuencia:'diaria', destinoId: split?split.id:null});
  }
  if(split){ state.destinoActualId = split.id; }
  aplicarSugerenciaDestinoSiAplica();
  persist();
}

function escHtml(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
// Fechas SIEMPRE en la hora local del celular (no la de Londres/UTC): así un
// gasto a la 1 a.m. del día 1 cae en el mes correcto.
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoLocal(new Date()); }
function mesActual(){ return todayISO().slice(0,7); }
function ymDe(iso){ return (iso||'').slice(0,7); }
function ymMas(ym, n){ let y=+ym.slice(0,4), m=+ym.slice(5,7)+n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+'-'+String(m).padStart(2,'0'); }
function nombreMesLargo(ym){ const t=new Date(ym+'-01T00:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
}
function fmt(n, cur){
  cur = cur||'EUR';
  const symbols = {EUR:'€', MXN:'$', USD:'US$', GBP:'£', CHF:'CHF '};
  const s = symbols[cur] || cur+' ';
  const v = (isFinite(n)?n:0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
  return `${s}${v}`;
}
function toMXN(amount, cur){
  if(cur==='MXN') return amount;
  return amount * (state.rates[cur]||1);
}
function toEUR(amountMXN){
  return amountMXN / (state.rates.EUR||21.5);
}
function convertToEUR(amount, cur){
  if(cur==='EUR') return amount;
  return toEUR(toMXN(amount, cur));
}

/* ------------------------------------------------------------
   Tipo de cambio en vivo (no fijo). Usa Frankfurter (Banco Central
   Europeo, gratis, sin llave) porque Google Finance no ofrece una
   API pública que se pueda llamar directo desde el navegador — este
   es el equivalente más confiable y abierto. Si no hay internet o el
   fetch falla, se queda con el último tipo de cambio conocido
   (guardado) para que la app siga funcionando en el camino.
   ------------------------------------------------------------ */
/* ============================================================
   SINCRONIZACIÓN ENTRE TELÉFONOS — usa un Google Apps Script Web
   App (que Jen configura una vez) como base de datos compartida
   simple. Última escritura gana: el que guardó más reciente es
   el que se adopta la próxima vez que el otro teléfono sincroniza.
   No es edición colaborativa en tiempo real — es "el otro teléfono
   ve tus cambios la próxima vez que abre o sincroniza la app".
   ============================================================ */
let syncEstado = { estado:'sin-configurar', ultimaVez:null }; // 'sin-configurar'|'ok'|'error'|'sincronizando'
let syncDebounceTimer = null;
let syncedAtLocal = null; // marca del último push/pull exitoso, para no re-jalar lo que ya subimos nosotros mismos

function programarSyncPush(){
  if(!state.syncUrl) return;
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(()=>{ pushToCloud(); }, 2500);
}
function nubeEsMasNueva(payload){
  const b = payload && Number(payload.appBuild);
  if(b && b > APP_BUILD){ syncVersionNube = b; syncEstado = { estado:'version', ultimaVez: syncEstado.ultimaVez }; return true; }
  return false;
}
async function pushToCloud(){
  if(!state.syncUrl) return false;
  if(syncVersionNube && syncVersionNube > APP_BUILD) return false;
  syncEstado = { estado:'sincronizando', ultimaVez: syncEstado.ultimaVez };
  try{
    // Antes de subir, revisa que el otro teléfono no use una versión más nueva.
    try{
      const chk = await fetch(state.syncUrl);
      if(chk && chk.ok){ const pl = await chk.json(); if(nubeEsMasNueva(pl)){ render(); return false; } }
    }catch(e){ /* si no se pudo revisar, se intenta subir igual */ }
    const now = new Date().toISOString();
    const res = await fetch(state.syncUrl, {
      method:'POST',
      body: JSON.stringify({ updatedAt: now, appBuild: APP_BUILD, data: state })
    });
    if(!res.ok) throw new Error('push failed');
    syncedAtLocal = now;
    syncEstado = { estado:'ok', ultimaVez: now };
    return true;
  }catch(e){
    syncEstado = { estado:'error', ultimaVez: syncEstado.ultimaVez };
    return false;
  }
}
async function pullFromCloud(forzarAunqueIgual){
  if(!state.syncUrl) return false;
  try{
    const res = await fetch(state.syncUrl);
    if(!res.ok) throw new Error('pull failed');
    const payload = await res.json();
    if(!payload || !payload.data || !payload.updatedAt) return false;
    if(nubeEsMasNueva(payload)) return false;
    // si la nube tiene algo más nuevo que lo último que sincronizamos, lo adoptamos
    if(forzarAunqueIgual || !syncedAtLocal || payload.updatedAt > syncedAtLocal){
      const syncUrlActual = state.syncUrl; // preservar la config de sync aunque venga vieja en la nube
      state = migrateState(payload.data) || state;
      state.syncUrl = syncUrlActual;
      syncedAtLocal = payload.updatedAt;
      Storage.save(state);
      syncEstado = { estado:'ok', ultimaVez: payload.updatedAt };
      return true;
    }
    syncEstado = { estado:'ok', ultimaVez: syncEstado.ultimaVez || payload.updatedAt };
    return false;
  }catch(e){
    syncEstado = { estado:'error', ultimaVez: syncEstado.ultimaVez };
    return false;
  }
}
async function sincronizarAhora(){
  if(!state.syncUrl) return;
  const cambioLocal = await pullFromCloud(false);
  if(cambioLocal) render();
  await pushToCloud();
}


// Tipo de cambio HISTÓRICO: cuántos MXN valía 1 unidad de `moneda` en la
// fecha dada. Usa Frankfurter (mismo dominio ya en la lista blanca de red).
// Devuelve null si no hay dato (moneda no soportada, sin internet, etc.) —
// el que llama se queda con el comportamiento actual (tasa de hoy, editable).
async function fetchRateHistorico(moneda, fecha){
  if(!moneda || moneda==='MXN') return moneda==='MXN' ? 1 : null;
  try{
    const url = `https://api.frankfurter.dev/v1/${fecha}?base=${moneda}&symbols=MXN`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const r = data && data.rates && data.rates.MXN;
    return (typeof r === 'number' && r>0) ? r : null;
  }catch(e){ return null; }
}
// Conecta el campo de fecha de una hoja con su campo de tipo de cambio: al
// cambiar la fecha a una distinta de hoy, jala el tipo de cambio real de ese
// día y lo pone en el input (dejándolo editable). Si falla, no toca nada.
function wireHistRate(prefix){
  const fechaEl = document.getElementById(prefix+'Fecha');
  const monedaEl = document.getElementById(prefix+'Moneda');
  const rateEl = document.getElementById(prefix+'Rate');
  if(!fechaEl || !rateEl) return;
  const actualizar = async ()=>{
    const moneda = monedaEl ? monedaEl.value : null;
    const fecha = fechaEl.value;
    if(!moneda || moneda==='MXN' || !fecha) return;
    if(fecha===todayISO()){ rateEl.value = rateSnapshotFor(moneda); return; }
    const prev = rateEl.value;
    rateEl.value = '…';
    const hist = await fetchRateHistorico(moneda, fecha);
    rateEl.value = hist!==null ? Number(hist.toFixed(4)) : (prev && prev!=='…' ? prev : rateSnapshotFor(moneda));
  };
  fechaEl.addEventListener('change', actualizar);
}
async function fetchLiveRates(showAlertOnFail){
  // Tres fuentes gratis, en orden. Si la primera falla (red, CORS,
  // bloqueo temporal), se intenta la siguiente automáticamente.
  const fuentes = [
    { nombre:'open.er-api.com', url:'https://open.er-api.com/v6/latest/EUR' },
    { nombre:'fxratesapi.com', url:'https://api.fxratesapi.com/latest?base=EUR&currencies=' + CURRENCY_CODES.filter(c=>c!=='EUR').join(',') },
    // api.frankfurter.app se movió a api.frankfurter.dev — usamos el
    // dominio nuevo directo para no depender de que el redirect funcione.
    { nombre:'Frankfurter (BCE)', url:'https://api.frankfurter.dev/v1/latest?from=EUR&to=' + CURRENCY_CODES.filter(c=>c!=='EUR'&&c!=='MXN').join(',') },
  ];
  const errores = [];
  for(const fuente of fuentes){
    try{
      const res = await fetch(fuente.url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const r = data.rates;
      if(!r || !r.MXN) throw new Error('respuesta sin datos de MXN');
      const eurToMxn = r.MXN;
      state.rates.MXN = 1;
      state.rates.EUR = eurToMxn;
      CURRENCY_CODES.forEach(code=>{
        if(code==='MXN' || code==='EUR') return;
        if(r[code]) state.rates[code] = eurToMxn / r[code];
      });
      state.ratesMeta = { updatedAt: new Date().toISOString(), source:fuente.nombre };
      persist();
      return true;
    }catch(e){
      errores.push(fuente.nombre+': '+e.message);
    }
  }
  // Las tres fallaron — casi siempre es falta de internet en el momento,
  // pero guardamos el detalle por si es otra cosa.
  console.warn('No se pudo actualizar el tipo de cambio. Detalle:', errores.join(' | '));
  state.ratesMeta = state.ratesMeta || {};
  state.ratesMeta.ultimoError = errores.join(' | ');
  if(showAlertOnFail) alert('No se pudo conectar para actualizar el tipo de cambio ahora mismo. Se sigue usando el último valor guardado — puedes editarlo manualmente aquí abajo, y la app lo vuelve a intentar sola la próxima vez que la abras con internet.');
  return false;
}
function rateSnapshotFor(moneda){
  return state.rates[moneda] || (moneda==='MXN'?1:state.rates.EUR);
}
// Congela en cada transacción cuántos pesos valía en el momento exacto en
// que se registró, para que el gasto de una compra pasada nunca cambie de
// valor aunque el tipo de cambio se mueva después.
function stampRates(monto, moneda, rateMXNInput){
  const rateMXN = moneda==='MXN' ? 1 : (Number(rateMXNInput) || rateSnapshotFor(moneda));
  const montoMXN = moneda==='MXN' ? monto : monto*rateMXN;
  const rateEURMXN = state.rates.EUR||21.5; // tipo de cambio EUR vigente en ese instante, también congelado
  const montoEUR = moneda==='EUR' ? monto : montoMXN/rateEURMXN;
  return { rateMXN, montoMXN, rateEURMXN, montoEUR };
}
function mxnOf(t){
  if(t && typeof t.montoMXN === 'number') return t.montoMXN;
  return toMXN(t.monto, t.moneda||'EUR');
}

/* ============================================================
   DERIVED CALCULATIONS
   ============================================================ */
/* ------------------------------------------------------------
   INGRESOS POR MES. Cada ingreso dice a dónde va (destino: 'bote' |
   'debito' | 'efectivo') y a qué mes aplica (mes 'YYYY-MM'). Un ingreso
   recurrente cuenta solo en cada mes desde su mes (se "crea" el día 1).
   ------------------------------------------------------------ */
// El "mes al que aplica" solo importa para el bote; lo que llega a débito o
// efectivo cuenta desde que llega (su fecha).
function mesIngreso(ing){
  if(ing.destino && ing.destino!=='bote') return ymDe(ing.fecha) || ing.mes || mesActual();
  return ing.mes || ymDe(ing.fecha) || mesActual();
}
function ingresoAplicaEnMes(ing, ym){
  const desde = mesIngreso(ing);
  return ing.recurrente ? desde<=ym : desde===ym;
}
// Meses (hasta hastaYM, por defecto el actual) en que un ingreso ya contó.
function ocurrenciasIngreso(ing, hastaYM){
  hastaYM = hastaYM || mesActual();
  const desde = mesIngreso(ing);
  if(desde>hastaYM) return [];
  return ing.recurrente ? mesesEntre(desde, hastaYM) : [desde];
}
function brutoIngresoMXN(ing){ return typeof ing.montoMXN==='number' ? ing.montoMXN : toMXN(ing.montoBruto, ing.moneda); }
function ahorroDeIngresoMXN(ing){ return ing.ahorroAuto ? Math.min(ing.ahorroAutoMonto||0, brutoIngresoMXN(ing)) : 0; }
function netoIngresoMXN(ing){ return brutoIngresoMXN(ing) - ahorroDeIngresoMXN(ing); }
// Ingreso neto AL BOTE de cada una en un mes (por defecto el actual).
function ingresosNetos(ym){
  ym = ym || mesActual();
  let jen=0, isa=0, ahorroAuto=0;
  state.ingresos.forEach(ing=>{
    if((ing.destino||'bote')!=='bote' || !ingresoAplicaEnMes(ing, ym)) return;
    const neto = netoIngresoMXN(ing);
    if(ing.persona==='jen') jen += neto; else isa += neto;
    ahorroAuto += ahorroDeIngresoMXN(ing);
  });
  return {jenNetoMXN:jen, isaNetoMXN:isa, ahorroAutoMXN:ahorroAuto};
}
function aportacionPct(){
  const {jenNetoMXN, isaNetoMXN} = ingresosNetos();
  const total = jenNetoMXN+isaNetoMXN;
  if(total<=0) return {jen:50, isa:50};
  return {jen: (jenNetoMXN/total)*100, isa:(isaNetoMXN/total)*100};
}
function boteTotalMXN(ym){
  const {jenNetoMXN, isaNetoMXN} = ingresosNetos(ym);
  return jenNetoMXN+isaNetoMXN;
}
// Los depósitos al ahorro NO se guardan por separado — se calculan en vivo
// a partir de los ingresos con "genera ahorro automático", uno por cada mes
// en que el ingreso ya contó (los recurrentes depositan cada mes).
function ahorroDepositosDerivados(){
  const out = [];
  state.ingresos.filter(i=>i.ahorroAuto && i.ahorroAutoMonto>0).forEach(i=>{
    ocurrenciasIngreso(i).forEach(ym=>{
      out.push({ id:'ing-'+i.id+'-'+ym, tipo:'deposito', monto:ahorroDeIngresoMXN(i), fecha: ym===mesIngreso(i) ? (i.fecha||ym+'-01') : ym+'-01',
        nota:'Automático desde ingreso de '+i.fuente, deIngresoId:i.id });
    });
  });
  return out;
}
function ahorroSaldoMXN(){
  const depositos = ahorroDepositosDerivados().reduce((a,m)=>a+m.monto,0);
  // Los movimientos guardados en state.ahorro.movimientos ahora son solo
  // retiros (cualquier "deposito" viejo que haya quedado ahí de una
  // versión anterior se ignora aquí a propósito, para no contar doble).
  const retiros = state.ahorro.movimientos.filter(m=>m.tipo==='retiro').reduce((a,m)=>a+m.monto,0);
  return depositos - retiros - retirosEfectivoMXN('ahorro');
}
/* ============================================================
   RECURRENTES. Una serie (state.series) es la "receta" de algo que se
   repite cada mes. Cada mes la app crea SOLA un registro normal e
   independiente (con serieId/serieYM), así todos los cálculos lo tratan
   como si lo hubieras registrado a mano, y se puede editar o borrar solo
   ese mes. Los gastos aparecen el día que les toca; los ingresos, los
   "me deben" y las proyecciones, al empezar su mes. Al borrar un mes se
   anota en omitidos para no volver a crearlo.
   tipo: 'ingreso' | 'gasto' (categorías) | 'efectivo' | 'personal' |
         'cobro' (me deben) | 'proyeccion' (voy a deber)
   ============================================================ */
function camposNoPlantilla(){ return ['id','fecha','serieId','serieYM','montoMXN','rateMXN','montoEUR','rateEUR','cubreDesde','cubreHasta','estado','fechaCobro','fechaPago','mes','recurrente','ingresoId','virtual']; }
function plantillaDe(rec){
  const p = {};
  Object.keys(rec).forEach(k=>{ if(!camposNoPlantilla().includes(k)) p[k] = rec[k]; });
  return JSON.parse(JSON.stringify(p));
}
function diaDe(iso){ return Math.max(1, Math.min(31, Number(String(iso||'').slice(8,10))||1)); }
function diaEnMes(ym, dia){
  const n = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
  return ym+'-'+String(Math.min(dia||1, n)).padStart(2,'0');
}
function difMeses(a, b){ // meses de a hasta b (b - a)
  return (+b.slice(0,4) - +a.slice(0,4))*12 + (+b.slice(5,7) - +a.slice(5,7));
}
// Mes al que pertenece un registro dentro de su serie.
function ymDeRegistro(tipo, rec){
  if(tipo==='ingreso') return mesIngreso(rec);
  return ymDe(rec.fecha) || mesActual();
}
function serieNueva(tipo, rec, extra){
  const desde = ymDeRegistro(tipo, rec);
  const se = { id:uid(), tipo, persona: rec.persona || null, plantilla: plantillaDe(rec), dia: diaDe(rec.fecha),
    desde: desde || mesActual(), hasta: null, omitidos: [], offset: 0 };
  if(tipo==='ingreso') se.offset = difMeses(se.desde, ymDe(rec.fecha)||se.desde); // p. ej. llega el 30 pero aplica al mes siguiente
  if(rec.rateMXN) se.rateMXN = rec.rateMXN; // para meses anteriores que se rellenan después
  if(extra){ if(extra.cat) se.cat = extra.cat; if(extra.subId) se.subId = extra.subId; if(extra.persona) se.persona = extra.persona; }
  return se;
}
// Convierte un registro recién guardado en el primer mes de una serie.
function hacerRecurrente(rec, tipo, extra, hasta){
  const se = serieNueva(tipo, rec, extra);
  if(hasta && hasta>=se.desde) se.hasta = hasta;
  state.series.push(se);
  rec.serieId = se.id; rec.serieYM = se.desde;
  generarRecurrentes();
  return se;
}
function serieDe(rec){ return rec && rec.serieId ? (state.series||[]).find(x=>x.id===rec.serieId) : null; }
// Dónde viven los registros de cada tipo de serie.
function registrosTipo(se){
  if(se.tipo==='ingreso') return [state.ingresos];
  if(se.tipo==='gasto') return [...state.subcats.map(x=>x.gastos), state.gustosGastos];
  if(se.tipo==='efectivo') return [state.efectivoMovimientos];
  if(se.tipo==='personal') return se.persona && state.finanzas[se.persona] ? [state.finanzas[se.persona].gastos] : [];
  if(se.tipo==='cobro') return [state.porCobrar];
  if(se.tipo==='proyeccion') return [state.deudasProyectadas];
  return [];
}
function registrosDeSerie(se){
  const out = [];
  registrosTipo(se).forEach(arr=>arr.forEach(r=>{ if(r.serieId===se.id) out.push(r); }));
  return out;
}
function quitarRegistrosDeSerie(se, pred){
  registrosTipo(se).forEach(arr=>{
    for(let i=arr.length-1;i>=0;i--){ if(arr[i].serieId===se.id && pred(arr[i])) arr.splice(i,1); }
  });
}
function fechaOcurrencia(se, ym){
  return se.tipo==='ingreso' ? diaEnMes(ymMas(ym, se.offset||0), se.dia) : diaEnMes(ym, se.dia);
}
// Gastos: el día que toca. Ingresos, cobros y proyecciones: al empezar su mes.
function yaTocaOcurrencia(se, ym){
  if(se.tipo==='ingreso' && (se.plantilla||{}).destino && se.plantilla.destino!=='bote') return fechaOcurrencia(se, ym) <= todayISO(); // débito/efectivo: cuando llega
  if(se.tipo==='ingreso' || se.tipo==='cobro' || se.tipo==='proyeccion') return ym <= mesActual();
  return fechaOcurrencia(se, ym) <= todayISO();
}
function crearOcurrencia(se, ym){
  const p = JSON.parse(JSON.stringify(se.plantilla||{}));
  const fecha = fechaOcurrencia(se, ym);
  const base = {...p, id:uid(), fecha, serieId:se.id, serieYM:ym};
  const rate = ym < mesActual() && se.rateMXN ? se.rateMXN : null; // meses pasados: tipo de cambio de cuando se registró
  if(se.tipo==='ingreso'){
    Object.assign(base, {mes: ym, recurrente:false}, stampRates(Number(p.montoBruto)||0, p.moneda||'MXN', rate));
    state.ingresos.push(base);
  } else {
    Object.assign(base, stampRates(Number(p.monto)||0, p.moneda||'MXN', rate));
    if(se.tipo==='gasto'){
      if(se.cat==='gustos') state.gustosGastos.push(base);
      else { const sub = state.subcats.find(x=>x.id===se.subId) || state.subcats[0]; if(!sub) return null; sub.gastos.push(base); }
    } else if(se.tipo==='efectivo'){ base.tipo='gasto'; state.efectivoMovimientos.push(base); }
    else if(se.tipo==='personal'){ if(state.finanzas[se.persona]) state.finanzas[se.persona].gastos.push(base); }
    else if(se.tipo==='cobro'){ base.estado='pendiente'; state.porCobrar.push(base); }
    else if(se.tipo==='proyeccion'){ base.estado='pendiente'; state.deudasProyectadas.push(base); }
  }
  return base;
}
// Crea los meses que ya tocan y todavía no existen. Idempotente: si el otro
// teléfono ya lo creó (sincronización), no se duplica.
function generarRecurrentes(){
  let creados = 0;
  const limite = mesActual();
  (state.series||[]).forEach(se=>{
    if(!se.desde) return;
    const fin = se.hasta && se.hasta<limite ? se.hasta : limite;
    if(se.desde>fin) return;
    const existentes = new Set(registrosDeSerie(se).map(r=>r.serieYM));
    mesesEntre(se.desde, fin).forEach(ym=>{
      if(existentes.has(ym) || (se.omitidos||[]).includes(ym) || !yaTocaOcurrencia(se, ym)) return;
      if(crearOcurrencia(se, ym)) creados++;
    });
  });
  return creados;
}
// Meses futuros de una serie que todavía no existen (para proyecciones).
function proximasOcurrencias(se, meses){
  const out = [];
  const ini = ymMas(mesActual(), 1);
  const finMax = ymMas(mesActual(), meses||12);
  const fin = se.hasta && se.hasta<finMax ? se.hasta : finMax;
  const desde = se.desde>ini ? se.desde : ini;
  if(desde>fin) return out;
  const existentes = new Set(registrosDeSerie(se).map(r=>r.serieYM));
  mesesEntre(desde, fin).forEach(ym=>{
    if(existentes.has(ym) || (se.omitidos||[]).includes(ym)) return;
    const p = se.plantilla||{};
    const monto = Number(se.tipo==='ingreso'?p.montoBruto:p.monto)||0;
    out.push({...p, virtual:true, serieId:se.id, serieYM:ym, fecha:fechaOcurrencia(se, ym), monto, moneda:p.moneda||'MXN', montoMXN: toMXN(monto, p.moneda||'MXN'), estado:'pendiente'});
  });
  return out;
}
// Borrar un mes de una serie: 'solo' (solo este mes), 'siguientes' (este y
// los que siguen: la serie termina el mes anterior) o 'toda'.
function aplicarBorradoSerie(se, ym, alcance){
  if(!se) return;
  if(alcance==='toda'){
    quitarRegistrosDeSerie(se, ()=>true);
    state.series = state.series.filter(x=>x.id!==se.id);
  } else if(alcance==='siguientes'){
    quitarRegistrosDeSerie(se, r=>(r.serieYM||'')>=ym);
    se.hasta = ymMas(ym,-1);
    if(se.hasta < se.desde && registrosDeSerie(se).length===0) state.series = state.series.filter(x=>x.id!==se.id);
  } else {
    quitarRegistrosDeSerie(se, r=>r.serieYM===ym);
    if(!se.omitidos.includes(ym)) se.omitidos.push(ym);
  }
}
// Tras guardar un registro desde un formulario: crea, ajusta o termina su
// serie según lo que se eligió en el bloque "Se repite cada mes".
function guardarRecurrencia(prefix, rec, tipo, extra){
  const chk = document.getElementById(prefix+'Recurrente');
  if(!chk) return;
  const hastaEl = document.getElementById(prefix+'Hasta');
  const hasta = hastaEl && hastaEl.value ? hastaEl.value : null;
  const alcanceEl = document.getElementById(prefix+'Alcance');
  const alcance = alcanceEl ? alcanceEl.value : 'solo';
  const se = serieDe(rec);
  if(se){
    const ym = rec.serieYM;
    if(!chk.checked){ // deja de repetirse: termina con este mes
      quitarRegistrosDeSerie(se, r=>(r.serieYM||'')>ym);
      se.hasta = ym;
      return;
    }
    se.hasta = hasta ? (hasta<ym ? ym : hasta) : null; // (checarHasta ya avisó si era anterior)
    if(se.hasta) quitarRegistrosDeSerie(se, r=>(r.serieYM||'')>se.hasta);
    if(alcance==='siguientes'){
      const fechaEsperada = fechaOcurrencia(se, ym);
      se.plantilla = plantillaDe(rec);
      if(rec.fecha !== fechaEsperada){ // solo si de verdad cambiaste la fecha
        se.dia = diaDe(rec.fecha);
        if(tipo==='ingreso') se.offset = difMeses(ym, ymDe(rec.fecha)||ym);
      }
      if(rec.rateMXN) se.rateMXN = rec.rateMXN;
      if(extra){ if(extra.cat) se.cat = extra.cat; if(extra.subId!==undefined) se.subId = extra.subId; }
      // los meses siguientes que ya existían toman los datos nuevos
      registrosDeSerie(se).filter(r=>(r.serieYM||'')>ym && r!==rec).forEach(r=>{
        const keep = {id:r.id, fecha:fechaOcurrencia(se, r.serieYM), serieId:r.serieId, serieYM:r.serieYM, mes:r.mes, estado:r.estado, fechaCobro:r.fechaCobro, fechaPago:r.fechaPago, tipo:r.tipo};
        Object.keys(r).forEach(k=>{ if(!(k in keep)) delete r[k]; });
        Object.assign(r, JSON.parse(JSON.stringify(se.plantilla)), keep);
        const monto = Number(tipo==='ingreso'?r.montoBruto:r.monto)||0;
        Object.assign(r, stampRates(monto, r.moneda||'MXN', rec.rateMXN||null));
        Object.keys(keep).forEach(k=>{ if(keep[k]===undefined) delete r[k]; });
      });
      if(tipo==='gasto'){ // si cambió de subcategoría/categoría, los meses siguientes se mudan también
        const destino = se.cat==='gustos' ? state.gustosGastos : ((state.subcats.find(x=>x.id===se.subId)||{}).gastos);
        if(destino){
          registrosDeSerie(se).filter(r=>(r.serieYM||'')>ym && r!==rec).forEach(r=>{
            [...state.subcats.map(x=>x.gastos), state.gustosGastos].forEach(arr=>{ const i = arr.indexOf(r); if(i>=0 && arr!==destino) arr.splice(i,1); });
            if(!destino.includes(r)) destino.push(r);
          });
        }
      }
    }
    return;
  }
  if(chk.checked) hacerRecurrente(rec, tipo, extra, hasta);
}
// Bloque de formulario "Se repite cada mes" (mismo en todos lados).
// Antes de guardar: el último mes no puede ser anterior al mes del registro.
function checarHasta(prefix, existing, ymNuevo){
  const chk = document.getElementById(prefix+'Recurrente');
  const h = document.getElementById(prefix+'Hasta');
  if(!chk || !chk.checked || !h || !h.value) return true;
  const ref = existing && existing.serieId ? existing.serieYM : ymNuevo;
  if(h.value < ref){ alert('El último mes no puede ser antes de '+nombreMesLargo(ref).toLowerCase()+'.'); return false; }
  return true;
}
function renderRecurrenciaField(prefix, existing, tipo){
  const se = serieDe(existing);

  if(hasta && difMeses(base,hasta)>24) opts.push(`<option value="${hasta}" selected>${nombreMesLargo(hasta)}</option>`);
  const cuando = (tipo==='ingreso'||tipo==='cobro'||tipo==='proyeccion') ? 'al empezar cada mes' : 'el mismo día de cada mes';

      <div class="field"><label>¿A qué aplican los cambios?</label><select id="${prefix}Alcance"><option value="solo">Solo a este mes</option><option value="siguientes">A este mes y los siguientes</option></select></div>` :
      `<div class="small-note" style="margin-bottom:8px;">Se registra solo ${cuando}, como un movimiento aparte que puedes editar o borrar sin tocar los demás.</div>`}
      <div class="field" style="margin-bottom:4px;"><label>Último mes (opcional)</label><select id="${prefix}Hasta">${opts.join('')}</select></div>
      ${se ? '<div class="small-note">Si quitas la palomita, la serie se detiene después de este mes (lo anterior se queda).</div>' : ''}
