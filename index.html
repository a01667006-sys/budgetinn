    document.getElementById('ahorroAutoMontoWrap').style.display = ingAhorroAuto.checked ? '' : 'none';
  });
  const ingMonedaSel = document.getElementById('ingMoneda');
  if(ingMonedaSel) ingMonedaSel.addEventListener('change', ()=>{
    const wrap = document.getElementById('ingRateWrap'); const rateInput = document.getElementById('ingRate');
    if(!wrap||!rateInput) return;
    if(ingMonedaSel.value==='MXN'){ wrap.style.display='none'; } else { wrap.style.display=''; rateInput.value = rateSnapshotFor(ingMonedaSel.value); }
  });

  // finanzas personales
  const pmMonedaSel = document.getElementById('pmMoneda');
  if(pmMonedaSel) pmMonedaSel.addEventListener('change', ()=>{
    const wrap = document.getElementById('pmRateWrap'); const rateInput = document.getElementById('pmRate');
    if(!wrap||!rateInput) return;
    if(pmMonedaSel.value==='MXN'){ wrap.style.display='none'; } else { wrap.style.display=''; rateInput.value = rateSnapshotFor(pmMonedaSel.value); }
  });
  const doPersonalMov = document.getElementById('doPersonalMov');
  if(doPersonalMov) doPersonalMov.addEventListener('click', ()=>{
    const persona = document.getElementById('pmPersona').value;
    const tipo = document.getElementById('pmTipo').value;
    const monto = Number(document.getElementById('pmMonto').value||0);
    if(monto<=0){ alert('Ingresa un monto válido.'); return; }
    const moneda = document.getElementById('pmMoneda').value;
    const fecha = document.getElementById('pmFecha').value||todayISO();
    const nota = document.getElementById('pmNota').value;
    const rateInput = document.getElementById('pmRate');
    const stamp = stampRates(monto, moneda, rateInput?rateInput.value:null);
    const key = tipo==='ganancia' ? 'ganancias' : 'gastos';
    const pmCuentaEl = document.getElementById('pmCuenta');
    const cuenta = pmCuentaEl && pmCuentaEl.value==='credito' ? 'credito' : 'debito';
    const editId = document.getElementById('pmEditRef').value;
    if(tipo==='gasto' && !checarHasta('pm', editId ? state.finanzas[persona][key].find(m=>m.id===editId) : null, ymDe(fecha))) return;
    if(editId){
      const existing = state.finanzas[persona][key].find(m=>m.id===editId);
      if(existing){ Object.assign(existing, {monto, moneda, fecha, nota, ...stamp}, tipo==='gasto'?{cuenta}:{}); if(tipo==='gasto') guardarRecurrencia('pm', existing, 'personal', {persona}); }
      persist(); closeSheet(); render();
      return;
    }
    const mov = {id:uid(), monto, moneda, fecha, nota, ...stamp, ...(tipo==='gasto'?{cuenta}:{})};
    state.finanzas[persona][key].push(mov);
    if(tipo==='gasto') guardarRecurrencia('pm', mov, 'personal', {persona});
    persist(); closeSheet(); render();
  });

  const ingDestinoSel = document.getElementById('ingDestino');
  if(ingDestinoSel) ingDestinoSel.addEventListener('change', ()=>{
    const n = document.getElementById('ingDestinoNota'); if(n) n.textContent = notaDestinoIngreso(ingDestinoSel.value);
    const mw = document.getElementById('ingMesWrap'); if(mw) mw.style.display = ingDestinoSel.value==='bote' ? '' : 'none';
  });
  const ingMesSel = document.getElementById('ingMes');
  if(ingMesSel) ingMesSel.addEventListener('change', ()=>{ document.getElementById('ingMesTocado').value='1'; });
  const ingFechaEl = document.getElementById('ingFecha');
  if(ingFechaEl && ingMesSel) ingFechaEl.addEventListener('change', ()=>{
    if(document.getElementById('ingMesTocado').value) return;
    const ym = ymDe(ingFechaEl.value); if(!ym) return;
    if(![...ingMesSel.options].some(o=>o.value===ym)) ingMesSel.insertAdjacentHTML('beforeend', `<option value="${ym}">${nombreMesLargo(ym)}</option>`);
    ingMesSel.value = ym;
  });
  // pago de tarjeta de crédito
  const doPagoTarjeta = document.getElementById('doPagoTarjeta');
  if(doPagoTarjeta) doPagoTarjeta.addEventListener('click', ()=>{
    const persona = document.getElementById('ptPersona').value;
    const monto = Number(document.getElementById('ptMonto').value||0);
    if(monto<=0){ alert('Ingresa un monto válido.'); return; }
    const moneda = document.getElementById('ptMoneda').value;
    const fecha = document.getElementById('ptFecha').value||todayISO();
    const desde = document.getElementById('ptDesde').value||'otra';
    const notaLibre = document.getElementById('ptNota').value.trim();
    const rateInput = document.getElementById('ptRate');
    const stamp = stampRates(monto, moneda, rateInput?rateInput.value:null);
    const nota = 'Pago tarjeta de crédito · desde ' + labelDesdePagoTarjeta(desde, persona) + (notaLibre?(' · '+notaLibre):'');
    const campos = {persona, monto, moneda, fecha, desde, nota, notaLibre, ...stamp};
    const editId = document.getElementById('ptEditRef').value;
    if(!Array.isArray(state.pagosTarjeta)) state.pagosTarjeta = [];
    if(editId){ const ex = state.pagosTarjeta.find(p=>p.id===editId); if(ex) Object.assign(ex, campos); }
    else state.pagosTarjeta.push({id:uid(), ...campos});
    persist(); closeSheet(); render();
  });
  const ptMonedaSel = document.getElementById('ptMoneda');
  if(ptMonedaSel) ptMonedaSel.addEventListener('change', ()=>{
    const wrap = document.getElementById('ptRateWrap'); const rateInput = document.getElementById('ptRate');
    if(!wrap||!rateInput) return;
    if(ptMonedaSel.value==='MXN'){ wrap.style.display='none'; } else { wrap.style.display=''; rateInput.value = rateSnapshotFor(ptMonedaSel.value); }
  });
  wireHistRate('pt');
  // Me deben / deuda a futuro
  const doPorCobrar = document.getElementById('doPorCobrar');
  if(doPorCobrar) doPorCobrar.addEventListener('click', ()=>{
    const lista = document.getElementById('pcLista').value;
    const persona = document.getElementById('pcPersona').value;
    const nombre = document.getElementById('pcNombre').value.trim();
    if(!nombre){ alert(lista==='cobro'?'Escribe quién te debe.':'Escribe a quién le vas a deber.'); return; }
    const monto = Number(document.getElementById('pcMonto').value||0);
    if(monto<=0){ alert('Ingresa un monto válido.'); return; }
    const moneda = document.getElementById('pcMoneda').value;
    const fecha = document.getElementById('pcFecha').value||todayISO();
    const concepto = document.getElementById('pcConcepto').value.trim();
    const rateInput = document.getElementById('pcRate');
    const stamp = stampRates(monto, moneda, rateInput?rateInput.value:null);
    const hecho = document.getElementById('pcHecho').checked;
    const estadoHecho = lista==='cobro' ? 'cobrado' : 'pagado';
    const arr = listaPC(lista);
    const editId = document.getElementById('pcEditRef').value;
    if(!checarHasta('pc', editId ? arr.find(r=>r.id===editId) : null, ymDe(fecha))) return;
    let rec = editId ? arr.find(r=>r.id===editId) : null;
    if(rec){
      const antes = rec.estado;
      Object.assign(rec, {persona, nombre, concepto, monto, moneda, fecha, ...stamp});
      if(hecho && antes!==estadoHecho){ rec.estado = estadoHecho; if(lista==='cobro') rec.fechaCobro=todayISO(); else rec.fechaPago=todayISO(); }
      if(!hecho){ rec.estado='pendiente'; delete rec.fechaCobro; delete rec.fechaPago; }
    } else {
      rec = {id:uid(), persona, nombre, concepto, monto, moneda, fecha, estado: hecho?estadoHecho:'pendiente', ...stamp};
      if(hecho){ if(lista==='cobro') rec.fechaCobro=todayISO(); else rec.fechaPago=todayISO(); }
      arr.push(rec);
    }
    guardarRecurrencia('pc', rec, lista, {persona});
    persist(); closeSheet(); render();
  });
  const pcMonedaSel = document.getElementById('pcMoneda');
  if(pcMonedaSel) pcMonedaSel.addEventListener('change', ()=>{
    const wrap = document.getElementById('pcRateWrap'); const rateInput = document.getElementById('pcRate');
    if(!wrap||!rateInput) return;
    if(pcMonedaSel.value==='MXN'){ wrap.style.display='none'; } else { wrap.style.display=''; rateInput.value = rateSnapshotFor(pcMonedaSel.value); }
  });
  wireHistRate('pc');
  // pago a otra persona
  const doPagoOtro = document.getElementById('doPagoOtro');
  if(doPagoOtro) doPagoOtro.addEventListener('click', ()=>{
    const persona = document.getElementById('poPersona').value;
    const acreedor = document.getElementById('poAcreedor').value.trim();
    if(!acreedor){ alert('Escribe a quién le pagas.'); return; }
    const monto = Number(document.getElementById('poMonto').value||0);
    if(monto<=0){ alert('Ingresa un monto válido.'); return; }
    const moneda = document.getElementById('poMoneda').value;
    const fecha = document.getElementById('poFecha').value||todayISO();
    const desde = document.getElementById('poDesde').value||'otra';
    const notaLibre = document.getElementById('poNota').value.trim();
    const rateInput = document.getElementById('poRate');
    const stamp = stampRates(monto, moneda, rateInput?rateInput.value:null);
    const nota = 'Pago a '+acreedor+' · desde '+labelDesdePagoOtro(desde, persona)+(notaLibre?(' · '+notaLibre):'');
    const campos = {persona, acreedor, monto, moneda, fecha, desde, nota, notaLibre, ...stamp};
    const editId = document.getElementById('poEditRef').value;
    if(!Array.isArray(state.pagosOtros)) state.pagosOtros = [];
    if(editId){ const ex = state.pagosOtros.find(p=>p.id===editId); if(ex) Object.assign(ex, campos); }
    else state.pagosOtros.push({id:uid(), ...campos});
    persist(); closeSheet(); render();
  });
  const poMonedaSel = document.getElementById('poMoneda');
  if(poMonedaSel) poMonedaSel.addEventListener('change', ()=>{
    const wrap = document.getElementById('poRateWrap'); const rateInput = document.getElementById('poRate');
    if(!wrap||!rateInput) return;
    if(poMonedaSel.value==='MXN'){ wrap.style.display='none'; } else { wrap.style.display=''; rateInput.value = rateSnapshotFor(poMonedaSel.value); }
  });
  wireHistRate('po');
  const poDesdeSel = document.getElementById('poDesde');
  if(poDesdeSel) poDesdeSel.addEventListener('change', ()=>{ const n=document.getElementById('poDesdeNota'); if(n) n.textContent = notaDesdePagoOtro(poDesdeSel.value); });
  const ptDesdeSel = document.getElementById('ptDesde');
  if(ptDesdeSel) ptDesdeSel.addEventListener('change', ()=>{ const n=document.getElementById('ptDesdeNota'); if(n) n.textContent = notaDesdePagoTarjeta(ptDesdeSel.value); });

  const doIngreso = document.getElementById('doIngreso');
  if(doIngreso) doIngreso.addEventListener('click', ()=>{
    const persona = document.getElementById('ingPersona').value;
    const fuente = document.getElementById('ingFuente').value.trim()||'Ingreso';
    const montoBruto = Number(document.getElementById('ingMonto').value||0);
    if(montoBruto<=0){ alert('Ingresa un monto válido.'); return; }
    const moneda = document.getElementById('ingMoneda').value;
    const fecha = document.getElementById('ingFecha').value||todayISO();
    const ahorroAuto = document.getElementById('ingAhorroAuto').checked;
    const ahorroAutoMonto = Number(document.getElementById('ingAhorroMonto').value||0);
    const destino = (document.getElementById('ingDestino')||{}).value || 'bote';
    const mes = destino==='bote' ? ((document.getElementById('ingMes')||{}).value || ymDe(fecha)) : ymDe(fecha);
    const rateInput = document.getElementById('ingRate');
    const stamp = stampRates(montoBruto, moneda, rateInput?rateInput.value:null);
    const editId = document.getElementById('ingEditRef').value;
    if(!checarHasta('ing', editId ? state.ingresos.find(i=>i.id===editId) : null, destino==='bote' ? mes : ymDe(fecha))) return;
    if(editId){
      // Edición en el mismo registro. Como el saldo de ahorro se calcula en
      // vivo a partir de los ingresos (ver ahorroSaldoMXN), editar aquí
      // ajusta el ahorro solo, sin dejar depósitos huérfanos.
      const existing = state.ingresos.find(i=>i.id===editId);
      if(existing){ Object.assign(existing, {persona, fuente, montoBruto, moneda, fecha, mes, destino, ahorroAuto, ahorroAutoMonto, recurrente:false, ...stamp}); guardarRecurrencia('ing', existing, 'ingreso', null); }
      persist(); closeSheet(); render();
      return;
    }
    const ing = {id:uid(), persona, fuente, montoBruto, moneda, fecha, mes, destino, ahorroAuto, ahorroAutoMonto, recurrente:false, ...stamp};
    state.ingresos.push(ing);
    if(pcPendienteIngreso){ const c = (state.porCobrar||[]).find(r=>r.id===pcPendienteIngreso); if(c) c.ingresoId = ing.id; pcPendienteIngreso = null; }
    guardarRecurrencia('ing', ing, 'ingreso', null);
    persist(); closeSheet(); render();
  });
}

// (Los préstamos del Fondo a Generales ahora se calculan en vivo: prestamoFondoVivoMXN.)

render();
// Intenta traer el tipo de cambio real al abrir. Si no hay internet
// (Wifi débil en el camino, o el sandbox de Claude lo bloquea), la app
// se queda funcionando normal con el último valor guardado.
fetchLiveRates(false).then(ok=>{ if(ok) render(); });

// Si hay sincronización configurada, jala lo último de la nube al abrir
// (por si Isa/Jen guardaron algo desde el otro teléfono), y vuelve a
// intentar cada vez que el teléfono recupera conexión.
if(state.syncUrl){
  syncInicialListo = false;
  pullFromCloud(false).then(cambio=>{
    syncInicialListo = true;
    if(cambio) render();
    if(generadosSinSubir){ generadosSinSubir = false; programarSyncPush(); }
  });
}
window.addEventListener('online', ()=>{
  if(state.syncUrl) sincronizarAhora().then(()=>render());
});

// PWA: registra el service worker para que la app cargue sin internet
// una vez que ya la abriste al menos una vez (con conexión).
// Siempre revisa si hay una versión nueva publicada; si llega una, recarga
// una sola vez para mostrarla (así no se queda la versión vieja guardada).
if('serviceWorker' in navigator){
  const teniaVersionPrevia = !!navigator.serviceWorker.controller;
  let recargado = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!teniaVersionPrevia || recargado) return;
    recargado = true;
    Storage.save(state);
    location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
    }).catch(()=>{});
  });
}
</script>
