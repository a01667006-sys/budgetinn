    ${pend.length ? `<div class="small-note" style="margin:-4px 0 6px;">O marca los gastos que ${nombrePersona(deudora)} va a pagar. Puedes pagar solo una parte: el gasto sigue apareciendo con lo que falta.</div>` : ''}
    ${pend.length ? pend.map(i=>lineaItem(i, true)).join('') : (extraVer ? '' : `<div class="small-note">${nombrePersona(deudora)} no le debe nada a ${nombrePersona(ver)}. 🎉</div>`)}
    ${extraVer ? `<div class="exp-line nos-item"><span class="nos-chk"></span>${micoHtml(iconoMov({tipo:'pago-entre'}),'sm')}<div class="desc"><div class="n">Pagado de más por ${nombrePersona(ver)}</div><div class="d">${nombrePersona(ver)} le pagó más de lo que debía; ${nombrePersona(deudora)} se lo regresa</div></div><div class="amt gasto">${fmt(extraVer,'MXN')}</div></div>` : ''}
    ${(pend.length || extraVer) ? `<div class="det-actions" style="margin-top:12px;">
      <button class="btn btn-primary" id="nosPagarSel" ${selTotal>0?'':'disabled'}>Pagar lo marcado${selTotal>0?' · '+fmt(selTotal,'MXN'):''}</button>
      <button class="btn btn-outline" id="nosPagarTodo" data-deudora="${deudora}">Pagar todo · ${fmt(totalPend,'MXN')}</button>
    </div>` : ''}
    ${sald.length ? `<button class="link-quiet" id="nosVerSaldados" style="margin-top:10px;">${nosotrasSaldados?'Ocultar':'Ver'} saldados (${sald.length})</button>${nosotrasSaldados ? sald.map(i=>lineaItem(i,false)).join('') : ''}` : ''}
  </div>
  <div class="card">
    <div class="card-title"><h2>${ico('clock','icon-sm')} Historial completo</h2><span class="hint" data-open="pagoEntre" data-persona="${perfil}">+ pago</span></div>
    <input type="text" class="mov-search" id="nosBuscar" placeholder="Buscar por nombre o categoría..." value="${escHtml(nosotrasBusqueda)}">
    ${historial.length ? listaPorDia(historial.slice(0, nosHistLimite), x=> x.tipo==='item' ? `
      <div class="exp-line clickable" data-mov-open="gasto-generales|${x.i.id}|${x.i.subId}">

        <div class="desc"><div class="n">${escHtml(x.i.nota)}</div><div class="d">${escHtml(x.i.subNombre)} · ${nombrePersona(x.i.deudor)} le debe a ${nombrePersona(x.i.acreedor)}</div></div>
        <div class="amt ${x.i.saldado?'':'gasto'}">${fmt(x.i.mitad,'MXN')}${x.i.saldado?'<span class="est">saldado</span>':(x.i.pagado>0.005?`<span class="est">faltan ${fmt(x.i.restante,'MXN')}</span>`:'')}</div>
      </div>` : `
      <div class="exp-line clickable" data-mov-open="pago-entre|${x.p.id}|">
        ${micoHtml(iconoMov({tipo:'pago-entre'}),'sm')}
        <div class="desc"><div class="n">${escHtml(x.p.nota||'Pago entre nosotras')}</div><div class="d">${x.p.sale==='compensacion' ? 'compensación' : 'pago · de '+escHtml(cuentaPagoTxt(x.p.de, x.p.sale, x.p.ctaSale))+' a '+escHtml(cuentaPagoTxt(x.p.a, x.p.entra, x.p.ctaEntra))}${Array.isArray(x.p.aplica)&&x.p.aplica.length?' · '+x.p.aplica.length+' '+(x.p.aplica.length===1?'gasto':'gastos'):''}</div></div>
        <div class="amt ${x.p.sale==='compensacion'?'neutro':'income'}">${x.p.sale==='compensacion'?'↔ ':''}${fmt(x.p.monto, x.p.moneda||'MXN')}</div>
      </div>`) : emptyMini(q ? 'Nada coincide con esa búsqueda.' : 'Todavía no hay gastos compartidos ni pagos.', 'wallet')}
    ${historial.length > nosHistLimite ? `<button class="btn btn-outline btn-block" id="nosVerMas" style="margin-top:10px;">${ico('chevdown','icon-sm')} Ver más (${historial.length - nosHistLimite} más)</button>` : ''}
  </div>`;
}

  </div>
  ${canceladas.length ? `<div class="card"><div class="card-title"><h2>Canceladas</h2></div>${canceladas.map(linea).join('')}</div>` : ''}`;
}

    else { sub = {id:uid(), activa:true, avisosVistos:{}, creado:Date.now(), ...campos}; state.suscripciones.push(sub); }

  });

  if($('susBorrar')) $('susBorrar').addEventListener('click', ()=>{

    if(se){ quitarRegistrosDeSerie(se, r=>(r.fecha||'') > todayISO()); state.series = state.series.filter(x=>x.id!==se.id); }
    state.suscripciones = state.suscripciones.filter(x=>x.id!==ex.id);
    persist(); closeSheet(); render();
  });

/* ---------- ¿Con qué pago ahora? (orden de uso del dinero) ---------- */
function fuentesDinero(p){
  const efectivo = saldoEfectivoResumen(p).reduce((a,r)=>a+toMXN(r.saldo, r.moneda),0);
  const lista = [
    {k:'budget', nombre: nombreBudget(p)+' (50/50)', monto: miIngresoMXN(p) - miGastoBoteMXN(p), glyph:'bote', nota:'Tu mitad de lo compartido sale de aquí; la otra mitad del budget de '+(p==='isa'?'Jen':'Isa')+'.'},

    {k:'sobrante', nombre:'Sobrante de meses anteriores', monto: carryoverAcumuladoMXN(), glyph:'alcancia', nota:'Lo que se ha ido juntando.'},
    {k:'efectivo', nombre:'Efectivo', monto: efectivo, glyph:'billete', nota:'Tu efectivo (en pesos aprox.).'},
    {k:'personal', nombre:'Dinero personal (50/50)', monto: saldoDebitoMXN(p), glyph:'tarjeta', nota:'Tu tarjeta de débito.'},

  const mas = document.getElementById('tabsMas'); if(mas && bar) mas.addEventListener('click', ()=>{ bar.scrollBy ? bar.scrollBy({left:160, behavior:'smooth'}) : (bar.scrollLeft += 160); setTimeout(actualizarFlechaTabs, 350); });
  // Configuración: se guarda sola
  const autoCfg = ()=>{
    const m = document.getElementById('cfgMonto'), i = document.getElementById('cfgInicio'), f = document.getElementById('cfgFin');
    if(m) state.viajeConfig.montoDisponibleMXN = Number(m.value)||0;
    if(i) state.viajeConfig.fechaInicio = i.value||'';
    if(f) state.viajeConfig.fechaFin = f.value||'';
    persist(); render(); mostrarToast('Guardado.', 'ok');
  };
  ['cfgMonto','cfgInicio','cfgFin'].forEach(id=>{ const el = document.getElementById(id); if(el) el.addEventListener('change', autoCfg); });
  document.querySelectorAll('[data-rate-code]').forEach(el=>el.addEventListener('change', ()=>{ const v = Number(el.value); if(v>0){ state.rates[el.getAttribute('data-rate-code')] = v; persist(); mostrarToast('Tipo de cambio guardado.', 'ok'); } }));
  const pi = document.getElementById('primerIngreso'); if(pi) pi.addEventListener('change', ()=>{ if(pi.value){ state.primerIngresoOficial = pi.value; persist(); mostrarToast('Guardado.', 'ok'); } });
  wirePickers(document.getElementById('app'));
}

function wireSheetEvents(){

  document.querySelectorAll('[data-recuperar]').forEach(el=>{ el.addEventListener('click', ()=>{ recuperarDePapelera(el.getAttribute('data-recuperar')); if(document.getElementById('overlay')) openPapelera(); }); });

  const impArchBtn = document.getElementById('importArchivoBtn');
  if(impArchBtn) impArchBtn.addEventListener('click', ()=>{ const f = document.getElementById('importFile'); if(f) f.click(); });
  document.querySelectorAll('[data-borrar-alcance]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ref = JSON.parse(document.getElementById('borrarRef').value.replace(/&apos;/g,"'"));
      const alcance = el.getAttribute('data-borrar-alcance');
      closeSheet();
      if(ref.kind==='mov') deleteMovimiento(ref.tipo, ref.id, ref.extra, alcance);
      else if(ref.kind==='pc') borrarPorCobrar(ref.lista, ref.id, alcance);
    });
  });

  // Tipo de cambio histórico automático al cambiar la fecha, en toda hoja
  // que tenga moneda + fecha + tipo de cambio.
  ['gasto','con','pm','ing'].forEach(wireHistRate);
  ['gasto','cash','pm','ing','pc'].forEach(wireRecurrencia);

  // pct
  ['pctGen','pctGus','pctFon'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', updatePctSum);
  });
  const savePct = document.getElementById('savePct');
  if(savePct) savePct.addEventListener('click', ()=>{
    state.pct.generales = Number(document.getElementById('pctGen').value)||0;
    state.pct.gustos = Number(document.getElementById('pctGus').value)||0;
    state.pct.fondoGrande = Number(document.getElementById('pctFon').value)||0;
    persist(); closeSheet(); render();
  });

  // ahorro retiro
  const doRetiro = document.getElementById('doRetiro');
  if(doRetiro) doRetiro.addEventListener('click', ()=>{
    const monto = Number(document.getElementById('montoRetiro').value||0);
    if(monto<=0){ alert('Ingresa un monto válido.'); return; }
    const editIdEl = document.getElementById('retiroEditId');
    const editId = editIdEl ? editIdEl.value : '';
    const campos = {
      monto,
      motivo:document.getElementById('motivoRetiro').value,
      fecha:document.getElementById('fechaRetiro').value||todayISO(),
      nota:document.getElementById('notaRetiro').value
    };
    if(editId){
      const ex = state.ahorro.movimientos.find(m=>m.id===editId);
      if(ex) Object.assign(ex, campos);
    } else {
      state.ahorro.movimientos.push({id:uid(), tipo:'retiro', ...campos});
    }
    persist(); closeSheet(); render();
  });
  document.querySelectorAll('[data-edit-retiro]').forEach(el=>{
    el.addEventListener('click', ()=>{ const id=el.getAttribute('data-edit-retiro'); closeSheet(); openAhorro(id); });
  });
  document.querySelectorAll('[data-del-retiro]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.getAttribute('data-del-retiro');
      state.ahorro.movimientos = state.ahorro.movimientos.filter(m=>m.id!==id);
      persist(); closeSheet(); openAhorro();
    });
  });

  // gasto cat toggle
  const refrescarEstancia = ()=>{
    const wrap = document.getElementById('estanciaWrap'); if(!wrap) return;
    const catOn = document.querySelector('[data-gasto-cat].on');
    const subSelEl = document.getElementById('gastoSub');
    const sub = subSelEl ? state.subcats.find(x=>x.id===subSelEl.value) : null;
    const ver = (!catOn || catOn.getAttribute('data-gasto-cat')==='generales') && esSubAlojamiento(sub);
    wrap.style.display = ver ? '' : 'none';
    const desde = document.getElementById('gastoCubreDesde');
    if(ver && desde && !desde.value && !document.getElementById('gastoEditRef').value) desde.value = alojamientoPagadoHasta() || '';
  };
  document.querySelectorAll('[data-gasto-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('[data-gasto-cat]').forEach(b=>b.classList.remove('on'));
      el.classList.add('on');
      document.getElementById('subcatFieldWrap').style.display = el.getAttribute('data-gasto-cat')==='generales' ? '' : 'none';
      el.dataset.selected='true';
      refrescarEstancia();
    });
  });
  const gastoSubSel = document.getElementById('gastoSub');
  if(gastoSubSel) gastoSubSel.addEventListener('change', refrescarEstancia);
  // pagadoPor: botones + toggle de visibilidad según "¿a quién corresponde?"
  document.querySelectorAll('[data-pagadopor]').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('[data-pagadopor]').forEach(b=>b.classList.remove('on'));
      el.classList.add('on');
      const hidden = document.getElementById('gastoPagadoPor');
