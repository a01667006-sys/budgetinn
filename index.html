function wireRecurrencia(prefix){
  const chk = document.getElementById(prefix+'Recurrente');
  const wrap = document.getElementById(prefix+'RecWrap');
  if(chk && wrap && !chk.dataset.wired){ chk.dataset.wired='1'; chk.addEventListener('change', ()=>{ if(!chk.dataset.serie) wrap.style.display = chk.checked ? '' : 'none'; }); }
}
function gastoTotal(subOrList){ // suma de transacciones a su valor MXN congelado (todo el tiempo)
  return subOrList.reduce((acc,g)=> acc + mxnOf(g), 0);
}

/* ------------------------------------------------------------
   GASTOS POR MES / DÍA. Un pago de alojamiento con noches (entrada/salida)
   se reparte parejo por noche: 7 noches por $700 = $100 cada noche, en los
   días y meses de la estancia (no el día que se pagó).
   ------------------------------------------------------------ */
function esEstancia(g){ return !!(g && g.cubreDesde && g.cubreHasta && g.cubreHasta>g.cubreDesde); }
// Monto de un gasto que cae entre desdeISO y hastaISO (ambos inclusive).
function montoEnRangoMXN(g, desdeISO, hastaISO){
  if(esEstancia(g)){
    const ini = g.cubreDesde > desdeISO ? g.cubreDesde : desdeISO;
    const finExcl = sumarDiasISO(hastaISO, 1);
    const fin = g.cubreHasta < finExcl ? g.cubreHasta : finExcl;
    const n = nochesEntre(ini, fin);
    if(n<=0) return 0;
    return mxnOf(g) * n / nochesEntre(g.cubreDesde, g.cubreHasta);
  }
  return (g.fecha>=desdeISO && g.fecha<=hastaISO) ? mxnOf(g) : 0;
}
function finDeMesISO(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return ym+'-'+String(new Date(y, m, 0).getDate()).padStart(2,'0'); }
function montoEnMesMXN(g, ym){ return montoEnRangoMXN(g, ym+'-01', finDeMesISO(ym)); }
function montoEnDiaMXN(g, iso){ return montoEnRangoMXN(g, iso, iso); }
// Gastos que salen del bote (sin efectivo, débito, crédito ni Abuelo).
function cuentaEnBote(g){ return !fueraDelBote(g) && g.quien!=='abuelo'; }
function gastadoMesMXN(lista, ym){ ym = ym||mesActual(); return lista.filter(cuentaEnBote).reduce((a,g)=>a+montoEnMesMXN(g, ym),0); }
function subcatGastadoMesMXN(s, ym){ return gastadoMesMXN(s.gastos, ym); }
function generalesGastadoMXN(ym){
  return state.subcats.reduce((acc,s)=> acc + subcatGastadoMesMXN(s, ym), 0);
}
function gustosGastadoMXN(ym){
  return gastadoMesMXN(state.gustosGastos, ym);
}
// Tarjeta del Abuelo — meta mensual aparte, no resta del bote de Isa/Jen.
function abueloGastadoMXN(ym){
  ym = ym||mesActual();
  const todos = [...state.subcats.flatMap(s=>s.gastos), ...state.gustosGastos];
  return todos.filter(g=>g.quien==='abuelo').reduce((a,g)=>a+montoEnMesMXN(g, ym),0) + retirosEfectivoMXN('abuelo', null, ym);
}
function abueloMetaMXN(){ return state.abuelo.metaMXN||0; }
function abueloDisponibleMXN(){ return abueloMetaMXN() - abueloGastadoMXN(); }
function fondoGrandeConocidosMesActualMXN(){
  const ym = mesActual();
  return state.fondoGrande.conocidos.filter(c=> (c.fecha||'').slice(0,7)===ym)
    .reduce((acc,c)=> acc + mxnOf(c), 0);
}
function fondoGrandeSugeridoMXN(){
  if(state.fondoGrande.overrideManual!==null && state.fondoGrande.overrideManual!==undefined && state.fondoGrande.overrideManual!=='')
    return Number(state.fondoGrande.overrideManual);
  return fondoGrandeConocidosMesActualMXN();
}
// Préstamo del Fondo a Generales, calculado EN VIVO (ya no se guarda): si
// Generales se pasa este mes, el fondo cubre lo que pueda. Si el gasto se
// borra o edita, el préstamo se ajusta solo.
function prestamoFondoVivoMXN(){
  const falta = generalesGastadoMXN() - categoriaAsignadoMXN('generales');
  if(falta<=0) return 0;
  const gastadoFondo = state.fondoGrande.movimientos.filter(m=>m.tipo==='gasto' && ymDe(m.fecha)===mesActual()).reduce((a,m)=>a+m.monto,0);
  const dispFondo = fondoGrandeSugeridoMXN() - gastadoFondo;
  return Math.max(0, Math.min(dispFondo, falta));
}
function fondoGrandeMovsMXN(){
  const gastado = state.fondoGrande.movimientos.filter(m=>m.tipo==='gasto' && ymDe(m.fecha)===mesActual()).reduce((a,m)=>a+m.monto,0);
  return {gastado, prestado: prestamoFondoVivoMXN()};
}
function fondoGrandeDisponibleMXN(){
  const asignado = fondoGrandeSugeridoMXN();
  const {gastado, prestado} = fondoGrandeMovsMXN();
  return asignado - gastado - prestado;
}

function boteMXN(ym){ return boteTotalMXN(ym); }
// Pagos de la tarjeta de crédito hechos DESDE el bote (bajan el bote ese mes).
function pagosTarjetaDesdeBoteMXN(persona, ym){
  return (state.pagosTarjeta||[]).filter(p=>p.desde==='bote' && (!persona || p.persona===persona) && (!ym || ymDe(p.fecha)===ym)).reduce((a,p)=>a+mxnOf(p),0);
}
// Pagos a otras personas hechos DESDE el bote (bajan el bote ese mes).
function pagosOtrosDesdeBoteMXN(persona, ym){
  return (state.pagosOtros||[]).filter(p=>p.desde==='bote' && (!persona || p.persona===persona) && (!ym || ymDe(p.fecha)===ym)).reduce((a,p)=>a+mxnOf(p),0);
}
// Budget mamá / papá del mes: la parte de cada quien de los gastos del bote
// ("ambas" a la mitad), sus retiros a efectivo desde su tarjeta del bote,
// los pagos de su tarjeta de crédito desde el bote y los pagos entre ustedes
// que sacan dinero del bote (o lo meten).
function miGastoBoteMXN(persona, ym){
  ym = ym||mesActual();
  const todos = [...state.subcats.flatMap(s=>s.gastos), ...state.gustosGastos];
  const gastos = todos.filter(cuentaEnBote).reduce((acc,g)=>{
    const m = montoEnMesMXN(g, ym);
    if(g.quien===persona) return acc + m;
    if(g.quien==='ambas') return acc + m/2;
    return acc;
  },0);
  const pagosEntre = (state.pagosEntre||[]).filter(p=>ymDe(p.fecha)===ym).reduce((a,p)=>{
    const m = mxnOf(p);
    if(p.de===persona && p.sale==='bote' && p.entra!=='bote') a += m;   // sale del bote hacia fuera
    if(p.a===persona && p.entra==='bote' && p.sale!=='bote') a -= m;    // entra al bote desde fuera
    return a;
  },0);
  return gastos + retirosEfectivoMXN('bote', persona, ym) + pagosTarjetaDesdeBoteMXN(persona, ym) + pagosOtrosDesdeBoteMXN(persona, ym) + pagosEntre;
}
function miGastoBotePorSubcat(persona, ym){
  ym = ym||mesActual();
  return state.subcats.map(s=>{
    const monto = s.gastos.filter(cuentaEnBote).reduce((acc,g)=>{
      const m = montoEnMesMXN(g, ym);
      if(g.quien===persona) return acc + m;
      if(g.quien==='ambas') return acc + m/2;
      return acc;
    },0);
    return {subcat:s, monto};
  }).filter(x=>x.monto>0);
}
function miIngresoMXN(persona, ym){
  const {jenNetoMXN, isaNetoMXN} = ingresosNetos(ym);
  return persona==='jen' ? jenNetoMXN : isaNetoMXN;
}
// UN solo cálculo del bote por mes, que usan el saldo de arriba, el resumen
// por mes y el sobrante acumulado — así siempre cuadran.
function balanceMes(ym){
  ym = ym||mesActual();
  const ingreso = boteTotalMXN(ym);
  const gastoCategorias = generalesGastadoMXN(ym) + gustosGastadoMXN(ym);
  const retiros = retirosEfectivoMXN('bote', null, ym);
  const tarjetas = pagosTarjetaDesdeBoteMXN(null, ym);
  const otros = pagosOtrosDesdeBoteMXN(null, ym);
  const pagosEntre = -pagosEntreBoteNetoMXN(ym); // salida neta del bote
  const gasto = gastoCategorias + retiros + tarjetas + otros + pagosEntre;
  return { ingreso, gasto, disp: ingreso - gasto, gastoCategorias, retiros, tarjetas, otros, pagosEntre };
}

/* ============================================================
   EFECTIVO — historial completo y multi-moneda.
   El saldo NO se guarda como número: se DERIVA en vivo de la bitácora
   state.efectivoMovimientos (retiros de tarjeta +, gastos en efectivo −,
   ajustes manuales +) MÁS los gastos normales pagados en efectivo (que
   restan del efectivo de quien físicamente lo puso). Así, editar o borrar
   cualquier movimiento recalcula el saldo solo, sin números huérfanos.
   ============================================================ */
// Quién puso físicamente el dinero de un gasto (para el efectivo): si es
// compartido, quien lo puso (pagadoPor); si no, quien.
// Gastos que NO salen del bote: los pagados en efectivo o con dinero
// personal (cada uno resta de su propio saldo, no del presupuesto del bote).
function fueraDelBote(g){ return g.pagadoCon==='efectivo' || g.pagadoCon==='debito' || g.pagadoCon==='credito' || g.pagadoCon==='personal' || g.pagadoCon==='otro'; }
function pagadorFisico(g){
  if(g.quien==='ambas') return g.pagadoPor || 'jen';
  return g.quien;
}
function saldoEfectivo(persona, moneda){
  let s = 0;
  (state.efectivoMovimientos||[]).forEach(m=>{
    if(m.persona!==persona || m.moneda!==moneda) return;
    if(m.tipo==='gasto') s -= Number(m.monto)||0;
    else s += Number(m.monto)||0; // retiro / ajuste
  });
  // gastos normales de categorías pagados en efectivo
  const cats = [...state.subcats.flatMap(x=>x.gastos), ...state.gustosGastos];
  cats.forEach(g=>{
    if(g.pagadoCon!=='efectivo') return;
    if((g.moneda||'EUR')!==moneda) return;
    if(g.quien==='abuelo') return;
    if(pagadorFisico(g)===persona) s -= Number(g.monto)||0;
  });
  // pagos entre nosotras en efectivo (en su propia moneda)
  (state.pagosEntre||[]).forEach(p=>{
    if((p.moneda||'MXN')!==moneda) return;
    if(p.a===persona && p.entra==='efectivo') s += Number(p.monto)||0;
    if(p.de===persona && p.sale==='efectivo') s -= Number(p.monto)||0;
  });
  // pagos a otras personas hechos en efectivo (en su propia moneda)
  (state.pagosOtros||[]).forEach(p=>{
    if(p.persona===persona && p.desde==='efectivo' && (p.moneda||'MXN')===moneda) s -= Number(p.monto)||0;
  });
  // ingresos que llegan en efectivo (en su moneda, neto de ahorro), cada mes que aplicaron
  state.ingresos.forEach(i=>{
    if(i.persona!==persona || i.destino!=='efectivo' || (i.moneda||'MXN')!==moneda) return;
    const bruto = brutoIngresoMXN(i) || 1;
    const factorNeto = netoIngresoMXN(i)/bruto;
    s += (Number(i.montoBruto)||0) * factorNeto * ocurrenciasIngreso(i).length;
  });
  return s;
}
// Monedas en las que una persona tiene movimientos de efectivo (para
// mostrar todos sus saldos, no solo una moneda fija).
function monedasEfectivo(persona){
  const set = new Set();
  (state.efectivoMovimientos||[]).forEach(m=>{ if(m.persona===persona) set.add(m.moneda); });
  const cats = [...state.subcats.flatMap(x=>x.gastos), ...state.gustosGastos];
  cats.forEach(g=>{ if(g.pagadoCon==='efectivo' && g.quien!=='abuelo' && pagadorFisico(g)===persona) set.add(g.moneda||'EUR'); });
  (state.pagosEntre||[]).forEach(p=>{ if((p.a===persona && p.entra==='efectivo') || (p.de===persona && p.sale==='efectivo')) set.add(p.moneda||'MXN'); });
  state.ingresos.forEach(i=>{ if(i.persona===persona && i.destino==='efectivo' && ocurrenciasIngreso(i).length) set.add(i.moneda||'MXN'); });
  return [...set];
}
function saldoEfectivoResumen(persona){
  return monedasEfectivo(persona).map(moneda=>({moneda, saldo:saldoEfectivo(persona,moneda)}));
}
// Cuenta de donde salió un retiro a efectivo. Ese monto (en MXN congelado
// al tipo de cambio del día) SE RESTA de esa cuenta. Los gastos pagados
// después con ese efectivo solo bajan el efectivo — así no se cuenta doble.
// Retiros viejos sin cuenta = 'otra' (no restan de nada).
function cuentasRetiroPara(persona){
  const out = [['bote', nombreBudget(persona)+' (tarjeta del bote)'], ['abuelo','Tarjeta del Abuelo']];
  if(persona==='jen') out.push(['ahorro','Ahorro']);
  out.push(['debito','Tarjeta de débito'], ['otra','Otra / no registrada en la app']);
  return out;
}
function labelCuentaRetiro(cuenta, persona){
  const f = cuentasRetiroPara(persona||'jen').find(c=>c[0]===cuenta) || cuentasRetiroPara('jen').find(c=>c[0]===cuenta);
  return f ? f[1].replace(' (tarjeta del bote)','') : 'Otra';
}
function retirosEfectivoCuenta(cuenta, persona, ym){
  return (state.efectivoMovimientos||[]).filter(m=>m.tipo==='retiro' && m.cuenta===cuenta && (!persona || m.persona===persona) && (!ym || ymDe(m.fecha)===ym));
}
function retirosEfectivoMXN(cuenta, persona, ym){
  return retirosEfectivoCuenta(cuenta, persona, ym).reduce((a,m)=>a+mxnOf(m),0);
}

/* ============================================================
   DEUDAS ENTRE JEN E ISA — "quién le debe a quién"
   Un gasto compartido (quien==='ambas') lo consume mitad y mitad, pero
   una sola persona pone el dinero (pagadoPor). La otra le debe la mitad.
   Súper/Comida, Alojamiento y Transporte entre ciudades vienen marcados
   como compartidos por default, pero cualquier gasto marcado "ambas" con
   pagadoPor definido cuenta aquí, sin importar si se pagó con la tarjeta
   del bote, dinero personal o efectivo. Tarjeta del Abuelo: si el gasto es
   de ambas (repartoAbuelo='ambas'), Isa le debe la mitad a Jen; si es solo
   de Jen, no genera deuda.
   ============================================================ */
const SUBCATS_COMPARTIDAS_DEFAULT = ['Comida & Bebida', 'Alojamiento', 'Transporte entre ciudades'];
function esSubcatCompartidaDefault(nombre){ return SUBCATS_COMPARTIDAS_DEFAULT.includes(nombre); }
function deudasPendientes(){
  let jenLeDebeAIsa = 0, isaLeDebeAJen = 0;
  const detalle = [];
  const gastos = [
    ...state.subcats.flatMap(s=>s.gastos.map(g=>({...g, subNombre:s.nombre}))),
    ...state.gustosGastos.map(g=>({...g, subNombre:'Gustos'})),
  ];
  gastos.forEach(g=>{
    if(g.quien==='abuelo'){
      if(g.repartoAbuelo!=='ambas') return;
      const mitadAb = mxnOf(g)/2;
      if(mitadAb<=0) return;
      isaLeDebeAJen += mitadAb;
      detalle.push({ id:g.id, fecha:g.fecha, nota:g.nota||g.subNombre||'Gasto compartido', subNombre:g.subNombre, mitad:mitadAb, pagadoPor:'jen', viaAbuelo:true, deudor:'isa' });
      return;
    }
    if(g.quien!=='ambas') return;
    if(!g.pagadoPor || (g.pagadoPor!=='jen' && g.pagadoPor!=='isa')) return; // sin saber quién puso el dinero no se puede calcular
    const mitad = mxnOf(g)/2;
    if(mitad<=0) return;
    if(g.pagadoPor==='jen'){ isaLeDebeAJen += mitad; }
    else { jenLeDebeAIsa += mitad; }
    detalle.push({ id:g.id, fecha:g.fecha, nota:g.nota||g.subNombre||'Gasto compartido', subNombre:g.subNombre, mitad, pagadoPor:g.pagadoPor, deudor: g.pagadoPor==='jen'?'isa':'jen' });
  });
  // Pagos entre nosotras: lo que una ya le pagó a la otra baja su deuda.
  let pagadoJenAIsa = 0, pagadoIsaAJen = 0;
  (state.pagosEntre||[]).forEach(p=>{
    const m = mxnOf(p);
    if(p.de==='jen') pagadoJenAIsa += m; else pagadoIsaAJen += m;
    detalle.push({ id:p.id, esPago:true, fecha:p.fecha, nota:p.nota||'Pago entre nosotras', de:p.de, a:p.a, montoMXN:m, monto:p.monto, moneda:p.moneda });
  });
  const neto = (isaLeDebeAJen - pagadoIsaAJen) - (jenLeDebeAIsa - pagadoJenAIsa); // >0 → Isa le debe a Jen; <0 → Jen le debe a Isa
  detalle.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  return { jenLeDebeAIsa, isaLeDebeAJen, pagadoJenAIsa, pagadoIsaAJen, neto, detalle };
}
function nombrePersona(p){ return p==='isa' ? 'Isa' : 'Jen'; }
function otraPersona(p){ return p==='isa' ? 'jen' : 'isa'; }
// Cuentas de las que puede salir / a las que puede entrar un pago entre nosotras.
function cuentasPagoEntre(persona){
  return [['bote','Tarjeta del bote ('+nombreBudget(persona)+')'], ['debito','Tarjeta de débito'], ['efectivo','Efectivo'], ['otra','Otra / no registrada en la app']];
}
function labelCuentaPagoEntre(k, persona){
  const f = cuentasPagoEntre(persona).find(c=>c[0]===k); return f ? f[1] : 'Otra';
}
// Efecto neto de los pagos entre nosotras en el bote combinado: solo cambia
// cuando el dinero cruza la frontera del bote (sale del bote a personal/
// efectivo o al revés). De tarjeta del bote a tarjeta del bote = 0.
function pagosEntreBoteNetoMXN(ym){
  return (state.pagosEntre||[]).filter(p=>!ym || (p.fecha||'').slice(0,7)===ym).reduce((a,p)=>{
    const m = mxnOf(p);
    return a + (p.entra==='bote'?m:0) - (p.sale==='bote'?m:0);
  },0);
}
/* ------------------------------------------------------------
   MI DINERO APARTE: Tarjeta de débito y Tarjeta de crédito de cada una.
   (Lo que antes era "Dinero personal" es ahora la tarjeta de débito.)
   ------------------------------------------------------------ */
function esDebito(v){ return v==='debito' || v==='personal'; }
function gastosCategoria(){ return [...state.subcats.flatMap(x=>x.gastos), ...state.gustosGastos]; }
// Ingresos que llegan a una cuenta fuera del bote (débito/efectivo), neto de
// ahorro, contando cada mes que ya aplicó (recurrentes).
function ingresosFueraMXN(persona, destino){
  return state.ingresos.filter(i=>i.persona===persona && i.destino===destino)
    .reduce((a,i)=>a + netoIngresoMXN(i)*ocurrenciasIngreso(i).length, 0);
}
function saldoDebitoMXN(persona){
  const f = state.finanzas[persona];
  if(!f) return 0;
  const inicialMXN = Number(f.inicial)||0; // el inicial se guarda ya en MXN
  const ganancias = f.ganancias.reduce((a,g)=>a+mxnOf(g),0);
  const gastos = f.gastos.filter(g=>g.cuenta!=='credito').reduce((a,g)=>a+mxnOf(g),0);
  const cats = gastosCategoria().filter(g=>esDebito(g.pagadoCon) && g.quien!=='abuelo' && pagadorFisico(g)===persona).reduce((a,g)=>a+mxnOf(g),0);
  const pagosEntre = (state.pagosEntre||[]).reduce((a,p)=>{
    const m = mxnOf(p);
    if(p.a===persona && esDebito(p.entra)) a += m;
    if(p.de===persona && esDebito(p.sale)) a -= m;
    return a;
  },0);
  const pagosTarjeta = (state.pagosTarjeta||[]).filter(p=>p.persona===persona && p.desde==='debito').reduce((a,p)=>a+mxnOf(p),0);
  const pagosOtros = (state.pagosOtros||[]).filter(p=>p.persona===persona && p.desde==='debito').reduce((a,p)=>a+mxnOf(p),0);
  return inicialMXN + ganancias + ingresosFueraMXN(persona,'debito') - gastos - cats - retirosEfectivoMXN('debito', persona) + pagosEntre - pagosTarjeta - pagosOtros;
}
function saldoPersonalMXN(persona){ return saldoDebitoMXN(persona); }
function creditoUtilizadoMXN(persona){
  const f = state.finanzas[persona];
  if(!f) return 0;
  const gastos = f.gastos.filter(g=>g.cuenta==='credito').reduce((a,g)=>a+mxnOf(g),0);
  const cats = gastosCategoria().filter(g=>g.pagadoCon==='credito' && g.quien!=='abuelo' && pagadorFisico(g)===persona).reduce((a,g)=>a+mxnOf(g),0);
  const pagos = (state.pagosTarjeta||[]).filter(p=>p.persona===persona).reduce((a,p)=>a+mxnOf(p),0);
  return gastos + cats - pagos;
}
/* ------------------------------------------------------------
   LE DEBO A OTRAS PERSONAS: gastos que pagó alguien de fuera por Jen o
   por Isa (pagadoCon 'otro'). Cada una tiene sus propios "otros": la deuda
   es de quien puso el dinero (pagadorFisico). No toca el bote ni ninguna
   cuenta hasta que se paga (state.pagosOtros).
   ------------------------------------------------------------ */
function claveOtro(n){ return String(n||'').trim().toLowerCase() || 'otra persona'; }
function nombreOtroDe(g){ return String(g.otroNombre||'').trim() || 'Otra persona'; }
function deudasOtros(persona){
  const map = {};
  const fila = (nombre)=>{ const k = claveOtro(nombre); if(!map[k]) map[k] = {clave:k, nombre:String(nombre||'').trim()||'Otra persona', deuda:0, pagado:0, gastos:[], pagos:[]}; return map[k]; };
  gastosCategoria().forEach(g=>{
    if(g.pagadoCon!=='otro' || g.quien==='abuelo' || pagadorFisico(g)!==persona) return;
    const f = fila(nombreOtroDe(g)); f.deuda += mxnOf(g); f.gastos.push(g);
  });
  (state.pagosOtros||[]).forEach(p=>{
    if(p.persona!==persona) return;
    const f = fila(p.acreedor); f.pagado += mxnOf(p); f.pagos.push(p);
  });
  return Object.values(map).map(f=>({...f, pendiente: f.deuda - f.pagado})).sort((a,b)=>b.pendiente-a.pendiente || a.nombre.localeCompare(b.nombre));
}
function totalDeudasOtrosMXN(persona){ return deudasOtros(persona).reduce((a,f)=>a+Math.max(0,f.pendiente),0); }
function nombresOtros(persona){ return deudasOtros(persona).map(f=>f.nombre); }
function creditoLimiteMXN(persona){ const f=state.finanzas[persona]; return f && f.credito ? (Number(f.credito.limite)||0) : 0; }
function creditoDisponibleMXN(persona){ return creditoLimiteMXN(persona) - creditoUtilizadoMXN(persona); }
function categoriaAsignadoMXN(cat){
  const bote = boteMXN();
  if(cat==='fondoGrande') return fondoGrandeSugeridoMXN();
  return bote * (state.pct[cat]/100);
}
function categoriaGastadoMXN(cat){
  if(cat==='generales') return generalesGastadoMXN();
  if(cat==='gustos') return gustosGastadoMXN();
  if(cat==='fondoGrande'){ const {gastado} = fondoGrandeMovsMXN(); return gastado; }
  return 0;
}
function categoriaDisponibleMXN(cat){
  let disp = categoriaAsignadoMXN(cat) - categoriaGastadoMXN(cat);
  if(cat==='generales'){
    const {prestado} = fondoGrandeMovsMXN();
    disp += prestado;
  }
  return disp;
}

/* ============================================================
   MOTOR DE COSTO DE VIDA — el destino manda: reparte el costo de
   vida diario del lugar entre subcategorías según su "peso", y
   descuenta lo que el programa/alojamiento ya cubre.
   ============================================================ */
function coverageMultiplier(v){
  return {total:0, parcial:0.5, no:1}[v] ?? 1;
}
function coverageMultiplierForSub(sub, destino){
  if(!destino) return 1;
  if(!sub.coberturaKey) return 1;
  if(sub.coberturaKey==='comida'){
    const vals = ['desayuno','comida','cena'].map(k=>coverageMultiplier(destino.cobertura[k]));
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  return coverageMultiplier(destino.cobertura[sub.coberturaKey]);
}
// Qué tanto varía el costo real de cada subcategoría de un destino a otro.
// "alta": alojamiento/actividades/escapadas/transporte entre ciudades pueden
// duplicarse entre un destino económico en temporada baja y uno caro en
// temporada alta. "media": comida y transporte local varían, pero menos.
// "baja": eSIM, lavandería, salud, compras y trámites cuestan prácticamente
// lo mismo en cualquier país — no tiene sentido moverlos por destino.
const SENSIBILIDAD_POR_NOMBRE = {
  'Alojamiento':'alta', 'Actividades y tours':'alta', 'Escapadas de fin de semana':'alta', 'Transporte entre ciudades':'alta',
  'Comida & Bebida':'media', 'Transporte local':'media',
  'Compras / souvenirs':'baja', 'Salud y cuidado personal':'baja', 'Comunicación (eSIM/roaming)':'baja', 'Lavandería':'baja', 'Trámites y documentos':'baja',
};
const DAMP_POR_SENSIBILIDAD = { alta:1, media:0.5, baja:0 };
const NIVEL_COSTO_MULT = { economico:0.8, medio:1, alto:1.3 };
const ESTACIONALIDAD_MULT = { baja:0.9, media:1, alta:1.2 };
function sensibilidadSub(sub){ return SENSIBILIDAD_POR_NOMBRE[sub.nombre] || 'media'; }
// Peso base de la subcategoría ya ajustado por qué tan caro/temporada alta
// está el destino actual (antes de restar lo que el programa ya cubre).
function pesoBaseDestino(sub, destino){
  const base = Number(sub.peso)||0;
  if(!destino) return base;
  const damp = DAMP_POR_SENSIBILIDAD[sensibilidadSub(sub)];
  if(!damp) return base; // sensibilidad baja: nunca se mueve por destino
  const nivelMult = NIVEL_COSTO_MULT[destino.nivelCosto||'medio'] ?? 1;
  const estMult = ESTACIONALIDAD_MULT[destino.estacionalidad||'media'] ?? 1;
  return base * Math.pow(nivelMult * estMult, damp);
}
function totalPesoSubcats(destino){
  return state.subcats.reduce((a,s)=>a+pesoBaseDestino(s,destino),0) || 1;
}
function pesoAjustadoSub(sub, destino){
  return pesoBaseDestino(sub, destino) * coverageMultiplierForSub(sub, destino);
}
// Costo de vida diario del destino en MXN, ya descontando lo cubierto por el programa
function costoVidaAjustadoDia(destino){
  if(!destino || !destino.costoVidaDia) return 0;
  const totalPeso = totalPesoSubcats(destino);
  const totalAjustado = state.subcats.reduce((a,s)=>a+pesoAjustadoSub(s,destino),0);
  return destino.costoVidaDia * (totalAjustado/totalPeso);
}
// Cuánto le tocaría a una subcategoría específica del costo de vida del
// destino, en MXN (fallback cuando no hay costos de referencia propios para ella)
function estimadoAutoSubcat(sub, destino){
  if(!destino || !destino.costoVidaDia) return 0;
  const totalPeso = totalPesoSubcats(destino);
  const share = pesoBaseDestino(sub,destino)/totalPeso;
  const mult = coverageMultiplierForSub(sub, destino);
  return destino.costoVidaDia * share * mult * 30;
}
function sugerenciaGeneralesMensualMXN(){
  const destino = destinoActual();
  if(!destino) return null;
  return costoVidaAjustadoDia(destino) * 30;
}
function sugerenciaPctGenerales(){
  const bote = boteMXN();
  const sugerido = sugerenciaGeneralesMensualMXN();
  if(sugerido===null || bote<=0) return null;
  return Math.max(0, Math.min(95, (sugerido/bote)*100));
}
// Aplica la sugerencia automática al reparto (Generales↑, Gustos se ajusta
// con lo que sobra, Fondo de gastos grandes no se toca — se financia aparte
// con los "gastos grandes conocidos"). Solo corre si el modo automático
// está activo; si Jen/Isa lo editaron a mano, respeta su elección.
//
// OJO: antes, Gustos se calculaba como "lo que sobra" de Generales
// (100 - generales - fondoGrande). Eso disparaba números irreales (ej. 67%)
// en destinos donde el programa cubre casi todo Generales (como Split con
// IVHQ) — el hueco que dejaba Generales se le regalaba entero a Gustos en
// vez de quedarse como colchón. Ahora Gustos tiene un techo razonable (o
// respeta lo que ya tenía asignado si es más bajo) y el verdadero sobrante
// se queda en Generales como margen extra, no como gasto libre.
const TECHO_PCT_GUSTOS = 20;
function aplicarSugerenciaDestinoSiAplica(){
  if(!state.pctAuto) return;
  const sug = sugerenciaPctGenerales();
  if(sug===null) return;
  const genNecesario = Math.round(sug);
  const fondo = state.pct.fondoGrande;
  const espacioDisponible = Math.max(0, 100 - genNecesario - fondo);
  const gustosObjetivo = state.pct.gustos > 0 ? Math.min(state.pct.gustos, TECHO_PCT_GUSTOS) : TECHO_PCT_GUSTOS;
  const gustos = Math.max(3, Math.min(gustosObjetivo, espacioDisponible));
  state.pct.gustos = gustos;
  state.pct.generales = 100 - gustos - fondo;
}

function destinoActual(){ return state.destinos.find(d=>d.id===state.destinoActualId) || null; }
function programaCubreTodoActivo(){
  const d = destinoActual();
  if(!d) return false;
  const today = todayISO();
  if(today < d.fechaInicio || today > d.fechaFin) return false;
  return d.cobertura.alojamiento==='total' && d.cobertura.comida==='total';
}
function primerIngresoLlego(){
  return state.ingresos.length>0 || todayISO() >= state.primerIngresoOficial;
}

function diasEnMes(){
  const now=new Date(); return new Date(now.getFullYear(), now.getMonth()+1,0).getDate();
}
function diaDelMes(){ return new Date().getDate(); }
function diasRestantesMes(){ return diasEnMes()-diaDelMes()+1; }

function promedioDiario(cat){
  // Solo lo que ya pasó este mes (del 1ro a hoy): las noches de alojamiento
  // que aún no llegan no inflan el promedio.
  const ym = mesActual(), hoy = todayISO();
  const lista = cat==='generales' ? state.subcats.flatMap(s=>s.gastos) : (cat==='gustos' ? state.gustosGastos : null);
  const gastado = lista ? lista.filter(cuentaEnBote).reduce((a,g)=>a+montoEnRangoMXN(g, ym+'-01', hoy),0) : categoriaGastadoMXN(cat);
  const dias = Math.max(diaDelMes(),1);
  return gastado/dias;
}
function proyeccionDias(cat){
  const disp = categoriaDisponibleMXN(cat);
  const prom = promedioDiario(cat);
  if(prom<=0) return null;
  return Math.floor(disp/prom);
}

function subcatRebasada(s){

// Dibuja una dona con estilo consistente (relleno pastel + borde saturado a
// juego, sin leyenda nativa de Chart.js) y su propia leyenda de texto debajo
// con punto de color + nombre + %, para que el desglose sea siempre legible
// sin depender de tocar la gráfica.
function drawDonutConLeyenda({canvas, legendEl, labels, data, coloresBg, coloresFg, alertas}){
  const total = data.reduce((a,b)=>a+b,0) || 1;
  alertas = alertas || [];
  // Una subcategoría rebasada se pinta en rojo (--brick) en vez de su color.
  const bgFinal = coloresBg.map((c,i)=> alertas[i] ? '#FFE5E5' : c);
  const fgFinal = coloresFg.map((c,i)=> alertas[i] ? '#FF5A5F' : c);
  const chart = new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:bgFinal, borderColor:fgFinal, borderWidth:1.5 }] },
    options:{
      animation:false, responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ label:(ctx)=> `${ctx.label}: ${(ctx.parsed/total*100).toFixed(0)}%${alertas[ctx.dataIndex]?' · ya se pasó':''}` } } },
      cutout:'58%'
    }
  });
  if(legendEl){
    legendEl.innerHTML = labels.map((label,i)=>{
      const pct = data[i]/total*100;
      const alerta = alertas[i];
      return `<div class="row-between" style="padding:4px 0;font-size:12px;">
        <span style="display:flex;align-items:center;gap:7px;"><span style="width:9px;height:9px;border-radius:50%;background:${bgFinal[i]};border:1.5px solid ${fgFinal[i]};display:inline-block;"></span>${label}${alerta?` <span style="color:var(--brick);font-weight:700;">⚠ ya se pasó</span>`:''}</span>
        <b style="${alerta?'color:var(--brick);':''}">${pct.toFixed(0)}%</b>
      </div>`;
    }).join('');
  }
  return chart;
}
let chartSubcats = null;
function drawCharts(){
  if(typeof Chart === 'undefined') return; // sin internet / CDN bloqueado — la app sigue funcionando sin gráficas
  const canvasDia = document.getElementById('chartDiario');
  const canvasSub = document.getElementById('chartSubcats');
  if(!canvasDia && !canvasSub) return;
  try{

  // Cómo se reparte Generales entre sus subcategorías (alojamiento, comida,
  // transporte...). Si ya hay gasto real registrado, muestra lo gastado;
  // si todavía está todo en $0 (viaje recién arrancando), muestra el %
  // asignado por el motor de costo de vida — así la gráfica nunca sale
  // vacía ni engañosamente pareja. Las subcategorías que ya rebasaron su
  // presupuesto se pintan en rojo.
  if(canvasSub && state.subcats.length){
    const subGastados = state.subcats.map(s=>subcatGastadoMesMXN(s));
    const hayGastoSub = subGastados.some(v=>v>0);
    const subData = hayGastoSub ? subGastados : state.subcats.map(s=>pctSubcatDeGenerales(s));
    const alertas = state.subcats.map(s=>subcatRebasada(s));
    if(chartSubcats) chartSubcats.destroy();
    chartSubcats = drawDonutConLeyenda({
      canvas: canvasSub, legendEl: document.getElementById('subcatsLegend'),
      labels: state.subcats.map(s=>s.nombre), data: subData,
      coloresBg: state.subcats.map((s,i)=>colorFor(i)), coloresFg: state.subcats.map((s,i)=>colorFor(i)),
      alertas
    });
  }

  // últimos 14 días
  if(!canvasDia){ return; }
  const days = [];
  for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(isoLocal(d)); }
  const allG = [...state.subcats.flatMap(s=>s.gastos), ...state.gustosGastos].filter(cuentaEnBote);
  const porDia = days.map(day => allG.reduce((a,g)=>a+montoEnDiaMXN(g, day),0));
  const ejeColor = tema==='light' ? '#8a97b0' : '#6b7fa8';
  const gridColor = tema==='light' ? 'rgba(20,40,80,0.06)' : 'rgba(255,255,255,0.06)';
  const barColors = ['#00e5a0','#f5a623','#a78bfa','#ff5c6e','#4db8ff'];
  if(chartDiario) chartDiario.destroy();
  chartDiario = new Chart(canvasDia.getContext('2d'), {
    type:'bar',
    data:{
      labels: days.map(d=> d.slice(8,10)+'/'+d.slice(5,7)),
      datasets:[{ data: porDia, backgroundColor: porDia.map((_,i)=>barColors[i%barColors.length]), borderRadius:6, maxBarThickness:18 }]
    },
    options:{
      animation:false, responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{family:'Outfit, -apple-system, sans-serif', size:10}, color:ejeColor} },
        y:{ grid:{color:gridColor}, ticks:{font:{family:'Outfit, -apple-system, sans-serif', size:10}, color:ejeColor} }
      }
    }
  });
  }catch(e){ /* si el navegador no puede dibujar el canvas, seguimos sin romper la app */ }
}

// Lunes de la semana actual, en ISO — para el corte "esta semana".
function inicioDeSemanaISO(){
  const d = new Date();
  const dow = (d.getDay()+6)%7; // 0 = lunes
  d.setDate(d.getDate()-dow);
  return isoLocal(d);
}
// Cuánto de un gasto del bote cae en el periodo (el alojamiento, por noche).
function gastoEnPeriodoMXN(g, periodo){
  const today = todayISO();
  if(!cuentaEnBote(g)) return 0;
  if(periodo==='hoy') return montoEnDiaMXN(g, today);
  if(periodo==='semana') return montoEnRangoMXN(g, inicioDeSemanaISO(), today);
  if(periodo==='mes') return montoEnMesMXN(g, mesActual());
  return 0;
}
function gastoEnPeriodo(g, periodo){ return gastoEnPeriodoMXN(g, periodo) > 0; }
function statBoxToday(){
  const cats = ['generales','gustos'];
  const etiqueta = statPeriodo==='hoy' ? 'hoy' : (statPeriodo==='semana' ? 'esta semana' : 'este mes');
  return cats.map(c=>{
    const allG = c==='generales' ? state.subcats.flatMap(s=>s.gastos) : state.gustosGastos;
    const total = allG.reduce((a,g)=>a+gastoEnPeriodoMXN(g, statPeriodo),0);
    const prom = promedioDiario(c);
    return `<div class="stat-box">
      <div class="lbl">${c==='generales'?'Generales':'Gustos'} — ${etiqueta}</div>
      <div class="val" style="color:${total>0?'var(--brick)':'var(--ink)'}">${total>0?'−':''}${fmt(total,'MXN')}</div>
      <div class="small-note" style="margin-top:6px;">Promedio diario del mes: ${fmt(prom,'MXN')}</div>
    </div>`;
  }).join('');
}

function buildAlerts(){
  let html='';
  ['generales','gustos'].forEach(cat=>{
    const asignado = categoriaAsignadoMXN(cat);
    const gastado = categoriaGastadoMXN(cat);
    if(asignado<=0) return;
    const pct = gastado/asignado*100;
    const nombre = cat==='generales'?'Generales':'Gustos';
    if(pct>=100){
      html += `<div class="banner banner-bad">${ico('alert','icon-sm')}<div><b>${nombre} en déficit.</b> Ya se gastó ${fmt(gastado,'MXN')} de ${fmt(asignado,'MXN')} asignados este mes.</div></div>`;
    } else if(pct>=80 && diasRestantesMes()>=7){
      html += `<div class="banner banner-warn">${ico('alert','icon-sm')}<div><b>${nombre} al ${pct.toFixed(0)}%</b> y quedan ${diasRestantesMes()} días del mes. Vale la pena bajar el ritmo.</div></div>`;
    }
  });
  const fondoDisp = fondoGrandeDisponibleMXN();
  if(fondoDisp<0){
    html += `<div class="banner banner-bad">${ico('alert','icon-sm')}<div><b>Fondo de gastos grandes en negativo.</b> No hay saldo para prestar a Generales si hace falta.</div></div>`;
  }
  return html;

/* ============================================================
   ALOJAMIENTO — noches ya pagadas.
   Un gasto de Alojamiento puede decir qué noches cubre (entrada/salida).
   El monto se reparte parejo por noche en las fechas de la estancia (ver
   montoEnRangoMXN); además sirve para saber hasta cuándo ya está pagado,
   cuántas noches de cada mes ya no hay que pagar, y avisar antes de que se
   acabe. "cubreHasta" = día de salida (esa noche ya NO está pagada).
   ============================================================ */
function esSubAlojamiento(s){ return !!s && (s.coberturaKey==='alojamiento' || /alojamiento|hospedaje/i.test(s.nombre||'')); }
function sumarDiasISO(iso, n){
  const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10);
}
function nochesEntre(a, b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000); }
function estanciasPagadas(excluirId){
  return state.subcats.filter(esSubAlojamiento).flatMap(s=>s.gastos)
    .filter(g=>g.id!==excluirId && g.cubreDesde && g.cubreHasta && g.cubreHasta>g.cubreDesde);
}
function nocheCubierta(iso, estancias){
  return (estancias||estanciasPagadas()).some(g=>g.cubreDesde<=iso && iso<g.cubreHasta);
}
// Desde hoy (o la fecha dada), hasta qué día hay alojamiento pagado sin
// huecos. Devuelve la fecha de salida (primera noche NO pagada) o null si
// esta noche no está pagada.
function alojamientoPagadoHasta(desdeISO){
  const est = estanciasPagadas();
  let cursor = desdeISO || todayISO(), fin = null, cambio = true;
  while(cambio){
    cambio = false;
    est.forEach(g=>{ if(g.cubreDesde<=cursor && cursor<g.cubreHasta){ cursor = g.cubreHasta; fin = cursor; cambio = true; } });
  }
  return fin;
}
function proximaEstanciaDesde(desdeISO){
  const hoy = desdeISO || todayISO();
  const futuras = estanciasPagadas().filter(g=>g.cubreDesde>hoy).map(g=>g.cubreDesde).sort();
  return futuras[0] || null;
}
// Noches del mes 'YYYY-MM' que ya están pagadas.
function nochesPagadasMes(ym){
  const est = estanciasPagadas();
  const y=+ym.slice(0,4), m=+ym.slice(5,7);
  const dias = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let n=0;
  for(let d=1; d<=dias; d++){ if(nocheCubierta(ym+'-'+String(d).padStart(2,'0'), est)) n++; }
  return {pagadas:n, total:dias};
}
function nombreMes(ym){
  return new Date(ym+'-01T00:00:00').toLocaleDateString('es-MX',{month:'long'});
}
function siguienteYM(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'); }
function lineaEstancia(g){
  if(!g || !g.cubreDesde || !g.cubreHasta) return '';
  const n = nochesEntre(g.cubreDesde, g.cubreHasta);
  return ` · noches ${fmtDate(g.cubreDesde)} → ${fmtDate(g.cubreHasta)} (${n})`;
}
// Estado del alojamiento pagado: {nivel:'ok'|'warn'|'info', texto, meses:[...]}
// o null si no hay ninguna estancia registrada.
function estadoAlojamiento(){
  if(!estanciasPagadas().length) return null;
  const hoy = todayISO();
  const hasta = alojamientoPagadoHasta(hoy);
  const ym = hoy.slice(0,7), ym2 = siguienteYM(ym);
  const meses = [ym, ym2].map(x=>({ym:x, ...nochesPagadasMes(x)})).filter(x=>x.pagadas>0);
  if(hasta){
    const quedan = nochesEntre(hoy, hasta);
    const sig = proximaEstanciaDesde(hasta);
    if(quedan<=5 && !sig){
      return {nivel:'warn', texto:`Alojamiento pagado hasta el ${fmtDate(hasta)} — quedan ${quedan} ${quedan===1?'noche':'noches'} y aún no registran el siguiente.`, hasta, meses};
    }
    return {nivel:'ok', texto:`Alojamiento pagado hasta el ${fmtDate(hasta)} · ${quedan} ${quedan===1?'noche':'noches'} más sin pagar nada.`, hasta, meses};
  }
  const prox = proximaEstanciaDesde(hoy);
  if(prox) return {nivel:'info', texto:`Esta noche no hay alojamiento pagado registrado. El siguiente ya pagado empieza el ${fmtDate(prox)}.`, hasta:null, meses};
  return {nivel:'warn', texto:'No hay alojamiento pagado registrado para esta noche ni para después.', hasta:null, meses};
}
function renderEstadoAlojamiento(compacto){
  const e = estadoAlojamiento();
  if(!e) return '';
  // Si el destino actual cubre el alojamiento hoy, no alarmar.
  if(e.nivel!=='ok' && !e.hasta){ const d = destinoActual(); if(d && d.cobertura && d.cobertura.alojamiento==='total') return ''; }
  const color = e.nivel==='ok' ? 'var(--teal-deep)' : (e.nivel==='warn' ? 'var(--amber)' : 'var(--ink-soft)');

      ${mesesTxt ? `<div class="stat-grid" style="margin-top:12px;">${mesesTxt}</div>` : ''}
    </div>`;
}

const ILU_SUBCAT = {food:'comida', bed:'cama', bus:'bus', plane:'avion', ticket:'boleto', pin:'mapa', bag:'maleta', heart:'salud', wifi:'esim', shirt:'camisa', file:'pasaporte', suitcase:'maleta', cash:'billete', card:'tarjeta', piggy:'alcancia', banknote:'billete'};
function iconoSubcat(sub){ return {glyph: ILU_SUBCAT[sub.icono] || 'maleta'}; }
function iconoMov(m){
  const t = m.tipo;
  if(t==='gasto-generales'){
    const sub = state.subcats.find(x=>x.id===m.subId) || state.subcats.find(x=>x.nombre===m.subNombre);
    return sub ? iconoSubcat(sub) : {glyph:'maleta'};
  }
  if(t==='gasto-gustos') return {glyph:'coctel'};
  if(t==='gasto-efectivo' || t==='retiro-efectivo' || t==='ajuste-efectivo') return {glyph:'billete'};
  if(t==='ingreso' || t==='personal-ganancia') return {glyph:'billete'};
  if(t==='personal-gasto' || t==='pago-tarjeta') return {glyph:'tarjeta'};
  if(t==='pago-entre' || t==='pago-otro') return {glyph:'flechas'};
  if(t==='ahorro-retiro') return {glyph:'alcancia'};
  return {glyph:'tarjeta'};
}
function micoHtml(ic, extraCls){ return `<div class="mico ${extraCls||''}"><svg viewBox="0 0 64 64" aria-hidden="true">${ILU[ic.glyph]||ILU.maleta}</svg></div>`; }
// Nombre en chiquito junto a la fecha (quién hizo el movimiento).
function quienTxt(m){
  if(m.tipo==='pago-entre') return nombrePersona(m.persona)+' → '+nombrePersona(m.a);
  const q = m.quien || m.persona;
  const n = {jen:'Jen', isa:'Isa', ambas:'Ambas', abuelo:'Tarjeta del Abuelo'}[q] || '';
  return n ? ` · <span class="who-txt">${n}</span>` : '';
}
function renderExpLine(g, cat, subId){
  const mxn = mxnOf(g);
  const movTipo = cat==='generales' ? 'gasto-generales' : 'gasto-gustos';
  const movKey = [movTipo, g.id, subId||''].join('|');
  const ic = iconoMov({tipo:movTipo, subId});
  return `
  <div class="exp-line">
    ${micoHtml(ic)}
    <div class="desc"><div class="n">${escHtml(g.nota||'Gasto')}</div><div class="d">${fmtDate(g.fecha)}${quienTxt(g)}${lineaEstancia(g)}${g.serieId?' <span class="type-tag">cada mes</span>':''}</div></div>

/* ---------------- MOVIMIENTOS (unifica lo que antes eran las
   pestañas "Personal" y "Efectivo") ----------------
   Junta gastos, ingresos, efectivo y dinero aparte en una sola
   lista cronológica, filtrable por chips que cambian según el
   perfil activo — es solo una vista, ambas leen los mismos datos. */
function collectMovimientos(){
  const out = [];
  state.subcats.forEach(s=>{
    s.gastos.forEach(g=>{
      out.push({id:g.id, tipo:'gasto-generales', subId:s.id, subNombre:s.nombre, quien:g.quien, pagadoPor:g.pagadoPor, monto:g.monto, moneda:g.moneda, montoMXN:mxnOf(g), fecha:g.fecha, nota:g.nota, pagadoCon:g.pagadoCon, otroNombre:g.otroNombre, cubreDesde:g.cubreDesde, cubreHasta:g.cubreHasta, serieId:g.serieId});
    });
  });
  state.gustosGastos.forEach(g=>{
    out.push({id:g.id, tipo:'gasto-gustos', subId:null, subNombre:'Gustos', quien:g.quien, pagadoPor:g.pagadoPor, monto:g.monto, moneda:g.moneda, montoMXN:mxnOf(g), fecha:g.fecha, nota:g.nota, pagadoCon:g.pagadoCon, otroNombre:g.otroNombre, serieId:g.serieId});
  });
  (state.efectivoMovimientos||[]).forEach(m=>{
    if(m.tipo==='gasto'){
      out.push({id:m.id, tipo:'gasto-efectivo', subId:null, subNombre:'Efectivo', quien:m.persona, persona:m.persona, monto:m.monto, moneda:m.moneda, montoMXN:mxnOf(m), fecha:m.fecha, nota:m.nota, pagadoCon:'efectivo', serieId:m.serieId});
    } else if(m.tipo==='retiro'){
      out.push({id:m.id, tipo:'retiro-efectivo', subId:null, subNombre:'Retiro a efectivo', quien:m.persona, persona:m.persona, cuenta:m.cuenta||'otra', monto:m.monto, moneda:m.moneda, montoMXN:mxnOf(m), fecha:m.fecha, nota:m.nota});
    } else if(m.tipo==='ajuste'){
      out.push({id:m.id, tipo:'ajuste-efectivo', subId:null, subNombre:'Saldo inicial de efectivo', quien:m.persona, persona:m.persona, monto:m.monto, moneda:m.moneda, montoMXN:mxnOf(m), fecha:m.fecha, nota:m.nota});
    }
  });
  (state.pagosEntre||[]).forEach(p=>{
    out.push({id:p.id, tipo:'pago-entre', subId:null, subNombre:'Pago entre nosotras', quien:p.de, persona:p.de, a:p.a, sale:p.sale, entra:p.entra, monto:p.monto, moneda:p.moneda, montoMXN:mxnOf(p), fecha:p.fecha, nota:p.nota});
  });
  state.ingresos.forEach(i=>{
    out.push({id:i.id, tipo:'ingreso', subId:null, persona:i.persona, subNombre:i.fuente, quien:i.persona, monto:i.montoBruto, moneda:i.moneda, montoMXN: brutoIngresoMXN(i), netoMXN: netoIngresoMXN(i), destino:i.destino||'bote', mes:mesIngreso(i), recurrente:!!i.serieId, serieId:i.serieId, fecha:i.fecha, nota:i.fuente});
  });
  ['jen','isa'].forEach(p=>{
    state.finanzas[p].ganancias.forEach(m=>{
      out.push({id:m.id, tipo:'personal-ganancia', persona:p, subNombre:'Mi dinero aparte', quien:p, monto:m.monto, moneda:m.moneda, montoMXN:mxnOf(m), fecha:m.fecha, nota:m.nota});
    });
    state.finanzas[p].gastos.forEach(m=>{
      out.push({id:m.id, tipo:'personal-gasto', persona:p, subNombre:'Mi dinero aparte', quien:p, cuenta:m.cuenta==='credito'?'credito':'debito', monto:m.monto, moneda:m.moneda, montoMXN:mxnOf(m), fecha:m.fecha, nota:m.nota, serieId:m.serieId});
    });
  });
  (state.pagosTarjeta||[]).forEach(t=>{
    out.push({id:t.id, tipo:'pago-tarjeta', persona:t.persona, subNombre:'Pago de tarjeta de crédito', quien:t.persona, desde:t.desde, monto:t.monto, moneda:t.moneda, montoMXN:mxnOf(t), fecha:t.fecha, nota:t.nota});
  });
  (state.pagosOtros||[]).forEach(t=>{
    out.push({id:t.id, tipo:'pago-otro', persona:t.persona, subNombre:'Pago a '+(t.acreedor||'otra persona'), quien:t.persona, acreedor:t.acreedor, desde:t.desde, monto:t.monto, moneda:t.moneda, montoMXN:mxnOf(t), fecha:t.fecha, nota:t.nota});
  });
  state.ahorro.movimientos.filter(m=>m.tipo==='retiro').forEach(m=>{
    out.push({id:m.id, tipo:'ahorro-retiro', persona:'jen', subNombre:'Ahorro de emergencia', quien:'jen', monto:m.monto, moneda:'MXN', montoMXN:m.monto, fecha:m.fecha, nota:labelMotivo(m.motivo)+(m.nota?' · '+m.nota:'')});
  });
  return out;
}
function nombreBudget(persona){ return persona==='isa' ? 'Budget papá' : 'Budget mamá'; }
function chipsForPerfil(){
  if(perfil==='isa'){
    return [['todos','Todos'],['budget','Budget papá'],['efectivo','Mi efectivo'],['personales','Mi dinero aparte']];
  }
  return [['todos','Todos'],['budget','Budget mamá'],['abuelo','Tarjeta del Abuelo'],['efectivo','Mi efectivo'],['personales','Mi dinero aparte']];
}
// En qué tarjeta (débito/crédito) de una persona pega un movimiento, y con
// qué signo (+ entra / baja lo utilizado, − sale / sube lo utilizado).
function cuentasDeMov(m, persona){
  const out = [];
  const esCat = m.tipo==='gasto-generales' || m.tipo==='gasto-gustos';
  if(esCat && m.quien!=='abuelo' && pagadorFisico(m)===persona){
    if(esDebito(m.pagadoCon)) out.push({cuenta:'debito', signo:-1});
    if(m.pagadoCon==='credito') out.push({cuenta:'credito', signo:-1});
    if(m.pagadoCon==='otro') out.push({cuenta:'otro', signo:-1});
  }
  if(m.persona===persona){
    if(m.tipo==='personal-ganancia') out.push({cuenta:'debito', signo:+1});
    if(m.tipo==='personal-gasto') out.push({cuenta:m.cuenta==='credito'?'credito':'debito', signo:-1});
    if(m.tipo==='ingreso' && m.destino==='debito') out.push({cuenta:'debito', signo:+1});
    if(m.tipo==='retiro-efectivo' && esDebito(m.cuenta)) out.push({cuenta:'debito', signo:-1});
    if(m.tipo==='pago-tarjeta'){ out.push({cuenta:'credito', signo:+1}); if(m.desde==='debito') out.push({cuenta:'debito', signo:-1}); }
    if(m.tipo==='pago-otro'){ if(m.desde==='debito') out.push({cuenta:'debito', signo:-1}); out.push({cuenta:'otro', signo:+1}); }
  }
  if(m.tipo==='pago-entre'){
    if(m.persona===persona && esDebito(m.sale)) out.push({cuenta:'debito', signo:-1});
    if(m.a===persona && esDebito(m.entra)) out.push({cuenta:'debito', signo:+1});
  }
  return out;
}
// Efecto de un movimiento en el efectivo de una persona (+/−/0).
function signoEfectivo(m, persona){
  if(m.tipo==='gasto-efectivo' && m.quien===persona) return -1;
  if((m.tipo==='retiro-efectivo' || m.tipo==='ajuste-efectivo') && m.quien===persona) return +1;
  if((m.tipo==='gasto-generales'||m.tipo==='gasto-gustos') && m.pagadoCon==='efectivo' && m.quien!=='abuelo' && pagadorFisico(m)===persona) return -1;
  if(m.tipo==='ingreso' && m.destino==='efectivo' && m.persona===persona) return +1;
  if(m.tipo==='pago-otro' && m.desde==='efectivo' && m.persona===persona) return -1;
  if(m.tipo==='pago-entre'){
    if(m.persona===persona && m.sale==='efectivo') return -1;
    if(m.a===persona && m.entra==='efectivo') return +1;
  }
  return 0;
}
// Efecto en el Budget (mamá/papá) de una persona.
function signoBudget(m, persona){
  if(m.tipo==='ingreso') return (m.destino==='bote' && m.persona===persona) ? +1 : 0;
  if(m.tipo==='retiro-efectivo') return (m.cuenta==='bote' && m.persona===persona) ? -1 : 0;
  if(m.tipo==='pago-tarjeta') return (m.desde==='bote' && m.persona===persona) ? -1 : 0;
  if(m.tipo==='pago-otro') return (m.desde==='bote' && m.persona===persona) ? -1 : 0;
  if(m.tipo==='pago-entre'){
    if(m.persona===persona && m.sale==='bote' && m.entra!=='bote') return -1;
    if(m.a===persona && m.entra==='bote' && m.sale!=='bote') return +1;
    return 0;
  }
  if((m.tipo==='gasto-generales'||m.tipo==='gasto-gustos') && !fueraDelBote(m) && m.quien!=='abuelo'){

function movMatchesChip(m, chip){
  if(chip==='todos') return true;
  if(chip==='abuelo') return m.quien==='abuelo' || (m.tipo==='retiro-efectivo' && m.cuenta==='abuelo');
  if(chip==='personales') return cuentasDeMov(m, perfil).length>0;
  if(chip==='efectivo') return signoEfectivo(m, perfil)!==0;
  if(chip==='budget') return signoBudget(m, perfil)!==0;

}

function vistaMov(m){
  let signo;
  let monto = m.monto, moneda = m.moneda||'MXN', montoMXN = m.montoMXN, nota = '';
  if(movFiltro==='budget'){
    signo = signoBudget(m, perfil);
    if(m.tipo==='ingreso' && m.netoMXN!==m.montoMXN){ monto = m.netoMXN; moneda = 'MXN'; montoMXN = m.netoMXN; nota = 'neto de ahorro'; }
    if(m.quien==='ambas' && (m.tipo==='gasto-generales'||m.tipo==='gasto-gustos')){ monto = m.monto/2; montoMXN = m.montoMXN/2; nota = 'tu mitad'; }
  } else if(movFiltro==='efectivo'){
    signo = signoEfectivo(m, perfil);
  } else if(movFiltro==='personales'){
    const c = cuentasDeMov(m, perfil);
    signo = c.length ? c[0].signo : -1;
    if(m.tipo==='pago-tarjeta' && m.desde==='debito') nota = 'de débito a crédito';
    if(m.pagadoCon==='otro' && (m.tipo==='gasto-generales'||m.tipo==='gasto-gustos')) nota = 'lo pagó '+(m.otroNombre||'otra persona');
  } else if(movFiltro==='abuelo'){
    signo = -1;
  } else {
    signo = m.tipo==='pago-entre' ? (m.a===perfil ? +1 : -1)
      : ((m.tipo==='ingreso' || m.tipo==='personal-ganancia' || m.tipo==='retiro-efectivo' || m.tipo==='ajuste-efectivo') ? +1 : -1);
  }

function listaPC(lista){ return lista==='cobro' ? state.porCobrar : state.deudasProyectadas; }
function resumenPC(persona){
  const finMes = finDeMesISO(mesActual());
  const ymHoy = mesActual();
  const cobros = (state.porCobrar||[]).filter(r=>r.persona===persona);
  const proys = (state.deudasProyectadas||[]).filter(r=>r.persona===persona);
  const futC = (state.series||[]).filter(se=>se.tipo==='cobro' && se.persona===persona).flatMap(se=>proximasOcurrencias(se,12));
  const futP = (state.series||[]).filter(se=>se.tipo==='proyeccion' && se.persona===persona).flatMap(se=>proximasOcurrencias(se,12));
  const pend = r=>r.estado!=='cobrado' && r.estado!=='pagado';
  const porCobrarAhora = cobros.filter(r=>pend(r) && (r.fecha||'')<=finMes).reduce((a,r)=>a+mxnOf(r),0);
  const porCobrarFuturo = cobros.filter(r=>pend(r) && (r.fecha||'')>finMes).reduce((a,r)=>a+mxnOf(r),0) + futC.reduce((a,r)=>a+r.montoMXN,0);
  const cobradoMes = cobros.filter(r=>r.estado==='cobrado' && ymDe(r.fechaCobro||r.fecha)===ymHoy).reduce((a,r)=>a+mxnOf(r),0);
  const voyADeber = proys.filter(pend).reduce((a,r)=>a+mxnOf(r),0) + futP.reduce((a,r)=>a+r.montoMXN,0);
  return {cobros, proys, futC, futP, porCobrarAhora, porCobrarFuturo, cobradoMes, voyADeber, neto: porCobrarAhora + porCobrarFuturo - voyADeber};
}
function gruposPC(registros, virtuales){
  const map = {};
  [...registros, ...virtuales].forEach(r=>{
    const k = claveOtro(r.nombre);
    if(!map[k]) map[k] = {clave:k, nombre:String(r.nombre||'').trim()||'Sin nombre', items:[], pendiente:0};
    map[k].items.push(r);
    if(r.estado!=='cobrado' && r.estado!=='pagado') map[k].pendiente += r.virtual ? r.montoMXN : mxnOf(r);
  });
  Object.values(map).forEach(g=>g.items.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')));
  return Object.values(map).sort((a,b)=>b.pendiente-a.pendiente || a.nombre.localeCompare(b.nombre));
}

function botonAgregarMov(){

  return `<span class="hint" data-open="ingreso">+ ingreso</span>`;

// El registro guardado detrás de una línea de movimientos.
function registroDeMov(tipo, id, extra){
  if(tipo==='gasto-generales'){ const s = state.subcats.find(x=>x.id===extra); return s ? s.gastos.find(g=>g.id===id) : gastosCategoria().find(g=>g.id===id); }
  if(tipo==='gasto-gustos') return state.gustosGastos.find(g=>g.id===id);
  if(tipo==='gasto-efectivo') return (state.efectivoMovimientos||[]).find(m=>m.id===id);
  if(tipo==='ingreso') return state.ingresos.find(i=>i.id===id);
  if(tipo==='personal-gasto') return state.finanzas[extra] ? state.finanzas[extra].gastos.find(m=>m.id===id) : null;
  return null;
}
// Si es parte de una serie mensual, pregunta qué borrar; si no, borra directo.
function pedirBorrado(tipo, id, extra){
  const rec = registroDeMov(tipo, id, extra);
  if(rec && serieDe(rec)) return openBorrarSerie({kind:'mov', tipo, id, extra});
  deleteMovimiento(tipo, id, extra);
}
function openBorrarSerie(ref){
  openSheet(`
    ${sheetHeader('¿Qué quieres borrar?')}
    <div class="small-note" style="margin-bottom:14px;">Este movimiento se repite cada mes. Cada mes es independiente.</div>
    <input type="hidden" id="borrarRef" value='${JSON.stringify(ref).replace(/'/g,"&apos;")}'>
    <button class="btn btn-outline btn-block" data-borrar-alcance="solo" style="margin-bottom:10px;">Solo este mes</button>
    <button class="btn btn-outline btn-block" data-borrar-alcance="siguientes" style="margin-bottom:10px;">Este mes y los siguientes</button>
    <button class="btn btn-outline btn-block" data-borrar-alcance="toda" style="color:var(--brick);">Toda la serie (todos los meses)</button>
  `);
}
function deleteMovimiento(tipo, id, extra, alcance){
  const recSerie = registroDeMov(tipo, id, extra);
  const seSerie = serieDe(recSerie);
  if(seSerie){ aplicarBorradoSerie(seSerie, recSerie.serieYM, alcance||'solo'); persist(); render(); return; }
  if(tipo==='gasto-generales'){
    const s = state.subcats.find(x=>x.id===extra); if(s) s.gastos = s.gastos.filter(g=>g.id!==id);
  } else if(tipo==='gasto-gustos'){
    state.gustosGastos = state.gustosGastos.filter(g=>g.id!==id);
  } else if(tipo==='gasto-efectivo' || tipo==='retiro-efectivo' || tipo==='ajuste-efectivo'){
    state.efectivoMovimientos = (state.efectivoMovimientos||[]).filter(m=>m.id!==id);
  } else if(tipo==='ingreso'){
    state.ingresos = state.ingresos.filter(i=>i.id!==id);
  } else if(tipo==='personal-ganancia'){
    if(state.finanzas[extra]) state.finanzas[extra].ganancias = state.finanzas[extra].ganancias.filter(m=>m.id!==id);
  } else if(tipo==='personal-gasto'){
    if(state.finanzas[extra]) state.finanzas[extra].gastos = state.finanzas[extra].gastos.filter(m=>m.id!==id);
  } else if(tipo==='ahorro-retiro'){
    state.ahorro.movimientos = state.ahorro.movimientos.filter(m=>m.id!==id);
  } else if(tipo==='pago-entre'){
    state.pagosEntre = (state.pagosEntre||[]).filter(p=>p.id!==id);
  } else if(tipo==='pago-tarjeta'){
    state.pagosTarjeta = (state.pagosTarjeta||[]).filter(p=>p.id!==id);
  } else if(tipo==='pago-otro'){
    state.pagosOtros = (state.pagosOtros||[]).filter(p=>p.id!==id);
  }
  persist(); render();
}
function editMovimiento(tipo, id, extra){
  if(tipo==='gasto-generales') return openGasto('generales', extra, {kind:'generales', subId:extra, id});
  if(tipo==='gasto-gustos') return openGasto('gustos', null, {kind:'gustos', id});
  if(tipo==='gasto-efectivo') return openGastoEfectivo({id});
  if(tipo==='retiro-efectivo') return openRetiroEfectivo({id});
  if(tipo==='ajuste-efectivo') return openSaldoInicialEfectivo({id});
  if(tipo==='ingreso') return openIngreso({id});
  if(tipo==='personal-ganancia') return openPersonalMov(extra, 'ganancia', {id});
  if(tipo==='personal-gasto') return openPersonalMov(extra, 'gasto', {id});
  if(tipo==='ahorro-retiro') return openAhorro(id);
  if(tipo==='pago-entre') return openPagoEntre(null, id);
  if(tipo==='pago-tarjeta') return openPagoTarjeta(extra, id);

}

/* ---------------- RESUMEN MENSUAL (vive dentro de Movimientos) ---------------- */
// Antes era la pestaña "Historial" aparte; se fusionó aquí porque "Todos los
// ingresos" ya era un subconjunto exacto de Movimientos (chip "Todos"), y
// esto era lo único que de verdad aportaba algo distinto: el corte por mes.
// Lista de meses 'YYYY-MM' entre a y b, inclusive.
function mesesEntre(a, b){
  const out=[]; let ay=+a.slice(0,4), am=+a.slice(5,7); const by=+b.slice(0,4), bm=+b.slice(5,7);
  if(ay>by || (ay===by && am>bm)) return [a];
  while(ay<by || (ay===by && am<=bm)){
    out.push(ay+'-'+String(am).padStart(2,'0'));
    am++; if(am>12){ am=1; ay++; }
    if(out.length>240) break;
  }
  return out;
}
// Ingreso, gasto y neto por mes. Los ingresos recurrentes (Mamá, Abuelo, Isa)
// se cuentan en CADA mes desde su fecha inicial hasta el mes actual, no solo
// en el mes en que se registraron — así el neto mensual es real.
function resumenPorMes(){
  // Meses con cualquier movimiento del bote, del más viejo al actual (y los
  // futuros que ya tengan algo, p. ej. noches de alojamiento pagadas).
  const set = new Set([mesActual()]);
  state.ingresos.forEach(i=>{ if((i.destino||'bote')==='bote') set.add(mesIngreso(i)); });
  [...state.subcats.flatMap(s=>s.gastos), ...state.gustosGastos].forEach(g=>{
    if(esEstancia(g)){ set.add(ymDe(g.cubreDesde)); set.add(ymDe(sumarDiasISO(g.cubreHasta,-1))); }
    else if(g.fecha) set.add(ymDe(g.fecha));
  });
  (state.efectivoMovimientos||[]).forEach(m=>{ if(m.tipo==='retiro' && m.cuenta==='bote' && m.fecha) set.add(ymDe(m.fecha)); });
  (state.pagosEntre||[]).forEach(p=>{ if(p.fecha) set.add(ymDe(p.fecha)); });
  (state.pagosTarjeta||[]).forEach(p=>{ if(p.desde==='bote' && p.fecha) set.add(ymDe(p.fecha)); });
  (state.pagosOtros||[]).forEach(p=>{ if(p.desde==='bote' && p.fecha) set.add(ymDe(p.fecha)); });
  const lista = [...set].filter(Boolean).sort();
  const meses = {};
  mesesEntre(lista[0], lista[lista.length-1]).forEach(ym=>{
    const b = balanceMes(ym);
    if(ym>mesActual() && b.gasto===0) return; // meses futuros solo si ya tienen algo pagado (p. ej. noches)
    meses[ym] = { ingreso:b.ingreso, gasto:b.gasto, neto:b.disp };
  });
  return meses;
}
// Sobrante (o faltante) acumulado de todos los meses YA CERRADOS (anteriores
// al actual). Se guarda aparte: no se suma al saldo de arriba del mes.
function carryoverAcumuladoMXN(){
  const meses = resumenPorMes();
  const nowYM = mesActual();
  let acc = 0;
  Object.keys(meses).forEach(ym=>{ if(ym < nowYM) acc += meses[ym].neto; });
  return acc;
}
// Total de toda la vida: lo acumulado de meses cerrados + lo que va de este mes.
function acumuladoTotalMXN(){ return carryoverAcumuladoMXN() + balanceMes().disp; }
function renderResumenMensual(){
  const meses = resumenPorMes();
  const keys = Object.keys(meses).sort().reverse();
  const carry = carryoverAcumuladoMXN();
  const carryColor = carry < 0 ? 'var(--brick)' : 'var(--teal-deep)';
  const carryTxt = carry < 0
    ? `Faltante acumulado de meses anteriores: falta reponer ${fmt(-carry,'MXN')}.`
    : (carry > 0 ? `Sobrante acumulado de meses anteriores: ${fmt(carry,'MXN')} disponibles para el futuro.` : 'Sin sobrante ni faltante de meses anteriores.');
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title" style="cursor:pointer;" data-toggle-resumen-mensual>
        <h2>${ico('clock','icon-sm')} Resumen por mes</h2>
        <button class="subrow-btn">${ico(mostrarResumenMensual?'chevdown':'chevright','icon-sm')}</button>
      </div>
      <div class="carry-line">
        <div class="carry-lbl">${carry<0?'Faltante':'Sobrante'} acumulado</div>
        <div class="carry-val" style="color:${carryColor};">${carry<0?'−':(carry>0?'+':'')}${fmt(Math.abs(carry),'MXN')}</div>
      </div>
      <div class="small-note" style="margin:-2px 0 6px;">${carryTxt} Aparte del saldo de arriba, que es solo de este mes. No incluye lo del ahorro.</div>
      <div class="carry-line" style="margin-top:4px;">
        <div class="carry-lbl">Total de toda la vida</div>
        <div class="carry-val" style="color:${acumuladoTotalMXN()<0?'var(--brick)':'var(--teal-deep)'};">${acumuladoTotalMXN()<0?'−':(acumuladoTotalMXN()>0?'+':'')}${fmt(Math.abs(acumuladoTotalMXN()),'MXN')}</div>
      </div>
      <div class="small-note" style="margin:-2px 0 6px;">Lo acumulado de meses anteriores más lo que va de ${nombreMesLargo(mesActual()).toLowerCase()}.</div>
      ${mostrarResumenMensual ? (keys.length? keys.map(k=>{
        const m = meses[k];
        const netoColor = m.neto<0 ? 'var(--brick)' : 'var(--teal-deep)';
        return `
        <div class="row-between" style="padding:10px 0;border-bottom:1px solid var(--line);">
          <div>
            <div style="font-weight:700;font-size:13.5px;">${nombreMesLargo(k)}${k===mesActual()?' <span class="muted" style="font-weight:600;font-size:11px;">· en curso</span>':(k>mesActual()?' <span class="muted" style="font-weight:600;font-size:11px;">· próximo, proyectado</span>':'')}</div>
            <div class="muted" style="font-size:11.5px;margin-top:2px;">Ingreso ${fmt(m.ingreso,'MXN')} · Gasto ${fmt(m.gasto,'MXN')}</div>
          </div>
          <div style="text-align:right;font-size:14px;font-weight:800;color:${netoColor};">${m.neto<0?'−':'+'}${fmt(Math.abs(m.neto),'MXN')}</div>
        </div>`;
      }).join('') : emptyMini('Aún no hay suficiente historial. Se va llenando solo cada mes.')) : ''}
    </div>`;
}

function openSheet(html){
  document.querySelectorAll('.overlay').forEach(o=>o.remove()); // nunca dos formularios encimados

  wrap.className='overlay';
  wrap.id='overlay';
  wrap.innerHTML = `<div class="sheet">${html}</div>`;
  wrap.addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });

  wireSheetEvents();
}

// Nombre legible de cada tipo de movimiento para el Excel exportado.
function tipoLabelExport(m){
  return {'gasto-generales':'Gasto — '+(m.subNombre||'Generales'), 'gasto-gustos':'Gasto — Gustos', 'gasto-efectivo':'Gasto — Efectivo',
    'ingreso':'Ingreso', 'personal-ganancia':'Personal — ingreso', 'personal-gasto':'Personal — gasto', 'ahorro-retiro':'Ahorro — retiro', 'pago-entre':'Pago entre nosotras', 'retiro-efectivo':'Retiro a efectivo', 'ajuste-efectivo':'Saldo inicial de efectivo', 'pago-tarjeta':'Pago de tarjeta de crédito', 'pago-otro':'Pago de deuda a otra persona', 'por-cobrar':'Me deben (solo anotado)', 'deuda-proyectada':'Deuda a futuro (solo anotada)', 'ahorro-deposito':'Ahorro — depósito automático', 'saldo-inicial-debito':'Saldo inicial de tarjeta de débito'}[m.tipo] || m.tipo;
}
function pagadoConExport(m){
  if(m.tipo!=='gasto-generales' && m.tipo!=='gasto-gustos') return '';
  if(m.quien==='abuelo') return 'Tarjeta del Abuelo';
  if(m.pagadoCon==='otro') return 'Otra persona ('+(m.otroNombre||'sin nombre')+')';
  return {bote:'Tarjeta del bote', efectivo:'Efectivo', debito:'Tarjeta de débito', personal:'Tarjeta de débito', credito:'Tarjeta de crédito'}[m.pagadoCon||'bote']||'';
}
function cuentaExport(m){
  const L = {bote:'Bote', debito:'Débito', personal:'Débito', efectivo:'Efectivo', credito:'Crédito', abuelo:'Tarjeta del Abuelo', ahorro:'Ahorro', otra:'Otra'};
  if(m.tipo==='ingreso') return L[m.destino||'bote'];
  if(m.tipo==='retiro-efectivo') return 'De '+(L[m.cuenta]||'Otra')+' a Efectivo';
  if(m.tipo==='pago-entre') return 'De '+(L[m.sale]||'Otra')+' ('+nombrePersonaExport(m.persona)+') a '+(L[m.entra]||'Otra')+' ('+nombrePersonaExport(m.a)+')';
  if(m.tipo==='pago-tarjeta') return 'De '+(L[m.desde]||'Otra')+' a Crédito';
  if(m.tipo==='pago-otro') return 'De '+(L[m.desde]||'Otra')+' a '+(m.acreedor||'otra persona');
  if(m.tipo==='por-cobrar' || m.tipo==='deuda-proyectada') return 'No mueve dinero';
  if(m.tipo==='personal-gasto') return m.cuenta==='credito' ? 'Crédito' : 'Débito';
  if(m.tipo==='personal-ganancia') return 'Débito';
  return '';
}
function detalleExport(m){
  const d = [];
  if(m.tipo==='ingreso'){ if(m.recurrente) d.push('recurrente cada mes'); if(m.netoMXN!==undefined && m.netoMXN!==m.montoMXN) d.push('neto de ahorro: '+Math.round(m.netoMXN*100)/100+' MXN'); }
  if(m.quien==='ambas' && m.pagadoPor) d.push('compartido, puso '+nombrePersonaExport(m.pagadoPor));
  if(m.pagadoCon==='otro') d.push('deuda de '+nombrePersonaExport(pagadorFisico(m))+' con '+(m.otroNombre||'otra persona'));
  if(m.estadoPC) d.push(m.estadoPC);
  if(m.serieId && m.tipo!=='ingreso') d.push('recurrente cada mes');
  if(m.quien==='abuelo'){ const g = gastosCategoria().find(x=>x.id===m.id); if(g && g.repartoAbuelo==='ambas') d.push('Abuelo compartido (Isa debe la mitad)'); }
  if(m.cubreDesde && m.cubreHasta) d.push('noches '+m.cubreDesde+' a '+m.cubreHasta);
  return d.join(' · ');
}
function nombrePersonaExport(v){
  return {jen:'Jen', isa:'Isa', abuelo:'Abuelo', ambas:'Ambas'}[v] || (v||'');
}
function csvCell(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
// Arma el CSV en texto plano (sin tocar el DOM) para poder probarlo aparte
// de la descarga. Ordenado cronológicamente para que se lea como bitácora.
function buildMovimientosCSV(){
  const movs = collectMovimientos().slice().sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
  // Extras que no son movimientos guardados pero sí dinero: depósitos
  // automáticos al ahorro y saldos iniciales de las tarjetas de débito.
  ahorroDepositosDerivados().forEach(d=>movs.push({tipo:'ahorro-deposito', quien:'jen', fecha:d.fecha, nota:d.nota, monto:d.monto, moneda:'MXN', montoMXN:d.monto}));
  ['jen','isa'].forEach(p=>{ const ini = Number(state.finanzas[p].inicial)||0; if(ini) movs.push({tipo:'saldo-inicial-debito', quien:p, fecha:'', nota:'Saldo inicial', monto:ini, moneda:'MXN', montoMXN:ini}); });
  (state.porCobrar||[]).forEach(r=>movs.push({tipo:'por-cobrar', quien:r.persona, fecha:r.fecha, nota:r.nombre+(r.concepto?' · '+r.concepto:''), monto:r.monto, moneda:r.moneda, montoMXN:mxnOf(r), estadoPC:r.estado, serieId:r.serieId}));
  (state.deudasProyectadas||[]).forEach(r=>movs.push({tipo:'deuda-proyectada', quien:r.persona, fecha:r.fecha, nota:r.nombre+(r.concepto?' · '+r.concepto:''), monto:r.monto, moneda:r.moneda, montoMXN:mxnOf(r), estadoPC:r.estado, serieId:r.serieId}));
  movs.sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
  const headers = ['Fecha','Tipo','Quién','Nota','Monto','Moneda','Monto (MXN)','Pagado con','Cuenta / destino','Mes que aplica','Detalle'];
  const filas = movs.map(m=>[
    m.fecha||'', tipoLabelExport(m), nombrePersonaExport(m.quien||m.persona), m.nota||m.subNombre||'',
    m.monto, m.moneda||'MXN', Math.round((m.montoMXN||0)*100)/100, pagadoConExport(m), cuentaExport(m),
    m.tipo==='ingreso' ? (m.mes||'') : '', detalleExport(m)
  ]);
  return [headers, ...filas].map(fila=>fila.map(csvCell).join(',')).join('\r\n');
}
// Exporta todos los movimientos (generales, gustos, efectivo, ingresos,
// personales y retiros de ahorro) a un .csv que Excel/Sheets abre directo —
// sin depender de internet ni de ninguna librería externa.
function exportarGastosCSV(){
  const csv = buildMovimientosCSV();
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `movimientos-ruta-compartida-${todayISO()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function borrarPorCobrar(lista, id, alcance){
  const arr = listaPC(lista);
  const rec = arr.find(r=>r.id===id);
  if(!rec) return;
  const se = serieDe(rec);
  if(se) aplicarBorradoSerie(se, rec.serieYM, alcance||'solo');
  else { const i = arr.indexOf(rec); if(i>=0) arr.splice(i,1); }
  persist(); render();
}
function toggleEstadoPC(lista, id){
  const rec = listaPC(lista).find(r=>r.id===id);
  if(!rec) return;
  const hecho = lista==='cobro' ? 'cobrado' : 'pagado';
  if(rec.estado===hecho){ rec.estado='pendiente'; delete rec.fechaCobro; delete rec.fechaPago; }
  else { rec.estado=hecho; if(lista==='cobro') rec.fechaCobro=todayISO(); else rec.fechaPago=todayISO(); }
  persist(); render();
}

function opcionesMes(sel){
  const base = mesActual();
  const set = new Set();
  for(let k=-6;k<=12;k++) set.add(ymMas(base,k));
  if(sel) set.add(sel);
  return [...set].sort().map(ym=>`<option value="${ym}" ${ym===sel?'selected':''}>${nombreMesLargo(ym)}</option>`).join('');
}

function notaDestinoIngreso(d){
  return {
    bote:'Suma al bote del mes que elijas (y a tu Budget mamá/papá).',
    debito:'Suma al saldo de tu tarjeta de débito; no toca el bote.',
    efectivo:'Suma a tu efectivo en esa moneda; no toca el bote.'
  }[d]||'';
}
// Campo reutilizable de "tipo de cambio en ese momento": se rellena solo con
// el valor vigente (Frankfurter/BCE) y es editable para registrar compras o
// ingresos pasados con el tipo de cambio real de ese día.
function renderTipoCambioField(prefix, monedaInicial){
  const actualizado = state.ratesMeta && state.ratesMeta.updatedAt
    ? 'Actualizado ' + new Date(state.ratesMeta.updatedAt).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
    : 'Aún no se ha conectado a internet para actualizarlo';
  return `
  <div class="field" id="${prefix}RateWrap" style="${monedaInicial==='MXN'?'display:none':''}">
    <label>Tipo de cambio a MXN en ese momento</label>
    <input type="number" step="0.0001" id="${prefix}Rate" value="${rateSnapshotFor(monedaInicial)}">
    <div class="small-note">${actualizado}. Si es una compra o ingreso de otro día, ajusta este número al tipo de cambio real de ese momento.</div>
  </div>`;
}

function wireSheetEvents(){
  const closeBtn = document.getElementById('closeSheetBtn');
  if(closeBtn) closeBtn.addEventListener('click', closeSheet);

    el.addEventListener('click', ()=>{

      closeSheet();
      if(ref.kind==='mov') deleteMovimiento(ref.tipo, ref.id, ref.extra, alcance);
      else if(ref.kind==='pc') borrarPorCobrar(ref.lista, ref.id, alcance);
    });
  });

  // Tipo de cambio histórico automático al cambiar la fecha, en toda hoja
  // que tenga moneda + fecha + tipo de cambio.
  ['gasto','con','pm','ing'].forEach(wireHistRate);
  ['gasto','cash','pm','ing','pc'].forEach(wireRecurrencia);

  // pct
  ['pctGen','pctGus','pctFon'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', updatePctSum);

    state.pct.gustos = Number(document.getElementById('pctGus').value)||0;
    state.pct.fondoGrande = Number(document.getElementById('pctFon').value)||0;
    persist(); closeSheet(); render();
  });

  // ahorro retiro
  const doRetiro = document.getElementById('doRetiro');
  if(doRetiro) doRetiro.addEventListener('click', ()=>{
    const monto = Number(document.getElementById('montoRetiro').value||0);
    if(monto<=0){ alert('Ingresa un monto válido.'); return; }
    const editIdEl = document.getElementById('retiroEditId');
    const editId = editIdEl ? editIdEl.value : '';
    const campos = {
      monto,
      motivo:document.getElementById('motivoRetiro').value,
      fecha:document.getElementById('fechaRetiro').value||todayISO(),
      nota:document.getElementById('notaRetiro').value
    };
    if(editId){
      const ex = state.ahorro.movimientos.find(m=>m.id===editId);
      if(ex) Object.assign(ex, campos);
    } else {
      state.ahorro.movimientos.push({id:uid(), tipo:'retiro', ...campos});
    }
    persist(); closeSheet(); render();
  });
  document.querySelectorAll('[data-edit-retiro]').forEach(el=>{
    el.addEventListener('click', ()=>{ const id=el.getAttribute('data-edit-retiro'); closeSheet(); openAhorro(id); });
  });
  document.querySelectorAll('[data-del-retiro]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.getAttribute('data-del-retiro');
      state.ahorro.movimientos = state.ahorro.movimientos.filter(m=>m.id!==id);
      persist(); closeSheet(); openAhorro();
    });
  });

  // gasto cat toggle
  const refrescarEstancia = ()=>{
    const wrap = document.getElementById('estanciaWrap'); if(!wrap) return;
    const catOn = document.querySelector('[data-gasto-cat].on');
    const subSelEl = document.getElementById('gastoSub');
    const sub = subSelEl ? state.subcats.find(x=>x.id===subSelEl.value) : null;
    const ver = (!catOn || catOn.getAttribute('data-gasto-cat')==='generales') && esSubAlojamiento(sub);
    wrap.style.display = ver ? '' : 'none';
    const desde = document.getElementById('gastoCubreDesde');
    if(ver && desde && !desde.value && !document.getElementById('gastoEditRef').value) desde.value = alojamientoPagadoHasta() || '';
  };
