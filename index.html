// Botón de sincronizar (arriba del +): se actualiza sin redibujar la pantalla.
function estadoBotonSync(){
  if(!state.syncUrl) return {cls:'off', txt:'Sin configurar'};
  if(syncEstado.estado==='sincronizando') return {cls:'girando', txt:'Sincronizando…'};
  if(syncEstado.estado==='version') return {cls:'error', txt:'Actualiza la app'};
  if(syncEstado.estado==='error'){ const n = cuantosPendientes(); return {cls:'error', txt:'No se pudo sincronizar'+(n?' · '+n+' '+(n===1?'cambio':'cambios')+' sin subir':''), n}; }
  const n = cuantosPendientes();
  if(n) return {cls:'pendiente', txt: n+' '+(n===1?'cambio':'cambios')+' sin subir', n};
  return {cls:'ok', txt:'Sincronizado'};
}
function pintarBotonSync(){
  const b = document.getElementById('fabSync');
  const e = estadoBotonSync();
  if(b){
    b.className = 'fab-sync '+e.cls;
    b.setAttribute('aria-label', e.txt);
    b.title = e.txt;
    const dot = b.querySelector('.fab-dot'); if(dot) dot.textContent = e.n ? (e.n>99?'99+':String(e.n)) : '';
  }
  pintarBarraPendiente();
}
// Aviso fijo si hay cambios sin subir por más de un minuto.
function pintarBarraPendiente(){
  if(typeof document==='undefined' || !document.body) return;
  const meta = leerMetaSync();
  const n = cuantosPendientes();
  const mostrar = !!(state.syncUrl && n && meta.pendienteDesde && (Date.now()-meta.pendienteDesde) > 60*1000 && syncEstado.estado!=='sincronizando' && syncEstado.estado!=='version');
  let bar = document.getElementById('barraPendiente');
  if(!mostrar){ if(bar) bar.hidden = true; return; }
  if(!bar){
    bar = document.createElement('div'); bar.id='barraPendiente'; bar.className='barra-pendiente';
    bar.innerHTML = '<span></span><button type="button" class="bp-sync">Sincronizar</button><button type="button" class="bp-porque" hidden>Ver por qué</button>';
    bar.querySelector('.bp-sync').addEventListener('click', tocarBotonSync);
    bar.querySelector('.bp-porque').addEventListener('click', openPorQueSync);
    document.body.appendChild(bar);
  }
  bar.querySelector('span').textContent = 'Tienes '+n+' '+(n===1?'cambio':'cambios')+' sin subir'+(syncEstado.estado==='error'?' (no se pudo sincronizar)':'')+'.';
  bar.querySelector('.bp-porque').hidden = syncEstado.estado!=='error';
  bar.hidden = false;
}
// v18.5: por qué no sincroniza, con los pasos para arreglarlo.
function openPorQueSync(){
  const es404 = /404/.test(syncError||'');
  const viejo = /código nuevo/.test(syncError||'');
  openSheet(`
    ${sheetHeader('¿Por qué no sincroniza?')}
    <div class="note-box" style="margin-bottom:12px;">${ico('alert','icon-sm')}<div>${escHtml(syncError||'No se pudo sincronizar.')}</div></div>
    ${es404 || viejo ? `<div class="small-note" style="margin-bottom:8px;"><b>Cómo arreglarlo (una sola vez):</b></div>
    <ol class="pasos-sync">
      ${viejo ? '<li>Abre tu hoja de Google → Extensiones → Apps Script y pega el código nuevo (v3.6) completo. Guarda.</li>' : ''}
      <li>Arriba a la derecha: <b>Implementar → Gestionar implementaciones</b>.</li>
      <li>Toca el lápiz (editar) de la implementación activa → en <b>Versión</b> elige <b>Nueva versión</b> → <b>Implementar</b>. Así la URL no cambia.</li>
      <li>Copia la <b>URL de la aplicación web</b> (termina en /exec). Debe estar en "Ejecutar como: yo" y "Quién tiene acceso: cualquier persona".</li>
      <li>Pégala en Configuración → Sincronización → Guardar URL, <b>en los dos teléfonos</b>.</li>
    </ol>` : `<div class="small-note" style="margin-bottom:12px;">Nada de lo que registraste se pierde: se queda en este teléfono y se sube en cuanto la hoja responda.</div>`}
    <button class="btn btn-primary btn-block" id="porQueReintentar">${ico('repeat','icon-sm')} Probar otra vez</button>
  `);
  document.getElementById('porQueReintentar').addEventListener('click', ()=>{ closeSheet(); tocarBotonSync(); });
}
let toastTimer = null;
function mostrarToast(txt, tipo, accion){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); t.addEventListener('click', (e)=>{ if(!e.target.closest('.toast-accion')) t.hidden = true; }); document.body.appendChild(t); }
  t.className = 'toast '+(tipo||'');
  { const bp = document.getElementById('barraPendiente'); t.classList.toggle('bajo-barra', !!(bp && !bp.hidden)); }
  t.textContent = txt;
  if(accion && accion.label){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-accion'; b.textContent = accion.label;
    b.addEventListener('click', ()=>{ t.hidden = true; try{ accion.fn(); }catch(e){} });
    t.appendChild(b);
  }
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.hidden = true; }, accion ? 7000 : 3600);
}
async function tocarBotonSync(){
  if(!state.syncUrl){ mostrarToast('Primero pon la URL de tu Google Sheet en Configuración.', 'error'); activeTab='config'; render(); return; }
  const ok = await sincronizar();
  if(ok){ const t = document.getElementById('toast'); if(!t || t.hidden) mostrarToast('Sincronizado · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}), 'ok'); }
  else if(syncEstado.estado==='version') mostrarToast('El otro teléfono tiene una versión más nueva. Cierra y vuelve a abrir la app.', 'error');
  else if(syncEstado.estado==='error') mostrarToast(syncError || 'No se pudo sincronizar. Revisa tu internet.', 'error');
}

// Tipo de cambio HISTÓRICO: cuántos MXN valía 1 unidad de `moneda` en la
// fecha dada. Usa Frankfurter (mismo dominio ya en la lista blanca de red).
// Devuelve null si no hay dato (moneda no soportada, sin internet, etc.) —
// el que llama se queda con el comportamiento actual (tasa de hoy, editable).
async function fetchRateHistorico(moneda, fecha){
  if(!moneda || moneda==='MXN') return moneda==='MXN' ? 1 : null;
  try{
    const url = `https://api.frankfurter.dev/v1/${fecha}?base=${moneda}&symbols=MXN`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const r = data && data.rates && data.rates.MXN;
    return (typeof r === 'number' && r>0) ? r : null;
  }catch(e){ return null; }
}
// Conecta el campo de fecha de una hoja con su campo de tipo de cambio: al
// cambiar la fecha a una distinta de hoy, jala el tipo de cambio real de ese
// día y lo pone en el input (dejándolo editable). Si falla, no toca nada.
function wireHistRate(prefix){
  const fechaEl = document.getElementById(prefix+'Fecha');
  const monedaEl = document.getElementById(prefix+'Moneda');
  const rateEl = document.getElementById(prefix+'Rate');
  if(!fechaEl || !rateEl) return;
  const actualizar = async ()=>{
    const moneda = monedaEl ? monedaEl.value : null;
    const fecha = fechaEl.value;
    if(!moneda || moneda==='MXN' || !fecha) return;
    if(fecha===todayISO()){ rateEl.value = rateSnapshotFor(moneda); return; }
    const prev = rateEl.value;
    rateEl.value = '…';
    const hist = await fetchRateHistorico(moneda, fecha);
    rateEl.value = hist!==null ? Number(hist.toFixed(4)) : (prev && prev!=='…' ? prev : rateSnapshotFor(moneda));
  };
  fechaEl.addEventListener('change', actualizar);
}
async function fetchLiveRates(showAlertOnFail){
  // Tres fuentes gratis, en orden. Si la primera falla (red, CORS,
  // bloqueo temporal), se intenta la siguiente automáticamente.
  const fuentes = [
    { nombre:'open.er-api.com', url:'https://open.er-api.com/v6/latest/EUR' },
    { nombre:'fxratesapi.com', url:'https://api.fxratesapi.com/latest?base=EUR&currencies=' + CURRENCY_CODES.filter(c=>c!=='EUR').join(',') },
    // api.frankfurter.app se movió a api.frankfurter.dev — usamos el
    // dominio nuevo directo para no depender de que el redirect funcione.
    { nombre:'Frankfurter (BCE)', url:'https://api.frankfurter.dev/v1/latest?from=EUR&to=' + CURRENCY_CODES.filter(c=>c!=='EUR'&&c!=='MXN').join(',') },
  ];
  const errores = [];
  for(const fuente of fuentes){
    try{
      const res = await fetch(fuente.url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const r = data.rates;
      if(!r || !r.MXN) throw new Error('respuesta sin datos de MXN');
      const eurToMxn = r.MXN;
      state.rates.MXN = 1;
      state.rates.EUR = eurToMxn;
      CURRENCY_CODES.forEach(code=>{
        if(code==='MXN' || code==='EUR') return;
        if(r[code]) state.rates[code] = eurToMxn / r[code];
      });
      state.ratesMeta = { updatedAt: new Date().toISOString(), source:fuente.nombre };
      persist();
      return true;
    }catch(e){
      errores.push(fuente.nombre+': '+e.message);
    }
  }
  // Las tres fallaron — casi siempre es falta de internet en el momento,
  // pero guardamos el detalle por si es otra cosa.
  console.warn('No se pudo actualizar el tipo de cambio. Detalle:', errores.join(' | '));
  state.ratesMeta = state.ratesMeta || {};
  state.ratesMeta.ultimoError = errores.join(' | ');
  if(showAlertOnFail) alert('No se pudo conectar para actualizar el tipo de cambio ahora mismo. Se sigue usando el último valor guardado — puedes editarlo manualmente aquí abajo, y la app lo vuelve a intentar sola la próxima vez que la abras con internet.');
  return false;
}
function rateSnapshotFor(moneda){
  return state.rates[moneda] || (moneda==='MXN'?1:state.rates.EUR);
}
// Congela en cada transacción cuántos pesos valía en el momento exacto en
// que se registró, para que el gasto de una compra pasada nunca cambie de
// valor aunque el tipo de cambio se mueva después.
function stampRates(monto, moneda, rateMXNInput){
  const rateMXN = moneda==='MXN' ? 1 : (Number(rateMXNInput) || rateSnapshotFor(moneda));
  const montoMXN = moneda==='MXN' ? monto : monto*rateMXN;
  const rateEURMXN = state.rates.EUR||21.5; // tipo de cambio EUR vigente en ese instante, también congelado
  const montoEUR = moneda==='EUR' ? monto : montoMXN/rateEURMXN;
  return { rateMXN, montoMXN, rateEURMXN, montoEUR };
}
function mxnOf(t){
  if(t && typeof t.montoMXN === 'number') return t.montoMXN;
  return toMXN(t.monto, t.moneda||'EUR');
}

/* ============================================================
   DERIVED CALCULATIONS
   ============================================================ */
/* ------------------------------------------------------------
   INGRESOS POR MES. Cada ingreso dice a dónde va (destino: 'bote' |
   'debito' | 'efectivo') y a qué mes aplica (mes 'YYYY-MM'). Un ingreso
   recurrente cuenta solo en cada mes desde su mes (se "crea" el día 1).
   ------------------------------------------------------------ */
// El "mes al que aplica" solo importa para el bote; lo que llega a débito o
// efectivo cuenta desde que llega (su fecha).
function mesIngreso(ing){
  if(ing.destino && !esDestinoBote(ing.destino)) return ymDe(ing.fecha) || ing.mes || mesActual();
  return ing.mes || ymDe(ing.fecha) || mesActual();
}
function ingresoAplicaEnMes(ing, ym){
  const desde = mesIngreso(ing);
  return ing.recurrente ? desde<=ym : desde===ym;
}
// Meses (hasta hastaYM, por defecto el actual) en que un ingreso ya contó.
function ocurrenciasIngreso(ing, hastaYM){
  hastaYM = hastaYM || mesActual();
  const desde = mesIngreso(ing);
  if(desde>hastaYM) return [];
  return ing.recurrente ? mesesEntre(desde, hastaYM) : [desde];
}
function brutoIngresoMXN(ing){ return typeof ing.montoMXN==='number' ? ing.montoMXN : toMXN(ing.montoBruto, ing.moneda); }
function ahorroDeIngresoMXN(ing){ return ing.ahorroAuto ? Math.min(ing.ahorroAutoMonto||0, brutoIngresoMXN(ing)) : 0; }
function netoIngresoMXN(ing){ return brutoIngresoMXN(ing) - ahorroDeIngresoMXN(ing); }
// Ingreso neto AL BOTE de cada una en un mes (por defecto el actual).
function ingresosNetos(ym, sinTraspasos){
  ym = ym || mesActual();
  let jen=0, isa=0, ahorroAuto=0;
  state.ingresos.forEach(ing=>{
    if(!esDestinoBote(ing.destino) || !ingresoAplicaEnMes(ing, ym)) return;
    if(esIngresoAbuelo(ing)) return; // el Abuelo ya cuenta por su meta: no se suma dos veces
    if(sinTraspasos && esTraspaso(ing)) return;
    const neto = netoIngresoMXN(ing);
    if(ing.persona==='jen') jen += neto; else isa += neto;
    ahorroAuto += ahorroDeIngresoMXN(ing);
  });
  return {jenNetoMXN:jen, isaNetoMXN:isa, ahorroAutoMXN:ahorroAuto};
}
function aportacionPct(){
  const {jenNetoMXN, isaNetoMXN} = ingresosNetos(null, true);
  const total = jenNetoMXN+isaNetoMXN;
  if(total<=0) return {jen:50, isa:50};
  return {jen: (jenNetoMXN/total)*100, isa:(isaNetoMXN/total)*100};
}
function boteTotalMXN(ym){
  const {jenNetoMXN, isaNetoMXN} = ingresosNetos(ym);
  return jenNetoMXN+isaNetoMXN;
}
// Los depósitos al ahorro NO se guardan por separado — se calculan en vivo
// a partir de los ingresos con "genera ahorro automático", uno por cada mes
// en que el ingreso ya contó (los recurrentes depositan cada mes).
function ahorroDepositosDerivados(){
  const out = [];
  state.ingresos.filter(i=>i.ahorroAuto && i.ahorroAutoMonto>0).forEach(i=>{
    ocurrenciasIngreso(i).forEach(ym=>{
      out.push({ id:'ing-'+i.id+'-'+ym, tipo:'deposito', monto:ahorroDeIngresoMXN(i), fecha: ym===mesIngreso(i) ? (i.fecha||ym+'-01') : ym+'-01',
        nota:'Automático desde ingreso de '+i.fuente, deIngresoId:i.id });
    });
  });
  return out;
}
function ahorroSaldoMXN(){
  const depositos = ahorroDepositosDerivados().reduce((a,m)=>a+m.monto,0);
  // Los movimientos guardados en state.ahorro.movimientos ahora son solo
  // retiros (cualquier "deposito" viejo que haya quedado ahí de una
  // versión anterior se ignora aquí a propósito, para no contar doble).
  const retiros = state.ahorro.movimientos.filter(m=>m.tipo==='retiro').reduce((a,m)=>a+m.monto,0);
  return depositos - retiros - retirosEfectivoMXN('ahorro') - traspasosMXN('ahorro');
}
/* v16 — TRASPASOS: sacar del ahorro o del sobrante de meses pasados y pasarlo a
   otra cuenta. Se guardan como un ingreso marcado "traspaso" (entra a la cuenta
   destino y, si es el bote, cuenta para el Budget de ese mes) y se restan del
   apartado de donde salieron. No son ingresos nuevos: no cuentan en "Ingresos
   por fuente" ni en la aportación. */
// v17: un ingreso con fuente "Abuelo" no entra al bote (su dinero es la meta de la Tarjeta del Abuelo).
function esIngresoAbuelo(i){ return !!(i && !esTraspaso(i) && (i.destino||'bote')==='bote' && /^\s*(tarjeta del |del |el )?abuelo\s*$/i.test(i.fuente||'')); } // v18.5: también si se importó
function esTraspaso(i){ return !!(i && (i.traspaso==='ahorro' || i.traspaso==='sobrante')); }
function traspasosMXN(origen, hastaISO, antesDeYM, excluirId){
  return state.ingresos.filter(i=>i.traspaso===origen && i.id!==excluirId
      && (origen!=='sobrante' || ymDe(i.fecha||'') >= inicioBudgetYM()) // v18.5: lo de antes del inicio del Budget no cuenta
      && (!hastaISO || (i.fecha||'') <= hastaISO)
      && (!antesDeYM || ymDe(i.fecha||'') < antesDeYM))
    .reduce((a,i)=>a+brutoIngresoMXN(i),0);
}
/* ============================================================
   RECURRENTES. Una serie (state.series) es la "receta" de algo que se
   repite cada mes. Cada mes la app crea SOLA un registro normal e
   independiente (con serieId/serieYM), así todos los cálculos lo tratan
   como si lo hubieras registrado a mano, y se puede editar o borrar solo
   ese mes. Los gastos aparecen el día que les toca; los ingresos, los
   "me deben" y las proyecciones, al empezar su mes. Al borrar un mes se
   anota en omitidos para no volver a crearlo.
   tipo: 'ingreso' | 'gasto' (categorías) | 'efectivo' | 'personal' |
         'cobro' (me deben) | 'proyeccion' (voy a deber)
   ============================================================ */
function camposNoPlantilla(){ return ['id','fecha','serieId','serieYM','montoMXN','rateMXN','montoEUR','rateEUR','cubreDesde','cubreHasta','estado','fechaCobro','fechaPago','mes','recurrente','ingresoId','virtual','_u','importId']; }
function plantillaDe(rec){
  const p = {};
  Object.keys(rec).forEach(k=>{ if(!camposNoPlantilla().includes(k)) p[k] = rec[k]; });
  return JSON.parse(JSON.stringify(p));
}
function diaDe(iso){ return Math.max(1, Math.min(31, Number(String(iso||'').slice(8,10))||1)); }
function diaEnMes(ym, dia){
  const n = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
  return ym+'-'+String(Math.min(dia||1, n)).padStart(2,'0');
}
function difMeses(a, b){ // meses de a hasta b (b - a)
  return (+b.slice(0,4) - +a.slice(0,4))*12 + (+b.slice(5,7) - +a.slice(5,7));
}
// Mes al que pertenece un registro dentro de su serie.
function ymDeRegistro(tipo, rec){
  if(tipo==='ingreso') return mesIngreso(rec);
  return ymDe(rec.fecha) || mesActual();
}
function serieNueva(tipo, rec, extra){
  const desde = ymDeRegistro(tipo, rec);
  const se = { id:uid(), tipo, persona: rec.persona || null, plantilla: plantillaDe(rec), dia: diaDe(rec.fecha),
    desde: desde || mesActual(), hasta: null, omitidos: [], offset: 0 };
  if(tipo==='ingreso') se.offset = difMeses(se.desde, ymDe(rec.fecha)||se.desde); // p. ej. llega el 30 pero aplica al mes siguiente
  if(rec.rateMXN) se.rateMXN = rec.rateMXN; // para meses anteriores que se rellenan después
  if(extra){ if(extra.cat) se.cat = extra.cat; if(extra.subId) se.subId = extra.subId; if(extra.persona) se.persona = extra.persona; }
  return se;
}
// Convierte un registro recién guardado en el primer mes de una serie.
function hacerRecurrente(rec, tipo, extra, hasta){
  const se = serieNueva(tipo, rec, extra);
  if(hasta && hasta>=se.desde) se.hasta = hasta;
  state.series.push(se);
  rec.serieId = se.id; rec.serieYM = se.desde;
  generarRecurrentes();
  return se;
}
function serieDe(rec){ return rec && rec.serieId ? (state.series||[]).find(x=>x.id===rec.serieId) : null; }
// Dónde viven los registros de cada tipo de serie.
function registrosTipo(se){
  if(se.tipo==='ingreso') return [state.ingresos];
  if(se.tipo==='gasto') return [...state.subcats.map(x=>x.gastos), state.gustosGastos];
  if(se.tipo==='efectivo') return [state.efectivoMovimientos];
  if(se.tipo==='personal') return se.persona && state.finanzas[se.persona] ? [state.finanzas[se.persona].gastos] : [];
  if(se.tipo==='cobro') return [state.porCobrar];
  if(se.tipo==='proyeccion') return [state.deudasProyectadas];
  return [];
}
function registrosDeSerie(se){
  const out = [];
  registrosTipo(se).forEach(arr=>arr.forEach(r=>{ if(r.serieId===se.id) out.push(r); }));
  return out;
}
function quitarRegistrosDeSerie(se, pred){
  registrosTipo(se).forEach(arr=>{
    for(let i=arr.length-1;i>=0;i--){ if(arr[i].serieId===se.id && pred(arr[i])) arr.splice(i,1); }
  });
}
function fechaOcurrencia(se, ym){
  return se.tipo==='ingreso' ? diaEnMes(ymMas(ym, se.offset||0), se.dia) : diaEnMes(ym, se.dia);
}
// Gastos: el día que toca. Ingresos, cobros y proyecciones: al empezar su mes.
function yaTocaOcurrencia(se, ym){
  if(se.tipo==='ingreso' && (se.plantilla||{}).destino && !esDestinoBote(se.plantilla.destino)) return fechaOcurrencia(se, ym) <= todayISO(); // débito/efectivo: cuando llega
  if(se.tipo==='ingreso' || se.tipo==='cobro' || se.tipo==='proyeccion') return ym <= mesActual();
  return fechaOcurrencia(se, ym) <= todayISO();
}
// Meses creados (o actualizados) en automático: llevan la hora de la última vez que se
// cambió la plantilla ("este mes y los siguientes"), no la de ahora. Así, si el otro
// teléfono editó ese mes, gana su edición; y un mes hecho con una plantilla vieja
// pierde contra la plantilla nueva.
const sellosFijos = new WeakMap();
function crearOcurrencia(se, ym){
  const p = JSON.parse(JSON.stringify(se.plantilla||{}));
  const fecha = fechaOcurrencia(se, ym);
  const base = {...p, id:se.id+'-'+ym, fecha, serieId:se.id, serieYM:ym, _u: Number(se.plantillaU)||0}; // id fijo: si los dos teléfonos crean el mismo mes, es el mismo registro
  sellosFijos.set(base, base._u);
  const rate = (se.aMeses || ym < mesActual()) && se.rateMXN ? se.rateMXN : null; // meses pasados (o compras a meses): tipo de cambio de cuando se registró
  if(se.aMeses && se.tipo==='gasto' && numeroMensualidad(se, ym)===Number(se.aMeses.meses)){
    // Última mensualidad: cierra exacto el total (sin centavos de más o de menos).
    p.monto = Math.round((Number(se.aMeses.total) - (Number(se.aMeses.meses)-1)*Number(se.aMeses.cuota))*100)/100;
    base.monto = p.monto;
  }
  if(se.tipo==='ingreso'){
    Object.assign(base, {mes: ym, recurrente:false}, stampRates(Number(p.montoBruto)||0, p.moneda||'MXN', rate));
    state.ingresos.push(base);
  } else {
    Object.assign(base, stampRates(Number(p.monto)||0, p.moneda||'MXN', rate));
    if(se.tipo==='gasto'){
      const sub = state.subcats.find(x=>x.id===se.subId) || (se.cat==='gustos' ? subcatV15(state, clasificarGastoV15(p.nota)) : null) || state.subcats[0]; if(!sub) return null; sub.gastos.push(base);
      // Pagado con Arq en euros: al tipo de cambio de la compra.
      if(p.pagadoCon==='arq' && (p.moneda||'MXN')==='EUR'){ const t = tasaArq(p.quien==='ambas' ? (p.pagadoPor||'jen') : p.quien, Number(p.monto)||0, base.id); if(t) Object.assign(base, stampRates(Number(p.monto)||0, 'EUR', t)); }
    } else if(se.tipo==='efectivo'){ base.tipo='gasto'; state.efectivoMovimientos.push(base); }
    else if(se.tipo==='personal'){ if(state.finanzas[se.persona]) state.finanzas[se.persona].gastos.push(base); }
    else if(se.tipo==='cobro'){ base.estado='pendiente'; state.porCobrar.push(base); }
    else if(se.tipo==='proyeccion'){ base.estado='pendiente'; state.deudasProyectadas.push(base); }
  }
  return base;
}
// Crea los meses que ya tocan y todavía no existen. Idempotente: si el otro
// teléfono ya lo creó (sincronización), no se duplica.
// Meses que se crearon con una plantilla vieja (p. ej. en el otro teléfono antes de que
// le llegara el cambio "este mes y los siguientes") toman la plantilla nueva.
function refrescarMesesDeSerie(){
  let n = 0;
  (state.series||[]).forEach(se=>{
    const pu = Number(se.plantillaU)||0;
    if(!pu || !se.plantillaYM || !se.plantilla) return;
    registrosDeSerie(se).forEach(r=>{
      if(!r.serieYM || r.serieYM <= se.plantillaYM) return;
      if((typeof r._u==='number' ? r._u : 0) >= pu) return; // ya es de la plantilla nueva o se editó después
      const keep = {id:r.id, fecha:fechaOcurrencia(se, r.serieYM), serieId:r.serieId, serieYM:r.serieYM, mes:r.mes, estado:r.estado, fechaCobro:r.fechaCobro, fechaPago:r.fechaPago, tipo:r.tipo};
      Object.keys(r).forEach(k=>{ if(!(k in keep)) delete r[k]; });
      Object.assign(r, JSON.parse(JSON.stringify(se.plantilla)), keep);
      const monto = Number(se.tipo==='ingreso'?r.montoBruto:r.monto)||0;
      Object.assign(r, stampRates(monto, r.moneda||'MXN', r.serieYM < mesActual() && se.rateMXN ? se.rateMXN : null));
      Object.keys(keep).forEach(k=>{ if(keep[k]===undefined) delete r[k]; });
      r._u = pu; sellosFijos.set(r, pu);
      n++;
    });
  });
  return n;
}
function generarRecurrentes(){
  let creados = refrescarMesesDeSerie();
  const limite = mesActual();
  (state.series||[]).forEach(se=>{
    if(!se.desde) return;
    const fin = se.hasta && se.hasta<limite ? se.hasta : limite;
    if(se.desde>fin) return;
    const existentes = new Set(registrosDeSerie(se).map(r=>r.serieYM));
    const colSerie = {ingreso:'ingresos', gasto:'gastos', efectivo:'efectivo', personal:'finGas', cobro:'porCobrar', proyeccion:'proyecciones'}[se.tipo];
    mesesEntre(se.desde, fin).forEach(ym=>{
      if(existentes.has(ym) || (se.omitidos||[]).includes(ym) || !yaTocaOcurrencia(se, ym)) return;
      if(state._borrados && state._borrados[colSerie+':'+se.id+'-'+ym]) return; // ese mes se borró en algún teléfono
      if(crearOcurrencia(se, ym)) creados++;
    });
  });
  return creados;
}
// Meses futuros de una serie que todavía no existen (para proyecciones).
function proximasOcurrencias(se, meses){
  const out = [];
  const ini = ymMas(mesActual(), 1);
  const finMax = ymMas(mesActual(), meses||12);
  const fin = se.hasta && se.hasta<finMax ? se.hasta : finMax;
  const desde = se.desde>ini ? se.desde : ini;
  if(desde>fin) return out;
  const existentes = new Set(registrosDeSerie(se).map(r=>r.serieYM));
  mesesEntre(desde, fin).forEach(ym=>{
    if(existentes.has(ym) || (se.omitidos||[]).includes(ym)) return;
    const p = se.plantilla||{};
    const monto = Number(se.tipo==='ingreso'?p.montoBruto:p.monto)||0;
    out.push({...p, virtual:true, serieId:se.id, serieYM:ym, fecha:fechaOcurrencia(se, ym), monto, moneda:p.moneda||'MXN', montoMXN: toMXN(monto, p.moneda||'MXN'), estado:'pendiente'});
  });
  return out;
}
// Borrar un mes de una serie: 'solo' (solo este mes), 'siguientes' (este y
// los que siguen: la serie termina el mes anterior) o 'toda'.
function aplicarBorradoSerie(se, ym, alcance){
  if(!se) return;
  if(alcance==='toda'){
    quitarRegistrosDeSerie(se, ()=>true);
    state.series = state.series.filter(x=>x.id!==se.id);
  } else if(alcance==='siguientes'){
    quitarRegistrosDeSerie(se, r=>(r.serieYM||'')>=ym);
    se.hasta = ymMas(ym,-1);
    if(se.hasta < se.desde && registrosDeSerie(se).length===0) state.series = state.series.filter(x=>x.id!==se.id);
  } else {
    quitarRegistrosDeSerie(se, r=>r.serieYM===ym);
    if(!se.omitidos.includes(ym)) se.omitidos.push(ym);
  }
}
// Tras guardar un registro desde un formulario: crea, ajusta o termina su
// serie según lo que se eligió en el bloque "Se repite cada mes".
function guardarRecurrencia(prefix, rec, tipo, extra){
  const chk = document.getElementById(prefix+'Recurrente');
  if(!chk) return;
  const hastaEl = document.getElementById(prefix+'Hasta');
  const hasta = hastaEl && hastaEl.value ? hastaEl.value : null;
  const alcanceEl = document.getElementById(prefix+'Alcance');
  const alcance = alcanceEl ? alcanceEl.value : 'solo';
  const se = serieDe(rec);
  if(se){
    const ym = rec.serieYM;
    if(!chk.checked){ // deja de repetirse: termina con este mes
      quitarRegistrosDeSerie(se, r=>(r.serieYM||'')>ym);
      se.hasta = ym;
      return;
    }
    se.hasta = hasta ? (hasta<ym ? ym : hasta) : null; // (checarHasta ya avisó si era anterior)
    if(se.hasta) quitarRegistrosDeSerie(se, r=>(r.serieYM||'')>se.hasta);
    if(alcance==='siguientes'){
      const fechaEsperada = fechaOcurrencia(se, ym);
      se.plantilla = plantillaDe(rec);
      se.plantillaU = Math.max(Date.now(), selloMaximo(state)+1); // desde cuándo vale esta plantilla
      se.plantillaYM = ym;                                        // y para los meses después de este
      if(rec.fecha !== fechaEsperada){ // solo si de verdad cambiaste la fecha
        se.dia = diaDe(rec.fecha);
        if(tipo==='ingreso') se.offset = difMeses(ym, ymDe(rec.fecha)||ym);
      }
      if(rec.rateMXN) se.rateMXN = rec.rateMXN;
      if(extra){ if(extra.cat) se.cat = extra.cat; if(extra.subId!==undefined) se.subId = extra.subId; }
      // los meses siguientes que ya existían toman los datos nuevos
      registrosDeSerie(se).filter(r=>(r.serieYM||'')>ym && r!==rec).forEach(r=>{
        const keep = {id:r.id, fecha:fechaOcurrencia(se, r.serieYM), serieId:r.serieId, serieYM:r.serieYM, mes:r.mes, estado:r.estado, fechaCobro:r.fechaCobro, fechaPago:r.fechaPago, tipo:r.tipo};
        Object.keys(r).forEach(k=>{ if(!(k in keep)) delete r[k]; });
        Object.assign(r, JSON.parse(JSON.stringify(se.plantilla)), keep);
        const monto = Number(tipo==='ingreso'?r.montoBruto:r.monto)||0;
        Object.assign(r, stampRates(monto, r.moneda||'MXN', rec.rateMXN||null));
        Object.keys(keep).forEach(k=>{ if(keep[k]===undefined) delete r[k]; });
      });
      if(tipo==='gasto'){ // si cambió de subcategoría/categoría, los meses siguientes se mudan también
        const destino = (state.subcats.find(x=>x.id===se.subId)||{}).gastos;
        if(destino){
          registrosDeSerie(se).filter(r=>(r.serieYM||'')>ym && r!==rec).forEach(r=>{
            [...state.subcats.map(x=>x.gastos), state.gustosGastos].forEach(arr=>{ const i = arr.indexOf(r); if(i>=0 && arr!==destino) arr.splice(i,1); });
            if(!destino.includes(r)) destino.push(r);
          });
        }
      }
    }
    return;
  }
  if(chk.checked) hacerRecurrente(rec, tipo, extra, hasta);
}
// Bloque de formulario "Se repite cada mes" (mismo en todos lados).
// Antes de guardar: el último mes no puede ser anterior al mes del registro.
function checarHasta(prefix, existing, ymNuevo){

function gastoTotal(subOrList){ // suma de transacciones a su valor MXN congelado (todo el tiempo)
  return subOrList.reduce((acc,g)=> acc + mxnOf(g), 0);
}

/* ------------------------------------------------------------
   GASTOS POR MES / DÍA. Un pago de alojamiento con noches (entrada/salida)
   se reparte parejo por noche: 7 noches por $700 = $100 cada noche, en los
   días y meses de la estancia (no el día que se pagó).
   ------------------------------------------------------------ */
function esEstancia(g){ return !!(g && g.cubreDesde && g.cubreHasta && g.cubreHasta>g.cubreDesde); }
// Monto de un gasto que cae entre desdeISO y hastaISO (ambos inclusive).
function montoEnRangoMXN(g, desdeISO, hastaISO){
  if(esEstancia(g)){
    const ini = g.cubreDesde > desdeISO ? g.cubreDesde : desdeISO;
    const finExcl = sumarDiasISO(hastaISO, 1);
    const fin = g.cubreHasta < finExcl ? g.cubreHasta : finExcl;
    const n = nochesEntre(ini, fin);
    if(n<=0) return 0;
    return mxnOf(g) * n / nochesEntre(g.cubreDesde, g.cubreHasta);
  }
  return (g.fecha>=desdeISO && g.fecha<=hastaISO) ? mxnOf(g) : 0;
}
function finDeMesISO(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return ym+'-'+String(new Date(y, m, 0).getDate()).padStart(2,'0'); }
function montoEnMesMXN(g, ym){ return montoEnRangoMXN(g, ym+'-01', finDeMesISO(ym)); }
function montoEnDiaMXN(g, iso){ return montoEnRangoMXN(g, iso, iso); }
// Gastos que salen del bote (sin efectivo, débito, crédito ni Abuelo).
function cuentaEnBote(g){ return !fueraDelBote(g) && g.quien!=='abuelo'; }
function gastadoMesMXN(lista, ym){ ym = ym||mesActual(); return lista.filter(cuentaEnBote).reduce((a,g)=>a+montoEnMesMXN(g, ym),0); }
function subcatGastadoMesMXN(s, ym){ return gastadoMesMXN(s.gastos, ym); }
function generalesGastadoMXN(ym){
  return state.subcats.reduce((acc,s)=> acc + subcatGastadoMesMXN(s, ym), 0);
}
function gustosGastadoMXN(ym){
  return gastadoMesMXN(state.gustosGastos, ym);
}
// Tarjeta del Abuelo — meta mensual aparte, no resta del bote de Isa/Jen.
function abueloGastadoMXN(ym){
  ym = ym||mesActual();
  const todos = [...state.subcats.flatMap(s=>s.gastos), ...state.gustosGastos];
  return todos.filter(g=>g.quien==='abuelo').reduce((a,g)=>a+montoEnMesMXN(g, ym),0) + retirosEfectivoMXN('abuelo', null, ym);
}
// v18: el tope del Abuelo se puede cambiar por mes; cada mes empieza con el del mes anterior.
function abueloMetaMXN(ym){
  ym = ym || mesActual();
  const pm = (state.abuelo && state.abuelo.porMes) || {};
  const ks = Object.keys(pm).filter(k=>/^\d{4}-\d{2}$/.test(k) && k<=ym && isFinite(Number(pm[k])) && pm[k]!==null && pm[k]!=='').sort();
  if(ks.length) return Number(pm[ks[ks.length-1]])||0;
  return Number(state.abuelo && state.abuelo.metaMXN)||0;
}
function abueloDisponibleMXN(ym){ return abueloMetaMXN(ym) - abueloGastadoMXN(ym); }
function openTopeAbuelo(ym){

    <div class="field"><label>Tope de ${nombreMesLargo(ym).toLowerCase()} (MXN)</label><input type="number" step="0.01" id="topeAbuelo" value="${abueloMetaMXN(ym)}"></div>

}
function guardarTopeAbuelo(ym, v){

function fondoGrandeConocidosMesActualMXN(){
  const ym = mesActual();
  return state.fondoGrande.conocidos.filter(c=> (c.fecha||'').slice(0,7)===ym)
    .reduce((acc,c)=> acc + mxnOf(c), 0);
}
function fondoGrandeSugeridoMXN(){
  if(state.fondoGrande.overrideManual!==null && state.fondoGrande.overrideManual!==undefined && state.fondoGrande.overrideManual!=='')
    return Number(state.fondoGrande.overrideManual);
  return fondoGrandeConocidosMesActualMXN();
}
// Préstamo del Fondo a Generales, calculado EN VIVO (ya no se guarda): si
// Generales se pasa este mes, el fondo cubre lo que pueda. Si el gasto se
// borra o edita, el préstamo se ajusta solo.
function prestamoFondoVivoMXN(){
  const falta = generalesGastadoMXN() - categoriaAsignadoMXN('generales');
  if(falta<=0) return 0;
  const gastadoFondo = state.fondoGrande.movimientos.filter(m=>m.tipo==='gasto' && ymDe(m.fecha)===mesActual()).reduce((a,m)=>a+m.monto,0);
  const dispFondo = fondoGrandeSugeridoMXN() - gastadoFondo;
  return Math.max(0, Math.min(dispFondo, falta));
}
function fondoGrandeMovsMXN(){
  const gastado = state.fondoGrande.movimientos.filter(m=>m.tipo==='gasto' && ymDe(m.fecha)===mesActual()).reduce((a,m)=>a+m.monto,0);
  return {gastado, prestado: prestamoFondoVivoMXN()};
}
function fondoGrandeDisponibleMXN(){
  const asignado = fondoGrandeSugeridoMXN();
  const {gastado, prestado} = fondoGrandeMovsMXN();
  return asignado - gastado - prestado;
}

function boteMXN(ym){ return boteTotalMXN(ym); }
// Pagos de la tarjeta de crédito hechos DESDE el bote (bajan el bote ese mes).
function pagosTarjetaDesdeBoteMXN(persona, ym){
  return (state.pagosTarjeta||[]).filter(p=>p.desde==='bote' && p.bolsa!=='budget' && (!persona || p.persona===persona) && (!ym || ymDe(p.fecha)===ym)).reduce((a,p)=>a+mxnOf(p),0);
}
// Pagos a otras personas hechos DESDE el bote (bajan el bote ese mes).
function pagosOtrosDesdeBoteMXN(persona, ym){
  return (state.pagosOtros||[]).filter(p=>p.desde==='bote' && (!persona || p.persona===persona) && (!ym || ymDe(p.fecha)===ym)).reduce((a,p)=>a+mxnOf(p),0);
}
// Budget mamá / papá del mes: la parte de cada quien de los gastos del bote
// ("ambas" a la mitad), sus retiros a efectivo desde su tarjeta del bote,
// los pagos de su tarjeta de crédito desde el bote y los pagos entre ustedes
// que sacan dinero del bote (o lo meten).
function miGastoBoteMXN(persona, ym){
  ym = ym||mesActual();
  const todos = [...state.subcats.flatMap(s=>s.gastos), ...state.gustosGastos];
  const gastos = todos.filter(cuentaEnBote).reduce((acc,g)=>{
    const m = montoEnMesMXN(g, ym);
    if(g.quien===persona) return acc + m;
    if(g.quien==='ambas') return acc + m/2;
    return acc;
  },0);
  const delMes = (state.pagosEntre||[]).filter(p=>ymDe(p.fecha)===ym && (p.de===persona || p.a===persona));
  const xbPorPago = delMes.length ? porcionBudgetDePagos() : {};
  const pagosEntre = delMes.reduce((a,p)=>a + efectoBudgetPagoEntre(p, persona, xbPorPago), 0);
  return gastos + retirosEfectivoMXN('bote', persona, ym) + pagosTarjetaDesdeBoteMXN(persona, ym) + pagosOtrosDesdeBoteMXN(persona, ym) + pagosEntre;
}
// v18.5: cuánto de cada pago entre ustedes saldó gastos que se pagaron con el Budget.
function porcionBudgetDePagos(){
  const out = {};
  deudaItems().items.forEach(it=>{ if(it.delBudget) it.pagos.forEach(pg=>{ out[pg.id] = (out[pg.id]||0) + pg.x; }); });
  return out;
}
// Efecto de un pago entre ustedes en el Budget de una persona (positivo = cuenta como gastado).
// - Lo que salda gastos pagados con el Budget: si quien debía paga con su dinero (no con el Budget), su Budget
//   recupera esa parte; si quien recibe lo guarda fuera del Budget, su Budget la pierde.
// - Lo demás (deudas de gastos con dinero propio, pagos de más o "no es deuda"): sale del Budget de quien paga si lo
//   paga con el Budget, y entra al Budget de quien recibe si lo recibe en el Budget (aunque vaya de Budget a Budget).
function efectoBudgetPagoEntre(p, persona, xbPorPago){
  const m = mxnOf(p);
  const xb = Math.min(m, Math.max(0, (xbPorPago||{})[p.id]||0)), xp = m - xb;
  let e = 0;
  if(p.de===persona){ if(p.sale==='bote') e += xp; else e -= xb; }
  if(p.a===persona){ if(p.entra==='bote') e -= xp; else e += xb; }
  return e;
}
function miGastoBotePorSubcat(persona, ym){
  ym = ym||mesActual();
  return state.subcats.map(s=>{
    const monto = s.gastos.filter(cuentaEnBote).reduce((acc,g)=>{
      const m = montoEnMesMXN(g, ym);
      if(g.quien===persona) return acc + m;
      if(g.quien==='ambas') return acc + m/2;
      return acc;
    },0);
    return {subcat:s, monto};
  }).filter(x=>x.monto>0);
}
function miIngresoMXN(persona, ym){
  const {jenNetoMXN, isaNetoMXN} = ingresosNetos(ym);
  return persona==='jen' ? jenNetoMXN : isaNetoMXN;
}
// UN solo cálculo del bote por mes, que usan el saldo de arriba, el resumen
// por mes y el sobrante acumulado — así siempre cuadran.
function balanceMes(ym){
  ym = ym||mesActual();
  const ingreso = boteTotalMXN(ym);
  const gastoCategorias = generalesGastadoMXN(ym) + gustosGastadoMXN(ym);
  const retiros = retirosEfectivoMXN('bote', null, ym);
  const tarjetas = pagosTarjetaDesdeBoteMXN(null, ym);
  const otros = pagosOtrosDesdeBoteMXN(null, ym);
  const pagosEntre = -pagosEntreBoteNetoMXN(ym); // salida neta del bote
  const gasto = gastoCategorias + retiros + tarjetas + otros + pagosEntre;
  return { ingreso, gasto, disp: ingreso - gasto, gastoCategorias, retiros, tarjetas, otros, pagosEntre };
}

/* ============================================================
   EFECTIVO — historial completo y multi-moneda.
   El saldo NO se guarda como número: se DERIVA en vivo de la bitácora
   state.efectivoMovimientos (retiros de tarjeta +, gastos en efectivo −,
   ajustes manuales +) MÁS los gastos normales pagados en efectivo (que
   restan del efectivo de quien físicamente lo puso). Así, editar o borrar
   cualquier movimiento recalcula el saldo solo, sin números huérfanos.
   ============================================================ */
// Quién puso físicamente el dinero de un gasto (para el efectivo): si es
// compartido, quien lo puso (pagadoPor); si no, quien.
// Gastos que NO salen del bote: los pagados en efectivo o con dinero
// personal (cada uno resta de su propio saldo, no del presupuesto del bote).
function fueraDelBote(g){ return g.pagadoCon==='efectivo' || g.pagadoCon==='debito' || g.pagadoCon==='credito' || g.pagadoCon==='personal' || g.pagadoCon==='otro'; }
function pagadorFisico(g){
  if(g.quien==='ambas') return g.pagadoPor || 'jen';
  return g.quien;
}
// v16: parte del gasto que puso cada una (0..1). Con "Ambas" pagaron las dos:
// 50/50 o personalizado (parteJen). Con una sola persona, 1 o 0.
function parteJenDe(g){ const f = Number(g && g.parteJen); return isFinite(f) && g.parteJen!==null && g.parteJen!=='' ? Math.min(1, Math.max(0, f)) : 0.5; }
function partePago(g, persona){
  if(!g || g.quien==='abuelo') return 0;
  if(g.quien==='ambas' && g.pagadoPor==='ambas') return persona==='jen' ? parteJenDe(g) : 1 - parteJenDe(g);
  return pagadorFisico(g)===persona ? 1 : 0;
}
// Quién le debe a quién por un gasto de ambas: {acreedor, deudor, monto} o null.
function deudaDeGastoAmbas(g){
  if(!g || g.quien!=='ambas') return null;
  const total = mxnOf(g); if(!(total>0)) return null;
  if(g.pagadoPor==='jen' || g.pagadoPor==='isa') return {acreedor:g.pagadoPor, deudor:otraPersona(g.pagadoPor), monto: total/2};
  if(g.pagadoPor==='ambas'){
    const dif = total*(parteJenDe(g) - 0.5); // >0: Jen puso de más
    if(Math.abs(dif) < 0.005) return null;
    return dif>0 ? {acreedor:'jen', deudor:'isa', monto:dif} : {acreedor:'isa', deudor:'jen', monto:-dif};
  }
  return null;
}
function textoPagadoPor(g){
  if(!g || g.quien!=='ambas') return '';
  if(g.pagadoPor==='ambas'){ const pj = parteJenDe(g); return Math.abs(pj-0.5)<0.0001 ? 'Las dos, 50/50' : `Las dos · Jen ${fmt((Number(g.monto)||0)*pj, g.moneda||'MXN')} · Isa ${fmt((Number(g.monto)||0)*(1-pj), g.moneda||'MXN')}`; }
  return g.pagadoPor ? nombrePersona(g.pagadoPor) : 'Sin definir';
}
function saldoEfectivo(persona, moneda){
  let s = 0;
  (state.efectivoMovimientos||[]).forEach(m=>{
    if(m.persona!==persona || m.moneda!==moneda) return;
    if(m.tipo==='gasto') s -= Number(m.monto)||0;
    else s += Number(m.monto)||0; // retiro / ajuste
  });
  // gastos normales de categorías pagados en efectivo
  const cats = [...state.subcats.flatMap(x=>x.gastos), ...state.gustosGastos];
  cats.forEach(g=>{
    if(g.pagadoCon!=='efectivo') return;
    if((g.moneda||'EUR')!==moneda) return;
    if(g.quien==='abuelo') return;
    s -= (Number(g.monto)||0) * partePago(g, persona);
  });
  // pagos entre nosotras en efectivo (en su propia moneda)
  (state.pagosEntre||[]).forEach(p=>{
    if((p.moneda||'MXN')!==moneda) return;
    if(p.a===persona && p.entra==='efectivo') s += Number(p.monto)||0;
    if(p.de===persona && p.sale==='efectivo') s -= Number(p.monto)||0;
  });
  // pagos a otras personas hechos en efectivo (en su propia moneda)
  (state.pagosOtros||[]).forEach(p=>{
    if(p.persona===persona && p.desde==='efectivo' && (p.moneda||'MXN')===moneda) s -= Number(p.monto)||0;
  });
  // pagos de tarjeta de crédito hechos en efectivo (p. ej. en tienda)
  (state.pagosTarjeta||[]).forEach(p=>{
    if(p.persona===persona && p.desde==='efectivo' && (p.moneda||'MXN')===moneda) s -= Number(p.monto)||0;
  });
  // ingresos que llegan en efectivo (en su moneda, neto de ahorro), cada mes que aplicaron
  state.ingresos.forEach(i=>{
    if(i.persona!==persona || i.destino!=='efectivo' || (i.moneda||'MXN')!==moneda) return;
    const bruto = brutoIngresoMXN(i) || 1;
    const factorNeto = netoIngresoMXN(i)/bruto;
    s += (Number(i.montoBruto)||0) * factorNeto * ocurrenciasIngreso(i).length;
  });
  return s;
}
// Monedas en las que una persona tiene movimientos de efectivo (para
// mostrar todos sus saldos, no solo una moneda fija).
function monedasEfectivo(persona){
  const set = new Set();
  (state.efectivoMovimientos||[]).forEach(m=>{ if(m.persona===persona) set.add(m.moneda); });
  const cats = [...state.subcats.flatMap(x=>x.gastos), ...state.gustosGastos];
  cats.forEach(g=>{ if(g.pagadoCon==='efectivo' && partePago(g, persona)>0) set.add(g.moneda||'EUR'); });
  (state.pagosEntre||[]).forEach(p=>{ if((p.a===persona && p.entra==='efectivo') || (p.de===persona && p.sale==='efectivo')) set.add(p.moneda||'MXN'); });
  state.ingresos.forEach(i=>{ if(i.persona===persona && i.destino==='efectivo' && ocurrenciasIngreso(i).length) set.add(i.moneda||'MXN'); });
  (state.pagosTarjeta||[]).forEach(p=>{ if(p.persona===persona && p.desde==='efectivo') set.add(p.moneda||'MXN'); });
  (state.pagosOtros||[]).forEach(p=>{ if(p.persona===persona && p.desde==='efectivo') set.add(p.moneda||'MXN'); });
  return [...set];
}
function saldoEfectivoResumen(persona){
  return monedasEfectivo(persona).map(moneda=>({moneda, saldo:saldoEfectivo(persona,moneda)}));
}
// Cuenta de donde salió un retiro a efectivo. Ese monto (en MXN congelado
// al tipo de cambio del día) SE RESTA de esa cuenta. Los gastos pagados
// después con ese efectivo solo bajan el efectivo — así no se cuenta doble.
// Retiros viejos sin cuenta = 'otra' (no restan de nada).
function cuentasRetiroPara(persona){
  const out = [['bote', nombreBudget(persona)]];
  if(typeof hayArq!=='function' || hayArq()) out.push(['arq', 'Arq ('+nombreBudget(persona)+')']);
  out.push(['abuelo','Tarjeta del Abuelo']);
  if(persona==='jen') out.push(['ahorro','Ahorro']);
  out.push(['debito','Mi dinero'], ['otra','Otra / no registrada en la app']);
  return out;
}
function labelCuentaRetiro(cuenta, persona){
  const f = cuentasRetiroPara(persona||'jen').find(c=>c[0]===cuenta) || cuentasRetiroPara('jen').find(c=>c[0]===cuenta);
  return f ? f[1].replace(' (tarjeta del bote)','') : 'Otra';
}
function retirosEfectivoCuenta(cuenta, persona, ym){
  return (state.efectivoMovimientos||[]).filter(m=>m.tipo==='retiro' && (m.cuenta===cuenta || (cuenta==='bote' && m.cuenta==='arq')) && (!persona || m.persona===persona) && (!ym || ymDe(m.fecha)===ym));
}
function retirosEfectivoMXN(cuenta, persona, ym){
  return retirosEfectivoCuenta(cuenta, persona, ym).reduce((a,m)=>a+mxnOf(m),0);
}

/* ============================================================
   DEUDAS ENTRE JEN E ISA — "quién le debe a quién"
   Un gasto compartido (quien==='ambas') lo consume mitad y mitad, pero
   una sola persona pone el dinero (pagadoPor). La otra le debe la mitad.
   Súper/Comida, Alojamiento y Transporte entre ciudades vienen marcados
   como compartidos por default, pero cualquier gasto marcado "ambas" con
   pagadoPor definido cuenta aquí, sin importar si se pagó con la tarjeta
   del bote, dinero personal o efectivo. Tarjeta del Abuelo: si el gasto es
   de ambas (repartoAbuelo='ambas'), Isa le debe la mitad a Jen; si es solo
   de Jen, no genera deuda.
   ============================================================ */
const SUBCATS_COMPARTIDAS_DEFAULT = ['Comida & Bebida', 'Comida y bebida (fuera)', 'Súper', 'Alojamiento', 'Transporte entre ciudades'];
function esSubcatCompartidaDefault(nombre){ return SUBCATS_COMPARTIDAS_DEFAULT.includes(nombre); }
function deudasPendientes(){
  let jenLeDebeAIsa = 0, isaLeDebeAJen = 0;
  const detalle = [];
  const gastos = [
    ...state.subcats.flatMap(s=>s.gastos.map(g=>({...g, subNombre:s.nombre}))),
    ...state.gustosGastos.map(g=>({...g, subNombre:'Gustos'})),
  ];
  gastos.forEach(g=>{
    if(g.quien==='abuelo'){
      if(g.repartoAbuelo!=='ambas') return;
      const mitadAb = mxnOf(g)/2;
      if(mitadAb<=0) return;
      isaLeDebeAJen += mitadAb;
      detalle.push({ id:g.id, fecha:g.fecha, nota:g.nota||g.subNombre||'Gasto compartido', subNombre:g.subNombre, mitad:mitadAb, pagadoPor:'jen', viaAbuelo:true, deudor:'isa' });
      return;
    }
    const dd = deudaDeGastoAmbas(g); // sin saber quién puso el dinero no se puede calcular
    if(!dd) return;
    const mitad = dd.monto;
    if(dd.acreedor==='jen'){ isaLeDebeAJen += mitad; }
    else { jenLeDebeAIsa += mitad; }
    detalle.push({ id:g.id, fecha:g.fecha, nota:g.nota||g.subNombre||'Gasto compartido', subNombre:g.subNombre, mitad, pagadoPor:dd.acreedor, deudor: dd.deudor });
  });
  // Pagos entre nosotras: lo que una ya le pagó a la otra baja su deuda.
  let pagadoJenAIsa = 0, pagadoIsaAJen = 0;
  (state.pagosEntre||[]).forEach(p=>{
    if(p.noDeuda) return; // v18.5: pasarle dinero no paga deudas
    const m = mxnOf(p);
    if(p.de==='jen') pagadoJenAIsa += m; else pagadoIsaAJen += m;
    detalle.push({ id:p.id, esPago:true, fecha:p.fecha, nota:p.nota||'Pago entre nosotras', de:p.de, a:p.a, montoMXN:m, monto:p.monto, moneda:p.moneda });
  });
  const neto = (isaLeDebeAJen - pagadoIsaAJen) - (jenLeDebeAIsa - pagadoJenAIsa); // >0 → Isa le debe a Jen; <0 → Jen le debe a Isa
  detalle.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  return { jenLeDebeAIsa, isaLeDebeAJen, pagadoJenAIsa, pagadoIsaAJen, neto, detalle };
}
function nombrePersona(p){ return p==='isa' ? 'Isa' : 'Jen'; }
function otraPersona(p){ return p==='isa' ? 'jen' : 'isa'; }
// Cuentas de las que puede salir / a las que puede entrar un pago entre nosotras.
function cuentasPagoEntre(persona){
  return [['bote',nombreBudget(persona)], ['debito','Mi dinero'], ['efectivo','Efectivo'], ['otra','Otra / no registrada en la app']];
}
function labelCuentaPagoEntre(k, persona){
  const f = cuentasPagoEntre(persona).find(c=>c[0]===k); return f ? f[1] : 'Otra';
}
// Efecto neto de los pagos entre nosotras en el bote combinado: solo cambia
// cuando el dinero cruza la frontera del bote (sale del bote a personal/
// efectivo o al revés). De tarjeta del bote a tarjeta del bote = 0.
function pagosEntreBoteNetoMXN(ym){
  return (state.pagosEntre||[]).filter(p=>!ym || (p.fecha||'').slice(0,7)===ym).reduce((a,p)=>{
    const m = mxnOf(p);
    return a + (p.entra==='bote'?m:0) - (p.sale==='bote'?m:0);
  },0);
}
/* ------------------------------------------------------------
   MI DINERO APARTE: Tarjeta de débito y Tarjeta de crédito de cada una.
   (Lo que antes era "Dinero personal" es ahora la tarjeta de débito.)
   ------------------------------------------------------------ */
function esDebito(v){ return v==='debito' || v==='personal'; }
function gastosCategoria(){ return [...state.subcats.flatMap(x=>x.gastos), ...state.gustosGastos]; }
// Ingresos que llegan a una cuenta fuera del bote (débito/efectivo), neto de
// ahorro, contando cada mes que ya aplicó (recurrentes).
function ingresosFueraMXN(persona, destino){
  return state.ingresos.filter(i=>i.persona===persona && i.destino===destino)
    .reduce((a,i)=>a + netoIngresoMXN(i)*ocurrenciasIngreso(i).length, 0);
}
function saldoDebitoMXN(persona){
  const f = state.finanzas[persona];
  if(!f) return 0;
  const inicialMXN = Number(f.inicial)||0; // el inicial se guarda ya en MXN
  const ganancias = f.ganancias.reduce((a,g)=>a+mxnOf(g),0);
  const gastos = f.gastos.filter(g=>g.cuenta!=='credito').reduce((a,g)=>a+mxnOf(g),0);
  const cats = gastosCategoria().filter(g=>esDebito(g.pagadoCon)).reduce((a,g)=>a+mxnOf(g)*partePago(g, persona),0);
  const pagosEntre = (state.pagosEntre||[]).reduce((a,p)=>{
    const m = mxnOf(p);
    if(p.a===persona && esDebito(p.entra)) a += m;
    if(p.de===persona && esDebito(p.sale)) a -= m;
    return a;
  },0);
  const pagosTarjeta = (state.pagosTarjeta||[]).filter(p=>p.persona===persona && p.desde==='debito').reduce((a,p)=>a+mxnOf(p),0);
  const pagosOtros = (state.pagosOtros||[]).filter(p=>p.persona===persona && p.desde==='debito').reduce((a,p)=>a+mxnOf(p),0);
  const inicialRev = Number(((state.cuentasCfg||{})[persona]||{})['rev-deb'] && state.cuentasCfg[persona]['rev-deb'].inicial)||0; // v18: Revolut débito
  return inicialMXN + inicialRev + ganancias + ingresosFueraMXN(persona,'debito') - gastos - cats - retirosEfectivoMXN('debito', persona) + pagosEntre - pagosTarjeta - pagosOtros;
}
function saldoPersonalMXN(persona){ return saldoDebitoMXN(persona); }
function creditoUtilizadoMXN(persona){
  const f = state.finanzas[persona];
  if(!f) return 0;
  const gastos = f.gastos.filter(g=>g.cuenta==='credito').reduce((a,g)=>a+mxnOf(g),0);
  const cats = gastosCategoria().filter(g=>g.pagadoCon==='credito').reduce((a,g)=>a+mxnOf(g)*partePago(g, persona),0);
  const pagos = (state.pagosTarjeta||[]).filter(p=>p.persona===persona && p.bolsa!=='budget').reduce((a,p)=>a+mxnOf(p),0); // v18: pagar la parte del Budget no baja lo tuyo
  return gastos + cats - pagos;
}
/* ------------------------------------------------------------
   LE DEBO A OTRAS PERSONAS: gastos que pagó alguien de fuera por Jen o
   por Isa (pagadoCon 'otro'). Cada una tiene sus propios "otros": la deuda
   es de quien puso el dinero (pagadorFisico). No toca el bote ni ninguna
   cuenta hasta que se paga (state.pagosOtros).
   ------------------------------------------------------------ */
function claveOtro(n){ return String(n||'').trim().toLowerCase() || 'otra persona'; }
function nombreOtroDe(g){ return String(g.otroNombre||'').trim() || 'Otra persona'; }
function deudasOtros(persona){
  const map = {};
  const fila = (nombre)=>{ const k = claveOtro(nombre); if(!map[k]) map[k] = {clave:k, nombre:String(nombre||'').trim()||'Otra persona', deuda:0, pagado:0, gastos:[], pagos:[]}; return map[k]; };
  gastosCategoria().forEach(g=>{
    const parte = g.pagadoCon==='otro' ? partePago(g, persona) : 0;
    if(!(parte>0)) return;
    const f = fila(nombreOtroDe(g)); f.deuda += mxnOf(g)*parte; f.gastos.push(g);
  });
  (state.pagosOtros||[]).forEach(p=>{
    if(p.persona!==persona) return;
    const f = fila(p.acreedor); f.pagado += mxnOf(p); f.pagos.push(p);
  });
  return Object.values(map).map(f=>({...f, pendiente: f.deuda - f.pagado})).sort((a,b)=>b.pendiente-a.pendiente || a.nombre.localeCompare(b.nombre));
}
function totalDeudasOtrosMXN(persona){ return deudasOtros(persona).reduce((a,f)=>a+Math.max(0,f.pendiente),0); }
function nombresOtros(persona){ return deudasOtros(persona).map(f=>f.nombre); }
function creditoLimiteMXN(persona){ const f=state.finanzas[persona]; return f && f.credito ? (Number(f.credito.limite)||0) : 0; }
function creditoDisponibleMXN(persona){ return creditoLimiteMXN(persona) - creditoUtilizadoMXN(persona); }
function categoriaAsignadoMXN(cat){
  const bote = boteMXN();
  if(cat==='fondoGrande') return fondoGrandeSugeridoMXN();
  return bote * (state.pct[cat]/100);
}
function categoriaGastadoMXN(cat){
  if(cat==='generales') return generalesGastadoMXN();
  if(cat==='gustos') return gustosGastadoMXN();
  if(cat==='fondoGrande'){ const {gastado} = fondoGrandeMovsMXN(); return gastado; }
  return 0;
}
function categoriaDisponibleMXN(cat){
  let disp = categoriaAsignadoMXN(cat) - categoriaGastadoMXN(cat);
  if(cat==='generales'){
    const {prestado} = fondoGrandeMovsMXN();
    disp += prestado;
  }
  return disp;
}

/* ============================================================
   MOTOR DE COSTO DE VIDA — el destino manda: reparte el costo de
   vida diario del lugar entre subcategorías según su "peso", y
   descuenta lo que el programa/alojamiento ya cubre.
   ============================================================ */
function coverageMultiplier(v){
  return {total:0, parcial:0.5, no:1}[v] ?? 1;
}
function coverageMultiplierForSub(sub, destino){
  if(!destino) return 1;
  if(!sub.coberturaKey) return 1;
  if(sub.coberturaKey==='comida'){
    const vals = ['desayuno','comida','cena'].map(k=>coverageMultiplier(destino.cobertura[k]));
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  return coverageMultiplier(destino.cobertura[sub.coberturaKey]);
}
// Qué tanto varía el costo real de cada subcategoría de un destino a otro.
// "alta": alojamiento/actividades/escapadas/transporte entre ciudades pueden
// duplicarse entre un destino económico en temporada baja y uno caro en
// temporada alta. "media": comida y transporte local varían, pero menos.
// "baja": eSIM, lavandería, salud, compras y trámites cuestan prácticamente
// lo mismo en cualquier país — no tiene sentido moverlos por destino.
const SENSIBILIDAD_POR_NOMBRE = {
  'Alojamiento':'alta', 'Actividades y tours':'alta', 'Escapadas de fin de semana':'alta', 'Transporte entre ciudades':'alta',
  'Comida & Bebida':'media', 'Comida y bebida (fuera)':'media', 'Súper':'media', 'Transporte local':'media',
  'Compras / souvenirs':'baja', 'Otros':'baja', 'Salud y cuidado personal':'baja', 'Comunicación (eSIM/roaming)':'baja', 'Lavandería':'baja', 'Trámites y documentos':'baja',
};
const DAMP_POR_SENSIBILIDAD = { alta:1, media:0.5, baja:0 };
const NIVEL_COSTO_MULT = { economico:0.8, medio:1, alto:1.3 };
const ESTACIONALIDAD_MULT = { baja:0.9, media:1, alta:1.2 };
function sensibilidadSub(sub){ return SENSIBILIDAD_POR_NOMBRE[sub.nombre] || 'media'; }
// Peso base de la subcategoría ya ajustado por qué tan caro/temporada alta
// está el destino actual (antes de restar lo que el programa ya cubre).
function pesoBaseDestino(sub, destino){
  const base = (Number(sub.peso)||0) * factorPaisSub(sub, destino); // precios del país (alojamiento, restaurantes, súper, transporte)
  if(!destino) return base;
  const damp = DAMP_POR_SENSIBILIDAD[sensibilidadSub(sub)];
  if(!damp) return base; // sensibilidad baja: nunca se mueve por destino
  const nivelMult = NIVEL_COSTO_MULT[destino.nivelCosto||'medio'] ?? 1;
  const estMult = ESTACIONALIDAD_MULT[destino.estacionalidad||'media'] ?? 1;
  return base * Math.pow(nivelMult * estMult, damp);
}
function totalPesoSubcats(destino){
  return state.subcats.reduce((a,s)=>a+pesoBaseDestino(s,destino),0) || 1;
}
function pesoAjustadoSub(sub, destino){
  return pesoBaseDestino(sub, destino) * coverageMultiplierForSub(sub, destino);
}
// Costo de vida diario del destino en MXN, ya descontando lo cubierto por el programa
function costoVidaAjustadoDia(destino){
  if(!destino || !destino.costoVidaDia) return 0;
  const totalPeso = totalPesoSubcats(destino);
  const totalAjustado = state.subcats.reduce((a,s)=>a+pesoAjustadoSub(s,destino),0);
  return destino.costoVidaDia * (totalAjustado/totalPeso);
}
// Cuánto le tocaría a una subcategoría específica del costo de vida del
// destino, en MXN (fallback cuando no hay costos de referencia propios para ella)
function estimadoAutoSubcat(sub, destino){
  if(!destino || !destino.costoVidaDia) return 0;
  const totalPeso = totalPesoSubcats(destino);
  const share = pesoBaseDestino(sub,destino)/totalPeso;
  const mult = coverageMultiplierForSub(sub, destino);
  return destino.costoVidaDia * share * mult * 30;
}
function sugerenciaGeneralesMensualMXN(){
  const destino = destinoActual();
  if(!destino) return null;
  return costoVidaAjustadoDia(destino) * 30;
}
function sugerenciaPctGenerales(){
  const bote = boteMXN();
  const sugerido = sugerenciaGeneralesMensualMXN();
  if(sugerido===null || bote<=0) return null;
  return Math.max(0, Math.min(95, (sugerido/bote)*100));
}
// Aplica la sugerencia automática al reparto (Generales↑, Gustos se ajusta
// con lo que sobra, Fondo de gastos grandes no se toca — se financia aparte
// con los "gastos grandes conocidos"). Solo corre si el modo automático
// está activo; si Jen/Isa lo editaron a mano, respeta su elección.
//
// OJO: antes, Gustos se calculaba como "lo que sobra" de Generales
// (100 - generales - fondoGrande). Eso disparaba números irreales (ej. 67%)
// en destinos donde el programa cubre casi todo Generales (como Split con
// IVHQ) — el hueco que dejaba Generales se le regalaba entero a Gustos en
// vez de quedarse como colchón. Ahora Gustos tiene un techo razonable (o
// respeta lo que ya tenía asignado si es más bajo) y el verdadero sobrante
// se queda en Generales como margen extra, no como gasto libre.
const TECHO_PCT_GUSTOS = 20;
function aplicarSugerenciaDestinoSiAplica(){
  return; // v15: ya no hay Gustos ni Fondo; Generales es siempre el 100% (los % de subcategorías sí se mueven por destino).
  if(!state.pctAuto) return;
  const sug = sugerenciaPctGenerales();
  if(sug===null) return;
  const genNecesario = Math.round(sug);
  const fondo = state.pct.fondoGrande;
  const espacioDisponible = Math.max(0, 100 - genNecesario - fondo);
  const gustosObjetivo = state.pct.gustos > 0 ? Math.min(state.pct.gustos, TECHO_PCT_GUSTOS) : TECHO_PCT_GUSTOS;
  const gustos = Math.max(3, Math.min(gustosObjetivo, espacioDisponible));
  state.pct.gustos = gustos;
  state.pct.generales = 100 - gustos - fondo;
}

function destinoActual(){ return state.destinos.find(d=>d.id===state.destinoActualId) || null; }
function programaCubreTodoActivo(){
  const d = destinoActual();
  if(!d) return false;
  const today = todayISO();
  if(today < d.fechaInicio || today > d.fechaFin) return false;
  return d.cobertura.alojamiento==='total' && d.cobertura.comida==='total';
}
function primerIngresoLlego(){
  return state.ingresos.length>0 || todayISO() >= state.primerIngresoOficial;
}

function diasEnMes(){
  const now=new Date(); return new Date(now.getFullYear(), now.getMonth()+1,0).getDate();
}
function diaDelMes(){ return new Date().getDate(); }
function diasRestantesMes(){ return diasEnMes()-diaDelMes()+1; }

function promedioDiario(cat){
  // Solo lo que ya pasó este mes (del 1ro a hoy): las noches de alojamiento
  // que aún no llegan no inflan el promedio.
  const ym = mesActual(), hoy = todayISO();
  const lista = cat==='generales' ? state.subcats.flatMap(s=>s.gastos) : (cat==='gustos' ? state.gustosGastos : null);
  const gastado = lista ? lista.filter(cuentaEnBote).reduce((a,g)=>a+montoEnRangoMXN(g, ym+'-01', hoy),0) : categoriaGastadoMXN(cat);
  const dias = Math.max(diaDelMes(),1);
  return gastado/dias;
}
function proyeccionDias(cat){
  const disp = categoriaDisponibleMXN(cat);
  const prom = promedioDiario(cat);
  if(prom<=0) return null;
  return Math.floor(disp/prom);
}

let fabUltimoY = 0, fabTimer = null;
window.addEventListener('scroll', ()=>{
  const y = window.scrollY || 0, b = document.body; if(!b) return;

function renderAlojamientoInicio(){
  const d = destinoActual();
  const e = estadoAlojamiento();
  if(!d && !e) return '';
  const hoy = todayISO();
  let diaTxt = '', pct = 0;
  if(d && d.fechaInicio && d.fechaFin){
    const tot = Math.max(1, diasEntreISO(d.fechaInicio, d.fechaFin)+1);
    const x = diasEntreISO(d.fechaInicio, hoy)+1;
    if(x>=1 && x<=tot){ diaTxt = `día ${x} de ${tot}`; pct = x/tot*100; }
    else if(x<1) diaTxt = `empieza en ${1-x} ${1-x===1?'día':'días'}`;
    else diaTxt = 'ya terminó';
  }
  const estancia = estanciasPagadas().find(g=>g.cubreDesde<=hoy && hoy<g.cubreHasta);
  const porNoche = estancia ? mxnOf(estancia)/Math.max(1, nochesEntre(estancia.cubreDesde, estancia.cubreHasta)) : null;
  const cov = d && d.cobertura ? d.cobertura.alojamiento : null;
  let alerta = '';
  if(e){
    const oculto = e.nivel!=='ok' && !e.hasta && cov==='total';
    if(!oculto){

  return `<div class="card aloj-card" id="alojamientoCard">
    <div class="card-title"><h2>${micoHtml({glyph:'cama'},'sm')} Alojamiento</h2>${d?`<span class="hint" data-tab="destinos">${escHtml(banderaDestino(d))} ${escHtml(nombreCorto(d))}</span>`:''}</div>
    ${alerta}
    ${d ? `<div class="aloj-dest">

      <div style="flex:1;min-width:0;"><div style="font-weight:700;">${escHtml(d.nombre)}</div><div class="muted" style="font-size:12px;">${fmtDate(d.fechaInicio)} → ${fmtDate(d.fechaFin)}${diaTxt?' · '+diaTxt:''}</div>${pct?`<div class="dest-prog"><div style="width:${pct.toFixed(0)}%"></div></div>`:''}</div>
    </div>

      ${porNoche ? `<span class="chip-info">${fmt(porNoche,'MXN')} por noche</span>` : ''}
    </div>` : ''}
    ${meses ? `<div class="stat-grid" style="margin-top:12px;">${meses}</div>` : ''}

}
function desglosePeriodo(periodo){
  const hoy = todayISO();
  const desde = periodo==='hoy' ? hoy : (periodo==='semana' ? inicioDeSemanaISO() : mesActual()+'-01');
  const hasta = periodo==='mes' ? finDeMesISO(mesActual()) : hoy;
  const r = {bote:0, abuelo:0, efectivo:0};
  gastosCategoria().forEach(g=>{
    const m = montoEnRangoMXN(g, desde, hasta); if(!m) return;
    if(g.quien==='abuelo') r.abuelo += m; else if(cuentaEnBote(g)) r.bote += m; else if(g.pagadoCon==='efectivo') r.efectivo += m;
  });
  (state.efectivoMovimientos||[]).forEach(m=>{ if(m.tipo==='gasto' && m.fecha>=desde && m.fecha<=hasta) r.efectivo += mxnOf(m); });
  r.total = r.bote + r.abuelo + r.efectivo;
  return r;
}

// v18: lo que se espera que llegue este mes al Budget (mamá el día 1, papá de Isa) y lo que ya llegó.
function ingresosEsperadosMes(ym){
  ym = ym || mesActual();
  const delMes = state.ingresos.filter(i=>esDestinoBote(i.destino) && !esTraspaso(i) && !esIngresoAbuelo(i) && ingresoAplicaEnMes(i, ym));
  // v18.5: cada línea toma solo lo de esa fuente (Mamá / Papá); lo demás va en "Otros".
  const deFuente = (i, e)=>i.persona===e.persona && e.re.test(sinAcentos(i.fuente||''));
  const ultimo = (e)=>state.ingresos.filter(i=>deFuente(i, e) && esDestinoBote(i.destino) && !esTraspaso(i) && !esIngresoAbuelo(i) && mesIngreso(i) < ym).sort((a,b)=>mesIngreso(b).localeCompare(mesIngreso(a)) || (b.fecha||'').localeCompare(a.fecha||''))[0];
  return [
    {clave:'mama', persona:'jen', fuente:'Mamá', nombre:'Mamá', cuando:'el día 1', dia:'01', re:/\bmama\b|\bmom\b|\bmadre\b|^\s*jen\s*$/},
    {clave:'papa', persona:'isa', fuente:'Papá', nombre:'Papá de Isa', cuando:'', dia:null, re:/\bpapa\b|\bdad\b|\bpadre\b|^\s*isa\s*$/},
  ].map(e=>{
    const llegados = delMes.filter(i=>deFuente(i, e));
    const u = ultimo(e);
    return Object.assign(e, {llegados, total: llegados.reduce((a,i)=>a+netoIngresoMXN(i),0), esperado: u ? Number(u.montoBruto)||0 : 0, moneda: u ? (u.moneda||'MXN') : 'MXN', fuenteUlt: u ? u.fuente : e.fuente});
  });
}
function otrosIngresosBudgetMes(ym){
  const usados = new Set(); ingresosEsperadosMes(ym).forEach(e=>e.llegados.forEach(i=>usados.add(i.id)));
  return state.ingresos.filter(i=>esDestinoBote(i.destino) && !esTraspaso(i) && !esIngresoAbuelo(i) && ingresoAplicaEnMes(i, ym) && !usados.has(i.id));
}

function textoLlegadas(lista, ym){
  const hoy = todayISO(), partes = [];
  lista.forEach(i=>{

    else if((i.fecha||'') > hoy) partes.push('programado '+fmtDate(i.fecha));
    else partes.push('llegó '+fmtDate(i.fecha));

  const u = [...new Set(partes)].join(', ');
  return u.charAt(0).toUpperCase()+u.slice(1);
}

// Dibuja una dona con estilo consistente (relleno pastel + borde saturado a
// juego, sin leyenda nativa de Chart.js) y su propia leyenda de texto debajo
// con punto de color + nombre + %, para que el desglose sea siempre legible
// sin depender de tocar la gráfica.
function drawDonutConLeyenda({canvas, legendEl, labels, data, coloresBg, coloresFg, alertas}){
  const total = data.reduce((a,b)=>a+b,0) || 1;
  alertas = alertas || [];
  // Una subcategoría rebasada se pinta en rojo (--brick) en vez de su color.
  const bgFinal = coloresBg.map((c,i)=> alertas[i] ? '#FFE5E5' : c);
  const fgFinal = coloresFg.map((c,i)=> alertas[i] ? '#FF5A5F' : c);
  const chart = new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:bgFinal, borderColor:fgFinal, borderWidth:1.5 }] },
    options:{
      animation:false, responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ label:(ctx)=> `${ctx.label}: ${(ctx.parsed/total*100).toFixed(0)}%${alertas[ctx.dataIndex]?' · ya se pasó':''}` } } },
      cutout:'58%'
    }
  });
  if(legendEl){
    legendEl.innerHTML = labels.map((label,i)=>{
      const pct = data[i]/total*100;
      const alerta = alertas[i];
      return `<div class="row-between" style="padding:4px 0;font-size:12px;">
        <span style="display:flex;align-items:center;gap:7px;"><span style="width:9px;height:9px;border-radius:50%;background:${bgFinal[i]};border:1.5px solid ${fgFinal[i]};display:inline-block;"></span>${label}${alerta?` <span style="color:var(--brick);font-weight:700;">⚠ ya se pasó</span>`:''}</span>
        <b style="${alerta?'color:var(--brick);':''}">${pct.toFixed(0)}%</b>
      </div>`;
    }).join('');
  }
  return chart;
}

  if(chartDiario) chartDiario.destroy();
  chartDiario = new Chart(canvasDia.getContext('2d'), {

// Lunes de la semana actual, en ISO — para el corte "esta semana".
function inicioDeSemanaISO(){
  const d = new Date();
  const dow = (d.getDay()+6)%7; // 0 = lunes
  d.setDate(d.getDate()-dow);
  return isoLocal(d);
}
// Cuánto de un gasto del bote cae en el periodo (el alojamiento, por noche).
function gastoEnPeriodoMXN(g, periodo){
  const today = todayISO();
  if(!cuentaEnBote(g)) return 0;
  if(periodo==='hoy') return montoEnDiaMXN(g, today);
  if(periodo==='semana') return montoEnRangoMXN(g, inicioDeSemanaISO(), today);
  if(periodo==='mes') return montoEnMesMXN(g, mesActual());
  return 0;
}
function gastoEnPeriodo(g, periodo){ return gastoEnPeriodoMXN(g, periodo) > 0; }
function statBoxToday(){
  const cats = ['generales','gustos'];
  const etiqueta = statPeriodo==='hoy' ? 'hoy' : (statPeriodo==='semana' ? 'esta semana' : 'este mes');
  return cats.map(c=>{
    const allG = c==='generales' ? state.subcats.flatMap(s=>s.gastos) : state.gustosGastos;
    const total = allG.reduce((a,g)=>a+gastoEnPeriodoMXN(g, statPeriodo),0);
    const prom = promedioDiario(c);
    return `<div class="stat-box">
      <div class="lbl">${c==='generales'?'Generales':'Gustos'} — ${etiqueta}</div>
      <div class="val" style="color:${total>0?'var(--brick)':'var(--ink)'}">${total>0?'−':''}${fmt(total,'MXN')}</div>
      <div class="small-note" style="margin-top:6px;">Promedio diario del mes: ${fmt(prom,'MXN')}</div>
    </div>`;
  }).join('');
}

  const d = destinoActual();
  const relevantes = s.costos.filter(c=> !c.destinoId || c.destinoId===(d?d.id:null));

    const monto = relevantes.reduce((acc,c)=>{
      const freqDias = {noche:1, diaria:1, semanal:7, quincenal:14, mensual:30, unica:9999}[c.frecuencia]||30;
      const vecesEnMes = 30/freqDias;
      return acc + toMXN(c.monto, c.moneda||'EUR')*vecesEnMes;
    },0);
    return {monto, fuente:'referencia'}; // tu propio dato — máxima prioridad

  return {monto: auto, fuente: auto>0 ? 'costoVida' : 'ninguna'};

function labelFrecuencia(f){
  return {noche:'por noche', diaria:'por día', semanal:'por semana', quincenal:'cada 2 semanas', mensual:'por mes', unica:'una sola vez'}[f]||f;
}
/* ============================================================
   ALOJAMIENTO — noches ya pagadas.
   Un gasto de Alojamiento puede decir qué noches cubre (entrada/salida).
   El monto se reparte parejo por noche en las fechas de la estancia (ver
   montoEnRangoMXN); además sirve para saber hasta cuándo ya está pagado,
   cuántas noches de cada mes ya no hay que pagar, y avisar antes de que se
   acabe. "cubreHasta" = día de salida (esa noche ya NO está pagada).
   ============================================================ */
function esSubAlojamiento(s){ return !!s && (s.coberturaKey==='alojamiento' || /alojamiento|hospedaje/i.test(s.nombre||'')); }
function sumarDiasISO(iso, n){
  const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10);
}
function nochesEntre(a, b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z'))/86400000); }
function estanciasPagadas(excluirId){
  return state.subcats.filter(esSubAlojamiento).flatMap(s=>s.gastos)
    .filter(g=>g.id!==excluirId && g.cubreDesde && g.cubreHasta && g.cubreHasta>g.cubreDesde);
}
function nocheCubierta(iso, estancias){
  return (estancias||estanciasPagadas()).some(g=>g.cubreDesde<=iso && iso<g.cubreHasta);
}
// Desde hoy (o la fecha dada), hasta qué día hay alojamiento pagado sin
// huecos. Devuelve la fecha de salida (primera noche NO pagada) o null si
// esta noche no está pagada.
function alojamientoPagadoHasta(desdeISO){
  const est = estanciasPagadas();
  let cursor = desdeISO || todayISO(), fin = null, cambio = true;
  while(cambio){
    cambio = false;
    est.forEach(g=>{ if(g.cubreDesde<=cursor && cursor<g.cubreHasta){ cursor = g.cubreHasta; fin = cursor; cambio = true; } });
  }
  return fin;
}
function proximaEstanciaDesde(desdeISO){
  const hoy = desdeISO || todayISO();
  const futuras = estanciasPagadas().filter(g=>g.cubreDesde>hoy).map(g=>g.cubreDesde).sort();
  return futuras[0] || null;
}
// Noches del mes 'YYYY-MM' que ya están pagadas.
function nochesPagadasMes(ym){
  const est = estanciasPagadas();
  const y=+ym.slice(0,4), m=+ym.slice(5,7);
  const dias = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let n=0;
  for(let d=1; d<=dias; d++){ if(nocheCubierta(ym+'-'+String(d).padStart(2,'0'), est)) n++; }
  return {pagadas:n, total:dias};
}
function nombreMes(ym){
  return new Date(ym+'-01T00:00:00').toLocaleDateString('es-MX',{month:'long'});
}
function siguienteYM(ym){ const y=+ym.slice(0,4), m=+ym.slice(5,7); return m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'); }
function lineaEstancia(g){
  if(!g || !g.cubreDesde || !g.cubreHasta) return '';
  const n = nochesEntre(g.cubreDesde, g.cubreHasta);
  return ` · noches ${fmtDate(g.cubreDesde)} → ${fmtDate(g.cubreHasta)} (${n})`;
}
// Estado del alojamiento pagado: {nivel:'ok'|'warn'|'info', texto, meses:[...]}
// o null si no hay ninguna estancia registrada.
function estadoAlojamiento(){
  if(!estanciasPagadas().length) return null;
  const hoy = todayISO();
  const hasta = alojamientoPagadoHasta(hoy);
  const ym = hoy.slice(0,7), ym2 = siguienteYM(ym);
  const meses = [ym, ym2].map(x=>({ym:x, ...nochesPagadasMes(x)})).filter(x=>x.pagadas>0);
  if(hasta){
    const quedan = nochesEntre(hoy, hasta);
    const sig = proximaEstanciaDesde(hasta);
    if(quedan<=5 && !sig){
      return {nivel:'warn', texto:`Alojamiento pagado hasta el ${fmtDate(hasta)} — quedan ${quedan} ${quedan===1?'noche':'noches'} y aún no registran el siguiente.`, hasta, meses};
    }
    return {nivel:'ok', texto:`Alojamiento pagado hasta el ${fmtDate(hasta)} · ${quedan} ${quedan===1?'noche':'noches'} más sin pagar nada.`, hasta, meses};
  }
  const prox = proximaEstanciaDesde(hoy);
  if(prox) return {nivel:'info', texto:`Esta noche no hay alojamiento pagado registrado. El siguiente ya pagado empieza el ${fmtDate(prox)}.`, hasta:null, meses};
  return {nivel:'warn', texto:'No hay alojamiento pagado registrado para esta noche ni para después.', hasta:null, meses};
}
function renderEstadoAlojamiento(compacto){
  const e = estadoAlojamiento();
  if(!e) return '';
  // Si el destino actual cubre el alojamiento hoy, no alarmar.
  if(e.nivel!=='ok' && !e.hasta){ const d = destinoActual(); if(d && d.cobertura && d.cobertura.alojamiento==='total') return ''; }
  const color = e.nivel==='ok' ? 'var(--teal-deep)' : (e.nivel==='warn' ? 'var(--amber)' : 'var(--ink-soft)');
  const icon = e.nivel==='ok' ? 'check' : 'alert';
  const mesesTxt = e.meses.map(m=>`<div class="stat-box"><div class="lbl">Noches de ${nombreMes(m.ym)} ya pagadas</div><div class="val">${m.pagadas} <span style="font-size:12px;color:var(--ink-faint);font-weight:600;">de ${m.total}</span></div></div>`).join('');

function iconoMov(m){
  const t = m.tipo;
  if(t==='gasto-generales'){
    const sub = state.subcats.find(x=>x.id===m.subId) || state.subcats.find(x=>x.nombre===m.subNombre);

  if(t==='gasto-efectivo' || t==='retiro-efectivo' || t==='ajuste-efectivo') return {glyph:'billete'};
